function initCy() {
  cy = cytoscape({ container: $('#cy'), minZoom: 0.15, maxZoom: 3, wheelSensitivity: 0.25, boxSelectionEnabled: false, autoungrabify: false, style: cyStyle() });
  cy.on('tap', 'node', (e) => onNode(e.target));
  cy.on('tap', (e) => { if (e.target === cy) { clearFade(); renderPanel(); } });
}
function cyStyle() {
  const fg = css('--fg'), fg2 = css('--fg-2'), card = css('--card');
  return [
    { selector: 'node', style: { 'label': 'data(label)', 'text-wrap': 'wrap', 'text-max-width': 'data(tw)', 'font-family': 'Outfit, system-ui, sans-serif', 'font-size': 'data(fs)', 'color': fg, 'text-valign': 'center', 'text-halign': 'center', 'shape': 'round-rectangle', 'width': 'data(w)', 'height': 'data(h)', 'background-color': 'data(color)', 'background-opacity': 0.13, 'border-width': 1.5, 'border-color': 'data(color)', 'line-height': 1.25 } },
    { selector: 'node.core', style: { 'shape': 'ellipse', 'background-opacity': 0.08, 'border-style': 'dashed', 'color': fg2 } },
    { selector: 'node.db', style: { 'shape': 'barrel', 'background-opacity': 0.1 } },
    { selector: 'node.neighbor', style: { 'shape': 'ellipse', 'background-opacity': 0.06, 'color': fg2 } },
    { selector: 'node.hot', style: { 'border-width': 3, 'border-color': css('--danger') } },
    { selector: 'node.focus', style: { 'border-width': 3.5, 'background-opacity': 0.28 } },
    { selector: 'node.step', style: { 'background-opacity': 0.18, 'border-width': 2 } },
    { selector: 'edge', style: { 'curve-style': 'bezier', 'width': 'data(w)', 'line-color': 'data(color)', 'target-arrow-color': 'data(color)', 'target-arrow-shape': 'triangle', 'arrow-scale': 0.8, 'line-style': 'data(ls)', 'opacity': 'data(op)' } },
    { selector: '.faded', style: { 'opacity': 0.22 } },
    { selector: 'node:selected', style: { 'overlay-opacity': 0 } },
  ];
}
function nodeBox(label, fs, minW) {
  const lines = String(label).split('\n');
  const longest = Math.max(...lines.map((l) => l.length));
  const w = Math.max(minW || 0, Math.min(260, longest * fs * 0.58 + 28));
  return { w, h: lines.length * fs * 1.3 + 22, tw: w - 16 };
}

function overviewEls() {

  for (const e of G.groupEdges) {

    els.push({ group: 'edges', data: { id: `${e.a}>${e.b}>${e.kind}`, source: e.a, target: e.b, w: Math.min(7, 0.8 + Math.log2(e.n) * 1.2), color: col, ls: e.kind === 'http' ? 'dashed' : e.kind === 'data' ? 'dotted' : 'solid', op: 0.7 } });
  }

}

// ---------- Часть (группа) ----------
function groupEls(gid) {
  const els = [];
  const inG = G.files.filter((f) => f.group === gid).sort((a, b) => b.loc - a.loc);
  const neighbors = new Map();
  const bump = (k) => neighbors.set(k, (neighbors.get(k) || 0) + 1);
  for (const f of inG) {
    const label = f.name;
    const fs = 12 + Math.min(3, Math.sqrt(f.loc) / 18);
    const i = inG.indexOf(f), cols = Math.max(2, Math.ceil(Math.sqrt(inG.length * 1.4)));
    els.push({ group: 'nodes', data: { id: 'f:' + f.path, label, fs, ...nodeBox(label, fs, 80), color: colorOfGroup(gid), kind: 'file', path: f.path }, position: { x: (i % cols) * 200, y: Math.floor(i / cols) * 80 }, classes: FIND.has(f.path) ? 'hot' : '' });
  }
  const fileEdge = new Set();
  for (const f of inG) {
    for (const t of f.imports) {
      const tf = FILE.get(t);
      if (tf.group === gid) { els.push({ group: 'edges', data: { id: `e:${f.path}>${t}`, source: 'f:' + f.path, target: 'f:' + t, w: 1.2, color: css('--line'), ls: 'solid', op: 0.9 } }); }
      else { const k = `${f.path}|${tf.group}`; if (!fileEdge.has(k)) { fileEdge.add(k); bump(tf.group); } }
    }
    for (const t of f.http) { const tg = FILE.get(t)?.group; if (tg && tg !== gid) { const k = `${f.path}|${tg}|h`; if (!fileEdge.has(k)) { fileEdge.add(k); bump(tg); } } }
    for (const p of f.usedBy) { const sg = FILE.get(p).group; if (sg !== gid) { const k = `${sg}|${f.path}|in`; if (!fileEdge.has(k)) { fileEdge.add(k); bump(sg); } } }
  }
  const cols = Math.max(2, Math.ceil(Math.sqrt(inG.length * 1.4)));
  const rows = Math.ceil(inG.length / cols);
  [...neighbors.keys()].forEach((ng, j, arr) => {
    const g = GROUP.get(ng);
    const label = g.label;
    const step = Math.max(64, (Math.max(rows - 1, 1) * 80) / Math.max(arr.length - 1, 1));
    const y = (Math.max(rows - 1, 0) * 80) / 2 + (j - (arr.length - 1) / 2) * step;
    els.push({ group: 'nodes', data: { id: 'g:' + ng, label, fs: 13, ...nodeBox(label, 13, 120), color: colorOfGroup(ng), kind: 'neighbor', gid: ng }, position: { x: cols * 200 + 140, y }, classes: 'neighbor' });
  });
  for (const k of fileEdge) {
    const parts = k.split('|');
    if (parts[2] === 'in') els.push({ group: 'edges', data: { id: 'n:' + k, source: 'g:' + parts[0], target: 'f:' + parts[1], w: 1, color: css('--line'), ls: 'solid', op: 0.45 } });
    else els.push({ group: 'edges', data: { id: 'n:' + k, source: 'f:' + parts[0], target: 'g:' + parts[1], w: 1, color: parts[2] === 'h' ? css('--accent') : css('--line'), ls: parts[2] === 'h' ? 'dashed' : 'solid', op: 0.45 } });
  }
  return els;
}

// ---------- Сценарий ----------
function flowEls(fl) {
  const els = [];
  const narrow = $('#cy').clientWidth < 620;
  fl.steps.forEach(([p], i) => {
    const f = FILE.get(p);
    const label = `${i + 1}. ${f.name}`;
    const b = nodeBox(label, 14, 150);
    const pos = narrow ? { x: (i % 2) * 40, y: i * 110 } : { x: i * 230, y: (i % 2) * 70 };
    els.push({ group: 'nodes', data: { id: 'f:' + p, label, fs: 14, ...b, color: colorOfGroup(f.group), kind: 'file', path: p }, position: pos, classes: 'step' + (FIND.has(p) ? ' hot' : '') });
    const c = fl.callers[i];
    if (c !== null && c !== undefined) els.push({ group: 'edges', data: { id: `fe${i}`, source: 'f:' + fl.steps[c][0], target: 'f:' + p, w: 2, color: css('--accent'), ls: 'solid', op: 0.9 } });
  });
  if (fl.tableAt >= 0) {
    const at = fl.steps[fl.tableAt][0];
    const label = `таблица\n${fl.table}`;
    const base = els.find((e) => e.data.id === 'f:' + at).position;
    els.push({ group: 'nodes', data: { id: 't:' + fl.table, label, fs: 13, ...nodeBox(label, 13, 140), color: colorOfGroup('db'), kind: 'table' }, position: narrow ? { x: base.x + 230, y: base.y } : { x: base.x, y: base.y + 170 }, classes: 'db' });
    els.push({ group: 'edges', data: { id: 'ft', source: 'f:' + at, target: 't:' + fl.table, w: 1.6, color: css('--fg-2'), ls: 'dotted', op: 0.9 } });
  }
  return els;
}

function draw(els, layout) {
  cy.elements().remove();
  cy.add(els);
  const l = cy.layout(layout || { name: 'preset', fit: true, padding: 30 });
  l.run();
  cy.fit(undefined, 30);
}

let selected = null;
function renderPanel() {
  const el = $('#panel');
  if (view === 'flows') el.innerHTML = flowsPanel();
  else if (view === 'health' && !selected) el.innerHTML = healthPanel();
  else if (selected?.type === 'file') el.innerHTML = filePanel(selected.id);
  else if (selected?.type === 'group') el.innerHTML = groupPanel(selected.id);
  else if (scope) el.innerHTML = groupPanel(scope);
  else el.innerHTML = view === 'health' ? healthPanel() : overviewPanel();
}
function clearFade() { cy.elements().removeClass('faded focus'); selected = null; }
function focusNode(n) {
  cy.elements().addClass('faded');
  n.closedNeighborhood().removeClass('faded');
  n.addClass('focus');
}
function onNode(n) {
  const k = n.data('kind');
  if (view === 'flows') { if (n.data('path')) { selected = { type: 'file', id: n.data('path') }; $('#panel').innerHTML = filePanel(n.data('path')) + `<button class="row" data-back="1"><span>← К сценарию</span></button>`; } return; }
  if (k === 'group') { openGroup(n.id()); return; }
  if (k === 'neighbor') { openGroup(n.data('gid')); return; }
  if (k === 'file') { selected = { type: 'file', id: n.data('path') }; focusNode(n); renderPanel(); return; }
  if (k === 'db') { selected = null; $('#panel').innerHTML = `<h2>База данных</h2><p>Таблицы, к которым эти файлы обращаются прямым SQL. Названия сверены с миграциями.</p><div class="list-tight">${G.tables.map((t) => `<div class="row"><span>${esc(t.n)}</span><small>${t.users.length} ${plural(t.users.length, 'файл', 'файла', 'файлов')}</small></div>`).join('')}</div>`; focusNode(n); return; }
  if (k === 'core') { selected = null; focusNode(n); $('#panel').innerHTML = `<h2>${esc(n.data('label'))}</h2><p>Часть Ведара вне этой карты. Линия показывает, какие части кабинета её используют.</p>`; }
}

function setCrumbs() {
  const legend = `<span class="legend"><span>использует</span><span class="http">запрос к API</span><span class="data">база</span></span>`;
  if (view === 'flows') { $('#crumbs').innerHTML = `<span>Сценарий: ${esc(G.flows.find((x) => x.id === flowId).title)}</span>${legend}`; return; }
  if (view === 'list') { $('#crumbs').innerHTML = `<span>Все части и файлы</span>`; return; }
  $('#crumbs').innerHTML = scope ? `<button data-home="1">Вся карта</button><span>›</span><span>${esc(GROUP.get(scope).label)}</span>${legend}` : `<span>Вся карта</span>${legend}`;
}
function showOverview() { scope = null; selected = null; draw(overviewEls()); setCrumbs(); renderPanel(); }
function openGroup(gid, focusPath) {
  if (view !== 'map' && view !== 'health') setView('map', true);
  scope = gid; selected = focusPath ? { type: 'file', id: focusPath } : { type: 'group', id: gid };
  draw(groupEls(gid));
  setCrumbs();
  if (focusPath) { const n = cy.getElementById('f:' + focusPath); if (n.nonempty()) focusNode(n); }
  renderPanel();
}
function openFile(p) { const f = FILE.get(p); if (f) openGroup(f.group, p); }
function showFlow(id) { flowId = id; selected = null; draw(flowEls(G.flows.find((x) => x.id === id))); setCrumbs(); renderPanel(); }
function renderList() {
  $('#list').innerHTML = G.groups.map((g) => `
    <section class="grp"><h3 style="color:${colorOfGroup(g.id)}">${esc(g.label)}</h3><p>${esc(g.summary)}</p>
    <div class="list-tight">${G.files.filter((f) => f.group === g.id).sort((a, b) => b.loc - a.loc).map((f) => `<button class="row" data-open="${esc(f.path)}"><span>${esc(f.name)} <small>${nf(f.loc)} стр.</small></span><small>${esc(f.doc || 'нет описания в файле')}</small><span class="path">${esc(f.path)}</span></button>`).join('')}</div></section>`).join('');
}
function setView(v, silent) {
  view = v;
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.view === v)));
  const isList = v === 'list';
  $('#cy').hidden = isList; $('#list').hidden = !isList;
  if (!silent) { try { history.replaceState(null, '', '#' + v); } catch (e) { /* кадр без истории */ } }
  if (isList) { renderList(); setCrumbs(); $('#panel').innerHTML = overviewPanel(); return; }
  if (silent) return;
  cy.resize();
  if (v === 'flows') showFlow(flowId); else showOverview();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-open],[data-group],[data-flow],[data-home],[data-back],[data-view]');
  if (!t) return;
  if (t.dataset.view) { setView(t.dataset.view); return; }
  if (t.dataset.open) { $('#results').hidden = true; if (view === 'list' || view === 'flows') setView('map', true), $('#cy').hidden = false, $('#list').hidden = true, cy.resize(); openFile(t.dataset.open); return; }
  if (t.dataset.group) { openGroup(t.dataset.group); return; }
  if (t.dataset.flow) { showFlow(t.dataset.flow); return; }
  if (t.dataset.home) { showOverview(); return; }
  if (t.dataset.back) { selected = null; renderPanel(); }
});
$('#q').addEventListener('input', () => {
  const q = $('#q').value.trim().toLowerCase();
  const box = $('#results');
  if (q.length < 2) { box.hidden = true; return; }
  const hits = G.files.filter((f) => f.path.toLowerCase().includes(q) || (f.doc || '').toLowerCase().includes(q)).slice(0, 10);
  box.innerHTML = hits.length ? hits.map((f) => fileLink(f.path)).join('') : '<div class="row"><small>Ничего не нашлось</small></div>';
  box.hidden = false;
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('#results').hidden = true; } });

function rebuildForTheme() {
  if (!cy) return;
  cy.style(cyStyle());
  if (view === 'flows') showFlow(flowId); else if (view === 'list') renderList(); else if (scope) openGroup(scope, selected?.type === 'file' ? selected.id : undefined); else showOverview();
}
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rebuildForTheme); } catch (e) { /* старый браузер */ }
new MutationObserver(rebuildForTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function start() {
  if (typeof cytoscape === 'undefined') {
    $('#cy').innerHTML = '<p style="padding:16px">Схема не загрузилась (нет библиотеки). Откройте вкладку «Список».</p>';
    setView('list'); return;
  }
  initCy();
  const h = (location.hash || '').slice(1);
  setView(['map', 'flows', 'health', 'list'].includes(h) ? h : 'map');
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (cy && !$('#cy').hidden) { cy.resize(); if (view === 'flows') showFlow(flowId); else cy.fit(undefined, 30); } }, 200); });
start();
</script>
