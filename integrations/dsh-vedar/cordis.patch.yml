# dsh-vedar — Vedar (vedarai.ru), Kamchatka travel MCP server, for DeepSeek Harness.
# One @deepseek-ai/dsh-mcp-client instance; the model sees the tools as mcp__vedar__<tool>.
# Streamable HTTP, no auth, rate-limited by IP. Four write tools are requests confirmed
# by a human (create_lead, create_booking_request, create_stay_request, request_charter).
# Emergency number in Kamchatka: 112.
- insert:
    - id: mcp-vedar
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: vedar
        transport: streamable-http
        url: https://vedarai.ru/api/mcp
