# Dependabot: автоматические PR на обновление зависимостей.
# Security-обновления приходят сразу (вне расписания), версионные — раз в неделю.
# Каждый PR проходит обычный CI (tsc + vitest) — мержить только зелёные,
# по циклу «один PR = одна задача». Пуш в main = автодеплой Timeweb.
version: 2
updates:
  # npm: минорные и патчи группируются в один PR, чтобы не заспамить очередь.
  # Мажорные версии идут отдельными PR — их смотреть внимательно
  # (прошлый опыт: nodemailer 7→9 и vitest 3→4 требовали правок).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # major-обновления критичных пакетов Dependabot НЕ создаёт автоматически:
    # 05.07.2026 бамп react-dom 18→19 (без react) сломал main и мог уронить
    # деплой. Такие миграции делаем вручную, согласованным набором версий:
    #   - react/react-dom — только вместе, одним мажором, с проверкой 188 компонентов
    #   - next — major с ним тянет React/сборку
    #   - типы react — за реальными версиями, не сами по себе
    # Minor/patch этих пакетов приходят как обычно.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
    labels:
      - dependencies

  # GitHub Actions: пины экшенов в 41 workflow (cron-агенты, CI, deploy)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  # Docker: базовый образ node в Dockerfile (лимит standalone 50 МБ —
  # обновление базового образа проверять на размер, см. CLAUDE.md §6.1).
  # Major node НЕ автоматизируем: Docker-сборку CI не проверяет, смена базы
  # может тихо уронить деплой (npm ci / размер образа). Меняем базу вручную
  # с локальной сборкой. Minor/patch (обновления патч-тега образа) — ок.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "docker"
    labels:
      - dependencies
