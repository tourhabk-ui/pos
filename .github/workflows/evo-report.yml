name: Evo — рука действия (находки → GitHub Issues)

# Читает находки Growth Scan в статусе 'suggested' (не сводятся к авто-фиксу —
# нужен человек) и заводит по ним GitHub Issues. Никаких изменений кода: только
# задачи в трекер — безопасно и обратимо. Дедуп: колбэк проставляет
# github_issue_url; вторая линия — поиск открытой issue по заголовку.
#
# Раннер на GitHub (не на Timeweb) → RF-блокировки не мешают. Требует secret
# CRON_SECRET; issue создаёт под GITHUB_TOKEN (прав `issues: write` достаточно).

on:
  schedule:
    - cron: '37 5 * * *'   # ежедневно 05:37 UTC (нечётная минута — GitHub дропает :00)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/evo-report.json'

concurrency:
  group: evo-report
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Завести GitHub Issues из находок эволюции
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVO_REPO: ${{ github.repository }}
          # Эволюция 3.0, п.3: выключатель авто-запуска руки. Actions variable
          # EVO_AUTOPR=1 → auto_runnable-находки получают метку agent-proposal,
          # claude.yml ведёт их до draft-PR. По умолчанию выключено.
          #
          # Прежде здесь стояло обоснование «ключ руки (ANTHROPIC_API_KEY) без
          # кредитов». Оно УСТАРЕЛО: 19.08 владелец проверил — кредиты есть,
          # авто-пополнение включено. Комментарий пережил своё основание и
          # успел ввести в заблуждение при разборе немоты решателя: я повторил
          # его как факт, не проверив. Причина отказа Anthropic на раннере
          # выясняется отдельно, по HTTP-коду из отчёта разбора.
          EVO_AUTOPR: ${{ vars.EVO_AUTOPR }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "ERROR: CRON_SECRET secret не настроен"; exit 1; fi
          node scripts/evo-report-issues.js
