name: Сборка пакета карты района

# Ручной запуск: пакеты собираются редко и по решению человека — рельеф
# Камчатки не меняется по расписанию. Автоматический прогон здесь означал бы
# перекачку DEM и заливку 11 МБ в хранилище без причины.
#
# Где что исполняется (то же разделение, что в §8 CLAUDE.md):
#   собирает — раннер GitHub (нужны Python и сеть до Copernicus);
#   хранит   — объектное хранилище Timeweb;
#   читает   — прод, Range-запросами.
# Поэтому ключи S3 нужны ИМЕННО в секретах репозитория: переменные Timeweb
# сюда не достают, это разные контуры.

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Район из lib/geo/regions.ts (напр. avacha-group)'
        required: true
        default: 'avacha-group'
      upload:
        description: 'Заливать в хранилище (иначе только собрать и приложить артефактом)'
        type: boolean
        default: false
      terrain_only:
        description: 'Только рельеф (запас DEM за границей): без горизонталей, OSM, вектора, глифов'
        type: boolean
        default: false
  # Второй вход — файл-триггер, по образцу проб (probe-url.json): интеграция
  # Claude не имеет права на workflow_dispatch (403, проверено 02.09), а
  # просить владельца кликать с телефона в поле — лишний круг. Пуш файла
  # запускает сборку С ТОЙ ВЕТКИ, куда запушен: конвейер и контракт пакета
  # берутся из неё, и пакет можно пересобрать до мержа в main.
  push:
    branches: [main, 'claude/**']
    paths:
      - '.github/triggers/map-pack-build.json'

# Права по минимуму: сборщику нужно только прочитать репозиторий. Пакет он
# кладёт в объектное хранилище, а не в git, и писать сюда ему нечем.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 120 (было 30, 02.09): Overpass на крупном районе отвечает с
    # четвёртой попытки после паузы — 12 клеток занимали 26 минут, и прогон 10
    # отменился на двенадцатой. Время здесь — ожидание чужого сервера, не
    # наша работа.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Параметры — из ввода или из файла-триггера
        id: cfg
        run: |
          # Ручной запуск даёт inputs; пуш файла-триггера — нет. Один источник
          # параметров дальше по шагам, чтобы не держать две ветки логики.
          if [ -n "${{ inputs.region }}" ]; then
            REGION="${{ inputs.region }}"; UPLOAD="${{ inputs.upload }}"; TERRAIN_ONLY="${{ inputs.terrain_only }}"
          else
            REGION=$(python3 -c "import json;print(json.load(open('.github/triggers/map-pack-build.json'))['region'])")
            UPLOAD=$(python3 -c "import json;print('true' if json.load(open('.github/triggers/map-pack-build.json')).get('upload') else 'false')")
            TERRAIN_ONLY=$(python3 -c "import json;print('true' if json.load(open('.github/triggers/map-pack-build.json')).get('terrain_only') else 'false')")
          fi
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "upload=$UPLOAD" >> "$GITHUB_OUTPUT"
          echo "terrain_only=${TERRAIN_ONLY:-false}" >> "$GITHUB_OUTPUT"
          echo "район: $REGION · заливка: $UPLOAD · только рельеф: ${TERRAIN_ONLY:-false} · ref: $GITHUB_REF_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Инструменты сборки
        run: |
          pip install --quiet rasterio pmtiles pillow matplotlib shapely osm2geojson
          npm ci --ignore-scripts

      # tippecanoe — нарезка векторных тайлов (02.09). Собранный бинарник
      # кэшируется по версии: сборка из исходников — три минуты на каждый
      # прогон, а прогонов по десять за вечер.
      - uses: actions/cache@v4
        id: tippecanoe
        with:
          path: .cache/tippecanoe-bin
          key: tippecanoe-2.78.0-${{ runner.os }}
      - name: tippecanoe — из кэша или из исходников
        run: |
          if [ ! -x .cache/tippecanoe-bin/tippecanoe ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev
            git clone --quiet --depth 1 --branch 2.78.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
            make -C /tmp/tippecanoe -j"$(nproc)" >/dev/null
            mkdir -p .cache/tippecanoe-bin
            cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tile-join .cache/tippecanoe-bin/
          fi
          echo "$PWD/.cache/tippecanoe-bin" >> "$GITHUB_PATH"
          .cache/tippecanoe-bin/tippecanoe --version

      - name: Границы района — из реестра, не из ввода
        id: bbox
        run: |
          # Единственный источник истины о границах — lib/geo/regions.ts.
          # Второй, вписанный руками в workflow, разъехался бы молча: пакет
          # собрался бы на старый bbox, и карта кончалась бы у края района
          # без единой ошибки.
          BBOX=$(npx tsx scripts/map-tiles/region-bbox.ts "${{ steps.cfg.outputs.region }}")
          echo "value=$BBOX" >> "$GITHUB_OUTPUT"
          echo "bbox района ${{ steps.cfg.outputs.region }}: $BBOX"

      - name: Рельеф — terrain-RGB в PMTiles
        run: |
          mkdir -p .cache/packs
          python3 scripts/map-tiles/build_terrain.py \
            --bbox "${{ steps.bbox.outputs.value }}" \
            --out ".cache/packs/${{ steps.cfg.outputs.region }}.terrain.pmtiles"

      - name: Горизонтали — GeoJSON с высотой в атрибуте (100/500 м) и частые (20 м) для тайлов
        if: ${{ steps.cfg.outputs.terrain_only != 'true' }}
        run: |
          python3 scripts/map-tiles/build_contours.py \
            --bbox "${{ steps.bbox.outputs.value }}" \
            --out ".cache/packs/${{ steps.cfg.outputs.region }}.contours.geojson" \
            --fine-out ".cache/vector/${{ steps.cfg.outputs.region }}.contours-fine.geojson"

      # Кэш ответов Overpass по клеткам — между прогонами. Прогон 9 (02.09)
      # снял шесть клеток из двенадцати и упал на седьмой; без кэша прогон 10
      # спрашивал бы те же шесть заново у тех же перегруженных узлов.
      - uses: actions/cache/restore@v4
        if: ${{ steps.cfg.outputs.terrain_only != 'true' }}
        with:
          path: .cache/osm
          key: overpass-${{ steps.cfg.outputs.region }}-v1-${{ github.run_id }}
          restore-keys: |
            overpass-${{ steps.cfg.outputs.region }}-v1-

      - name: OSM-слои — вода, реки, лес, ледники, тропы, дороги, вершины, имена, покрытия, обрывы, броды, источники
        if: ${{ steps.cfg.outputs.terrain_only != 'true' }}
        run: |
          # Overpass с раннера: из контейнера сборки OSM недостижим, и стиль с
          # 31.08 честно писал «рек, леса и троп нет». Один запрос на район.
          python3 scripts/map-tiles/build_osm.py \
            --bbox "${{ steps.bbox.outputs.value }}" \
            --out-prefix ".cache/packs/${{ steps.cfg.outputs.region }}"

      # Сохранить снятые клетки ПРИ ЛЮБОМ исходе — и при отмене по потолку
      # времени: прогон 10 снял 11 клеток из 12 и потерял все, потому что
      # post-шаг actions/cache при отмене не выполняется.
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.cfg.outputs.terrain_only != 'true' }}
        with:
          path: .cache/osm
          key: overpass-${{ steps.cfg.outputs.region }}-v1-${{ github.run_id }}

      - name: Векторные тайлы — горизонтали и все OSM-слои в один PMTiles
        if: ${{ steps.cfg.outputs.terrain_only != 'true' }}
        run: |
          # Частые горизонтали лежат в .cache/vector (не в пакете — в
          # хранилище они не идут); tippecanoe ждёт всё под одним префиксом.
          P=".cache/packs/${{ steps.cfg.outputs.region }}"
          cp ".cache/vector/${{ steps.cfg.outputs.region }}.contours-fine.geojson" "$P.contours-fine.geojson"
          scripts/map-tiles/build_vector.sh "$P" "$P.vector.pmtiles"
          rm "$P.contours-fine.geojson"

      - name: Глифы — Noto Sans, цифры и кириллица
        if: ${{ steps.cfg.outputs.terrain_only != 'true' }}
        run: |
          # Подписи высот (и дальше — имена мест) требуют PBF-глифов. Свои,
          # в том же хранилище, а не с чужого CDN: иначе «карта сохранена»
          # лгало бы — тайлы в пакете, а числа на них приезжают из сети.
          # Диапазоны и имя шрифта — из lib/map/pack-source.ts (PACK_GLYPHS),
          # второго списка здесь нет намеренно.
          FONT=$(node -e "const t=require('fs').readFileSync('lib/map/pack-source.ts','utf8');console.log(t.match(/fontstack: '([^']+)'/)[1])")
          RANGES=$(node -e "const t=require('fs').readFileSync('lib/map/pack-source.ts','utf8');console.log(t.match(/ranges: \[([^\]]+)\]/)[1].replace(/['\s]/g,'').split(',').join(' '))")
          DIR=".cache/packs/glyphs/$FONT"
          mkdir -p "$DIR"
          ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$FONT")
          for r in $RANGES; do
            URL="https://protomaps.github.io/basemaps-assets/fonts/$ENC/$r.pbf"
            curl -fsSL --retry 3 -o "$DIR/$r.pbf" "$URL"
            SZ=$(stat -c %s "$DIR/$r.pbf")
            echo "  $FONT/$r.pbf: $SZ байт"
            if [ "$SZ" -lt 1000 ]; then echo "::error::глифы $r: файл подозрительно мал ($SZ байт)"; exit 1; fi
          done

      - name: Размер пакета — фактом в лог
        run: |
          # Владелец просил размер и время сборки как факты, а не «примерно».
          # Заодно сторож §6.1: пакет НЕ должен попасть в образ, но если он
          # вдруг вырос до десятков мегабайт — это надо увидеть здесь.
          du -h .cache/packs/* | sed 's/^/  /'
          total=$(du -cb .cache/packs/* | tail -1 | cut -f1)
          echo "итого: $((total / 1024 / 1024)) МБ"
          # Потолок 200 МБ (02.09, было 60): это сторож от случайного
          # раздувания, а не предел телефона — офлайн-кэш современного
          # телефона держит сотни мегабайт. Поднят ради крупных районов
          # (Ключевская, Южная, Эссо, Кроноцкий — 2-3 кв.°) по слову
          # владельца «прорисовать остальные районы». Скачивание такого
          # пакета в поле — минуты по мобильной сети, и это сказано на
          # кнопке «Сохранить карту» размером, а не скрыто.
          # 256 МБ (02.09, было 200): Эссо и Быстринский парк — 2.8 кв.° суши —
          # собрался в 209 МБ (рельеф 190, горизонтали 16, OSM 5) и упёрся в
          # 200 на последнем шаге после 50 минут Overpass. Это самый большой
          # район реестра; всё, что крупнее, уже дробится самим реестром.
          if [ "$total" -gt 268435456 ]; then
            echo "::error::Пакет больше 256 МБ — район слишком велик, дробите bbox"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: map-pack-${{ steps.cfg.outputs.region }}
          path: .cache/packs/
          retention-days: 7

      - name: Заливка в хранилище
        if: ${{ steps.cfg.outputs.upload == 'true' }}
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: |
          if [ -z "$S3_BUCKET" ]; then
            echo "::error::Секреты S3 не заданы в репозитории. Это ОТДЕЛЬНЫЙ набор от переменных Timeweb (§8)."
            exit 1
          fi
          if [ "${{ steps.cfg.outputs.terrain_only }}" = "true" ]; then
            # Только рельеф с запасом DEM (05.09): один файл, остальное в
            # хранилище прежнее.
            npx tsx scripts/map-tiles/upload-pack.ts "${{ steps.cfg.outputs.region }}" \
              ".cache/packs/${{ steps.cfg.outputs.region }}.terrain.pmtiles" --terrain-only
          else
            npx tsx scripts/map-tiles/upload-pack.ts "${{ steps.cfg.outputs.region }}" \
              ".cache/packs/${{ steps.cfg.outputs.region }}.terrain.pmtiles" \
              ".cache/packs/${{ steps.cfg.outputs.region }}.contours.geojson" \
              ".cache/packs/glyphs" \
              ".cache/packs/${{ steps.cfg.outputs.region }}" \
              ".cache/packs/${{ steps.cfg.outputs.region }}.vector.pmtiles"
          fi

      - name: Пакет НЕ залит — сказать это громко
        if: ${{ steps.cfg.outputs.upload != 'true' }}
        run: |
          # Пропущенный шаг выглядит в сводке почти как выполненный: галка
          # зелёная, прогон «успешен». Но заказывали файл в хранилище, а его
          # там нет — это ровно §4.0: зелёный прогон при несделанной работе.
          # Молчать об этом нельзя, падать тоже неправильно (сборка удалась).
          echo "::warning title=Пакет собран, но НЕ залит::Галочка upload была снята. Пакет лежит только артефактом этого прогона. Чтобы он попал в хранилище, перезапустите с включённой upload."
          {
            echo "### Пакет собран, но НЕ залит в хранилище"
            echo ""
            echo "Галочка \`upload\` была снята, поэтому шаг заливки пропущен."
            echo "Пакет доступен только артефактом этого прогона (7 дней)."
            echo ""
            echo "Чтобы карта увидела район — перезапустите с включённой \`upload\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Что делать дальше
        if: ${{ steps.cfg.outputs.upload == 'true' }}
        run: |
          echo "Пакет залит. Осталось два шага, оба руками и намеренно:"
          echo "  1. внести '${{ steps.cfg.outputs.region }}' в BUILT_PACK_REGIONS (lib/map/pack-source.ts)"
          echo "  2. проверить NEXT_PUBLIC_MAP_PACK_BASE_URL в переменных Timeweb"
          echo "Список собранных пакетов — обещание, что файл на месте."
