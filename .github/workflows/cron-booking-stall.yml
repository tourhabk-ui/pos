name: Cron — Booking Stall Alert (0 броней за 7 дней)

on:
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC ежедневно
  workflow_dispatch:

jobs:
  booking-stall-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check booking stall and alert
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/booking-stall-alert")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
