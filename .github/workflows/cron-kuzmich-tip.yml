name: Cron Kuzmich Tip

on:
  schedule:
    - cron: '0 14 * * 1,3,5'  # 14:00 UTC пн/ср/пт — совет туристу в канал
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Kuzmich tip post
        run: |
          curl -X GET "https://vedarai.ru/api/cron/kuzmich?type=tip" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions" \
            --max-time 120 \
            --fail
