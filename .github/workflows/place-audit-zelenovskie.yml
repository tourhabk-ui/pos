name: Аудит — Зеленовские озерки (что реально в базе)

# Одноразовый пульт. Владелец сообщил: у Зеленовских озерков на деле ДВЕ
# базы — старая (в народе) и новая, ~200м друг от друга (старая справа,
# новая левее). Проверяем через постоянный /api/cron/place-audit, есть ли
# у нас вообще запись/записи и в каком они состоянии (видимость, слияние,
# координаты) — до похода в интерфейс, чтобы понимать объём правки.
#
# Ветка не мержится в main — только push-триггер для вызова уже
# задеплоенного роута (у токена агента нет workflow_dispatch, 403).

on:
  push:
    branches: [place-audit-zelenovskie]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Перепись по нескольким написаниям
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET не задан"; exit 1
          fi

          # Одного слова мало: 30.08 перепись по «зеленовск» показала запись,
          # которой не было накануне, а «Раздолье» этим словом не ловится
          # вовсе. Спрашиваем поимённо по каждому написанию.
          for q in "зеленовск" "раздолье" "озерки"; do
            enc=$(printf '%s' "$q" | jq -sRr @uri)
            HTTP=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://vedarai.ru/api/cron/place-audit?q=$enc")
            echo "── q=$q → HTTP $HTTP"
            jq -c '.places[]? | {id, name, location_type, lat, lng, is_visible, has_safety, merged_into_name}' /tmp/out.json 2>/dev/null \
              || cat /tmp/out.json
            echo
            if [ "$HTTP" != "200" ]; then
              echo "::error::перепись по «$q» не прошла"; exit 1
            fi
          done

          # Владелец записал реальный трек «от 5 стройки». Его конец — это
          # фактический замер GPS, и он рассудит спор координат надёжнее
          # любой карты. Очередь загруженных треков отдаёт метаданные и
          # ссылку на GPX.
          echo "══ очередь загруженных треков (route_track_imports) ══"
          HTTP=$(curl -s -o /tmp/tracks.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/track-import-queue?status=all&limit=20")
          echo "HTTP $HTTP"
          jq -c '.items[]? | {created_at, trip_tag, note, points, length_km, span_km,
                              matched: .matched_route, problems, s3_url}' /tmp/tracks.json 2>/dev/null \
            || cat /tmp/tracks.json
