name: MCP probe (временный, удалить до мержа)

# Одноразовая проба MCP-сервера vedarai.ru с раннера: из контейнера
# разработки прод закрыт. Только чтение; пишущие инструменты не вызываются.
# Клиент представляется «vedar-audit-probe». Файл удаляется тем же PR.

on:
  push:
    branches: [ccr-1212a0d0-8yg7mi]
    paths:
      - '.github/workflows/mcp-probe-tmp.yml'
      - '.github/mcp-probe-tmp.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Probe
        run: python3 -u .github/mcp-probe-tmp.py
