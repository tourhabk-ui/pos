name: Cron — Tour Reminder (24h before)

# Runs daily at 06:00 UTC (18:00 Kamchatka time):
# Sends Telegram reminder to tourists who have a tour tomorrow.

on:
  schedule:
    - cron: '0 6 * * *'    # 06:00 UTC = 18:00 KMT (Камчатское время)
  workflow_dispatch:        # manual trigger

jobs:
  tour-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Сводка ответа вместо тела: лог Actions публичный, а в телах бывают
      # имена операторов, номера броней и свободный текст (перепись 23.11).
      # Отказ checkout не должен отменять вызовы эндпоинтов: без скрипта шаг
      # просто не напечатает сводку, исход решает код HTTP.
      - name: Скрипт сводки ответа
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Send 24h tour reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET не задан в секретах репозитория — эндпоинт не вызван, прогон не состоялся"
            exit 1
          fi

          HTTP=$(curl -s -o /tmp/reminder_resp.json -w "%{http_code}" \
            --max-time 120 \
            "https://vedarai.ru/api/cron/tour-reminder" \
            -H "Authorization: Bearer $CRON_SECRET")

          echo "HTTP: $HTTP"
          node scripts/cron-body-summary.mjs /tmp/reminder_resp.json "$HTTP" || true

          if [ "$HTTP" = "200" ]; then
            echo "Tour reminders sent OK"
          else
            echo "Unexpected HTTP $HTTP"
            exit 1
          fi
