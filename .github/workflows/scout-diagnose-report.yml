name: Scout — диагноз молчания в Issue

# Зачем этот workflow существует.
#
# Разведчик молчит с 01.08, и причина сидит на проде: в журнале прогонов
# (agent_run_history) и в воротах публикации. Прочитать её умеет
# GET /api/cron/scout-diagnose — но он под CRON_SECRET, а среда, где
# разбирают причину (рабочее место разработчика / агент в репозитории),
# закрыта egress-политикой организации и до vedarai.ru не дотягивается.
#
# Раннер GitHub дотягивается. Он и становится мостом: сходил на прод,
# положил ответ в Issue. Issue читается из репозитория кем угодно — и
# человеком, и агентом, который будет чинить. Данные перестают ходить
# через пересказ в переписке.
#
# READ-ONLY на стороне прода: scout-diagnose ничего не запускает и не
# публикует. Этот workflow тоже ничего не чинит — только приносит факты.

# Расписания нет намеренно. Это ДИАГНОСТИКА, а не платформенный крон: в
# реестре liveness она стала бы источником ложной тревоги («диагностика не
# запускалась» — беда, которой нет), а после починки #68 суточный отчёт в
# Issue превратился бы в шум. Запускает человек, когда нужны данные:
# Actions → «Scout — диагноз молчания в Issue» → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Снять диагноз с прода
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # exit 1, а не 0: без секрета диагноза НЕТ. Зелёный прогон при
          # отсутствии данных — ровно та ложь, из-за которой разведчика
          # семнадцать дней считали работающим.
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET не задан — диагноз не снят."
            exit 1
          fi
          HTTP=$(curl -s -o /tmp/diag.json -w "%{http_code}" --max-time 60 \
            "https://vedarai.ru/api/cron/scout-diagnose?limit=40" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP: $HTTP"
          [ "$HTTP" = "200" ] || { echo "::error::scout-diagnose ответил $HTTP"; cat /tmp/diag.json || true; exit 1; }
          cat /tmp/diag.json

          # Доступ бота в AI-канал — отдельный вопрос от ворот дайджеста, и
          # ответ на него не ждёт следующего прогона. Только чтение, без
          # пробного поста: в канале сорок тысяч подписчиков.
          #
          # Отказ этой проверки не роняет отчёт: диагноз по дайджесту уже
          # снят и он ценен сам по себе. Пустой файл разбор поймёт как
          # «проверка не состоялась» и так и напишет.
          CH=$(curl -s -o /tmp/channel.json -w "%{http_code}" --max-time 30 \
            "https://vedarai.ru/api/cron/ai-channel-check" \
            -H "Authorization: Bearer $CRON_SECRET" || echo "000")
          echo "channel-check HTTP: $CH"
          [ "$CH" = "200" ] || echo '{}' > /tmp/channel.json
          cat /tmp/channel.json

      - name: Собрать отчёт и обновить Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY' > /tmp/body.md
          import json, datetime

          d = json.load(open('/tmp/diag.json'))
          runs = d.get('runs') or []
          by = d.get('by_reason') or {}
          try:
              ch = json.load(open('/tmp/channel.json')) or {}
          except Exception:
              ch = {}

          print('# Разведчик: почему молчит')
          print()
          print(f"Снято: {datetime.datetime.now(datetime.timezone.utc):%Y-%m-%d %H:%M} UTC · "
                f"прогонов прочитано: {d.get('runs_read', 0)}")
          print()
          print('Отчёт собирает `.github/workflows/scout-diagnose-report.yml` — '
                'раннер GitHub ходит на прод, потому что среда разбора закрыта egress-политикой. '
                'Источник: `GET /api/cron/scout-diagnose` (read-only).')
          print()

          print('## Главное')
          print()
          last_ok = d.get('last_success_at')
          last_pub = d.get('last_published_at')
          print(f"- последний УСПЕШНЫЙ прогон: `{last_ok or 'не найден в прочитанном окне'}`")
          print(f"- последняя ПУБЛИКАЦИЯ: `{last_pub or 'не найдена'}` "
                f"(`{d.get('last_published_slug') or '-'}`)")
          print()

          # Различение, ради которого всё и затевалось: не запускался вовсе —
          # это НЕ то же самое, что запускался и не публиковал.
          if not runs:
              print('> **Прогонов в журнале нет.** Значит держат не ворота публикации, '
                    'а запуск: агент не вызывался вовсе. Смотреть надо внешнее расписание '
                    '(cron-job.org → `evo.run`), а не логику дайджеста.')
          else:
              codes = [r for r in runs if r.get('status') != 'success']
              if codes and len(set(r.get('skip_reason') for r in codes)) == 1:
                  only = codes[0].get('skip_label') or codes[0].get('skip_reason')
                  print(f'> **Одна и та же причина на всех молчаливых прогонах: {only}.** '
                        'Это стена, а не череда случайностей — чинить надо именно её.')
              elif codes:
                  print('> Причины РАЗНЫЕ — значит молчат разные вещи, и общей стены нет. '
                        'Разбирать по самой частой из таблицы ниже.')
          print()

          print('## Сколько раз какая причина (основной дайджест)')
          print()
          print('| Причина | Раз |')
          print('|---|---|')
          for k, v in sorted(by.items(), key=lambda kv: -kv[1]):
              print(f'| {k} | {v} |')
          print()

          # Второй канал считается ОТДЕЛЬНО: «дайджест ушёл» и «пост в канал
          # ушёл» — разные события, и слитый счёт прячет ровно тот вопрос,
          # ради которого разбор открывают.
          ai_by = d.get('ai_channel_by_reason') or {}
          print('## Канал @ai_hub_money — отдельно')
          print()
          print(f"- последний пост в канал: `{d.get('ai_channel_last_sent_at') or 'не найден в прочитанном окне'}`")
          # Доступ бота — вопрос, не зависящий от ворот дайджеста: заданный ID
          # без прав админа означает молчание канала при любом дайджесте.
          # Проверка только чтением, пробного поста в канал на 40К нет.
          if ch.get('summary'):
              print(f"- доступ бота: **{ch['summary']}**"
                    + (f" (бот @{ch['bot']})" if ch.get('bot') else ''))
              if ch.get('outcome') == 'cannot_post':
                  print()
                  print('> **Публиковать в канал бот НЕ МОЖЕТ.** Это причина, не зависящая от '
                        'ворот фактчека: даже успешный дайджест в канал не уйдёт. Чинится в '
                        'Telegram — бота добавить в канал администратором с правом публикации.')
          else:
              print('- доступ бота: проверка не состоялась (см. лог шага channel-check)')
          print()
          print('| Исход | Раз |')
          print('|---|---|')
          for k, v in sorted(ai_by.items(), key=lambda kv: -kv[1]):
              print(f'| {k} | {v} |')
          print()
          if ai_by.get('(исход канала не записан)', 0) == len(runs) and runs:
              print('> Исход канала не записан НИ РАЗУ в прочитанном окне: прогоны старше '
                    'правки от 29.08. Судить о канале по ним нельзя — нужен свежий прогон.')
          elif ai_by.get('ai_channel_not_configured'):
              print('> **`TELEGRAM_AI_CHANNEL_ID` не задан на проде.** Даже при успешном '
                    'дайджесте публиковать в канал некуда — это отдельная от ворот беда, '
                    'и чинится она переменной окружения, а не кодом.')
          print()

          print('## Прогоны')
          print()
          print('| Когда | Статус | Сигналов | LLM | Причина | Канал | Деталь |')
          print('|---|---|---|---|---|---|---|')
          for r in runs[:40]:
              detail = (r.get('skip_detail') or '')[:120].replace('|', '\\|').replace('\n', ' ')
              label = r.get('skip_label') or r.get('skip_reason') or ''
              sent = r.get('ai_channel_sent')
              ch = 'ушёл' if sent is True else (r.get('ai_channel_skip_label') or r.get('ai_channel_skip_reason') or '(не записано)')
              print(f"| {r.get('at','')} | {r.get('status','')} | {r.get('signals') if r.get('signals') is not None else ''} "
                    f"| {r.get('llm_calls') if r.get('llm_calls') is not None else ''} | {label} | {ch} | {detail} |")
          print()
          print('---')
          print()
          print('Канал `@ai_hub_money` публикуется ПОСЛЕ основного дайджеста, то есть после '
                'всех ворот: сработали ворота — в канал не уходит ничего. Отдельной причины '
                'у молчания канала может не быть вовсе.')
          PY

          TITLE="Разведчик: диагноз молчания"
          NUM=$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body-file /tmp/body.md
            echo "Дополнена issue #$NUM"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/body.md --label evo
            echo "Заведена новая issue"
          fi
