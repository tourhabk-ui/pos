name: Cron — Intelligence (мониторинг AI/Travel трендов)

on:
  schedule:
    - cron: '0 3,9,15,21 * * *'  # каждые 6 часов (смещение 3ч от evo)
  workflow_dispatch:
  # Запуск маркером: workflow_dispatch через интеграцию отвечает 403, а между
  # прогонами по расписанию проходит шесть часов. Столько же держится и
  # тревога Watchdog о бесплодных прогонах — она пересказывает последние три,
  # и после починки списка лент ждать её ухода приходится до следующего
  # расписания. Тот же приём, что у prod-check и scout-digest: маркер — ручной
  # запуск, а не второй крон.
  push:
    branches: [main]
    paths:
      - '.github/triggers/intelligence.json'

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan AI/Travel/Competitor signals
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/intelligence")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
