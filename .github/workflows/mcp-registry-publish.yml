name: Публикация MCP-сервера в официальный реестр

# Реестр MCP (registry.modelcontextprotocol.io) — то, из чего раз в час тянут
# агрегаторы и по чему чужие агенты нас находят. 17.09 владелец услышал от
# чужих агентов «к vedarai.ru/api/mcp не обращаемся — его нет в каталоге»,
# а сам публиковать не мог: он на телефоне, а `mcp-publisher login` требует
# либо приватный ключ на своей машине, либо device-flow в браузере.
#
# Первая публикация (17.09, run 1) шла по OIDC — `login github-oidc`, право
# `id-token: write`, имя `io.github.tourhabk-ui/vedar`, без единого секрета.
# Тем же вечером владелец решил завести доменное имя `ru.vedarai/mcp`:
# доказательство владения — публичный ключ Ed25519 по адресу
# /.well-known/mcp-registry-auth (константа в lib/mcp/registry-auth.ts,
# деплоится с приложением), а приватная половина — в секрете Actions
# `MCP_REGISTRY_PRIVATE_KEY` (hex-семя). Секрет добавляется с телефона в
# настройках репозитория; на машину владельца ничего не нужно.
#
# Секрета нет — прогон краснеет ДО входа, с именем секрета: это честнее,
# чем ошибка реестра «invalid signature» без объяснения.
#
# Запись `io.github.tourhabk-ui/vedar` и доменная не могут жить вместе:
# реестр держит один адрес за одной записью («remote URL … is already used
# by server …», run 9, 17.09) — правило, которого нет в его документации.
# Поэтому старое имя снимается (deleted, по OIDC — тем же правом, каким его
# заводили) ДО публикации доменного, а при отказе публикации возвращается в
# active: невидимость в реестре хуже старого имени.
#
# Повторная публикация той же версии реестром отвергается («cannot publish
# duplicate version», 400). Первый же мерж в main это показал: маркер
# опубликовал версию с ветки, а squash в main тронул тот же маркер и
# запустил прогон второй раз — красный на ровном месте. Поэтому перед
# публикацией реестр спрашивается: версия уже там — публикация
# пропускается с явным «уже опубликовано», а не отказом. Это третий
# исход, не успех и не поломка. Новая версия — поднять `version` в
# server.json И `MCP_SERVER_INFO.version` в lib/mcp/public-tools.ts;
# сторож mcp-registry-publish.test.ts держит их равными.
#
# Ноль результатов после публикации — отказ, а не успех (§4.0): последний
# шаг спрашивает реестр и краснеет, если нас там нет.
#
# Ручной вход и файл-триггер — как у остальных сборок: интеграция Claude не
# имеет права на workflow_dispatch (403, проверено 02.09).
#
# Только main, без веток claude/**: реестр читает публичный ключ с прода
# (/.well-known/mcp-registry-auth), а прод собирается только из main.
# Прогон с ветки ждал бы сборку, которой не будет, и упирался бы в старый
# прод — красный, не говорящий ничего нового. Первый прогон (17.09, OIDC)
# шёл с ветки, потому что тогда ключа не требовалось.
#
# Ожидание своей сборки — по общему правилу (scripts/wait-for-deploy.sh,
# сторож marker-waits-for-deploy): маркер едет в main вместе с кодом, а
# образ собирается 5–20 минут; без ожидания реестр прочитал бы ключ у
# вчерашнего прода.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/mcp-registry-publish.json'

permissions:
  id-token: write   # OIDC-токен для реестра
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Ожидание сборки — до 35 минут (70 x 30 с); таймаут обязан быть больше,
    # иначе прогон снимается в ту же секунду, когда дождался
    # (tests/unit/workflow-timeout-fits-wait.test.ts).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Дождаться своей сборки на проде
        env:
          BASE: https://vedarai.ru
          WANT_SHA: ${{ github.sha }}
          NEED_AFTER: ${{ github.event.head_commit.timestamp }}
        run: bash scripts/wait-for-deploy.sh

      - name: mcp-publisher — из релизов реестра
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version || true

      - name: Манифест — имя в пространстве, которое даёт ключ домена; секрет на месте
        id: manifest
        run: |
          set -euo pipefail
          NAME=$(python3 -c "import json;print(json.load(open('server.json'))['name'])")
          VERSION=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          case "$NAME" in
            ru.vedarai/*) ;;
            *) echo "::error::server.json называет '$NAME', а ключ домена даёт право только на ru.vedarai/*"; exit 1 ;;
          esac
          if [ -z "${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}" ]; then
            echo "::error::секрет MCP_REGISTRY_PRIVATE_KEY не задан — приватная половина ключа домена нужна для login http (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Публикуем $NAME @ $VERSION"

      - name: Уже в реестре? — тогда публиковать нечего
        id: present
        run: |
          set -euo pipefail
          NAME='${{ steps.manifest.outputs.name }}'
          VERSION='${{ steps.manifest.outputs.version }}'
          curl -sS -o before.json "https://registry.modelcontextprotocol.io/v0.1/servers?search=${NAME}"
          PRESENT=$(python3 - before.json "$NAME" "$VERSION" <<'PY'
          import json, sys
          path, name, version = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(path) as f:
              data = json.load(f)
          hit = any(
              s.get('server', {}).get('name') == name and s.get('server', {}).get('version') == version
              for s in data.get('servers', [])
          )
          print('true' if hit else 'false')
          PY
          )
          echo "present=$PRESENT" >> "$GITHUB_OUTPUT"
          if [ "$PRESENT" = "true" ]; then
            echo "::notice::$NAME @ $VERSION уже опубликован — публикация пропущена, ниже только проверка"
          fi

      - name: Снять старое имя io.github, опубликовать доменное; не вышло — вернуть старое
        if: steps.present.outputs.present != 'true'
        run: |
          set -uo pipefail
          # Правило реестра, которого нет в его документации и которое он
          # назвал сам (run 9, 10:01): «remote URL … is already used by server
          # io.github.tourhabk-ui/vedar». Один адрес — одна запись. Поэтому
          # порядок обратный первой редакции: сначала снять старое имя, потом
          # публиковать доменное. И третий исход: доменная публикация не
          # прошла — старое имя возвращается в active, чтобы мы ни минуты не
          # были невидимы в реестре, а прогон краснеет словами реестра.
          OLD='io.github.${{ github.repository_owner }}/vedar'
          curl -sS -o old.json "https://registry.modelcontextprotocol.io/v0.1/servers?search=${OLD}"
          STATE=$(python3 - old.json "$OLD" <<'PY'
          import json, sys
          path, name = sys.argv[1], sys.argv[2]
          with open(path) as f:
              data = json.load(f)
          hits = [s for s in data.get('servers', []) if s.get('server', {}).get('name') == name]
          if not hits:
              print('absent')
          else:
              print(hits[0].get('_meta', {}).get('io.modelcontextprotocol.registry/official', {}).get('status', 'unknown'))
          PY
          )
          echo "$OLD: $STATE"
          REMOVED=false
          if [ "$STATE" = "active" ] || [ "$STATE" = "deprecated" ]; then
            # Тем же правом, каким запись заводили: OIDC даёт io.github.<владелец>/*.
            # deleted, не deprecated: deprecated по документации «всё ещё виден» —
            # и, судя по ответу реестра, всё ещё держит адрес.
            ./mcp-publisher login github-oidc || exit 1
            ./mcp-publisher status --status deleted --message "Переехал на ru.vedarai/mcp" --all-versions --yes "$OLD" || exit 1
            REMOVED=true
            echo "$OLD снят (deleted)"
          fi

          ./mcp-publisher login http --domain vedarai.ru --private-key "${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}" || exit 1
          if ./mcp-publisher publish; then
            echo "Опубликовано доменное имя"
            exit 0
          fi

          echo "::error::доменная публикация не прошла — см. ответ реестра выше"
          if [ "$REMOVED" = "true" ]; then
            # Возврат старого имени: невидимость в реестре хуже старого имени.
            ./mcp-publisher login github-oidc && ./mcp-publisher status --status active --all-versions --yes "$OLD" \
              && echo "::warning::$OLD возвращён в active — в реестре мы по-прежнему под старым именем" \
              || echo "::error::вернуть $OLD не удалось — в реестре сейчас НЕТ ни одной нашей записи, нужен ручной разбор"
          fi
          exit 1

      - name: Реестр нас видит — иначе красный
        run: |
          set -euo pipefail
          NAME='${{ steps.manifest.outputs.name }}'
          VERSION='${{ steps.manifest.outputs.version }}'
          curl -sS -o registry-answer.json "https://registry.modelcontextprotocol.io/v0.1/servers?search=${NAME}"
          python3 - registry-answer.json "$NAME" "$VERSION" <<'PY'
          import json, sys
          path, name, version = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(path) as f:
              data = json.load(f)
          hits = [s for s in data.get('servers', []) if s.get('server', {}).get('name') == name]
          if not hits:
              print(f"::error::реестр не вернул {name}: {json.dumps(data)[:500]}")
              sys.exit(1)
          latest = [s for s in hits if s.get('_meta', {}).get('io.modelcontextprotocol.registry/official', {}).get('isLatest')]
          got = (latest or hits)[0]['server'].get('version')
          if got != version:
              print(f"::error::в реестре версия {got}, ожидалась {version}")
              sys.exit(1)
          print(f"Реестр видит {name} @ {got}")
          PY
