name: Channel — ручной пост через бота

# Доставляет .github/triggers/channel-post.json на прод-эндпоинт
# /api/cron/channel-post (паттерн kml-inbox: токен бота живёт только на
# проде). Публикация идемпотентна по тексту — повторный прогон с тем же
# триггером отвечает duplicate:true и пост не задваивает.
#
# Запуск: push в main, меняющий триггер-файл, или Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/channel-post.json'

jobs:
  channel-post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Publish post to channel via prod
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 1; fi

          FILE=".github/triggers/channel-post.json"
          jq -e . "$FILE" >/dev/null || { echo "триггер-файл не JSON"; exit 1; }

          BASE="https://vedarai.ru/api/cron/channel-post"

          # Ждём, пока прод отдаёт ИМЕННО ЭТОТ коммит, а не «какой-нибудь
          # рабочий эндпоинт». Живой случай 06.08: проверка «отвечает 401»
          # прошла мгновенно — эндпоинт существовал и в старом контейнере, —
          # и пост ушёл через старую схему, которая молча отбросила photos:
          # в канал уехала AI-обложка вместо альбома настоящих кадров.
          # Формат триггер-файла и код эндпоинта едут одним коммитом — значит
          # и публиковать можно только когда прод НА этом коммите.
          READY=""
          for i in $(seq 1 30); do
            SERVED=$(curl -s --max-time 30 "https://vedarai.ru/version.json" \
              | python3 -c "import json,sys;print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || echo "")
            if [ "${SERVED:0:7}" = "${GITHUB_SHA:0:7}" ]; then
              READY=1; echo "прод на ${SERVED:0:7} — коммит триггера задеплоен"; break
            fi
            echo "прод отдаёт ${SERVED:0:7}, ждём ${GITHUB_SHA:0:7} ($i/30)"
            sleep 60
          done
          if [ -z "$READY" ]; then echo "прод за 30 мин не перешёл на ${GITHUB_SHA:0:7} — публиковать через старый код нельзя"; exit 1; fi

          RESP=$(curl -s --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d @"$FILE" "$BASE" || echo '')
          echo "$RESP"
          if echo "$RESP" | jq -e '.success == true' >/dev/null 2>&1; then
            if echo "$RESP" | jq -e '.duplicate == true' >/dev/null 2>&1; then
              echo "пост уже публиковался ранее (дедуп по тексту) — пропуск"
            else
              echo "пост опубликован"
            fi
          else
            echo "публикация не удалась"
            exit 1
          fi
