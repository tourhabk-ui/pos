name: Channel — ручной пост через бота

# Доставляет .github/triggers/channel-post.json на прод-эндпоинт
# /api/cron/channel-post (паттерн kml-inbox: токен бота живёт только на
# проде). Публикация идемпотентна по тексту — повторный прогон с тем же
# триггером отвечает duplicate:true и пост не задваивает.
#
# Запуск: push в main, меняющий триггер-файл, или Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/channel-post.json'

permissions:
  contents: read
  deployments: read

jobs:
  channel-post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Своя сборка — по записи выката (scripts/wait-for-deploy.sh), а не по
      # commit в /version.json: маркер на проде отвечает commit=unknown
      # (no_git_head), и прежняя петля ждала 30 мин и падала (30.10, run 41030725157).
      - name: Wait for fresh deploy
        if: github.event_name == 'push'
        env:
          BASE: https://vedarai.ru
          WANT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          NEED_AFTER: ${{ github.event.head_commit.timestamp }}
        run: bash scripts/wait-for-deploy.sh

      - name: Publish post to channel via prod
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 1; fi

          FILE=".github/triggers/channel-post.json"
          jq -e . "$FILE" >/dev/null || { echo "триггер-файл не JSON"; exit 1; }

          BASE="https://vedarai.ru/api/cron/channel-post"

          RESP=$(curl -s --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d @"$FILE" "$BASE" || echo '')
          echo "$RESP"
          if echo "$RESP" | jq -e '.success == true' >/dev/null 2>&1; then
            if echo "$RESP" | jq -e '.duplicate == true' >/dev/null 2>&1; then
              echo "пост уже публиковался ранее (дедуп по тексту) — пропуск"
            else
              echo "пост опубликован"
            fi
          else
            echo "публикация не удалась"
            exit 1
          fi
