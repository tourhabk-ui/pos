name: Cron Kuzmich Route

on:
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC daily = 21:00 KMT (Kamchatka)
  workflow_dispatch:
  # Запуск маркером: workflow_dispatch через интеграцию отвечает 403, а
  # расписание одно на сутки. Проверять починку отправки фото, ожидая сутки,
  # значит проверять её раз в сутки. Тот же приём, что у prod-check и
  # scout-digest: маркер — ручной запуск, а не второй крон.
  push:
    branches: [main]
    paths:
      - '.github/triggers/kuzmich-route.json'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Kuzmich route post
        run: |
          curl -X GET "https://vedarai.ru/api/cron/kuzmich?type=route" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions" \
            --max-time 120 \
            --fail
