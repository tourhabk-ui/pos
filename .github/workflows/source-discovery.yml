name: Подбор источников разведчика одним проходом

# Вопрос владельца 07.09: «все источники и туриндустрия с законодательством
# рф? и опасности». Замер по коду: правового источника нет ни одного (все
# четыре туристических — отраслевые пересказы), а лавинных наблюдений нет
# вовсе — тип `avalanche` объявлен, текст пуша написан, и ни один источник его
# никогда не пишет.
#
# Решение владельца 07.09: «используй астру через опенроутер в гитхабе».
# Решение владельца 08.09: «дай задание внешнему агенту дипсику пусть подберет
# и проверит а не предположения» — предлагающий по умолчанию сменён на
# DeepSeek (прямой api.deepseek.com, без посредника). Путь через OpenRouter
# сохранён: имя модели в маркере включает его.
#
# Главный пробел с 08.09 — НОВОСТИ КРАЯ. Живых источников о Камчатке не
# осталось ни одного: kamgov и 41.mchs сняли RSS 01.08, kamchatka.aif.ru
# отдаёт HTML вместо ленты по всем трём обычным адресам (замер 40). Раздел
# «Камчатка» в дайджесте наполнялся федеральными новостями про ДФО.
#
# Раннер, а не прод: ключ OpenRouter для раннера живёт в секретах репозитория,
# и OpenRouter с раннера достижим напрямую (§8, таблица «какой ключ откуда»).
#
# Прогон НИЧЕГО не меняет: ни базы, ни состава источников. Он печатает таблицу
# с приговором по каждому адресу — вносит человек.
#
# Приговор выносит СЕРВЕР, а не модель: каждый предложенный адрес
# запрашивается, и в «живые» попадает только ответивший лентой. Отдельно
# печатается `refused_here` — отказ адреса раннеру, который стоит вне РФ; это
# не «ленты нет», а требование проверить с прода.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/source-discovery.json'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # Ожидания сборки здесь нет намеренно: прогон не зовёт прод вовсе —
      # только OpenRouter и сами адреса-кандидаты. Ждать деплой было бы
      # ожиданием ради ожидания (сторож tests/unit/marker-waits-for-deploy).
      - name: Подбор и перепись
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -uo pipefail
          MODEL=$(python3 -c "
          import json
          try:
              print(json.load(open('.github/triggers/source-discovery.json')).get('model') or '')
          except Exception:
              print('')
          ")
          npx tsx scripts/source-discovery-runner.ts $MODEL | tee /tmp/discovery.txt

      # Итог уходит В СВОДКУ И В АННОТАЦИЮ.
      #
      # Урок 08.09, оплаченный четырьмя прогонами подряд: сводка прогона НЕ
      # отдаётся через API проверки, а логи Actions закрыты прокси песочницы
      # агента. Замер, чей ответ лежит там, куда читатель не дотянется, —
      # половина замера: работа сделана, знания не прибавилось. Аннотация
      # доходит, поэтому итог дублируется в неё.
      - name: Итог в сводку и аннотацию
        if: always()
        run: |
          OUT=$(cat /tmp/discovery.txt 2>/dev/null || echo 'вывода нет')
          {
            echo "## Подбор источников разведчика"
            echo
            echo '```'
            echo "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Голова И хвост: у этого вывода итог («ЖИВЫЕ», «нужна проверка с
          # прода») стоит в КОНЦЕ, а перечень кандидатов — в начале. Взять
          # только голову значило бы снова обрезать ответ перед выводом.
          esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}'; }
          HEAD_PART=$(printf '%s' "$OUT" | head -c 2000 | esc)
          LEN=$(printf '%s' "$OUT" | wc -c)
          if [ "$LEN" -gt 2000 ]; then
            TAIL_PART=$(printf '%s' "$OUT" | tail -c 2500 | esc)
            echo "::notice title=Подбор источников::$HEAD_PART%0A…СЕРЕДИНА ОПУЩЕНА…%0A%0A$TAIL_PART"
          else
            echo "::notice title=Подбор источников::$HEAD_PART"
          fi
