name: Data — своя карта Камчатки (PMTiles)

# Фаза 1 плана офлайн-навигации: собрать СВОЮ карту и увидеть её настоящий вес.
#
# Зачем вообще уходить с чужих тайлов. Сейчас карту отдаёт tile.openstreetmap.org
# — сервер сообщества, живущий на пожертвования. Его политика прямо запрещает
# два наших сценария: массовую выкачку и раздачу тайлов через приложение. Пока
# трафик мал, никто не замечает; когда заметят, забанят по IP — и офлайн-карта
# умрёт разом у всех, в поле, где починить нельзя.
#
# Данные OSM при этом свободны (ODbL). Несвободна только чужая инфраструктура,
# и её мы заменяем своей.
#
# Почему векторные тайлы, а не растр. Камчатская рамка на 15 зуме — около трёх
# миллионов картинок, порядка 30 ГБ. Те же данные в векторе — сотни мегабайт,
# потому что рисует устройство, и любой зум получается из одного набора. Плюс
# офлайн становится ОДНОЙ закачкой одного файла вместо тысячи запросов за
# тайлами, каждый из которых может не дойти.
#
# ЭТОТ ПРОГОН НИЧЕГО НЕ ДЕПЛОИТ. Результат уходит артефактом, чтобы решение о
# переезде принималось по замеру, а не по оценке. Если файл выйдет
# неподъёмным — режем зумы или область, и это видно ДО того, как переписан
# фронтенд.
#
# Запуск: push в main, меняющий .github/triggers/pmtiles.json.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/pmtiles.json'

permissions:
  contents: read

concurrency:
  group: pmtiles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Выгрузка Дальнего Востока — сотни мегабайт, разбор занимает время.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Read config
        id: cfg
        run: |
          set -euo pipefail
          get() { python3 -c "import json;print(json.load(open('.github/triggers/pmtiles.json'))['$1'])"; }
          {
            echo "osmurl=$(get osmUrl)"
            echo "bounds=$(get bounds)"
            echo "minzoom=$(get minzoom)"
            echo "maxzoom=$(get maxzoom)"
            echo "version=$(get planetilerVersion)"
          } >> "$GITHUB_OUTPUT"
          echo "источник: $(get osmUrl)"
          echo "рамка: $(get bounds) · зумы $(get minzoom)-$(get maxzoom)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch Planetiler
        env:
          V: ${{ steps.cfg.outputs.version }}
        run: |
          set -euo pipefail
          curl -sSL --retry 3 --max-time 600 -o planetiler.jar \
            "https://github.com/onthegomap/planetiler/releases/download/v${V}/planetiler.jar"
          echo "planetiler.jar: $(du -h planetiler.jar | cut -f1)"

      # Ссылку проверяем ДО скачивания. Первый прогон 09.08 упал на псевдониме
      # geofabrik: («No matches for russia-far-eastern-fed-district») — ошибка
      # в одном слове стоила бы получаса ожидания, если бы всплыла после
      # загрузки семисот мегабайт. Здесь она видна за три секунды.
      - name: Check source is reachable
        env:
          OSM_URL: ${{ steps.cfg.outputs.osmurl }}
        run: |
          set -euo pipefail
          CODE=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 60 "$OSM_URL" || echo 000)
          echo "источник отвечает: HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Выгрузка недоступна по этой ссылке. Проверьте osmUrl в"
            echo ".github/triggers/pmtiles.json — Geofabrik переименовывает разделы."
            exit 1
          fi

      - name: Build Kamchatka vector tiles
        env:
          OSM_URL: ${{ steps.cfg.outputs.osmurl }}
          BOUNDS: ${{ steps.cfg.outputs.bounds }}
          MINZOOM: ${{ steps.cfg.outputs.minzoom }}
          MAXZOOM: ${{ steps.cfg.outputs.maxzoom }}
        run: |
          set -euo pipefail
          # --download тянет выгрузку по прямой ссылке; --bounds режет по
          # камчатской рамке, иначе в файл уедет весь Дальний Восток до
          # Владивостока.
          java -Xmx10g -jar planetiler.jar \
            --download \
            --osm-url="$OSM_URL" \
            --bounds="$BOUNDS" \
            --minzoom="$MINZOOM" \
            --maxzoom="$MAXZOOM" \
            --force \
            --output=kamchatka.pmtiles

      - name: Measure
        run: |
          set -euo pipefail
          BYTES=$(stat -c%s kamchatka.pmtiles)
          MB=$((BYTES / 1024 / 1024))
          echo "═══════════════════════════════════════"
          echo "Своя карта Камчатки: ${MB} МБ (${BYTES} байт)"
          echo "═══════════════════════════════════════"
          # Ориентир для решения. Сотни мегабайт на весь полуостров — это
          # нормально и несравнимо с 30 ГБ растра; если вышло больше гигабайта,
          # значит рамка или зумы взяты слишком щедро.
          if [ "$MB" -gt 1024 ]; then
            echo "ВНИМАНИЕ: больше гигабайта — для телефона тяжело."
            echo "Резать зумы (maxzoom) или рамку (bounds) в .github/triggers/pmtiles.json."
          fi
          {
            echo "### Своя карта Камчатки"
            echo ""
            echo "| Что | Значение |"
            echo "|---|---|"
            echo "| Вес файла | **${MB} МБ** |"
            echo "| Источник | ${{ steps.cfg.outputs.osmurl }} |"
            echo "| Рамка | ${{ steps.cfg.outputs.bounds }} |"
            echo "| Зумы хранения | ${{ steps.cfg.outputs.minzoom }}–${{ steps.cfg.outputs.maxzoom }} |"
            echo ""
            echo "Зум хранения 14 — не потолок показа: векторные тайлы дорисовываются"
            echo "на устройстве, на экране это 16–18 без единого лишнего байта."
            echo ""
            echo "Данные © OpenStreetMap contributors, ODbL."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: kamchatka-pmtiles
          path: kamchatka.pmtiles
          retention-days: 14
          compression-level: 0 # PMTiles уже сжат внутри — второй проход впустую

      # Выкладка в объектное хранилище. Шаг молча пропускается, пока секретов
      # нет: конвейер замера обязан работать и без хранилища — на нём
      # принималось решение о переезде, и ломать его настройкой нельзя.
      #
      # Почему не в образ приложения: 92 МБ не влезают в standalone-сборку
      # Timeweb (лимит 50 МБ, превышение роняет деплой).
      - name: Upload to object storage
        if: ${{ env.S3_BUCKET != '' }}
        env:
          S3_BUCKET:     ${{ secrets.MAP_S3_BUCKET }}
          S3_ENDPOINT:   ${{ secrets.MAP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.MAP_S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MAP_S3_SECRET }}
          AWS_DEFAULT_REGION: ru-1
        run: |
          set -euo pipefail
          KEY="maps/kamchatka-$(date -u +%Y%m%d).pmtiles"
          aws --endpoint-url "$S3_ENDPOINT" s3 cp kamchatka.pmtiles "s3://$S3_BUCKET/$KEY" \
            --content-type application/octet-stream \
            --cache-control "public, max-age=31536000, immutable"
          # Имя с датой, а не «latest»: файл, который меняется под тем же
          # адресом, ломает возобновление закачки — куски от старой и новой
          # версии сшивались бы в файл, которого никогда не было. Клиент
          # переключается на новую карту сменой переменной окружения, и старая
          # остаётся доступной тем, кто качает прямо сейчас.
          echo "Выложено: $S3_ENDPOINT/$S3_BUCKET/$KEY"
          {
            echo ""
            echo "Выложено в хранилище: \`$KEY\`"
            echo ""
            echo "Чтобы приложение начало брать карту отсюда, задайте"
            echo "\`NEXT_PUBLIC_MAP_PMTILES_URL\` на полный адрес файла."
          } >> "$GITHUB_STEP_SUMMARY"

      # Проверяем ГЛАЗАМИ раннера, а не надеждой: без Range и без открытых
      # заголовков формат бесполезен, и узнать об этом в браузере — значит
      # узнать поздно.
      - name: Verify Range and CORS
        if: ${{ env.S3_BUCKET != '' }}
        env:
          S3_BUCKET:   ${{ secrets.MAP_S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.MAP_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          KEY="maps/kamchatka-$(date -u +%Y%m%d).pmtiles"
          URL="$S3_ENDPOINT/$S3_BUCKET/$KEY"
          echo "── проверяем $URL ──"
          HDR=$(curl -s -D - -o /dev/null -r 0-99 -H 'Origin: https://vedarai.ru' "$URL" || true)
          echo "$HDR" | grep -iE '^(HTTP/|content-range|content-length|accept-ranges|etag|access-control-)' || true
          echo "$HDR" | grep -qi '^HTTP/.* 206' || {
            echo "Хранилище не отдало кусок (нет 206 Partial Content)."
            echo "PMTiles читается диапазонами байт — без этого формат бесполезен."
            exit 1
          }
          echo "$HDR" | grep -qi 'access-control-allow-origin' || {
            echo "Нет CORS: браузер не сможет читать файл с vedarai.ru."
            echo "В настройках бакета разрешить GET и HEAD с origin https://vedarai.ru"
            echo "и ОТКРЫТЬ заголовки: Content-Length, Content-Range, ETag, Accept-Ranges."
            echo "Без открытых заголовков возобновление закачки сломается молча:"
            echo "тело придёт, а размер и версию файла прочитать будет нечем."
            exit 1
          }
          echo "Хранилище отдаёт куски и разрешает браузеру их читать."
