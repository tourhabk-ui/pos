name: Приёмка своего роутера (вручную)

# Зачем этот workflow существует.
#
# 28.08 подключили roadGraphCarProvider — CarRouteProvider поверх своего
# дорожного графа Камчатки (миграция 760) вместо ожидания bake-off
# Yandex/2ГИС. Код и деплой проверены (tsc/vitest зелёные, билд на Timeweb
# прошёл), но это НЕ доказывает, что граф реально покрывает край: сколько
# узлов/рёбер в road_graph_nodes/road_graph_edges для конкретного района —
# вопрос данных, не архитектуры (см. lib/on-route/road-graph-car-provider.ts).
#
# Проверить это прямым запросом с машины разработчика не вышло: у сессии
# Claude Code, которая писала провайдер, исходящий прокси блокирует и
# vedarai.ru, и api.timeweb.cloud политикой allowlist (403 на CONNECT) — не
# токен виноват, сеть в принципе не пускает. Раннер GitHub Actions уже ходит
# на vedarai.ru штатно (см. cron-watchdog.yml и другие) — тот же путь решает
# и эту задачу.
#
# Пять пар координат — не наугад, каждая проверяет своё:
#   1. Городская сетка Петропавловска — тот самый случай 11.08, когда бага
#      «no_path» на 4 км по городу звучала как «дорог нет», хотя дело было
#      в честности причины отказа, не в данных.
#   2. Петропавловск → Елизово — точная пара из тестовых фикстур
#      регионального теста владельца на публичном демо-OSRM
#      (lib/on-route/route-provider.ts, KAMCHATKA_SAMPLE_*).
#   3. Подъезд к кордону у Авачинского — гравийные/track-дороги, проверяет,
#      выжили ли surface-теги при импорте.
#   4. Дальний посёлок вне главной магистрали Петропавловск—Елизово —
#      наиболее вероятное место обнаружить пустой/тонкий граф.
#   5. Заведомо вне дорог — должно вернуть too_far_from_road, а не молча
#      снапнуться на первую попавшуюся дорогу за много км.
#
# READ-ONLY: пять GET-запросов к нашему же публичному эндпоинту. Секрет не
# нужен вообще — /api/routing/path ничего не требует, кроме query-параметров.
# Только workflow_dispatch: это разовый инструмент разбора, не наблюдение и
# не часть деплоя.

on:
  workflow_dispatch:

permissions: {}

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Пять пар координат через GET /api/routing/path
        run: |
          BASE="https://vedarai.ru/api/routing/path"

          run() {
            local label="$1" from_lat="$2" from_lng="$3" to_lat="$4" to_lng="$5" mode="${6:-car}"
            echo "── ${label} (mode=${mode}) ──"
            curl -sS -w '\nHTTP %{http_code} · %{time_total}s\n' --max-time 30 \
              "${BASE}?from_lat=${from_lat}&from_lng=${from_lng}&to_lat=${to_lat}&to_lng=${to_lng}&mode=${mode}"
            echo
            echo
          }

          run "1. Петропавловск городской"  53.0195   158.6494 53.0444 158.6483
          run "2. Петропавловск → Елизово"  53.186963 158.45052 53.035011 158.649992
          run "3. К кордону у Авачинского"  53.0444   158.6483 53.256  158.833
          run "4. Дальний посёлок (Эссо)"   53.0195   158.6494 55.93   158.70
          run "5. Заведомо вне дорог"       53.0195   158.6494 53.9    160.5
