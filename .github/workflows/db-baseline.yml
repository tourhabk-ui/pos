# Снимок baseline-схемы прод-БД через /api/cron/schema-snapshot.
# Вычитывает секции слепка и коммитит SQL-файл в ту же ветку. Секрет уходит
# только на vedarai.ru/api/cron/*.
#
# Родился одноразовым (задача #57, ветка claude/db-baseline), но замер 19.08
# показал, зачем он нужен ПОСТОЯННО: тридцать таблиц, которые спрашивает код,
# не объявлены ни миграцией, ни baseline — модуль трансферов целиком, деньги,
# документы туриста, согласия 152-ФЗ. Они появились на проде ПОСЛЕ съёма
# baseline, и реестр схемы молча отстал. Объявлять их руками по файлам рядом —
# значит записать выдумку; единственный честный источник — сам прод.
#
# Триггер — файл-маркер в main (workflow_dispatch недоступен MCP-интеграции —
# 403); паттерн тот же, что у переписи, смоука и разбора находок.
name: db-baseline

on:
  workflow_dispatch:
  push:
    branches: [main, claude/db-baseline]
    paths: ['.github/triggers/db-baseline.txt']

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Снять слепок схемы и собрать baseline
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python3 scripts/assemble-db-baseline.py

      - name: Закоммитить baseline в текущую ветку
        run: |
          git config user.name "vedar-baseline"
          git config user.email "noreply@vedarai.ru"
          git add lib/database/baseline/schema-baseline.sql
          if git diff --cached --quiet; then
            echo "Схема не изменилась — коммитить нечего"
          else
            # [skip ci] намеренно: свежий baseline объявляет таблицы, которые
            # числятся в замороженном списке schema-coverage, и его сторож
            # ПОТРЕБУЕТ сократить список — это следующий коммит человека, а
            # красный main между двумя коммитами не сообщил бы ничего нового.
            git commit -m "Baseline-схема прод-БД: автосъём через schema-snapshot [skip ci]"
            git push
          fi
