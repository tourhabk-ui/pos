name: Cron — Group Scout (разведка TG-групп)

on:
  schedule:
    - cron: '0 18 * * 0'  # воскресенье 18:00 UTC — еженедельная разведка групп
  workflow_dispatch:

jobs:
  group-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scout Telegram tourism groups
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 600 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/group-scout")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
