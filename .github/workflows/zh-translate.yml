name: Китайские конспекты — машинный перевод туров и мест

# Зовёт /api/cron/zh-translate партиями (аудит 15.10, CN-pages; Китай, шаг 7,
# вариант «в»): тексты живых туров и мест на их маршрутах переводятся на
# китайский с пометкой машинного перевода; устаревшее по хэшу исходника
# переводится заново. Что переводится и с какими сверками — lib/zh/translate.
#
# Запуск — маркером .github/triggers/zh-translate.json (интеграция Claude не
# имеет права на workflow_dispatch: 403, проверено 02.09) или кнопкой.
# Параметры маркера:
#   mode    — "dry" (по умолчанию: только счёт, модель не зовётся) или "apply";
#   batches — сколько партий по 5 полей за прогон (1–12, по умолчанию 1).
#
# Перевод пишет прод (БД с раннера закрыта файрволом), поэтому шаг сначала
# ждёт СВОЮ сборку (scripts/wait-for-deploy.sh): иначе старый билд ответил бы
# 404 или перевёл бы по старым правилам.
#
# Очередь роута упорядочена по seed (сегодняшняя дата по Камчатке, одна на
# весь прогон), а skip копится на число непереведённых: поле, которое модель
# стабильно не переводит, не держит за собой следующие партии.
#
# Исходы: секрета нет — красный до запроса; сухой прогон — зелёный со счётом.
# Партия, где не принято ни одно поле (502 роута при attempted > 0), прогон НЕ
# обрывает (аудит 15.10, ZH-NUMERALS: прогон 4 вышел на первой же такой
# партии, и 11 следующих не шли): её поля уходят в skip, следующая партия
# берёт поля за ними. Красный — если хоть одна партия ответила не 200 и не
# 502, или 502 без attempted (это не роут, а шлюз перед ним), или запрос не
# дошёл (000); отказ базы — 500 с SQLSTATE; и если за весь боевой прогон не
# принято ни одного поля при непустой очереди — ноль при ненулевом входе
# не «хорошо» (§4.0). Итог по всем партиям — принято / отклонено / осталось —
# в сводке шага.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/zh-translate.json'

permissions:
  contents: read
  deployments: read   # запись выката для scripts/wait-for-deploy.sh

concurrency:
  group: zh-translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    # Ожидание сборки — до 70 минут (140 x 30 с) плюс до 12 партий по 10 минут
    # (у поля два вызова модели: прямой перевод и обратный); таймаут обязан быть
    # больше суммы (tests/unit/workflow-timeout-fits-wait.test.ts).
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v7

      - name: Секрет на месте
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::секрет CRON_SECRET не задан — позвать роут нечем"
            exit 1
          fi

      - name: Дождаться своей сборки на проде
        env:
          BASE: https://vedarai.ru
          WANT_SHA: ${{ github.sha }}
          # Запись выката (deploy.yml) читается с токеном — без него ждём по built_at.
          GH_TOKEN: ${{ github.token }}
          NEED_AFTER: ${{ github.event.head_commit.timestamp }}
        run: bash scripts/wait-for-deploy.sh

      - name: Перевод партиями
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          MARKER=.github/triggers/zh-translate.json
          MODE=dry
          BATCHES=1
          if [ -f "$MARKER" ]; then
            MODE=$(jq -r '.mode // "dry"' "$MARKER")
            BATCHES=$(jq -r '.batches // 1' "$MARKER")
          fi
          case "$MODE" in apply|dry) ;; *) echo "::error::mode в маркере — dry или apply, получено: $MODE"; exit 1 ;; esac
          if ! [[ "$BATCHES" =~ ^[0-9]+$ ]] || [ "$BATCHES" -lt 1 ] || [ "$BATCHES" -gt 12 ]; then
            echo "::error::batches в маркере — число 1–12, получено: $BATCHES"; exit 1
          fi
          APPLY=0
          if [ "$MODE" = "apply" ]; then APPLY=1; else BATCHES=1; fi
          # Один порядок очереди на весь прогон, даже если он перейдёт полночь.
          SEED=$(TZ=Asia/Kamchatka date +%F)
          OUT="${RUNNER_TEMP:-/tmp}/zh.json"
          # Целое из ответа роута; не JSON или не число — пусто (шлюз перед
          # роутом отвечает HTML, и это не «0 полей»).
          num() {
            local v
            v=$(jq -r "$1" "$OUT" 2>/dev/null || true)
            if [[ "$v" =~ ^[0-9]+$ ]]; then echo "$v"; else echo ""; fi
          }
          SKIP=0
          ACCEPTED=0
          REJECTED=0
          PENDING=""
          LEFT=""
          RED=""
          DONE=0
          echo "mode=$MODE batches=$BATCHES seed=$SEED"
          {
            echo "## Китайские конспекты — $MODE"
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

          for i in $(seq 1 "$BATCHES"); do
            rm -f "$OUT"
            HTTP=$(curl -sS -o "$OUT" -w "%{http_code}" --max-time 600 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://vedarai.ru/api/cron/zh-translate?apply=$APPLY&limit=5&seed=$SEED&skip=$SKIP") || HTTP="000"
            DONE=$i
            echo "партия $i: HTTP $HTTP"
            python3 -m json.tool "$OUT" || cat "$OUT" || true
            {
              echo "### Партия $i — HTTP $HTTP"
              echo ''
              echo '```json'
              python3 -m json.tool "$OUT" || cat "$OUT" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            ATTEMPTED=$(num '.attempted')
            # 502 роута при attempted > 0 — партия, где ни одно поле не прошло
            # сверку: не обрыв прогона (аудит 15.10, ZH-NUMERALS). Всё прочее
            # не 200 — роут партию не отработал: 500 базы, 401, шлюз, сеть.
            if [ "$HTTP" = "502" ] && [ -n "$ATTEMPTED" ] && [ "$ATTEMPTED" -gt 0 ]; then
              echo "::warning::партия $i: не принято ни одно из $ATTEMPTED полей — причины по полям в теле ответа выше; прогон идёт дальше"
            elif [ "$HTTP" != "200" ]; then
              RED="партия $i: HTTP $HTTP — роут партию не отработал, причина в теле ответа выше"
              echo "::error::$RED"
              break
            elif [ -z "$(num '.pending')" ]; then
              RED="партия $i: HTTP 200, но в ответе нет счёта очереди — отвечал не роут перевода"
              echo "::error::$RED"
              break
            fi
            [ -n "$PENDING" ] || PENDING=$(num '.pending')
            T=$(num '.translated | length')
            N=$(num '.not_translated | length')
            ACCEPTED=$((ACCEPTED + ${T:-0}))
            REJECTED=$((REJECTED + ${N:-0}))
            LEFT=$(num '.pending_left // .pending')
            if [ "$LEFT" = "0" ]; then echo "переводить больше нечего"; break; fi
            [ "$MODE" = "apply" ] || break
            if [ "${ATTEMPTED:-0}" = "0" ]; then
              echo "::warning::в очереди остались только поля, которые в этом прогоне не перевелись ($LEFT) — причины в партиях выше"
              break
            fi
            # Непереведённые остаются в очереди — следующая партия берёт поля за ними.
            SKIP=$((SKIP + ${N:-0}))
          done

          if [ "$MODE" = "apply" ]; then
            TOTAL="Итог: партий $DONE из $BATCHES; принято полей $ACCEPTED, отклонено $REJECTED, осталось в очереди ${LEFT:-неизвестно}"
          else
            TOTAL="Итог сухого прогона: в очереди ${LEFT:-неизвестно} полей, модель не звалась"
          fi
          echo "$TOTAL"
          {
            echo "### Итог"
            echo ''
            echo "$TOTAL"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$RED" ]; then exit 1; fi
          # Боевой прогон с работой, где не принято ни одно поле, — отказ, а не
          # «хорошо» (§4.0): поля отклонены во всех партиях подряд.
          if [ "$MODE" = "apply" ] && [ "$ACCEPTED" = "0" ] && [ -n "$PENDING" ] && [ "$PENDING" != "0" ]; then
            echo "::error::за прогон не принято ни одного поля из очереди $PENDING — причины по полям в партиях выше"
            exit 1
          fi
