name: CI Sweeper

# Петля loop engineering: красный CI чинится сам, без ручного дежурства.
#
# - Упал CI на PR-ветке → агент читает лог упавшего рана, чинит и коммитит
#   в ту же ветку с маркером [ci-sweep]. PR остаётся draft — мержит человек.
# - Упал CI на main (кандидат в сломанный автодеплой Timeweb) → в main НИКТО
#   не пушит: hotfix-ветка claude/ci-hotfix-<run_id> + draft-PR с заголовком
#   «ГОРЯЧО» — GitHub-нотификация владельцу и есть алерт. Агент на main не
#   зовётся, если решать есть кому: следом идёт прогон более свежего пуша
#   или упавший коммит меняет только маркеры (шаг «Решит ли более свежий
#   прогон» ниже).
#
# Защита от зацикливания: одна попытка на красный ран. Если упавший коммит
# уже содержит [ci-sweep] — свипер не запускается (иначе фикс, ломающий CI,
# порождал бы бесконечную рекурсию workflow_run).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Побеждает ПОСЛЕДНЕЕ падение, а не первое (разбор расходов 07.09).
#
# Замер утра 06.09: шесть свипов подряд, все на `main`, с 08:23 до 09:24 —
# 112 минут агента на одну и ту же сломанную ветку. Очередь (`false`) их не
# экономила, а растягивала: каждый следующий стартовал ПОСЛЕ предыдущего и
# чинил состояние, которое предыдущий, возможно, уже починил. Дороже всего
# в тот день обошёлся именно свипер — около 40% дневного счёта.
#
# `main` линеен: свежий коммит содержит все прежние, поэтому чинить надо
# последнее красное состояние, а прежние свипы по нему — работа впустую.
# Та же логика, что у руки: «новая просьба важнее начатой работы по старой».
#
# Цена решения названа: отменённый свип не оставляет починки. Это безопасно
# по построению — свипер коммитит и пушит одним шагом в конце, а не по
# кусочкам, поэтому отмена на середине не оставляет полуфабриката в ветке.
# Если последний свип не справится, красный CI никуда не денется и поднимет
# следующий.
concurrency:
  group: ci-sweep-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  sweep:
    # Первое условие — про ИСТОЧНИК, и оно здесь не для порядка.
    #
    # actions/untrusted-checkout/high (CodeQL, язык actions, 23.08.2026):
    # workflow_run — привилегированный триггер. Джоб получает секреты
    # репозитория и права contents/pull-requests/actions/id-token: write, а
    # затем делает checkout ветки, у которой упал CI, и запускает над ней
    # агента. Выполнить чужой код с нашим токеном — ровно та фигура, ради
    # которой правило заведено.
    #
    # Сейчас у actions/checkout ниже передан только `ref`, без `repository`, —
    # значит ветка форка искалась бы в НАШЕМ репозитории и не нашлась бы. Но
    # эта защита держится на отсутствии одной строки в другом месте файла:
    # добавит кто-нибудь `repository`, и дыра откроется молча. Условие
    # проверяет то, что надо проверять, — что ран пришёл из нашего же
    # репозитория, а не из форка.
    if: |
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'failure' &&
      !contains(github.event.workflow_run.head_commit.message, '[ci-sweep]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write # read — логи упавшего рана; write — gh run rerun при флаки
      id-token: write
    # Учёт расхода руки — отдельной работой usage-books ниже (аудит 15.10,
    # AC-1): ей нужен исход шага руки и путь файла выполнения, названный
    # самим экшеном, — чтобы отличить «рука не дошла до модели» от потери.
    outputs:
      hand_outcome: ${{ steps.hand.outcome }}
      execution_file: ${{ steps.hand.outputs.execution_file }}
    steps:
      # ── На main решает последнее красное состояние (аудит 15.10, AR-deploy) ──
      #
      # С 15.10 CI идёт на КАЖДЫЙ пуш в main, без фильтра путей (ci.yml), — в
      # том числе на коммиты, меняющие только маркер .github/triggers/. Маркер
      # в режиме apply краснит CI нарочно: сторожа images-repack,
      # timeweb-configure, iamkam-site и s3-object-delete требуют `mode: dry` в
      # репозитории, и следом идёт коммит с возвратом в dry (замер по истории:
      # a41e6c7d1, 8d3a279d9, 0c90090f7, d0e5ae85e — dry через 2 с – 2 мин;
      # 745cab8f2 — через 46 мин). До 15.10 такие коммиты CI на push не
      # запускали, теперь каждый будил бы агента и открывал «ГОРЯЧО».
      #
      # Правило то же, что у тревоги ci-red-alert в deploy.yml: main линеен,
      # чинить надо последнее красное состояние. Агент не нужен, если
      #  1) следом идёт (или прошёл) прогон CI более свежего пуша в main — он
      #     и решит: зелёный — чинить нечего, красный — позовёт свип сам.
      #     Отменённый (его заменил ещё более свежий) не в счёт;
      #  2) упавший коммит меняет только .github/triggers/** — красный от
      #     маркера снимается возвратом маркера в dry тем, кто его поднял, а не
      #     правкой кода; маркер — рука владельца, агенту его не править.
      #     Это и случай 46 минут, когда более свежего прогона ещё нет.
      # Не смогли спросить GitHub — свип идёт, как раньше: «не знаю» не
      # выдаётся за «решит другой» (§4.0). На PR-ветках шаг ничего не меняет.
      - name: Решит ли более свежий прогон
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          T="${RUNNER_TEMP:-/tmp}"
          if [ "$HEAD_BRANCH" != "main" ]; then
            echo "sweep=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=20" \
               > "$T/sweep-runs.json" 2> "$T/sweep-runs.err" \
             && NEWER=$(jq -r --argjson id "$CI_RUN_ID" '[.workflow_runs[] | select(.id > $id) | select(.status != "completed" or .conclusion != "cancelled")] | max_by(.id) // empty | "\(.head_sha[0:7]) \(.status)/\(.conclusion // "-")"' "$T/sweep-runs.json"); then
            if [ -n "$NEWER" ]; then
              echo "Свип не нужен: следом прогон CI более свежего пуша в main ($NEWER) — он и решит, а если не пройдёт, позовёт свип сам."
              echo "sweep=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "::warning::Не смог спросить GitHub о более свежих прогонах CI ($(head -c 200 "$T/sweep-runs.err" 2>/dev/null)) — свип идёт: решать, возможно, некому."
          fi

          # Список файлов коммита — до 300 на странице; маркеров в репозитории
          # меньше (121 на 15.10), так что усечённый список не сойдёт за
          # «только маркеры».
          if gh api "repos/$REPO/commits/$SHA" > "$T/sweep-commit.json" 2> "$T/sweep-commit.err" \
             && FILES=$(jq -r '.files[].filename' "$T/sweep-commit.json"); then
            if [ -n "$FILES" ] && ! printf '%s\n' "$FILES" | grep -qv '^\.github/triggers/'; then
              echo "Свип не нужен: коммит ${SHA:0:7} меняет только маркеры .github/triggers/ — красный от маркера в apply снимается возвратом маркера в dry, а не правкой кода."
              echo "sweep=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "::warning::Не смог прочитать файлы коммита ${SHA:0:7} ($(head -c 200 "$T/sweep-commit.err" 2>/dev/null)) — свип идёт."
          fi
          echo "sweep=true" >> "$GITHUB_OUTPUT"

      # Ветку удаляют вместе с мержем (так закрыт #2234). workflow_run при этом
      # ещё помнит head_branch, и checkout падает с exit 1 — свиперу нечего
      # чинить, красный ран не про код. Нет ref — выходим без ошибки.
      - name: Failing branch still exists
        if: steps.gate.outputs.sweep == 'true'
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api "repos/${{ github.repository }}/git/ref/heads/${{ github.event.workflow_run.head_branch }}" --silent
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Branch ${{ github.event.workflow_run.head_branch }} is gone. Nothing to sweep."
          fi

      - name: Checkout failing branch
        if: steps.branch.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 1

      - name: Read codebase rules
        if: steps.branch.outputs.exists == 'true'
        id: ctx
        run: |
          {
            echo 'RULES<<HEREDOC'
            grep -A 200 '## 4. КОД' CLAUDE.md | head -80 || true
            echo ''
            grep -A 50 '## 7. НЕ ТРОГАТЬ' CLAUDE.md | head -30 || true
            echo 'HEREDOC'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude sweeper
        id: hand
        if: steps.branch.outputs.exists == 'true'
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          # Ключ Console из репозиторного секрета — решение владельца 13.10:
          # «я пополню лучше баланс», после того как выпуск токена подписки
          # (claude setup-token) с компьютера упёрся в гео-блок claude.ai.
          # Что известно (#2396, пробы 19–22 и документация Anthropic,
          # api-credits-for-subscribers): 238 $ на счету Console — месячные
          # кредиты плана Max, они покрывают API, Agent SDK и playground, но НЕ
          # Claude Code; любой запрос с подписью Claude Code (бета-заголовок
          # claude-code-20250219 или user-agent claude-cli) получал 400 «credit
          # balance is too low», потому что купленного баланса было 0. Купленные
          # кредиты эту дыру закрывают: Claude Code списывает с них, обычные
          # запросы — по-прежнему с месячных. Руки оживают в момент пополнения,
          # без правок; пока баланс не куплен, отказ тот же 400, читать его как
          # «не пополнено», а не «ключ сломан». Токен подписки рядом НЕ держать:
          # отказ должен читаться как «ключ», а не «какой из двух».
          # Сторож: tests/unit/issue-hand-model-pinned.test.ts.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Модель ПРИБИТА, потолок ходов снижен (разбор расходов 06.09).
          #
          # Без --model цену определяет умолчание экшена: обновили пин экшена —
          # молча сменилась модель и счёт. У руки и летописца модель названа,
          # у свипера её не было.
          #
          # ЧЕСТНО О ЭФФЕКТЕ: сверка выгрузок 06-07.09 показывает, что
          # умолчание и так было Opus 5 (строка `opus-5` заморозилась ровно
          # тогда, когда свипер перестал запускаться). Значит пин НЕ
          # удешевляет прогон — он лишь лишает цену возможности смениться
          # молча при следующем обновлении экшена. Экономию здесь дают две
          # другие правки: потолок ходов и запрет полного набора тестов.
          #
          # 80 ходов свипер не выбирал ни разу: работа тут ограничена одним
          # логом и минимальным диффом. Потолок — граница на случай, когда
          # агент закружился, а не бюджет, который надо освоить.
          #
          # Комментарии ТОЛЬКО снаружи блока: содержимое claude_args уходит в
          # CLI как аргументы, и строка с решёткой стала бы аргументом «#».
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
            --max-turns 50
          show_full_output: true
          prompt: |
            Ты — CI Sweeper кодовой базы Ведар (Next.js 15, TypeScript strict,
            PostgreSQL). Упал CI, твоя задача — починить его за одну попытку.

            ══ КОНТЕКСТ ПАДЕНИЯ ══
            Ветка: ${{ github.event.workflow_run.head_branch }}
            Ран: ${{ github.event.workflow_run.id }}
            Коммит: ${{ github.event.workflow_run.head_sha }}

            ПЕРВЫМ ДЕЛОМ получи лог падения:
            gh run view ${{ github.event.workflow_run.id }} --log-failed

            Затем прочитай CLAUDE.md и файлы вокруг места падения — не угадывай
            паттерны. Почини корень падения минимальным диффом.

            ПРОВЕРКИ — ЦЕЛЕВЫЕ, НЕ ВЕСЬ НАБОР:
            Перед пушем прогони npx tsc --noEmit и ТОЛЬКО те тест-файлы, которые
            падали в логе: npx vitest run tests/unit/<файл>.
            Полный `npx vitest run` здесь ЗАПРЕЩЁН: это ~9000 тестов и шесть
            минут, весь их вывод оседает в твоём контексте и оплачивается как
            запись кэша — а ровно то же самое CI прогонит на твоём пуше, второй
            раз и без расхода на модель. Ты чинишь известное падение по логу, а
            не ищешь неизвестное.

            ══ КУДА КОММИТИТЬ ══
            ЕСЛИ ветка НЕ main:
              коммить прямо в текущую ветку (${{ github.event.workflow_run.head_branch }}).
              Сообщение коммита ОБЯЗАНО содержать маркер [ci-sweep] — это защита
              от зацикливания. После пуша оставь один короткий комментарий в
              связанный PR: gh pr comment --body "CI починен: <причина падения одной строкой>"

            ЕСЛИ ветка main:
              НИКОГДА не пушь в main. Создай ветку:
              git checkout -b claude/ci-hotfix-${{ github.event.workflow_run.id }}
              Запушь её и открой draft-PR:
              gh pr create --draft --title "ГОРЯЧО: CI на main красный — hotfix" --body "<что упало и что починено>"
              Сообщение коммита также обязано содержать [ci-sweep].

            ══ ГРАНИЦЫ (нарушение = остановись и позови человека) ══
            Если для починки нужно менять app/api/payments/, app/api/safety/sos,
            middleware.ts или lib/auth.ts — НЕ чини. Вместо этого оставь
            комментарий в PR (или создай issue для main) с диагнозом и стоп.
            Если падение флаки (сеть, таймаут раннера) и код не виноват —
            перезапусти ран: gh run rerun ${{ github.event.workflow_run.id }} --failed
            и больше ничего не делай.

            ЗАПРЕЩЕНО В КОДЕ (правила репозитория):
            ${{ steps.ctx.outputs.RULES }}

      # ── Расход руки — в книги (аудит 15.10, AC-1) ──────────────────────
      # К работе учёта usage-books уезжают ОДНИ СЧЁТЧИКИ, а не файл выполнения.
      # Файл выполнения — полный транскрипт агента: выводы Bash и Read, тексты
      # чужих issues, логи CI. Репозиторий публичный, артефакт скачивает любой
      # пользователь GitHub, а маски секретов в файлах артефакта нет — она есть
      # только в логе. Поэтому выжимка собирается здесь, белым списком полей:
      # тип сообщения, total_cost_usd, modelUsage (четыре счётчика на модель),
      # у ответа модели — id, модель и четыре счётчика usage. Текста, content и
      # tool_use в ней нет; не число на месте числа и не имя на месте имени —
      # null, и учёт назовёт расход неразобранным. Агент может переписать
      # числа — сервер проверит их схемой. Секрета учёта (CRON_SECRET) в этой
      # работе нет и быть не должно: у агента Bash на этом раннере. Отказ
      # выжимки или загрузки не красит руку — потерю назовёт учёт.
      - name: Выжимка расхода руки — одни счётчики
        if: always() && steps.hand.outcome != 'skipped'
        continue-on-error: true
        env:
          HAND_EXECUTION_FILE: ${{ steps.hand.outputs.execution_file }}
        run: |
          src="${HAND_EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          dst="$RUNNER_TEMP/hand-usage/hand-usage.json"
          mkdir -p "$RUNNER_TEMP/hand-usage"
          rm -f "$dst" "$dst.tmp"
          if [ ! -f "$src" ]; then
            echo "Файла выполнения нет — выжимать нечего; что это значит, скажет учёт"
            exit 0
          fi
          if ! jq -c '
            def n: if type == "number" then . else null end;
            def ident: if type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._:@/\\[\\]-]{0,127}$") then . else null end;
            def model_usage: if type == "object" then {inputTokens: (.inputTokens | n), outputTokens: (.outputTokens | n), cacheCreationInputTokens: (.cacheCreationInputTokens | n), cacheReadInputTokens: (.cacheReadInputTokens | n)} else null end;
            def msg_usage: if type == "object" then {input_tokens: (.input_tokens | n), output_tokens: (.output_tokens | n), cache_creation_input_tokens: (.cache_creation_input_tokens | n), cache_read_input_tokens: (.cache_read_input_tokens | n)} else null end;
            if type == "array" then [ .[] | objects |
              if .type == "result" then
                {type: "result", total_cost_usd: (.total_cost_usd | n),
                 modelUsage: (if (.modelUsage | type) == "object" then (.modelUsage | with_entries({key: (.key | ident // ""), value: (.value | model_usage)})) else null end)}
              elif .type == "assistant" and (.message | type) == "object" then
                {type: "assistant", message: {id: (.message.id | ident), model: (.message.model | ident), usage: (.message.usage | msg_usage)}}
              else empty end
            ] else null end
          ' "$src" > "$dst.tmp"; then
            echo "::warning::Файл выполнения руки не выжат: jq его не прочёл — учёт назовёт расход неразобранным"
            echo '{"hands_usage":"unreadable"}' > "$dst.tmp"
          fi
          mv "$dst.tmp" "$dst"

      - name: Счётчики расхода руки — к учёту
        if: always() && steps.hand.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: hand-usage
          path: ${{ runner.temp }}/hand-usage/hand-usage.json
          if-no-files-found: warn
          retention-days: 1
          overwrite: true

  # ── Расход руки — в книги llm_usage_log (аудит 15.10, AC-1) ─────────────
  #
  # Руки считают ключом Anthropic мимо logLLMUsage, и их расход до книг не
  # доходил: дневной бюджет (llm-budget-check) по ним не мог сработать. Здесь
  # выжимка файла выполнения (одни счётчики, собрана в работе руки) разбирается
  # (scripts/hands-usage.mjs), и строки уходят на прод
  # (POST /api/admin/llm-usage/report) с CRON_SECRET. Цену, включая кэш
  # подсказок, считает прод; заявление экшена (total_cost_usd) — в сводку
  # прогона для сверки, в книги не пишется.
  #
  # Отдельная работа на чистом раннере, а не шаг рядом с рукой: CRON_SECRET
  # открывает /api/admin/* на проде (§7), а у агента Bash — шаг после него
  # исполнял бы файл, который агент мог переписать. Скрипт берётся из main,
  # а не из рабочей копии руки. Сторож: tests/unit/llm-usage-reaches-books.test.ts.
  usage-books:
    needs: sweep
    if: always() && needs.sweep.outputs.hand_outcome != '' && needs.sweep.outputs.hand_outcome != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Скрипт учёта из main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: scripts/hands-usage.mjs
          sparse-checkout-cone-mode: false

      # Артефакта нет — экшен файла не оставил, или выжимка либо загрузка не
      # удались; потеря это или «рука не дошла до модели», решает учёт по
      # HAND_EXECUTION_FILE, а не этот шаг.
      - name: Счётчики расхода руки — из работы руки
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: hand-usage
          path: ${{ runner.temp }}/hand

      - name: Расход руки — в книги
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AGENT_ID: ci-sweeper
          EXECUTION_FILE: ${{ runner.temp }}/hand/hand-usage.json
          HAND_EXECUTION_FILE: ${{ needs.sweep.outputs.execution_file }}
        run: node scripts/hands-usage.mjs --run
