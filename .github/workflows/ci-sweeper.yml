name: CI Sweeper

# Петля loop engineering: красный CI чинится сам, без ручного дежурства.
#
# - Упал CI на PR-ветке → агент читает лог упавшего рана, чинит и коммитит
#   в ту же ветку с маркером [ci-sweep]. PR остаётся draft — мержит человек.
# - Упал CI на main (кандидат в сломанный автодеплой Timeweb) → в main НИКТО
#   не пушит: hotfix-ветка claude/ci-hotfix-<run_id> + draft-PR с заголовком
#   «ГОРЯЧО» — GitHub-нотификация владельцу и есть алерт.
#
# Защита от зацикливания: одна попытка на красный ран. Если упавший коммит
# уже содержит [ci-sweep] — свипер не запускается (иначе фикс, ломающий CI,
# порождал бы бесконечную рекурсию workflow_run).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Побеждает ПОСЛЕДНЕЕ падение, а не первое (разбор расходов 07.09).
#
# Замер утра 06.09: шесть свипов подряд, все на `main`, с 08:23 до 09:24 —
# 112 минут агента на одну и ту же сломанную ветку. Очередь (`false`) их не
# экономила, а растягивала: каждый следующий стартовал ПОСЛЕ предыдущего и
# чинил состояние, которое предыдущий, возможно, уже починил. Дороже всего
# в тот день обошёлся именно свипер — около 40% дневного счёта.
#
# `main` линеен: свежий коммит содержит все прежние, поэтому чинить надо
# последнее красное состояние, а прежние свипы по нему — работа впустую.
# Та же логика, что у руки: «новая просьба важнее начатой работы по старой».
#
# Цена решения названа: отменённый свип не оставляет починки. Это безопасно
# по построению — свипер коммитит и пушит одним шагом в конце, а не по
# кусочкам, поэтому отмена на середине не оставляет полуфабриката в ветке.
# Если последний свип не справится, красный CI никуда не денется и поднимет
# следующий.
concurrency:
  group: ci-sweep-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  sweep:
    # Первое условие — про ИСТОЧНИК, и оно здесь не для порядка.
    #
    # actions/untrusted-checkout/high (CodeQL, язык actions, 23.08.2026):
    # workflow_run — привилегированный триггер. Джоб получает секреты
    # репозитория и права contents/pull-requests/actions/id-token: write, а
    # затем делает checkout ветки, у которой упал CI, и запускает над ней
    # агента. Выполнить чужой код с нашим токеном — ровно та фигура, ради
    # которой правило заведено.
    #
    # Сейчас у actions/checkout ниже передан только `ref`, без `repository`, —
    # значит ветка форка искалась бы в НАШЕМ репозитории и не нашлась бы. Но
    # эта защита держится на отсутствии одной строки в другом месте файла:
    # добавит кто-нибудь `repository`, и дыра откроется молча. Условие
    # проверяет то, что надо проверять, — что ран пришёл из нашего же
    # репозитория, а не из форка.
    if: |
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'failure' &&
      !contains(github.event.workflow_run.head_commit.message, '[ci-sweep]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write # read — логи упавшего рана; write — gh run rerun при флаки
      id-token: write
    steps:
      - name: Checkout failing branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 1

      - name: Read codebase rules
        id: ctx
        run: |
          {
            echo 'RULES<<HEREDOC'
            grep -A 200 '## 4. КОД' CLAUDE.md | head -80 || true
            echo ''
            grep -A 50 '## 7. НЕ ТРОГАТЬ' CLAUDE.md | head -30 || true
            echo 'HEREDOC'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude sweeper
        uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Модель ПРИБИТА, потолок ходов снижен (разбор расходов 06.09).
          #
          # Без --model цену определяет умолчание экшена: обновили пин экшена —
          # молча сменилась модель и счёт. У руки и летописца модель названа,
          # у свипера её не было.
          #
          # ЧЕСТНО О ЭФФЕКТЕ: сверка выгрузок 06-07.09 показывает, что
          # умолчание и так было Opus 5 (строка `opus-5` заморозилась ровно
          # тогда, когда свипер перестал запускаться). Значит пин НЕ
          # удешевляет прогон — он лишь лишает цену возможности смениться
          # молча при следующем обновлении экшена. Экономию здесь дают две
          # другие правки: потолок ходов и запрет полного набора тестов.
          #
          # 80 ходов свипер не выбирал ни разу: работа тут ограничена одним
          # логом и минимальным диффом. Потолок — граница на случай, когда
          # агент закружился, а не бюджет, который надо освоить.
          #
          # Комментарии ТОЛЬКО снаружи блока: содержимое claude_args уходит в
          # CLI как аргументы, и строка с решёткой стала бы аргументом «#».
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
            --max-turns 50
          show_full_output: true
          prompt: |
            Ты — CI Sweeper кодовой базы Ведар (Next.js 15, TypeScript strict,
            PostgreSQL). Упал CI, твоя задача — починить его за одну попытку.

            ══ КОНТЕКСТ ПАДЕНИЯ ══
            Ветка: ${{ github.event.workflow_run.head_branch }}
            Ран: ${{ github.event.workflow_run.id }}
            Коммит: ${{ github.event.workflow_run.head_sha }}

            ПЕРВЫМ ДЕЛОМ получи лог падения:
            gh run view ${{ github.event.workflow_run.id }} --log-failed

            Затем прочитай CLAUDE.md и файлы вокруг места падения — не угадывай
            паттерны. Почини корень падения минимальным диффом.

            ПРОВЕРКИ — ЦЕЛЕВЫЕ, НЕ ВЕСЬ НАБОР:
            Перед пушем прогони npx tsc --noEmit и ТОЛЬКО те тест-файлы, которые
            падали в логе: npx vitest run tests/unit/<файл>.
            Полный `npx vitest run` здесь ЗАПРЕЩЁН: это ~9000 тестов и шесть
            минут, весь их вывод оседает в твоём контексте и оплачивается как
            запись кэша — а ровно то же самое CI прогонит на твоём пуше, второй
            раз и без расхода на модель. Ты чинишь известное падение по логу, а
            не ищешь неизвестное.

            ══ КУДА КОММИТИТЬ ══
            ЕСЛИ ветка НЕ main:
              коммить прямо в текущую ветку (${{ github.event.workflow_run.head_branch }}).
              Сообщение коммита ОБЯЗАНО содержать маркер [ci-sweep] — это защита
              от зацикливания. После пуша оставь один короткий комментарий в
              связанный PR: gh pr comment --body "CI починен: <причина падения одной строкой>"

            ЕСЛИ ветка main:
              НИКОГДА не пушь в main. Создай ветку:
              git checkout -b claude/ci-hotfix-${{ github.event.workflow_run.id }}
              Запушь её и открой draft-PR:
              gh pr create --draft --title "ГОРЯЧО: CI на main красный — hotfix" --body "<что упало и что починено>"
              Сообщение коммита также обязано содержать [ci-sweep].

            ══ ГРАНИЦЫ (нарушение = остановись и позови человека) ══
            Если для починки нужно менять app/api/payments/, app/api/safety/sos,
            middleware.ts или lib/auth.ts — НЕ чини. Вместо этого оставь
            комментарий в PR (или создай issue для main) с диагнозом и стоп.
            Если падение флаки (сеть, таймаут раннера) и код не виноват —
            перезапусти ран: gh run rerun ${{ github.event.workflow_run.id }} --failed
            и больше ничего не делай.

            ЗАПРЕЩЕНО В КОДЕ (правила репозитория):
            ${{ steps.ctx.outputs.RULES }}
