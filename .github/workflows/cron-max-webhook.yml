name: Cron — MAX webhook keepalive (Кузьмич в MAX)

# Самолечение MAX-бота: держит webhook-подписку зарегистрированной.
# Если MAX снял подписку (смена домена, вывод старого хоста, авто-снятие после
# ошибок) — эндпоинт регистрирует её заново. Идемпотентно: если всё на месте,
# ничего не меняет. workflow_dispatch — чтобы поднять бота немедленно вручную.

on:
  schedule:
    - cron: '17 */6 * * *'  # каждые 6 часов
  workflow_dispatch:

jobs:
  max-webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure MAX webhook subscription
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/max-webhook")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
