name: Диагностика Safety Decision Ledger (вручную)

# Разбор 30.08: критерий приёмки Safety Decision Ledger (925) не пройден —
# вкладка «Журнал» в /hub/admin/safety пуста. Три гипотезы:
#   1) миграция 925_safety_decision_events.sql не применилась;
#   2) применилась, пишет, но read-путь не показывает то, что есть;
#   3) применилась, но appendSafetyEvent не пишет (fail-soft глотает отказ
#      INSERT, или врезка в конвейер не достигается вовсе).
#
# 31.08, ПЕРВЫЙ прогон: спрашивали базу напрямую через `psql` с раннера — и
# получили `Connection timed out` к 94.228.112.62:5432. PostgreSQL Timeweb
# закрыт по IP, у раннеров они плавающие; аналогия с tochka-check была ложной
# (тот ходит по HTTPS на публичный vedarai.ru, а не в базу). Инструмент не мог
# сработать ни при каких обстоятельствах, а ждали его полтора суток.
#
# Теперь спрашиваем ПРИЛОЖЕНИЕ: оно с раннера достижимо (доказано прод-смоуком
# в deploy.yml), а доступ к базе у него есть по построению. Те же пять
# вопросов живут в GET /api/cron/safety-ledger-check, только чтение.
#
# 31.08, ВТОРОЙ прогон: HTTP 404. Причина не в инструменте и не в ledger —
# маркер запускает проверку тем же пушем, которым едет сам роут, а Timeweb
# выкладывает контейнер около двенадцати минут. То есть спросили раньше, чем
# появился отвечающий.
#
# Это ТРЕТИЙ исход, а не отказ (§4.0): «роута ещё нет» — не «ledger пуст» и не
# «инструмент сломан». Поэтому 404 и обрыв связи не приговор, а повод подождать
# в границах известного времени выкладки; всякий иной код — приговор сразу, без
# ожидания. Если за отведённое время роут так и не появился, это тоже говорится
# словами: «не смогли спросить», с последним полученным исходом.
#
# Запускается и кнопкой, и пушем файла-маркера. Ждать чужого клика оказалось
# нечем: у токена агента нет actions:write (403 на dispatch), и пункт, который
# никто не может закрыть, полтора суток числился «ожидающим». Приём с маркером
# в репозитории общий — см. коммит 87bb939f, сорок с лишним воркфлоу так и
# заводятся.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/safety-ledger-check.json'

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    # 20 > 15 минут ожидания выкладки + запас на сам запрос. Терпение джоба
    # обязано быть больше терпения шага, иначе ожидание обрывается снаружи и
    # исход снова становится неразличим (та же болезнь, что чинил E-1 в
    # cron-evo.yml: --max-time клиента равнялся maxDuration роута).
    timeout-minutes: 20
    steps:
      - name: Триада — таблица / отказ миграции / записи
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret не задан."
            exit 1
          fi

          URL="${LEDGER_CHECK_URL:-https://vedarai.ru/api/cron/safety-ledger-check}"
          # Значения по умолчанию — боевые; переопределяются только сторожем,
          # который исполняет этот же блок и не может ждать пятнадцать минут.
          ATTEMPTS="${LEDGER_CHECK_ATTEMPTS:-30}"
          DELAY="${LEDGER_CHECK_DELAY:-30}"
          # Версия контракта ответа, которую этот воркфлоу умеет читать. Ответ
          # более старой версии — тот же третий исход, что и 404: отвечает не тот
          # код, которого мы ждём. Поднимать вместе с contract_version в роуте.
          EXPECT_CONTRACT="${LEDGER_CHECK_CONTRACT:-3}"

          i=0
          LAST="не спрашивали"
          while :; do
            i=$((i + 1))

            # --max-time обязателен: без него отказ висит до таймаута джоба, и
            # «не смогли спросить» приходит через минуты вместо секунды. Ровно
            # это и случилось в первом прогоне с psql (2.5 минуты молчания).
            CURL_RC=0
            HTTP=$(curl -sS -o /tmp/ledger.json -w "%{http_code}" \
              --max-time 45 \
              "$URL" \
              -H "Authorization: Bearer $CRON_SECRET") || CURL_RC=$?

            if [ "$CURL_RC" = "0" ] && [ "$HTTP" = "200" ]; then
              # Ответ получен — но от ТОЙ ЛИ версии? Прогон 4 показал, что нет:
              # роут отвечал 200 мгновенно, потому что уехал прошлым коммитом, и
              # воркфлоу напечатал прежние, неверно отсортированные события как
              # «последние». Достижимость отвечающего и нужность его версии —
              # разные вопросы, и второй надо задавать вслух.
              # sed, а не python3 -c: многострочный питон внутри блочного скаляра
              # YAML обрывает сам скаляр (его первая строка встаёт левее отступа
              # блока). Эта яма в репозитории уже случалась — см. шапку
              # timeweb-deploy-logs.yml, прогоны 3/4 с IndentationError.
              # Отсутствие поля читается как 0 — то есть как прежняя версия.
              GOT=$(sed -n 's/.*"contract_version"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' /tmp/ledger.json | head -1)
              [ -z "$GOT" ] && GOT=0
              if [ "$GOT" -ge "$EXPECT_CONTRACT" ]; then
                break
              fi
              LAST="контракт $GOT < $EXPECT_CONTRACT (прод отвечает прежней версией)"
            elif [ "$CURL_RC" != "0" ]; then
              # Во время выкладки контейнер перезапускается, и обрыв связи здесь
              # ожидаем ровно так же, как 404. Отличать «прод лежит» от «прод
              # переезжает» одним запросом нельзя — различает их только время.
              LAST="curl $CURL_RC"
            elif [ "$HTTP" = "404" ]; then
              LAST="HTTP 404 (роута ещё нет)"
            else
              # Любой иной код — про сам роут, а не про выкладку: ждать нечего.
              echo "::error::Роут ответил $HTTP — тело ниже. Это ответ приложения, а не отсутствие выкладки, поэтому ждать нечего."
              cat /tmp/ledger.json 2>/dev/null || true
              exit 1
            fi

            if [ "$i" -ge "$ATTEMPTS" ]; then
              echo "::error::За $((ATTEMPTS * DELAY)) с нужного ответа не дождались, последний исход: $LAST. Это «не смогли спросить», а не «ledger пуст»: роут либо не отвечал вовсе, либо отвечал прежней версией контракта. Смотреть надо выкладку контейнера на Timeweb, а не миграцию 925."
              exit 1
            fi

            echo "$LAST — попытка $i из $ATTEMPTS, ждём ${DELAY}с (выкладка Timeweb идёт около 12 минут)"
            sleep "$DELAY"
          done

          echo "HTTP 200 с попытки $i"

          # Вердикт словами — первым, чтобы читающий не разбирал JSON ради него.
          python3 - <<'PY'
          import json
          with open('/tmp/ledger.json') as f:
              d = json.load(f)
          print('ВЕРДИКТ:', d.get('verdict', '(нет)'))
          print()
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
