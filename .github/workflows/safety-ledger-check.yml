name: Диагностика Safety Decision Ledger (вручную)

# Разбор 30.08: критерий приёмки Safety Decision Ledger (925) не пройден —
# вкладка «Журнал» в /hub/admin/safety пуста. Три гипотезы:
#   1) миграция 925_safety_decision_events.sql не применилась;
#   2) применилась, пишет, но read-путь не показывает то, что есть;
#   3) применилась, но appendSafetyEvent не пишет (fail-soft глотает отказ
#      INSERT, или врезка в конвейер не достигается вовсе).
#
# 31.08, ПЕРВЫЙ прогон: спрашивали базу напрямую через `psql` с раннера — и
# получили `Connection timed out` к 94.228.112.62:5432. PostgreSQL Timeweb
# закрыт по IP, у раннеров они плавающие; аналогия с tochka-check была ложной
# (тот ходит по HTTPS на публичный vedarai.ru, а не в базу). Инструмент не мог
# сработать ни при каких обстоятельствах, а ждали его полтора суток.
#
# Теперь спрашиваем ПРИЛОЖЕНИЕ: оно с раннера достижимо (доказано прод-смоуком
# в deploy.yml), а доступ к базе у него есть по построению. Те же пять
# вопросов живут в GET /api/cron/safety-ledger-check, только чтение.
#
# 31.08, ВТОРОЙ прогон: HTTP 404. Причина не в инструменте и не в ledger —
# маркер запускает проверку тем же пушем, которым едет сам роут, а Timeweb
# выкладывает контейнер около двенадцати минут. То есть спросили раньше, чем
# появился отвечающий.
#
# Это ТРЕТИЙ исход, а не отказ (§4.0): «роута ещё нет» — не «ledger пуст» и не
# «инструмент сломан». Поэтому 404 и обрыв связи не приговор, а повод подождать
# в границах известного времени выкладки; всякий иной код — приговор сразу, без
# ожидания. Если за отведённое время роут так и не появился, это тоже говорится
# словами: «не смогли спросить», с последним полученным исходом.
#
# Запускается и кнопкой, и пушем файла-маркера. Ждать чужого клика оказалось
# нечем: у токена агента нет actions:write (403 на dispatch), и пункт, который
# никто не может закрыть, полтора суток числился «ожидающим». Приём с маркером
# в репозитории общий — см. коммит 87bb939f, сорок с лишним воркфлоу так и
# заводятся.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/safety-ledger-check.json'

# contents: read — ровно для checkout: цикл ожидания теперь лежит в
# scripts/ci/wait-for-contract.sh, и его надо получить. Больше воркфлоу не
# делает ничего: он только читает прод.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 20 > 15 минут ожидания выкладки + запас на сам запрос. Терпение джоба
    # обязано быть больше терпения шага, иначе ожидание обрывается снаружи и
    # исход снова становится неразличим (та же болезнь, что чинил E-1 в
    # cron-evo.yml: --max-time клиента равнялся maxDuration роута).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Триада — таблица / отказ миграции / записи
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Ожидание выкладки живёт в общем скрипте: у этой логики появился
          # второй пользователь (перепись реестра схемы), а две копии цикла
          # разошлись бы — в этом репозитории расхождение копий уже было корнем
          # худших дефектов. Умолчания ATTEMPTS/DELAY боевые и переопределяются
          # только сторожем.
          WAIT_URL: https://vedarai.ru/api/cron/safety-ledger-check
          WAIT_OUT: /tmp/ledger.json
          # Версия контракта ответа, которую этот воркфлоу умеет читать. Ответ
          # более старой версии — тот же третий исход, что и 404: отвечает не тот
          # код, которого мы ждём. Поднимать вместе с contract_version в роуте.
          WAIT_CONTRACT: '3'
        run: |
          bash scripts/ci/wait-for-contract.sh

          # Вердикт словами — первым, чтобы читающий не разбирал JSON ради него.
          python3 - <<'PY'
          import json
          with open('/tmp/ledger.json') as f:
              d = json.load(f)
          print('ВЕРДИКТ:', d.get('verdict', '(нет)'))
          print()
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
