name: Диагностика Safety Decision Ledger (вручную)

# Разбор 30.08: критерий приёмки Safety Decision Ledger (925) не пройден —
# вкладка «Журнал» в /hub/admin/safety пуста. Три гипотезы:
#   1) миграция 925_safety_decision_events.sql не применилась;
#   2) применилась, пишет, но read-путь (GET /api/admin/safety/ledger
#      или сама вкладка) не показывает то, что есть;
#   3) применилась, но appendSafetyEvent не пишет (fail-soft глотает
#      ошибку INSERT, или врезка в конвейер не достигается вовсе).
#
# Прод недостижим из песочницы разработчика (agent-egress политика режет
# vedarai.ru и Timeweb API) — проверка идёт мостом через раннер GitHub,
# тем же приёмом, что tochka-check.yml/ai-channel-check. Только чтение:
# ни один запрос здесь не пишет и не мутирует данные.
#
# Watchdog 30.08 уже назвал ОДНУ упавшую миграцию — 925_zelenovskie_
# ozerki_and_razdolie.sql (другой домен, PR #1468, коллизия номера 925
# с этой миграцией по совпадению параллельной работы). Этот workflow
# проверяет ИМЕННО 925_safety_decision_events.sql — Watchdog её не
# называл в списке отказов, но список ограничен LIMIT 5 и мог её не
# захватить.

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Триада SQL — таблица / отказ миграции / записи
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSLMODE: require
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret не задан."
            exit 1
          fi

          echo "=== 1) Таблица существует? (925_safety_decision_events.sql применилась) ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=0 -c \
            "SELECT to_regclass('public.safety_decision_events') AS table_regclass;"

          echo ""
          echo "=== 2) Отказы миграции 925_safety_decision_events (если есть) ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=0 -c \
            "SELECT name, error, attempts, first_failed_at, last_failed_at
               FROM _migration_failures
              WHERE name LIKE '925_safety%'
              ORDER BY last_failed_at DESC;"

          echo ""
          echo "=== 3) Сколько строк реально записано ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=0 -c \
            "SELECT count(*) AS total_events FROM safety_decision_events;"

          echo ""
          echo "=== 4) Последние 20 событий, если есть (для сверки с контрактом) ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=0 -c \
            "SELECT id, entity_id, event_type, actor_type, actor_id,
                    decision_reason, created_at
               FROM safety_decision_events
              ORDER BY id DESC
              LIMIT 20;"

          echo ""
          echo "=== 5) Не применённые вовсе миграции (сверка с migrations/) ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=0 -c \
            "SELECT name FROM _migrations WHERE name LIKE '925%';"
