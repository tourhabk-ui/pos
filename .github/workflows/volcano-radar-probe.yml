name: Проба — Ключевской на радаре

on:
  push:
    branches: [volcano-radar-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Запись места в каталоге
        run: |
          for q in "Ключевск" "Шивелуч" "Безымянн" "Крашенин"; do
            curl -s -G --max-time 30 -H "Authorization: Bearer $CRON_SECRET" \
              --data-urlencode "q=$q" "https://vedarai.ru/api/cron/place-audit" \
            | jq -r --arg q "$q" '.places[]? | "\($q)\t\(.name)\tlat=\(.lat) lng=\(.lng)\tvisible=\(.is_visible)\tmerged_into=\(.merged_into_name // "-")\ttype=\(.location_type)"'
          done

      - name: Что /safety отдаёт в радар
        run: |
          curl -s --max-time 60 -A "Mozilla/5.0" "https://vedarai.ru/safety" -o /tmp/safety.html
          echo "размер страницы: $(wc -c < /tmp/safety.html)"
          echo "--- упоминания вулканов в полезной нагрузке ---"
          for n in "Ключевск" "Шивелуч" "Безымянн" "Крашенин"; do
            printf '%s\t%s\n' "$n" "$(grep -o "$n" /tmp/safety.html | wc -l)"
          done
          echo "--- метки радара kind=volcano (из RSC-полезной нагрузки) ---"
          grep -o 'kind\\\\\?":\\\\\?"volcano\\\\\?"[^}]\{0,200\}' /tmp/safety.html | head -20 || true
          grep -o '"kind":"volcano"[^}]\{0,200\}' /tmp/safety.html | head -20 || true
          echo "--- центр и radius в разметке ---"
          grep -o '500 км\|200 км' /tmp/safety.html | sort | uniq -c
