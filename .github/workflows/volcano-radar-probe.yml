name: Проба — вулканы на радаре

# Одноразовая проба после мержа #1497. Ветка временная, в main не идёт.
#
# Порядок такой, а не «подождать N минут»:
#
# 1. Признак деплоя — не таймер, а СЛЕД в данных: миграция 927 переименовывает
#    «Вулкан Крашенникова» в «Вулкан Крашенинникова». Пока имя старое, новый
#    образ не поднялся, и запускать синк рано. Таймер сказал бы «прошло 10
#    минут» — это факт о часах, а не о проде.
# 2. Только после следа — синк KVERT, и печатается ВЕСЬ ответ: matched,
#    причины отказа поимённо, размер указателя каталога.
# 3. Отдельно — сверка радара: остались ли опасные коды без привязки.
#
# Вложенных python-скриптов здесь нет намеренно: первая версия оборвала
# блочный скаляр YAML строкой с нулевой колонки, и прогон упал на старте с
# нулём джобов — то есть выглядел как «проба не прошла», не проверив ничего.

on:
  push:
    branches: [volcano-radar-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Дождаться деплоя по следу миграции 927
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET не задан"; exit 1; fi
          for i in $(seq 1 40); do
            HTTP=$(curl -s -G -o /tmp/k.json -w "%{http_code}" --max-time 30 \
              -H "Authorization: Bearer $CRON_SECRET" \
              --data-urlencode "q=Крашен" \
              "https://vedarai.ru/api/cron/place-audit" || echo 000)
            echo "попытка $i · HTTP $HTTP"
            jq -r '.places[]? | "  \(.name)"' /tmp/k.json 2>/dev/null || head -c 400 /tmp/k.json
            # Сверяется ПОЛЕ name целиком, а не подстрока в теле ответа.
            # Первая версия делала grep по всему JSON и позеленела мгновенно:
            # правильное написание «Крашенинникова» стоит в ОПИСАНИИ места,
            # а имя оставалось с опечаткой. Проба отрапортовала «миграция
            # применена», не проверив ничего, — тот же промах, что с
            # «не нашёл по запросу» = «нет в каталоге», только наоборот.
            if jq -e '[.places[]? | select(.name == "Вулкан Крашенинникова")] | length > 0' \
                 /tmp/k.json >/dev/null 2>&1; then
              echo "МИГРАЦИЯ 927 ПРИМЕНЕНА — поле name исправлено"
              exit 0
            fi
            sleep 30
          done
          echo "за 20 минут имя не изменилось: деплой не дошёл или миграция не применилась"
          exit 1

      - name: Синк KVERT — привязка вулканов к точкам
        run: |
          HTTP=$(curl -s -o /tmp/kvert.json -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/kvert-acc" || echo 000)
          echo "HTTP: $HTTP"
          python3 -m json.tool /tmp/kvert.json || cat /tmp/kvert.json
          test "$HTTP" = "200"
          # Ответ обязан быть НОВОЙ формы. Старая — плоский список unmatched
          # без причин — значит на проде ещё прежний образ, и число matched
          # ничего не говорит о починке. Зелёная проба на старом коде хуже
          # красной: она закрывает вопрос, не ответив на него.
          jq -e 'has("unmatched_reasons") and has("places_indexed")' \
            /tmp/kvert.json >/dev/null \
            || { echo "ОТВЕТ СТАРОЙ ФОРМЫ — деплой не дошёл, проверять нечего"; exit 1; }
          echo "--- разбор ---"
          jq -r '"каталог вулканов: \(.places_indexed) точек",
                 "сопоставлено:    \(.matched) из \(.fetched)",
                 "нет в алиасах:   \(.unmatched_reasons.unknown_name | length)",
                 "нет места:       \(.unmatched_reasons.no_place | length)",
                 "неоднозначно:    \(.unmatched_reasons.ambiguous | length)",
                 "отказ записи:    \(.unmatched_reasons.failed | length)"' /tmp/kvert.json

      - name: Радар — остались ли опасные коды без точки
        run: |
          HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" --max-time 60 \
            "https://vedarai.ru/api/public/safety-status" || echo 000)
          echo "safety-status HTTP: $HTTP"
          head -c 2000 /tmp/r.json; echo
