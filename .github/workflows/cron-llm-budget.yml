name: Cron — LLM Budget Check (контроль расходов AI)

on:
  schedule:
    - cron: '30 * * * *'  # каждый час в :30 — проверка дневного бюджета AI
  workflow_dispatch:

jobs:
  llm-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check LLM daily budget
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET не задан в секретах репозитория — эндпоинт не вызван, прогон не состоялся"; exit 1; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/llm-budget-check")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          # Порог не задан — не «OK» (22.10): видно в сводке прогона. Шаг не
          # краснеет — иначе письмо о сбое каждый час; владельцу говорит
          # Watchdog по отказу в журнале прогонов, дважды в сутки.
          if grep -q '"status":"not_configured"' /tmp/out.json 2>/dev/null; then
            echo "::warning::Дневной бюджет AI не сторожится: AI_DAILY_BUDGET_USD не задан или не число на проде (переменные приложения Timeweb)"
          fi
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
