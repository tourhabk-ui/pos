name: Cron — LLM Budget Check (контроль расходов AI)

on:
  schedule:
    - cron: '30 * * * *'  # каждый час в :30 — проверка дневного бюджета AI
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llm-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Check LLM daily budget
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/llm-budget-step.mjs
