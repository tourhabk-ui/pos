name: Cron — LLM Budget Check (контроль расходов AI)

on:
  schedule:
    - cron: '30 * * * *'  # каждый час в :30 — проверка дневного бюджета AI
  workflow_dispatch:

jobs:
  llm-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check LLM daily budget
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/llm-budget-check")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
