name: Cron — Safety Ingest

on:
  schedule:
    - cron: '*/20 * * * *'  # каждые 20 минут
  workflow_dispatch:

jobs:
  safety-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warmup — разбудить сервер
        run: |
          curl -s --max-time 90 -o /dev/null -w "Warmup HTTP: %{http_code}\n" \
            "https://vedarai.ru/api/health" || echo "Warmup done"

      - name: Safety Ingest — вулканы и сейсмика КБГС РАН
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 120 \
            "https://vedarai.ru/api/cron/safety-ingest?secret=$CRON_SECRET")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
