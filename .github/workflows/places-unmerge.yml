name: Data — Откат ошибочных слияний мест

# Откатывает ошибочные/спорные авто-дедуп-слияния (places-dedup run #2):
# обнуляет merged_into_id у перечисленных мест через POST /api/cron/places-unmerge.
# Список зашит ниже (владелец подтвердил откат неверных + спорных, 2026-07-10).
#
# Запуск: workflow_dispatch ИЛИ push в main, меняющий
# .github/triggers/places-unmerge.json.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/places-unmerge.json'

jobs:
  places-unmerge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Unmerge wrong pairs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE: https://vedarai.ru
        run: |
          set -uo pipefail
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 1; fi

          # Ждём деплой: POST-роут на GET отвечает 405 когда задеплоен, 404 если нет.
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE/api/cron/places-unmerge" || echo 000)
            if [ "$CODE" = "405" ] || [ "$CODE" = "401" ]; then echo "endpoint deployed (HTTP $CODE)"; break; fi
            echo "endpoint not ready (HTTP $CODE), жду 60с ($i/20)"; sleep 60
          done

          BODY='{"names":[
            "Ключевская группа вулканов",
            "Нижне-Вилючинские термальные источники",
            "Войновские термальные источники",
            "Смотровая на Мутновский вулкан (точка А)",
            "Смотровая на Мутновский вулкан (точка Б)",
            "Водопад у Мутновского (вид 2)",
            "Вулкан Козельский",
            "Козельский"
          ]}'

          echo "=== unmerge ==="
          curl -s --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d "$BODY" "$BASE/api/cron/places-unmerge" \
            | python3 -m json.tool --no-ensure-ascii 2>/dev/null \
            || curl -s --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -d "$BODY" "$BASE/api/cron/places-unmerge"
