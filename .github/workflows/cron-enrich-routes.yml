name: Cron — Enrich Routes

on:
  schedule:
    - cron: '0 23 * * *'  # 23:00 UTC — DeepSeek off-peak window
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enrich route descriptions (20 per run)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/enrich-routes")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] || { echo "FAIL $HTTP"; exit 1; }
          # HTTP 200 — ещё не успех: месяц подряд эндпоинт отвечал 200 с
          # errors=20/20 (TypeError на NUMERIC-строке), а прогон был «зелёным».
          # Партия, где не улучшено НИЧЕГО при наличии ошибок, — это поломка.
          PROCESSED=$(jq -r '.processed // 0' /tmp/out.json)
          IMPROVED=$(jq -r '.improved // 0' /tmp/out.json)
          ERRORS=$(jq -r '.errors // 0' /tmp/out.json)
          echo "processed=$PROCESSED improved=$IMPROVED errors=$ERRORS remaining=$(jq -r '.remaining // "?"' /tmp/out.json)"
          if [ "$PROCESSED" -gt 0 ] && [ "$IMPROVED" -eq 0 ] && [ "$ERRORS" -gt 0 ]; then
            echo "FAIL: партия целиком в ошибках — обогащение сломано, не молчим"
            exit 1
          fi
          echo "OK"
