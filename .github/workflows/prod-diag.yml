name: Prod Diagnostic
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Run checks
        run: |
          APP_ID=175477
          BASE=https://api.timeweb.cloud/api/v1
          APP=$(curl -sf -H "Authorization: Bearer $TOKEN" "$BASE/apps/$APP_ID" || echo '{}')
          ENVS=$(curl -sf -H "Authorization: Bearer $TOKEN" "$BASE/apps/$APP_ID/envs" || echo '{}')
          H1=$(curl -sf --max-time 15 -o /dev/null -w '%{http_code}' https://vedarai.ru/api/health 2>/dev/null || echo FAIL)
          H2=$(curl -sf --max-time 15 https://vedarai.ru/api/debug-start 2>/dev/null || echo not_responding)
          STATUS=$(echo "$APP" | jq -r '.app.status + " commit=" + .app.commit_sha[:10] + " branch=" + .app.branch' 2>/dev/null || echo unknown)
          ENVLIST=$(echo "$ENVS" | jq -r '.envs[].name' 2>/dev/null | sort | paste -sd ',' - || echo unknown)
          BODY="Diagnostic $(date -u '+%Y-%m-%d %H:%M UTC') | App: $STATUS | Envs: $ENVLIST | health=$H1 | debug=$H2"
          echo "$BODY"
          jq -n --arg b "$BODY" '{body:$b}' | curl -sf -X POST -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" https://api.github.com/repos/tourhabk-ui/pos/issues/20/comments -d @-
