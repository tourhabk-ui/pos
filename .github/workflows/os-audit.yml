name: Аудит ОС и эволюции одним проходом (с раннера)

# Владелец 08.09: «может Astra проведёт аудит ОС и эволюции, может мы тоже
# упустили что-то».
#
# Мы судим платформу по кусочкам: сторож проверяет своё, перепись считает
# своё, ревью смотрит диф. Никто не держит перед глазами ПРАВИЛА и
# ИСПОЛНЕНИЕ одновременно — а расхождение живёт именно там. За один день
# 07-08.09 нашлось четыре таких, и ни одно не поймал ни один сторож.
#
# Аудит НЕ ХОДИТ НА ПРОД вовсе: он читает репозиторий из своего же checkout.
# Это сделано намеренно — весь день пробы упирались в незаехавшую выкладку,
# а здесь ждать нечего.
#
# Только чтение. Находки печатаются с уликами; ссылка на файл вне выданного
# набора считается выдумкой и выбрасывается.
#
# Расход: набор до 1,8 МБ ≈ 450 тыс. входных токенов ≈ 600 ₽ за проход.
# Точная цифра печатается из usage. Это не ежедневный крон — только по маркеру.

on:
  workflow_dispatch:
    inputs:
      verify_findings_run:
        description: 'ID прогона, чьи находки проверить (без нового прохода)'
        required: false
  push:
    branches: [main]
    paths:
      - '.github/triggers/os-audit.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # ── Режим «проверить сохранённое» ─────────────────────────────────
      #
      # Проверка находок, за которые уже заплачено проходом. Стоит копейки:
      # короткие заходы по одному файлу дешёвой моделью, без набора в 1,7 МБ.
      - name: Взять находки прошлого прогона
        if: inputs.verify_findings_run != ''
        uses: actions/download-artifact@v4
        with:
          name: audit-findings
          run-id: ${{ inputs.verify_findings_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Проверить сохранённые находки
        if: inputs.verify_findings_run != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AUDIT_FINDINGS_IN: audit-findings.json
        run: |
          set -uo pipefail
          AUDIT_VERIFY_MODEL=$(python3 -c "
          import json
          try:
              print(json.load(open('.github/triggers/os-audit.json')).get('verify_model') or '')
          except Exception:
              print('')
          ")
          export AUDIT_VERIFY_MODEL
          npx tsx scripts/os-audit-runner.ts

      - name: Аудит одним проходом
        if: inputs.verify_findings_run == ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -uo pipefail
          # Модель круга проверки — своя. Задача там узкая (найти дословную
          # примету и выбрать один из трёх исходов), флагман не нужен, а
          # отдельный судья независимее того, кто находку и написал.
          AUDIT_VERIFY_MODEL=$(python3 -c "
          import json
          try:
              print(json.load(open('.github/triggers/os-audit.json')).get('verify_model') or '')
          except Exception:
              print('')
          ")
          export AUDIT_VERIFY_MODEL
          MODEL=$(python3 -c "
          import json
          try:
              print(json.load(open('.github/triggers/os-audit.json')).get('model') or '')
          except Exception:
              print('')
          ")
          TARGETS=$(python3 -c "
          import json
          try:
              print(' '.join(json.load(open('.github/triggers/os-audit.json')).get('targets') or []))
          except Exception:
              print('')
          ")
          npx tsx scripts/os-audit-runner.ts $MODEL $TARGETS

      # Находки оплаченного прохода переживают прогон — даже красный.
      #
      # Четыре прогона подряд теряли их вместе с процессом: проход стоит
      # ~751 ₽ и съедает баланс, круг проверки получает 402, и доплата
      # покупает не проверку, а НОВЫЙ проход. Теперь находки можно проверить
      # позже и почти даром: workflow_dispatch с verify_findings_run.
      - name: Сохранить находки прохода
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-findings
          path: audit-findings.json
          if-no-files-found: warn
          retention-days: 30
