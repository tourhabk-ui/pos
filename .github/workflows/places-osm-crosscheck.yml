name: Places × OSM — массовая сверка координат (вручную)

# GET /api/cron/places-osm-crosscheck (10.09): читает ВСЕ живые places и
# сверяет с одним bulk-запросом к Overpass по имени (pg_trgm) и расстоянию.
# Ничего не пишет и не прячет сам — список кандидатов для человека, отсортированный
# по убыванию расстояния БЕЗ порогового отсечения (единого порога, отделяющего
# ошибку от однофамильца, не существует — см. шапку route.ts).
#
# Повод: 10.09 четыре плохие координаты (Голубые озёра, Овальное, Смотровая
# у Авачинского, Лежбище сивучей) нашлись только по жалобам туриста с
# телефона. Правку по находке делать здесь — POST /api/cron/place-coords
# (нужен независимый источник) или отдельная миграция-скрытие (без
# источника, как 947/948).
#
# Запуск: workflow_dispatch (кнопка) или push в main, меняющий
# .github/triggers/places-osm-crosscheck.json.

on:
  workflow_dispatch:
    inputs:
      min_sim:
        description: 'Порог pg_trgm.similarity() (0..1)'
        required: false
        default: '0.3'
      part:
        description: 'summary — только счётчики; items/both — со списком'
        required: false
        default: both
        type: choice
        options: [both, summary, items]
  push:
    branches: [main]
    paths:
      - '.github/triggers/places-osm-crosscheck.json'

permissions:
  contents: read

# Новый прогон отменяет старый: сверка только читает, и две одновременные
# копии лишь дважды нагружают Overpass ради одного и того же ответа.
concurrency:
  group: places-osm-crosscheck
  cancel-in-progress: true

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    # Ожидание своей сборки (scripts/wait-for-deploy.sh) — до 55 минут
    # (ATTEMPTS ниже). 10.09 run 2 отсидел штатные 35 и не дождался: две
    # сборки Timeweb встали в очередь подряд. Пятнадцати минут не хватило бы
    # по построению: job отменила бы себя раньше, чем прод обновился.
    # 03.10: выборка OSM идёт здесь, на раннере, — 42 квадрата 2° × 2° по
    # минуте-полторы (run 9: 36 из 42 за 62 минуты, и job снял потолок 65).
    # Плюс до 20 минут ожидания сборки и до 20 — признака кода. 150 — с запасом.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Параметры — из ввода или из маркера
        env:
          IN_MIN_SIM: ${{ inputs.min_sim || '' }}
          IN_PART: ${{ inputs.part || '' }}
        run: |
          set -u
          python3 - <<'PY'
          import json, os
          with open('.github/triggers/places-osm-crosscheck.json') as f:
              marker = json.load(f)
          min_sim = os.environ.get('IN_MIN_SIM') or str(marker.get('min_sim') or '0.3')
          part = os.environ.get('IN_PART') or marker.get('part') or 'both'
          limit = str(marker.get('limit') or 100)
          offset = str(marker.get('offset') or 0)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'MIN_SIM={min_sim}\n')
              env.write(f'PART={part}\n')
              env.write(f'LIMIT={limit}\n')
              env.write(f'OFFSET={offset}\n')
          print(f'min_sim={min_sim} part={part} limit={limit} offset={offset}')
          PY

      # ── Объекты OSM выбираются ЗДЕСЬ, на раннере (03.10) ─────────────────
      # Публичные Overpass перестали отдавать край за то время, что живёт
      # запрос прода: с 10.09 сверка не проходила ни разу, 03.10 — таймаут
      # и 504 на всех четырёх серверах даже на один квадрат. Раннер ждёт
      # минутами, берёт квадраты 2° × 2° и обходит серверы по кругу; прод
      # получает готовый список POST-ом и сравнивает имена в базе.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Объекты OSM по краю — с раннера
        run: npx tsx scripts/osm-crosscheck-fetch.ts /tmp/osm-features.json

      # Маркер едет в main тем же пушем, что и роут /api/cron/places-osm-crosscheck,
      # а Timeweb собирает образ 5–20 минут. Эндпоинт этого прогона едет ТЕМ ЖЕ
      # коммитом (REQUIRE_FRESH=1): не дождались сборки — спрашивать нечего,
      # прогон обязан покраснеть на своей причине, а не получить 404 со старого
      # прода (сторож tests/unit/marker-waits-for-deploy.test.ts).
      - name: Wait for fresh deploy
        if: github.event_name == 'push'
        env:
          BASE: https://vedarai.ru
          WANT_SHA: ${{ github.sha }}
          NEED_AFTER: ${{ github.event.head_commit.timestamp }}
          # 03.10: ожидание больше не приговор. Маркер сборки отдаёт built_at
          # НАЧАЛА сборки (+25 с от пуша), а скрипт требует +600 с — run 8
          # просидел 55 минут при давно выкатанном коде. Приговор выносит
          # следующий шаг по признаку самого кода, а не по времени.
          REQUIRE_FRESH: '0'
          ATTEMPTS: '40'
        run: bash scripts/wait-for-deploy.sh

      # Признак КОДА, а не времени сборки: POST появился в v4 (03.10). Новый
      # код на пустое тело отвечает 400 (Zod), старый — 405 (метода нет).
      - name: На проде код сверки с POST
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" -H "Content-Type: application/json" \
              --data '{}' --max-time 30 "https://vedarai.ru/api/cron/places-osm-crosscheck") || CODE=000
            if [ "$CODE" = "400" ]; then echo "код с POST на проде (400 на пустое тело)"; exit 0; fi
            echo "ещё не тот код: HTTP $CODE, жду 30 с ($i/40)"
            sleep 30
          done
          echo "::error::Код сверки с POST на прод не доехал за 20 минут (последний ответ HTTP $CODE). Это «не смогли спросить», а не «расхождений нет»."
          exit 1

      - name: Сверка
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          URL="https://vedarai.ru/api/cron/places-osm-crosscheck?part=${PART}&min_sim=${MIN_SIM}&limit=${LIMIT}&offset=${OFFSET}"
          RESP=$(curl -X POST -H "Authorization: Bearer ${CRON_SECRET}" -H "Content-Type: application/json" \
            --data-binary @/tmp/osm-features.json -s --max-time 300 "$URL") || RESP=""
          # ── ОТКАЗ НЕ ВЫДАЁТСЯ ЗА УСПЕХ (правка 20.09) ─────────────────────
          #
          # Прогон 5 вернул `{"success": false, "error": ...}` (роут отвечает
          # так при отказе Overpass, HTTP 502) — и job остался ЗЕЛЁНЫМ. Печать
          # ниже берёт ИМЕНОВАННЫЕ поля, и при отказе они все приходят пустыми:
          # в лог ушла строка сплошных null, а `error` с настоящей причиной был
          # выброшен. Читатель видел зелёную галочку и пустой список — ровно
          # «не смог» под видом «нарушений нет» (§4.0).
          #
          # Теперь вердикт по `success`, а тело печатается целиком, когда он
          # не `true`. Разбор причины — дело следующего прогона, но причина
          # обязана быть НАПЕЧАТАНА, иначе следующий прогон начинается с
          # гадания.
          if [ -z "$RESP" ]; then
            echo "::error::Сверка не ответила вовсе: curl не дошёл (таймаут 300 с или сеть). Это «не смогли спросить», а не «расхождений нет»."
            exit 1
          fi
          echo "$RESP" | python3 -c "
          import json, sys
          raw = sys.stdin.read()
          try:
              d = json.loads(raw)
          except ValueError:
              print('Ответ не разобрался как JSON. Первые 2000 знаков:')
              print(raw[:2000])
              sys.exit(1)
          print(json.dumps({k: d.get(k) for k in (
              'success', 'probe', 'bbox', 'name_sim_floor', 'strong_sim',
              'checked_places_total', 'osm_features_total',
              'items_with_candidates_total', 'items_strong_total',
              'items_weak_only_total', 'items_without_candidates_total',
              'items_offset', 'items_limit', 'items_dropped',
          )}, ensure_ascii=False))
          if d.get('success') is not True:
              print('::error::Сверка ответила отказом — списка мест нет, и пустота ниже НЕ означает отсутствие расхождений.')
              print('Тело ответа целиком:')
              print(json.dumps(d, ensure_ascii=False)[:4000])
              sys.exit(1)
          "
          # ── ТОЧКА OSM ДАЛЬШЕ КИЛОМЕТРА (03.10) ──────────────────────────
          # Пометка «[протяжённый]» берётся из НАШЕГО рода места и гасила
          # улику у гор: «Гора Замок» стояла в 6.2 км от вершины Замок
          # (natural=peak) с 10.09, и её отложили как широкую гору, пока
          # турист не показал точку из Maps.me. Здесь отдельный список по
          # тегу САМОГО объекта OSM: вершина, вулкан, водопад, источник,
          # маяк, памятник — точка, и расстояние до неё — улика при любом
          # нашем роде. Решает человек: тёзки с тем же именем бывают.
          echo "── Точечный тёзка OSM дальше 1 км — кандидаты на правку координаты ──"
          echo "$RESP" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          strong = d.get('strong_sim') or 0.5
          rows = [it for it in (d.get('items') or []) if (it.get('nearestStrongPointKm') or 0) >= 1]
          rows.sort(key=lambda it: -it['nearestStrongPointKm'])
          for it in rows:
              km = it['nearestStrongPointKm']
              c = next((c for c in it.get('candidates') or [] if c.get('distanceKm') == km and (c.get('nameSim') or 0) >= strong), {})
              print(f\"{km} км | {it.get('name')} [{it.get('placeId')}] @ {it.get('ourLat')},{it.get('ourLng')} -> {c.get('osmName')} @ {c.get('osmLat')},{c.get('osmLng')} ({c.get('matchedTag')}, {c.get('osmKind')} {c.get('osmId')}, sim={c.get('nameSim')})\")
          print(f'Всего: {len(rows)}')
          "
          echo "── Ближайший одноимённый объект OSM (sim >= strong_sim), самые дальние первыми ──"
          echo "$RESP" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for it in d.get('items') or []:
              top = (it.get('candidates') or [{}])[0]
              ext = ' [протяжённый]' if it.get('isExtendedObject') else ''
              ns = it.get('nearestStrongKm')
              key = f'{ns} км' if ns is not None else 'только слабые'
              print(f\"{key} | {it.get('name')}{ext} [{it.get('placeId')}] @ {it.get('ourLat')},{it.get('ourLng')} -> {top.get('osmName')} @ {top.get('osmLat')},{top.get('osmLng')} ({top.get('matchedTag')}, sim={top.get('nameSim')}, {top.get('distanceKm')} км)\")
          "
          {
            echo "## places-osm-crosscheck — min_sim=$MIN_SIM part=$PART"
            echo
            echo '```json'
            echo "$RESP" | python3 -m json.tool | head -c 30000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
