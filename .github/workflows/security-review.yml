name: Security Review — AI-ревью диффа (Claude)

# Дополняет CodeQL (статические квери) семантическим ревью: официальный экшен
# Anthropic claude-code-security-review читает дифф PR и ищет логические/
# контекстные уязвимости, которые статика не ловит (утечки авторизации, SSRF,
# небезопасные потоки данных, инъекции в system-промпт AI-стека). Находка evo
# #795.
#
# ВАЖНО:
# - Триггер обычного pull_request (без -target варианта): форки не получают
#   секрет — на недоверенных PR ревью просто не запускается (экшен не защищён
#   от prompt-injection, гонять только на доверенных диффах — реком. Anthropic).
# - Ключ — секрет ANTHROPIC_API_KEY, тот же, что у рук Claude (claude.yml,
#   ci-sweeper, issue-triage, weekly-chronicle). Решение владельца 16.10
#   «перевести ревью на основной ключ»: прежний отдельный CLAUDE_API_KEY
#   отвечал 401 «Invalid API key» (PR #2537, run 38855757474), а проверка
#   оставалась зелёной. Цена решения названа владельцу: каждое ревью тратит
#   купленный баланс API (промокредиты запрос Claude Code не берёт, #2396).
#   Нет ключа — шаг мягко пропускается, workflow НЕ краснеет.
# - Ключ есть, а ревью не состоялось (отказ API, пустой итог) — КРАСНЫЙ
#   (§4.0: «не смог проверить» не равно «находок нет»). Экшен сам на отказ
#   API отвечает зелёным и пишет {"error": …} в claudecode-results.json.
# - Ревью совещательное: постит комментарии на PR, не является required-чеком.

# Триггер сужен по разбору расходов 06.09.
#
# Замер за сутки: 37 прогонов ревью, из них 22 — на ОДНОЙ ветке. Действие
# `synchronize` срабатывает на каждый push в PR, а экшен читает дифф PR
# ЦЕЛИКОМ — то есть один и тот же дифф оплачивался по двадцать с лишним раз,
# и каждый следующий прогон отличался от предыдущего на один коммит.
# `cancel-in-progress` тут не спасает: он снимает только перекрытые прогоны,
# а это были последовательные пуши.
#
# Теперь ревью идёт там, где его читают: при открытии PR и по метке
# `security-review` — её можно повесить перед мержем, когда дифф дособран, и
# получить свежее ревью одним кликом.
#
# Вывода из черновика (`ready_for_review`) в списке нет с 07.11, а
# `run-every-commit` включён. До этого экшен сам запрещал второе ревью того же
# PR (метка в кэше, `run-every-commit: false`): прогон при выводе из
# черновика и по метке видел «уже ревьюили», модель не звал, а шаг «Ревью
# состоялось» краснел на пустом итоге — у каждого PR второй красный крестик и
# ни одного обещанного свежего ревью. Теперь одно ревью при открытии и
# настоящее свежее — по метке. Цена та же: одно ревью на PR, второе — только
# по метке, то есть по решению человека.
#
# ЧЕСТНО О ЦЕНЕ РЕШЕНИЯ: PR, открытый пустым и дополненный коммитами, будет
# отревьюен по первому состоянию, если не повесить метку. Статику на каждый
# push по-прежнему гоняет CodeQL (security-extended) — она бесплатна и от
# этой правки не зависит; выпадает семантическая половина. Вернуть прежнее
# поведение — добавить `synchronize` в types обратно, одна строка.
on:
  pull_request:
    types: [opened, reopened, labeled]
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-review-${{ github.ref }}
  cancel-in-progress: true

# Провайдер рук (решение владельца 03.11 «агентов переключи пока на
# оупенррут»): Anthropic отвечает 403 verification_required (проверка
# организации). По умолчанию руки идут через OpenRouter (его
# Anthropic-совместимый /api/v1/messages, ключ OPENROUTER_API_KEY, модель
# anthropic/claude-opus-5). Вернуть Anthropic без правки кода:
# переменная репозитория AGENTS_PROVIDER=anthropic.
# Ревьюер остаётся на Opus 5, хотя руки с 07.11 на Opus 5.5. Экшен ставит
# Claude Code из npm без версии (`npm install -g @anthropic-ai/claude-code`),
# npm отдаёт 2.1.197, а Opus 5.5 принимается от 2.1.280: прогон на PR #3083
# 07.11 ответил «API Error: 400 Claude Code 2.1.197 does not support this
# model». Задать экшену версию нечем. Руки этим не задеты: claude-code-action
# ставит Claude Code 2.1.319 сам.
# Сторож: tests/unit/security-review-workflow.test.ts.
jobs:
  review:
    # `labeled` приходит на ЛЮБУЮ метку — без этого условия каждый ярлык
    # триажа («triaged», «size-L», «evo») запускал бы ревью, и экономия
    # обернулась бы ростом. Ревью по метке — только по своей, названной.
    if: |
      github.event.action != 'labeled' ||
      github.event.label.name == 'security-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ vars.AGENTS_PROVIDER == 'anthropic' && secrets.ANTHROPIC_API_KEY || secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ vars.AGENTS_PROVIDER == 'anthropic' && 'https://api.anthropic.com' || 'https://openrouter.ai/api' }}
    steps:
      - name: Checkout (с базой для диффа)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Платное ревью — только там, где ошибка стоит денег, входа или
      # персональных данных (владелец 07.11: «быстро» — баланс OpenRouter таял
      # на ревью каждого PR, около доллара за прогон). PR, где меняются только
      # интерфейс, тесты, документы или прочий код, модель не зовут; нужно —
      # метка `security-review`. Бесплатный CodeQL (security-extended) смотрит
      # каждый PR, как и прежде. Фильтр `paths` вверху так не умеет: он
      # отсекает и запуск по метке. Список файлов не прочитан — ревью идёт:
      # «не смог проверить» не равно «можно не проверять» (§4.0).
      - name: Нужно ли ревью
        id: scope
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          LABELED: ${{ github.event.action == 'labeled' }}
          SENSITIVE: '^(app/api/|middleware\.ts$|lib/auth\.ts$|lib/auth/|lib/payments/|lib/security/|lib/mcp/|lib/notifications/|lib/max/|lib/miniapp/|lib/agents/compliance/|\.github/workflows/)'
        run: |
          if [ "$LABELED" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Ревью по метке security-review."
            exit 0
          fi
          if ! CHANGED=$(git diff --name-only HEAD^1 HEAD); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Список файлов PR не прочитан — ревью идёт."
            exit 0
          fi
          if printf '%s\n' "$CHANGED" | grep -qE "$SENSITIVE"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "PR трогает чувствительные пути — ревью идёт."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Ревью безопасности не запускалось: PR не трогает API, вход, оплату, MCP, ПД и workflow. Нужно — повесьте метку security-review."
          fi

      # Ревьюер не получает настроек Claude Code из репозитория. В
      # .claude/settings.json разрешены curl, npm и git для разработчика, а
      # ревьюер читает дифф PR — недоверенный текст — с ключом API в окружении:
      # разрешения проекта дали бы инъекции в диффе руки вне песочницы экшена.
      # И с 03.11 (новый Claude Code на раннере) непринятые настройки проекта
      # роняли запуск: «Ignoring 25 permissions.allow entries … workspace has
      # not been trusted», код возврата 1 — ревью не состоялось ни на одном PR.
      # CLAUDE.md (220 КБ, ~60 тыс. токенов) Claude Code кладёт в контекст сам
      # и перечитывает на каждом ходу. Ревьюеру история проекта не нужна — у
      # экшена свой промпт безопасности, — а платили за неё на каждом ревью
      # (разбор расхода 07.11). Правила ПД держат детерминированные сторожа CI.
      # Удаляется только из рабочей копии раннера, репозиторий не меняется.
      - name: Настройки Claude Code репозитория — не ревьюеру
        if: ${{ env.ANTHROPIC_API_KEY != '' && steps.scope.outputs.run == 'true' }}
        run: rm -f .claude/settings.json .claude/settings.local.json CLAUDE.md

      - name: Claude security review
        if: ${{ env.ANTHROPIC_API_KEY != '' && steps.scope.outputs.run == 'true' }}
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # ветка main на 23.08.2026
        with:
          claude-api-key: ${{ env.ANTHROPIC_API_KEY }}
          claude-model: ${{ vars.AGENTS_PROVIDER == 'anthropic' && 'claude-opus-5' || 'anthropic/claude-opus-5' }}
          comment-pr: true
          # Свежее ревью по метке `security-review` — по-настоящему: без этого
          # экшен видит метку прошлого ревью в кэше и модель не зовёт (07.11).
          run-every-commit: true
          claudecode-timeout: '15'
          # Шум вне нашего кода — не гоняем ревью по зависимостям и билд-артефактам.
          exclude-directories: 'node_modules,.next,public,migrations'

      # Экшен на отказ API завершается зелёным, оставляя в рабочем каталоге
      # claudecode-results.json вида {"error": "…"} — так 16.10 ревью PR #2537
      # «прошло» с ответом 401. Здесь «не смог» становится красным, а не
      # «находок нет». Текст ошибки — одной строкой: перевод строки в нём
      # начал бы новую команду workflow.
      - name: Ревью состоялось
        if: ${{ env.ANTHROPIC_API_KEY != '' && steps.scope.outputs.run == 'true' }}
        run: |
          F=claudecode-results.json
          if [ ! -s "$F" ]; then
            echo "::error::Ревью безопасности не оставило итога ($F пуст или его нет) — проверка не состоялась, это не «находок нет»."
            exit 1
          fi
          if jq -e 'type == "object" and has("error")' "$F" >/dev/null 2>&1; then
            MSG=$(jq -r '.error | tostring' "$F" | tr '\r\n' '  ' | head -c 400)
            echo "::error::Ревью безопасности не состоялось: $MSG"
            exit 1
          fi
          if ! jq -e 'type == "object"' "$F" >/dev/null 2>&1; then
            echo "::error::Итог ревью ($F) не разобран как JSON-объект — проверка не состоялась."
            exit 1
          fi
          echo "Ревью состоялось, находок: $(jq '.findings // [] | length' "$F")"

      - name: Ключ не задан — пропуск
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "ANTHROPIC_API_KEY не задан в секретах — AI-ревью безопасности пропущено (не ошибка). Добавьте секрет, чтобы включить."
