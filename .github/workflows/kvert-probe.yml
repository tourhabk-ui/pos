name: Проба — формат выпуска KVERT

# Читает выпуск KVERT и печатает его структуру: размер, сводку кодов и
# окрестности имён вулканов. Нужна, потому что песочница агента к
# kvert.febras.net не ходит (403 на прокси), а раннер ходит — этим же путём
# 10.08 снималась фикстура парсера.
#
# Только чтение: ни прод, ни база не участвуют.
#
# Запуск: push в main, меняющий .github/triggers/kvert-probe.json, или кнопка.

# Права токена: Единственный потребитель токена — checkout маркера с адресами;
# опрос KVERT идёт без токена вовсе.
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/kvert-probe.json'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # 08.10: недельная сводка (type=3) обновляется раз в неделю, а KVERT
      # между сводками выпускает отдельные VONA по активным вулканам. Где лежит
      # их лента и в каком виде — вопрос замера: маркер даёт список адресов
      # (urls), по каждому печатаем ответ, число заголовков VONA и строки
      # Issued/Volcano/код — этого хватает, чтобы выбрать адрес и снять фикстуру.
      - name: Ленты VONA — какие адреса что отдают
        run: |
          python3 - <<'PY'
          import json, re, html, subprocess
          m = json.load(open('.github/triggers/kvert-probe.json'))
          for url in m.get('urls') or []:
              r = subprocess.run(['curl','-s','-L','--max-time','60','-o','/tmp/v.html','-w','%{http_code}',url],capture_output=True,text=True)
              code = r.stdout.strip()
              try: raw = open('/tmp/v.html',encoding='utf-8',errors='replace').read()
              except Exception: raw = ''
              t = re.sub(r'<br\s*/?>','\n',raw,flags=re.I)
              t = re.sub(r'</(p|div|tr|h\d|pre)>','\n',t,flags=re.I)
              t = re.sub(r'<[^>]+>',' ',t); t = html.unescape(t)
              lines = [re.sub(r'[ \t]+',' ',l).strip() for l in t.split('\n')]
              lines = [l for l in lines if l]
              heads = sum(1 for l in lines if re.search(r'VOLCANO OBSERVATORY NOTICE', l, re.I))
              print(f'════ {url}\nHTTP {code}, байт {len(raw)}, строк {len(lines)}, заголовков VONA {heads}')
              keys = [l for l in lines if re.match(r'(Issued|Volcano|Current aviation|Previous aviation|Notice Number|Volcanic cloud height)\b', l, re.I)]
              print('— поля VONA (первые 24):'); print('\n'.join(keys[:24]) or '  нет')
              print('— начало текста (40 строк):'); print('\n'.join(lines[:40]))
              # Окрестности искомых слов (grep из маркера): список выпусков
              # длинный, и начало страницы не говорит, где в нём VONA и даты.
              for pat in m.get('grep') or []:
                  idx = [i for i,l in enumerate(lines) if re.search(pat, l, re.I)]
                  print(f'— «{pat}»: совпадений {len(idx)}, первые 8 с контекстом:')
                  for i in idx[:8]:
                      print('  ┄ ' + ' | '.join(lines[max(0,i-2):i+4]))
              links = sorted(set(re.findall(r'href=["\']([^"\']*(?:type=|vona|van)[^"\']*)', raw, re.I)))[:30]
              print('— ссылки на ленты:'); print('\n'.join(links) or '  нет')
          PY

      - name: Снять выпуск и показать структуру
        run: |
          # Адрес берём из маркера: у выпуска есть языковые версии, и какая из
          # них годится под разбор — вопрос замера, а не догадки.
          URL=$(python3 -c "import json; print(json.load(open('.github/triggers/kvert-probe.json')).get('url') or 'http://kvert.febras.net/van/index.php?type=3&lend=en')")
          echo "адрес: $URL"
          CODE=$(curl -s -o /tmp/kvert.html -w "%{http_code}" --max-time 60 -L "$URL" || echo 000)
          echo "HTTP $CODE, bytes: $(wc -c < /tmp/kvert.html)"
          [ "$CODE" = "200" ] || { echo "источник не ответил — разбирать нечего"; exit 0; }

          # Текст без тегов: разбирать сводку по сырому HTML — спотыкаться о
          # <span id='ORANGE'> внутри строки.
          python3 - <<'PY' > /tmp/kvert.txt
          import re, html
          raw = open('/tmp/kvert.html', encoding='utf-8', errors='replace').read()
          t = re.sub(r'<br\s*/?>', '\n', raw, flags=re.I)
          t = re.sub(r'</(p|div|tr|h\d)>', '\n', t, flags=re.I)
          t = re.sub(r'<[^>]+>', ' ', t)
          t = html.unescape(t)
          t = re.sub(r'[ \t]+', ' ', t)
          print('\n'.join(l.strip() for l in t.split('\n')))
          PY
          echo "текст без тегов: $(wc -c < /tmp/kvert.txt) байт, строк $(wc -l < /tmp/kvert.txt)"

          echo "════ сводка кодов ════"
          grep -n -i -A 14 "AVIATION COLOUR CODES" /tmp/kvert.txt | head -30

          echo "════ окрестности имён вулканов (первые 60 строк после сводки) ════"
          START=$(grep -n -i -m1 "AVIATION COLOUR CODES" /tmp/kvert.txt | cut -d: -f1)
          sed -n "$((START+15)),$((START+75))p" /tmp/kvert.txt

          NAMES=$(python3 -c "import json; print(' '.join(json.load(open('.github/triggers/kvert-probe.json')).get('names') or ['SHEVELUCH','KLYUCHEVSKOY','BEZYMIANNY']))")
          for V in $NAMES; do
            echo "════ $V: первое упоминание вне сводки ════"
            # -m2: первое обычно в самой сводке, второе — в разделе активности.
            grep -n -i -m2 -A 18 "^$V" /tmp/kvert.txt | tail -25
          done
