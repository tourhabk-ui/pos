name: Data — OSM Geometry (GPS-треки маршрутов из OpenStreetMap)

# Ручной прогон scripts/import-osm-geometry.ts (PR #398): тянет реальные
# GPS-треки из OSM Overpass для kamchatka_routes без geometry и пишет
# GeoJSON LineString. Overpass доступен с GitHub-раннера (US), прод-БД —
# по secret DATABASE_URL (тот же, что у Reindex Embeddings / Park Vertices).
#
# По умолчанию dry-run + limit 5 — безопасная первая проверка. Для боевого
# прогона: dry_run=false, limit по вкусу (999 = все маршруты без geometry).
# Overpass rate-limit: скрипт держит паузу 1.2с между запросами.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (без записи в БД)'
        required: false
        default: true
        type: boolean
      limit:
        description: 'Сколько маршрутов обработать (999 = все)'
        required: false
        default: '5'
        type: string

jobs:
  import-osm-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Import OSM geometry
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production # включает ssl для managed PostgreSQL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set — добавьте его в Settings → Secrets"
            exit 1
          fi
          LIMIT="${{ github.event.inputs.limit }}"
          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            npx tsx scripts/import-osm-geometry.ts --limit "$LIMIT"
          else
            npx tsx scripts/import-osm-geometry.ts --dry-run --limit "$LIMIT"
          fi
