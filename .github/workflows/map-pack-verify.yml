name: Проверка пакетов карты в хранилище

# Читается ли то, что лежит в бакете. Отдельно от сборки: сборка отвечает за
# то, что файл СДЕЛАН, а этот прогон — за то, что он ДОЕЗЖАЕТ целиком и
# разбирается. 02.09 из поля пришёл скрин с обрывом GeoJSON на 388 КБ, и
# проверить это из контейнера нечем: адрес бакета живёт в секретах репозитория
# (§8 — «где что исполняется»).
#
# Ручной вход и файл-триггер — как у сборки: интеграция Claude не имеет права
# на workflow_dispatch (403, проверено 02.09), а пуш файла запускает прогон с
# той ветки, куда запушен.

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - '.github/triggers/map-pack-verify.json'
  # Раз в неделю: пакеты не меняются сами, но хранилище — чужая
  # инфраструктура, и молчаливая порча файла обнаружилась бы иначе только
  # телефоном в поле, то есть в худший момент.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Зависимости
        run: npm ci --ignore-scripts

      - name: Скачать и разобрать каждый файл пакета
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: |
          if [ -z "$S3_BUCKET" ]; then
            echo "::error::Секрета S3_BUCKET нет — проверить нечего и негде. Это ОТДЕЛЬНЫЙ набор от переменных Timeweb (§8)."
            exit 2
          fi
          set +e
          npx tsx scripts/map-tiles/verify-packs.ts
          code=$?
          set -e
          # Три исхода вместо двух (§4.0): испорченный файл и «не смог
          # проверить» — разные беды, и одинаково красный прогон о них
          # соврал бы. Оба не зелёные, но называются по-разному.
          if [ "$code" = "1" ]; then
            echo "::error::В хранилище есть испорченные файлы пакета — карта в поле их не прочитает."
          elif [ "$code" = "3" ]; then
            echo "::error::Часть файлов проверить не удалось (сеть/хранилище). Это не значит, что они целы."
          elif [ "$code" = "2" ]; then
            echo "::error::Проверка не состоялась — не задан адрес хранилища."
          fi
          exit $code
