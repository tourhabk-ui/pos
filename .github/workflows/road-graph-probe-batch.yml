name: Связность трёх сёл после фикса bbox (Паратунка, Ключи, Эссо)

# Разовая пакетная перепроверка (владелец 29.08). Реальные координаты сёл,
# не bbox-центроиды regions.ts (та же ошибка, что была с Эссо в начале
# расследования: центроид региона — не трейлхед и не населённый пункт).
#
# READ-ONLY: GET к нашему публичному /api/routing/path. Секрет не нужен.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/triggers/road-graph-probe-batch.json'

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Запрос связности по трём точкам
        run: |
          BASE="https://vedarai.ru/api/routing/path"
          FROM_LAT="53.0195"
          FROM_LNG="158.6494"

          check() {
            local label="$1" lat="$2" lng="$3"
            echo "── ${label} (${lat},${lng}) ──"
            curl -sS -w '\nHTTP %{http_code} · %{time_total}s\n' --max-time 30 \
              "${BASE}?from_lat=${FROM_LAT}&from_lng=${FROM_LNG}&to_lat=${lat}&to_lng=${lng}&mode=car"
            echo
            echo
          }

          check "Паратунка (52°57'38\"N 158°14'55\"E)" "52.960556" "158.248611"
          check "Ключи (56°17'59\"N 160°50'59\"E)" "56.299722" "160.849722"
          check "Эссо (55°55'N 158°42'E)" "55.916667" "158.7"
