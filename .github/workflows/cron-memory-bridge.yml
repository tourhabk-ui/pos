name: Cron — Memory Bridge (синхронизация предпочтений)

on:
  schedule:
    - cron: '0 1,7,13,19 * * *'  # каждые 6 часов (смещение 1ч от evo)
  workflow_dispatch:

jobs:
  memory-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync user preferences to agent memory
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/memory-bridge")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
