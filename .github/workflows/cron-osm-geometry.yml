name: Cron — OSM Geometry Import

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC ежедневно — параллельный батчинг обрабатывает все 294 за ~5 мин
  workflow_dispatch:        # ручной запуск из GitHub Actions UI

jobs:
  osm-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Import GPS tracks from OpenStreetMap
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/osm-geometry")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null | python3 -m json.tool || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
