name: Диагностика каталога (вручную)

# Зачем отдельный workflow, а не curl с чьей-нибудь машины.
#
# Закрытый endpoint требует CRON_SECRET, а прод доступен не отовсюду. Держать
# ключ у себя, чтобы разово посмотреть SQLSTATE, — плохой размен: секрет
# начинает жить в истории терминалов и в переписке. В Actions он уже есть
# (им пользуются cron-workflow), там же есть и сеть. Значит правильное место
# для разового запроса — здесь, а ответ читается в логе прогона.
#
# Запускается ТОЛЬКО вручную: это инструмент разбора, а не наблюдение.
# Регулярный опрос диагностики создавал бы нагрузку и шум, а вопрос, ради
# которого её зовут, каждый раз новый.
#
# Ответ не содержит ни секретов, ни персональных данных: тексты ошибок
# Postgres, счётчики и id маршрутов.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Спросить диагностику и показать ответ
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Cron-workflow при отсутствии секрета выходят с нулём: пропущенная
          # задача лучше красного прогона. Здесь наоборот — молчаливый успех
          # диагностики означал бы «мы посмотрели и всё хорошо», хотя мы не
          # посмотрели вовсе.
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET не задан в секретах репозитория — спросить диагностику нечем."
            exit 1
          fi

          HTTP=$(curl -sS -o /tmp/diag.json -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/catalog-diag") || HTTP="000"

          echo "HTTP $HTTP"

          if [ "$HTTP" != "200" ]; then
            echo "::error::Диагностика ответила $HTTP."
            head -c 2000 /tmp/diag.json || true
            exit 1
          fi

          # В лог — как есть, в сводку прогона — читаемо: по этому ответу
          # принимается решение о причине P0, и его должно быть удобно читать
          # и цитировать, а не выковыривать из простыни.
          python3 -m json.tool /tmp/diag.json || cat /tmp/diag.json

          {
            echo '## Диагностика каталога'
            echo ''
            echo '```json'
            python3 -m json.tool /tmp/diag.json || cat /tmp/diag.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
