name: Cron — Editor

on:
  schedule:
    - cron: '0 22 * * *'  # 22:00 UTC — off-peak DeepSeek; окна пика — lib/ai/deepseek-peak.ts, не повторять здесь
  workflow_dispatch:

jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Editor — AI улучшение описаний туров
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 300 \
            "https://vedarai.ru/api/cron/editor" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
