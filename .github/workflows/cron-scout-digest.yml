name: Cron — Scout Digest

# Расписание вернулось 05.09 (решение владельца). С 29.08 дайджест был
# стадией runEvoOrchestrator внутри evo.run; замер прогона 389 показал, что
# он один занимает 321 с при бюджете роута 300 с — три прогона эволюции
# подряд (386-388) умерли на сервере без ответа. Свой крон даёт дайджесту
# свой потолок, а эволюции — её бюджет. Двойного вызова нет: из
# оркестратора стадия убрана тем же коммитом.
#
# Два выпуска в сутки: 07:00 и 17:00 UTC (10:00 и 20:00 МСК). Повторы
# между выпусками гасит сторож повторов самого дайджеста.
on:
  schedule:
    - cron: '0 7,17 * * *'
  workflow_dispatch:
  # Запуск маркером (03.09): workflow_dispatch через интеграцию отвечает 403,
  # а проверить разведчика после выкатки (реле, ленты лабораторий, линза
  # «ИИ-фичи») нужно сразу, не дожидаясь вечернего прогона эволюции. Тот же
  # приём, что у prod-check и safety-relay-deploy. Расписания по-прежнему нет:
  # маркер — ручной запуск, а не второй крон.
  push:
    branches: [main]
    paths:
      - '.github/triggers/scout-digest.json'

jobs:
  scout-digest:
    runs-on: ubuntu-latest
    # 40, а не 8: ожидание деплоя (до 25 мин) плюс прогон разведчика (до 5).
    timeout-minutes: 40
    steps:
      # checkout ради scripts/wait-for-deploy.sh: сам замер идёт на проде.
      - uses: actions/checkout@v7

      # Ждём НЕ любой рестарт, а СВОЮ сборку — по маркеру /version.json
      # (commit + built_at, пишется scripts/write-version.js при сборке образа).
      # Правило одно на все замеры — scripts/wait-for-deploy.sh; замер 05.09
      # (prod-check run 8) показал, что штамп из next.config.js до обработчика
      # маршрута не доходит: build_time был null, и ожидание отсиживало 25 мин
      # впустую.
      # Только для запуска маркером: по расписанию head_commit пуст, и шаг
      # честно ждал бы 25 минут «своей сборки», которой не просили.
      - name: Wait for fresh deploy
        if: github.event_name == 'push'
        env:
          BASE: https://vedarai.ru
          WANT_SHA: ${{ github.sha }}
          NEED_AFTER: ${{ github.event.head_commit.timestamp }}
        run: bash scripts/wait-for-deploy.sh

      - name: Scout Digest — ежедневный дайджест
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # exit 1, а не 0. Прежде отсутствие секрета давало ЗЕЛЁНЫЙ прогон при
          # полном бездействии: дайджест не собирался, в каналы не уходило
          # ничего, а календарь Actions показывал ровный ряд галочек. Ровно на
          # такой ряд смотрел владелец 17.08, спрашивая, почему молчит канал.
          #
          # У пропуска и у успеха разный смысл, и они обязаны выглядеть
          # по-разному. Единственный аргумент за exit 0 — «пропущенная задача
          # лучше красного прогона» — верен для задач, чьё невыполнение видно
          # иначе. Здесь не видно ничем: публикация и есть единственный признак.
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET не задан — дайджест не собран и в каналы ничего не ушло."
            exit 1
          fi
          # --max-time 300, а не 120: дайджест — это RSS четырёх источников
          # плюс AI-синтез через waterfall, и при перескоке на резервного
          # провайдера он законно идёт дольше двух минут. Прогон 27.07 10:48
          # упал с exit 28 (таймаут curl), хотя сервер работу ДОДЕЛАЛ и
          # дайджест в Telegram ушёл: раннер бросал трубку раньше времени.
          # Красный прогон при выполненной работе хуже бесполезного — он учит
          # не верить красному.
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 300 \
            "https://vedarai.ru/api/cron/scout-digest" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] || { echo "FAIL $HTTP"; exit 1; }

          # Молчание подряд краснит прогон.
          #
          # У дайджеста восемь законных выходов без публикации, и каждый по
          # отдельности — осторожность: лучше промолчать, чем выпустить
          # непроверенное. Но крон при этом отвечает успехом, и 1–8.08 это
          # стоило недели тишины, а к 18.08 накопилось семнадцать дней — при
          # зелёных галочках каждый день.
          #
          # Предупреждение в Telegram про молчание уже есть. Его читают среди
          # других; красный прогон в Actions требует ответа.
          CRIT=$(python3 -c "import json;print(json.load(open('/tmp/out.json')).get('silence_critical', False))" 2>/dev/null || echo False)
          RUNS=$(python3 -c "import json;print(json.load(open('/tmp/out.json')).get('silent_runs', 0))" 2>/dev/null || echo 0)
          WHY=$(python3 -c "import json;print(json.load(open('/tmp/out.json')).get('digest_skip_reason') or 'причина не записана')" 2>/dev/null || echo '?')
          if [ "$CRIT" = "True" ]; then
            echo "::error::Разведчик молчит $RUNS прогона подряд. Причина последнего: $WHY. Ворота держат агента систематически — нужен человек."
            exit 1
          fi
          echo "OK"
