name: Cron — проверка сайтов операторов

# Платформа ручается за оператора, и его сайт — часть этого ручательства.
# Решение владельца 19.08 по issue #1275.
#
# Что проверяется: сертификат, HTTPS, заголовки безопасности, смешанный
# контент, раскрытие версий, открытые служебные файлы. Всё — обычными
# запросами, как у посетителя. Перебора, фаззинга и эксплуатации нет:
# это уже вторжение, и разрешает его владелец САЙТА, а не владелец платформы.
#
# Раз в сутки и по десять операторов за прогон: очередь идёт от тех, кого
# дольше всех не проверяли, поэтому ни один сайт не получает наш трафик чаще
# раза в день, а обходится реестр целиком.

on:
  schedule:
    - cron: '30 3 * * *'   # до ночной сверки каналов и утреннего дайджеста
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Проверка внешней поверхности сайтов
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Нет секрета — это ОТКАЗ, а не «нечего делать»: молчаливый выход
          # с нулём читается как успешная проверка (CLAUDE.md §4.0).
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET не задан — проверка не выполнена. Это не «чисто»."
            exit 1
          fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 300 \
            "https://vedarai.ru/api/cron/operator-site-audit" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] || { echo "FAIL $HTTP"; exit 1; }
