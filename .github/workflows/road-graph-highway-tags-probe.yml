name: Какие highway-теги есть в коридоре ПК-Мильково (вручную)

# Разовая диагностика (владелец 29.08). Мильково (54.695,158.62) снапнулось
# в 65 м от дороги в нашем графе — значит дорога ЕСТЬ в данных у самой цели,
# но связного пути от Петропавловска нет (disconnected). Значит разрыв не в
# "нет данных", а либо в графе (ways не делят узел на стыке), либо в фильтре
# highway-классов (road-graph-builder.js: HIGHWAY_WHITELIST), который может
# отбрасывать сегмент где-то посередине трассы — например *_link, которых в
# списке сейчас нет.
#
# Этот воркфлоу спрашивает Overpass напрямую (доступен только с раннера
# GitHub Actions, сессия Claude Code к нему подключиться не может — прокси
# блокирует overpass-api.de политикой) и считает частоты ВСЕХ значений
# highway в широком коридоре между Петропавловском и Мильково, явно называя,
# какие из них НЕ входят в наш текущий фильтр.
#
# READ-ONLY: один GET/POST к Overpass, ничего не пишет и не меняет.

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Частоты highway-тегов в коридоре
        run: |
          # Коридор пошире прямой линии — реальная трасса петляет
          Q='[out:json][timeout:60];way["highway"](53.0,157.5,55.0,159.5);out tags;'
          HTTP=$(curl -sS -o /tmp/tags.json -w '%{http_code}' --max-time 90 \
            -X POST --data-urlencode "data=${Q}" \
            https://overpass-api.de/api/interpreter) || HTTP="000"
          echo "HTTP overpass-api.de: ${HTTP}"
          if [ "$HTTP" != "200" ]; then
            echo "первое зеркало не ответило, пробую overpass.kumi.systems"
            HTTP=$(curl -sS -o /tmp/tags.json -w '%{http_code}' --max-time 90 \
              -X POST --data-urlencode "data=${Q}" \
              https://overpass.kumi.systems/api/interpreter) || HTTP="000"
            echo "HTTP kumi.systems: ${HTTP}"
          fi
          if [ "$HTTP" != "200" ]; then
            echo "второе зеркало тоже не ответило, пробую maps.mail.ru"
            HTTP=$(curl -sS -o /tmp/tags.json -w '%{http_code}' --max-time 90 \
              -X POST --data-urlencode "data=${Q}" \
              https://maps.mail.ru/osm/tools/overpass/api/interpreter) || HTTP="000"
            echo "HTTP mail.ru: ${HTTP}"
          fi
          if [ "$HTTP" != "200" ]; then
            echo "::error::Все зеркала Overpass недоступны"
            exit 1
          fi

          python3 - <<'PY'
          import json
          WHITELIST = {
              'motorway', 'trunk', 'primary', 'secondary', 'tertiary',
              'unclassified', 'residential', 'service', 'living_street',
              'track', 'road', 'path', 'footway', 'bridleway', 'cycleway',
          }
          with open('/tmp/tags.json') as f:
              data = json.load(f)
          els = data.get('elements', [])
          from collections import Counter
          counts = Counter()
          for e in els:
              hw = (e.get('tags') or {}).get('highway')
              if hw:
                  counts[hw] += 1
          print(f'Всего ways с highway-тегом в коридоре: {len(els)}')
          print()
          print('Частоты по значению highway (по убыванию), * = НЕ в нашем HIGHWAY_WHITELIST:')
          for hw, n in counts.most_common():
              flag = ' *** ВНЕ ФИЛЬТРА ***' if hw not in WHITELIST else ''
              print(f'  {hw:20s} {n:5d}{flag}')

          missing = sum(n for hw, n in counts.items() if hw not in WHITELIST)
          print()
          print(f'Итого ways вне фильтра: {missing} из {sum(counts.values())}')
          PY
