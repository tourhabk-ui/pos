name: Telegram Webhook Probe

on:
  push:
    branches: ['claude/new-session-0jqpe']
    paths: ['.github/workflows/telegram-webhook-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      BOT: "8925264444:AAF2WP0559nVrHYu97e_mt6tU9yCiuOCoME"
      WH:  "https://vedarai.ru/api/telegram/kuzmich"
    steps:
      - name: getMe
        run: |
          echo "=== getMe ==="
          curl -s "https://api.telegram.org/bot${BOT}/getMe" | python3 -m json.tool

      - name: getWebhookInfo BEFORE
        run: |
          echo "=== getWebhookInfo BEFORE ==="
          curl -s "https://api.telegram.org/bot${BOT}/getWebhookInfo" | python3 -m json.tool

      - name: setWebhook
        run: |
          echo "=== setWebhook ==="
          curl -s -X POST "https://api.telegram.org/bot${BOT}/setWebhook" \
            -H "Content-Type: application/json" \
            -d "{\"url\":\"${WH}\",\"allowed_updates\":[\"message\",\"callback_query\"],\"drop_pending_updates\":true}" \
            | python3 -m json.tool

      - name: getWebhookInfo AFTER
        run: |
          echo "=== getWebhookInfo AFTER ==="
          curl -s "https://api.telegram.org/bot${BOT}/getWebhookInfo" | python3 -m json.tool
