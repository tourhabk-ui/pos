name: Cron — Watchdog

# Файл зовёт ровно один адрес — /api/cron/watchdog. Шаги «Webhook Watchdog» и
# «LLM Budget Check» убраны 15.10 (находка аудита P2-18): оба эндпоинта уже
# зовут свои расписания — cron-safety-heartbeat.yml (шаг tg_watchdog) и
# cron-llm-budget.yml — и вторая нога в start.js. Здесь они были третьим
# путём, который не читал HTTP-код (curl без -f и `|| true`): отказ не красил
# ничего, а аренда окна и так гасила повторный вызов. Один эндпоинт — одно
# расписание: tests/unit/cron-single-schedule.test.ts.

on:
  schedule:
    - cron: '*/30 * * * *'  # каждые 30 минут
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warmup — разбудить сервер
        run: |
          curl -s --max-time 90 -o /dev/null -w "Warmup HTTP: %{http_code}\n" \
            "https://vedarai.ru/api/health" || echo "Warmup ping done (server may have been cold)"

      - name: Watchdog — мониторинг платформы
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET не задан в секретах репозитория — эндпоинт не вызван, прогон не состоялся"; exit 1; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 120 \
            "https://vedarai.ru/api/cron/watchdog" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
