name: Cron — Watchdog

on:
  schedule:
    - cron: '*/30 * * * *'  # каждые 30 минут
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warmup — разбудить сервер
        run: |
          curl -s --max-time 90 -o /dev/null -w "Warmup HTTP: %{http_code}\n" \
            "https://vedarai.ru/api/health" || echo "Warmup ping done (server may have been cold)"

      - name: Watchdog — мониторинг платформы
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 120 \
            "https://vedarai.ru/api/cron/watchdog" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }

      - name: Webhook Watchdog — проверка вебхука Telegram
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          curl -s --max-time 30 \
            "https://vedarai.ru/api/cron/telegram-webhook-watchdog" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -o /tmp/webhook.json || true
          cat /tmp/webhook.json 2>/dev/null || true

      - name: LLM Budget Check — контроль расходов AI
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          curl -s --max-time 30 \
            "https://vedarai.ru/api/cron/llm-budget-check" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -o /tmp/budget.json || true
          cat /tmp/budget.json 2>/dev/null || true
