name: Cron — Kuzmich Place Reviews

on:
  schedule:
    # Ежедневно, рецензии Кузьмича (20 мест/запуск) — самый объёмный плановый
    # вызов модели. До 10.09 стояло 03:00 UTC — пик DeepSeek (окна —
    # lib/ai/deepseek-peak.ts). 00:33 UTC = 12:33 Камчатки, читателю рецензий
    # час безразличен, а цена вдвое ниже.
    - cron: '33 0 * * *'
  workflow_dispatch:
  # Запуск маркером (14.10): workflow_dispatch через интеграцию отвечает 403,
  # а расписание одно на сутки. Прогон теперь начинается с перепроверки уже
  # стоящих заметок (слово владельца «1 да» — заметки сверх данных места на
  # перезапись), и снять выдумки с карточек надо в день решения, а не
  # следующей ночью. Маркер — ручной запуск, а не второй крон.
  push:
    branches: [main]
    paths:
      - '.github/triggers/kuzmich-places.json'

# Токену — только чтение: checkout и запись выката, по которой
# scripts/wait-for-deploy.sh ждёт свою сборку (15.10). Другим шагам
# этого workflow токен не нужен.
permissions:
  contents: read
  deployments: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    # 80: ожидание своей сборки (до 70 мин) плюс прогон агента (до 10).
    timeout-minutes: 80
    steps:
      # checkout ради scripts/wait-for-deploy.sh: сам прогон идёт на проде.
      - uses: actions/checkout@v7
        with:
          # История за час — для CODE_PATHS в wait-for-deploy.sh.
          fetch-depth: 200

      # Ждём СВОЮ сборку: прогон ПИШЕТ (снимает заметки и пишет новые), и
      # перепроверка, выполненная прежним кодом, — это прогон без неё.
      # REQUIRE_FRESH — «не дождались сборки» обязано быть отказом, а не
      # молчаливым прогоном по чужому коду (§4.0). Только для запуска
      # маркером: по расписанию head_commit пуст.
      - name: Wait for fresh deploy
        if: github.event_name == 'push'
        env:
          BASE: https://vedarai.ru
          WANT_SHA: ${{ github.sha }}
          # Запись выката (deploy.yml) читается с токеном — без него ждём по built_at.
          GH_TOKEN: ${{ github.token }}
          NEED_AFTER: ${{ github.event.head_commit.timestamp }}
          REQUIRE_FRESH: '1'
          CODE_PATHS: 'app/api/cron/kuzmich-places lib/agents/kuzmich-place-enricher.ts lib/kuzmich/review-claims.ts lib/places/description-voice.ts lib/safety/profile-source.ts'
        run: bash scripts/wait-for-deploy.sh

      - name: Generate kuzmich_review for places (20 per run)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 600 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/kuzmich-places")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] || { echo "FAIL $HTTP"; exit 1; }
          # Перепроверка, которая не выполнилась, — не «снимать нечего» (§4.0).
          if [ "$(jq -r '.recheck_failed // false' /tmp/out.json)" = "true" ]; then
            echo "FAIL: перепроверка стоящих заметок не выполнилась — см. лог прода"
            exit 1
          fi
          echo "OK: reset=$(jq -r '.reset // "?"' /tmp/out.json) enriched=$(jq -r '.enriched // "?"' /tmp/out.json) rejected=$(jq -r '.rejected // "?"' /tmp/out.json)"
