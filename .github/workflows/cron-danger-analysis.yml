name: Cron — Danger Analysis (зоны риска Камчатки)

on:
  schedule:
    - cron: '0,30 * * * *'  # каждые 30 минут — оценка риска по зонам
  workflow_dispatch:

jobs:
  danger-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Analyze danger zones
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/danger-analysis")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
