name: Timeweb Diagnostic
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Collect status and post to issue
        env:
          TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_ID="175477"
          BASE="https://api.timeweb.cloud/api/v1"

          APP=$(curl -sf -H "Authorization: Bearer $TOKEN" "$BASE/apps/$APP_ID" 2>/dev/null || echo '{}')
          ENVS=$(curl -sf -H "Authorization: Bearer $TOKEN" "$BASE/apps/$APP_ID/envs" 2>/dev/null || echo '{}')
          H1=$(curl -sf --max-time 15 -o /dev/null -w '%{http_code}' 'https://vedarai.ru/api/health' 2>/dev/null || echo 'FAIL')
          H2=$(curl -sf --max-time 15 'https://vedarai.ru/api/debug-start' 2>/dev/null || echo '{"err":"not_responding"}')

          python3 - "$APP" "$ENVS" "$H1" "$H2" "$GH_TOKEN" <<'ENDPY'
import json, sys, urllib.request, datetime

app_raw, envs_raw, h1, h2_raw, token = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5]

a = json.loads(app_raw).get('app', {})
e = json.loads(envs_raw).get('envs', [])
names = sorted([x.get('name','?') for x in e]) if isinstance(e, list) else list(e.keys())

try:
    d2 = json.loads(h2_raw)
    debug = f"node={d2.get('node','?')} uptime={int(d2.get('uptime',0))}s DB={d2.get('env',{}).get('DATABASE_URL','?')} JWT={d2.get('env',{}).get('JWT_SECRET','?')}"
except Exception:
    debug = h2_raw[:200]

ts = datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
body = f"""## Timeweb Diagnostic {ts}

**App:** status={a.get('status','?')} commit={str(a.get('commit_sha','?'))[:10]} branch={a.get('branch','?')}

**Env vars ({len(names)}):**
{chr(10).join('- '+n for n in names)}

**Health:**
- /api/health: HTTP {h1}
- /api/debug-start: {debug}
"""

data = json.dumps({'body': body}).encode()
req = urllib.request.Request(
    'https://api.github.com/repos/tourhabk-ui/pos/issues/20/comments',
    data=data,
    headers={'Authorization': 'token ' + token, 'Content-Type': 'application/json'}
)
urllib.request.urlopen(req)
print(body)
print('Posted to issue #20')
ENDPY
