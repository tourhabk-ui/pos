name: Probe — снять содержимое внешних URL с раннера

# Из контейнера разработки внешний интернет закрыт (WebFetch 403 на все
# хосты), а раннер GitHub Actions ходит свободно. Этот workflow — «глаза»:
# скачивает указанные URL и печатает начало содержимого в лог, чтобы можно
# было писать парсеры по реальным данным, а не по догадкам. Ничего не пишет
# ни в БД, ни в репозиторий.

# Запуск: push в main, меняющий .github/triggers/probe-url.json (там же —
# список URL). workflow_dispatch у интеграции недоступен (403).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/probe-url.json'

jobs:
  probe:
    runs-on: ubuntu-latest
    # Щедрый потолок: шаг умеет ЖДАТЬ выката (retries × retryDelay), и десять
    # минут он перерастал молча — прогон 10.08 с двенадцатью повторами по
    # минуте job отменила по собственному таймауту. Отменённая проба выглядит
    # как «что-то сломалось», хотя ломать было нечего: ждать здесь законно.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Fetch and print
        env:
          # Некоторые эндпоинты (например /api/cron/health) требуют CRON_SECRET.
          # Заголовок безопасен для публичных URL — они его игнорируют. Секрет
          # маскируется в логах Actions и не попадает в коммитимый probe-url.json.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # .get: проба может быть только-POST (проба 96 упала на KeyError без 'urls')
          URLS=$(python3 -c "import json; print(' '.join(json.load(open('.github/triggers/probe-url.json')).get('urls', [])))")
          BYTES=$(python3 -c "import json; print(json.load(open('.github/triggers/probe-url.json')).get('bytes', 6000))")
          # Необязательный список строк-маркеров: для каждой печатаем НАЙДЕНО/НЕТ
          # (удобно проверять деплой большого HTML, где нужный текст не в первых
          # байтах — грепаем всё тело, а не только head).
          GREP=$(python3 -c "import json; print('\n'.join(json.load(open('.github/triggers/probe-url.json')).get('grep', [])))")
          # Необязательный User-Agent: важно для главной — она отдаёт разное
          # дерево телефону и десктопу (page.tsx isMobile). Дефолт — VedarProbe.
          # Необязательные счётчики вхождений: «тонкий, но 200 OK» sitemap не
          # должен маскироваться — пустая секция видна нулём, а не отсутствием.
          COUNTS=$(python3 -c "import json; print('\n'.join(json.load(open('.github/triggers/probe-url.json')).get('count', [])))")
          # Маркеры, вокруг которых печатать контекст (см. ниже), и сколько.
          AROUND=$(python3 -c "import json; print('\n'.join(json.load(open('.github/triggers/probe-url.json')).get('around', [])))")
          AROUND_LINES=$(python3 -c "import json; print(json.load(open('.github/triggers/probe-url.json')).get('aroundLines', 8))")
          AROUND_HITS=$(python3 -c "import json; print(json.load(open('.github/triggers/probe-url.json')).get('aroundHits', 2))")
          UA=$(python3 -c "import json; print(json.load(open('.github/triggers/probe-url.json')).get('ua', 'Mozilla/5.0 (compatible; VedarProbe/1.0)'))")
          # Необязательный таймаут (сек): нужен для длинных серверных прогонов
          # (полный /api/cron/evo идёт ~100 с — дефолтные 60 обрубали бы его).
          TIMEOUT=$(python3 -c "import json; print(json.load(open('.github/triggers/probe-url.json')).get('timeout', 60))")
          # Диапазон байт и Origin: нужны, чтобы проверить путь ЧТЕНИЯ карты, а
          # не только её наличие. PMTiles читается кусками, и «файл отдаётся»
          # ничего не говорит о том, отдаётся ли КУСОК: 200 вместо 206 значит,
          # что браузер получит 92 МБ на каждый чих. Origin проверяет вторую
          # половину — открыты ли заголовки, по которым решается докачка.
          RANGE=$(python3 -c "import json; print(json.load(open('.github/triggers/probe-url.json')).get('range', ''))")
          ORIGIN=$(python3 -c "import json; print(json.load(open('.github/triggers/probe-url.json')).get('origin', ''))")
          # Повтор при 404/502/000: проба сразу после мержа обгоняет сборку
          # Timeweb и снимает СТАРЫЙ прод. Так уже вышло 10.08 с переписью
          # вердиктов — 404 через 17 секунд после пуша. Ждать «на глаз» перед
          # пушем ненадёжно: время сборки не постоянно. Дефолт 0 — поведение
          # прежних проб не меняется.
          RETRIES=$(python3 -c "import json; print(json.load(open('.github/triggers/probe-url.json')).get('retries', 0))")
          RETRY_DELAY=$(python3 -c "import json; print(json.load(open('.github/triggers/probe-url.json')).get('retryDelay', 60))")
          # Маркер нового кода. Повтора по коду ответа мало: роут, который
          # существовал и ДО правки, отвечает 200 сразу — со старым кодом.
          # Так вышло 10.08 с переписью вердиктов: проба вернула прошлые
          # цифры за 2 секунды, и стухший ответ выглядел точно как свежий.
          # `until` — строка, которой в старом ответе быть не может; пока её
          # нет, ждём так же, как ждали бы 404. Пусто — проверки нет.
          UNTIL=$(python3 -c "import json; print(json.load(open('.github/triggers/probe-url.json')).get('until', ''))")
          # Осознанное разрешение читать несвежее. Нужно ровно там, где 404 —
          # и есть искомый ответ: проба «роут точно удалён?» законна. Во всех
          # прочих случаях исчерпанные повторы — отказ пробы, а не её успех.
          ALLOW_STALE=$(python3 -c "import json; print('yes' if json.load(open('.github/triggers/probe-url.json')).get('allowStale') else 'no')")
          # Именно if, а не `[ ... ] && ...`: шаг идёт под `bash -e`, и
          # неуспешная проверка как последняя команда строки убила бы прогон,
          # когда поля просто не заданы.
          # Заголовки из конфига — для чужих API, которые без них не отвечают
          # (песочница Точки требует Authorization с ОПУБЛИКОВАННЫМ тестовым
          # токеном). Значения берутся ИЗ ФАЙЛА КОНФИГА, то есть из репозитория,
          # и никогда из секретов GitHub: сюда физически нечему утечь. Правило
          # CRON_SECRET этим не ослабляется — оно по-прежнему решает по адресу,
          # отдельно и ниже. Класть в этот список настоящий ключ нельзя: файл
          # публичный, и он останется в истории.
          HEADERS=$(python3 -c "import json; print('\n'.join(json.load(open('.github/triggers/probe-url.json')).get('headers', [])))")

          EXTRA=()
          if [ -n "$RANGE" ];  then EXTRA+=(-r "$RANGE"); fi
          if [ -n "$ORIGIN" ]; then EXTRA+=(-H "Origin: $ORIGIN"); fi
          # Отдельным списком, а не в EXTRA: range и origin осмысленны только
          # для GET, а заголовок авторизации нужен обоим методам.
          HDR=()
          if [ -n "$HEADERS" ]; then
            while IFS= read -r h; do
              [ -z "$h" ] && continue
              HDR+=(-H "$h")
              echo "  заголовок из конфига: ${h%%:*}"
            done <<< "$HEADERS"
          fi
          echo "UA: $UA · timeout: ${TIMEOUT}s${RANGE:+ · range: $RANGE}${ORIGIN:+ · origin: $ORIGIN}"

          # Маркер свежести без повторов — конфигурация, бессмысленная по
          # построению: ждать появления маркера нечем, и проба снимет ответ
          # мгновенно, будто ожидания и не просили.
          #
          # Проба 103 ушла именно такой. Файл конфига один на всех, его
          # правят две сессии, и он был собран правкой ЧУЖОГО содержимого:
          # `retries` в нём просто не оказалось. Молчаливый дефолт 0 превратил
          # «жди выката до двенадцати минут» в «спроси и сразу сдайся».
          if [ -n "$UNTIL" ] && [ "${RETRIES:-0}" -lt 1 ]; then
            echo "ПРОБА НЕ УДАЛАСЬ: задан маркер свежести «$UNTIL», но retries=${RETRIES:-0}."
            echo "Ждать появления маркера нечем — либо укажи retries, либо убери until."
            exit 1
          fi

          # ────────────────────────────────────────────────────────────────
          # Одно правило запроса и одно правило отчёта — на GET и на POST.
          #
          # До 22.08 ожидание выката и разбор маркеров жили ТОЛЬКО в GET-ветке,
          # а POST бил один раз и печатал голое тело. Проба 99 (сухой прогон
          # уборки партнёров) ушла сразу после мержа, сняла 404 у роута, который
          # ещё не собрался, — и job отчиталась «success». То есть проба,
          # получившая страницу «не найдено» вместо ответа, выглядела удачной,
          # а объявленные ей маркеры («dry_run», «deleted_count») не проверялись
          # вовсе. Ровно тот дефект, который правило §4.0 запрещает в коде:
          # у проверки не было исхода «не смог».
          # ────────────────────────────────────────────────────────────────

          # Запрос. CRON_SECRET — ТОЛЬКО своим крон-роутам, детерминированно по
          # адресу. Конфиг-флаг auth (утро 08.08) провалился в тот же день:
          # смешанная проба health+чужой-URL ушла с дефолтным auth=true, и
          # секрет уехал на сторонний хост. Правило, зависящее от дисциплины
          # заполняющего конфиг, — не защита; проверка адреса — защита.
          # Адрес сужен с домена до /api/cron/ (09.08): секрет нужен только там.
          do_request() {
            local method="$1" url="$2"
            local auth=()
            case "$url" in
              https://vedarai.ru/api/cron/*) auth=(-H "Authorization: Bearer ${CRON_SECRET}");;
            esac
            if [ "$method" = POST ]; then
              CODE=$(curl -sL -o /tmp/body -D /tmp/headers -w '%{http_code}' --max-time "$TIMEOUT" -A "$UA" \
                ${HDR[@]+"${HDR[@]}"} ${auth[@]+"${auth[@]}"} -H "Content-Type: application/json" \
                -X POST --data-binary @/tmp/postbody.json "$url" || echo 000)
            else
              CODE=$(curl -sL -o /tmp/body -D /tmp/headers -w '%{http_code}' --max-time "$TIMEOUT" -A "$UA" \
                ${EXTRA[@]+"${EXTRA[@]}"} ${HDR[@]+"${HDR[@]}"} ${auth[@]+"${auth[@]}"} "$url" || echo 000)
            fi
          }

          # Ожидание выката. Третий аргумент — «этот запрос датчик свежести»:
          # маркер `until` спрашивается только у него (см. ниже, почему не у всех).
          fetch_waiting() {
            local method="$1" url="$2" sensor="$3"
            attempt=0
            while : ; do
              do_request "$method" "$url"
              # Повторяем только «ещё не выкатилось»: 404 на новом роуте, 502
              # на перезапускающемся контейнере, 000 на оборванном соединении.
              # 401 и 500 — ответы работающего кода, их повторять незачем.
              STALE=""
              case "$CODE" in
                404|502|503|000) STALE="код $CODE";;
                *)
                  # Ответ есть, но кода правки в нём ещё нет — значит отвечает
                  # прежняя сборка. Ждём так же, как ждали бы отсутствия роута.
                  if [ -n "$UNTIL" ] && [ "$sensor" = 1 ] && ! grep -qF -- "$UNTIL" /tmp/body; then
                    STALE="нет маркера «$UNTIL»"
                  fi;;
              esac
              [ -z "$STALE" ] && break
              # Повторы кончились — это ТРЕТИЙ исход: «не смог снять», а не
              # «снял». Запоминаем, чтобы job покраснела в конце (см. хвост
              # шага): проба 99 отчиталась «success», прочитав страницу «не
              # найдено», и её пустоту пришлось замечать глазами.
              [ "$attempt" -ge "$RETRIES" ] && { echo "  СТАРЫЙ ОТВЕТ: $STALE — попытки кончились, ниже данные ПРЕЖНЕЙ сборки"; STALE_END="${STALE_END}${STALE_END:+; }$method $url: $STALE"; break; }
              attempt=$((attempt+1))
              echo "  $STALE — попытка $attempt из $RETRIES, ждём ${RETRY_DELAY}с (похоже, выкат ещё идёт)"
              sleep "$RETRY_DELAY"
            done
          }

          # Отчёт по снятому телу — общий для обоих методов.
          report_body() {
            echo "HTTP: $CODE | bytes: $(wc -c < /tmp/body) | попыток: $((attempt+1))"
            # Заголовки ответа: часть поведения задаётся не нашим кодом, а
            # прокси перед ним. Например Permissions-Policy может выключить
            # геолокацию на всём сайте, и по телу страницы этого не увидеть.
            if [ -s /tmp/headers ]; then
              echo "── заголовки ──"
              grep -iE '^(HTTP/|permissions-policy|feature-policy|content-security-policy|x-frame-options|strict-transport|server|cache-control|content-range|content-length|accept-ranges|etag|age|x-cache|x-cached|access-control-):' /tmp/headers | cut -c1-300
            fi
            if [ -n "$GREP" ]; then
              echo "── маркеры ──"
              while IFS= read -r marker; do
                [ -z "$marker" ] && continue
                if grep -qF -- "$marker" /tmp/body; then
                  echo "  НАЙДЕНО: $marker"
                else
                  echo "  НЕТ:     $marker"
                fi
              done <<< "$GREP"
            fi
            if [ -n "$COUNTS" ]; then
              echo "── счётчики ──"
              while IFS= read -r c; do
                [ -z "$c" ] && continue
                echo "  $c: $(grep -o -F -- "$c" /tmp/body | wc -l)"
              done <<< "$COUNTS"
            fi
            # Необязательный контекст вокруг маркера. Начало файла бесполезно,
            # когда нужное лежит в середине: страница KVERT на 244 КБ начинается
            # тремя экранами счётчика Яндекса, а коды вулканов — глубоко внутри.
            # Просить больше байт с начала значит листать boilerplate; здесь
            # печатаются строки ВОКРУГ совпадения.
            if [ -n "$AROUND" ]; then
              echo "── контекст вокруг маркеров ──"
              while IFS= read -r a; do
                [ -z "$a" ] && continue
                echo "  ── $a ──"
                # Разбиваем на строки и режем длину: одна минифицированная
                # строка (HTML или JSON) способна занять весь лог целиком.
                #
                # Здесь был `tr '>' '>\n'`, и он не делал НИЧЕГО: tr заменяет
                # символ на символ и не умеет расширять один в два, лишний
                # символ SET2 просто отбрасывается. Разбиения не происходило,
                # grep находил всю простыню одной строкой, cut отрезал первые
                # двести знаков — и «контекст вокруг маркера» показывал начало
                # файла, то есть ровно то, что и без него видно. Сломанный
                # инструмент молчал и выглядел работающим (проба 47).
                #
                # sed умеет вставлять перевод строки. По '>' — для HTML, по
                # запятой — для JSON: у ответа аудита нет ни одного '>' на
                # двенадцать килобайт, и без запятой он остаётся простынёй.
                sed 's/>/>\n/g; s/,/,\n/g' < /tmp/body | grep -m "$AROUND_HITS" -A "$AROUND_LINES" -F -- "$a" | cut -c1-200 || echo "  (не найдено)"
              done <<< "$AROUND"
            fi
            echo "── первые ${BYTES} байт ──"
            # fold: канал чтения логов (get_job_logs) режет строки длиннее
            # ~10 КБ, и 40-килобайтный JSON среза приходил на четверть —
            # проба 94 отдала 17 мест из 60, хотя раннер напечатал все.
            # Перенос по 3000 байт ничего не теряет: читатель склеивает
            # строки между разделителями обратно.
            head -c "${BYTES}" /tmp/body | tr -d '\r' | fold -b -w 3000
            echo ""
          }
          # Маркер свежести проверяется ТОЛЬКО у первого URL.
          #
          # Прежде он применялся ко всем, и это стоило прогонам десятки минут
          # впустую: маркер — признак КОНКРЕТНОЙ правки, и остальные эндпоинты
          # его не содержат по построению. Каждый из них честно ждал появления
          # чужого поля, сжигал все повторы и печатал «СТАРЫЙ ОТВЕТ» на вполне
          # свежих данных. Проба 41 на этом перевалила за потолок job: три URL
          # по двадцать повторов дают сорок пять минут при потолке в сорок.
          #
          # Первый URL — датчик: он доказывает, что новая сборка отвечает.
          # После этого остальные читаются как свежие, потому что они читаются
          # ПОСЛЕ, из той же сборки.
          # Маркер свежести проверяется ТОЛЬКО у ПЕРВОГО запроса прогона.
          #
          # Прежде он применялся ко всем, и это стоило прогонам десятки минут
          # впустую: маркер — признак КОНКРЕТНОЙ правки, и остальные эндпоинты
          # его не содержат по построению. Каждый из них честно ждал появления
          # чужого поля, сжигал все повторы и печатал «СТАРЫЙ ОТВЕТ» на вполне
          # свежих данных. Проба 41 на этом перевалила за потолок job: три URL
          # по двадцать повторов дают сорок пять минут при потолке в сорок.
          #
          # Первый запрос — датчик: он доказывает, что новая сборка отвечает.
          # После этого остальные читаются как свежие, потому что они читаются
          # ПОСЛЕ, из той же сборки. Датчиком может оказаться и POST — у пробы
          # 99 GET-адресов не было вовсе.
          # Отказ ОСТАНАВЛИВАЕТ прогон, а не откладывает вывод до конца.
          #
          # Проба 103: снос строк вернул 404 (роут не выкатился), проба это
          # заметила — и всё равно пошла дальше и выполнила СЛЕДУЮЩИЙ шаг,
          # необратимую уборку партнёров с confirm. Ущерба не вышло, но
          # порядок негодный: действие пошло после отказа своей предпосылки.
          # Шаги пробы идут в заданном порядке именно потому, что зависят
          # друг от друга; «снять не смог, но продолжу» — это то же самое
          # молчаливое согласие, ради отлова которого писан весь этот день.
          stop_if_stale() {
            [ -n "$STALE_END" ] || return 0
            [ "$ALLOW_STALE" = yes ] && return 0
            echo "  ОСТАНОВ: предпосылка не снята, дальнейшие запросы пропущены"
            return 1
          }

          idx=0
          for u in $URLS; do
            echo "════════════════════════════════════════════════"
            echo "URL: $u"
            if [ "$idx" -eq 0 ]; then fetch_waiting GET "$u" 1; else fetch_waiting GET "$u" 0; fi
            report_body
            idx=$((idx+1))
            stop_if_stale || break
          done

          # Необязательные POST-пробы (приёмка MCP 08.08: tools/call руками из
          # раннера — JSON-RPC не проверить GET-ом). Формат в probe-url.json:
          #   "post": [{"url": "...", "body": {...}}]
          N=$(python3 -c "import json; print(len(json.load(open('.github/triggers/probe-url.json')).get('post', [])))")
          for i in $(seq 0 $((N-1))); do
            # POST-шаги чаще всего меняют данные. Если предыдущий запрос не
            # снялся, следующий не пускаем ВООБЩЕ — до запроса, а не после.
            stop_if_stale || break
            PURL=$(python3 -c "import json; print(json.load(open('.github/triggers/probe-url.json'))['post'][$i]['url'])")
            python3 -c "import json; print(json.dumps(json.load(open('.github/triggers/probe-url.json'))['post'][$i].get('body', {})))" > /tmp/postbody.json
            echo "════════════════════════════════════════════════"
            echo "POST: $PURL"
            if [ "$idx" -eq 0 ]; then fetch_waiting POST "$PURL" 1; else fetch_waiting POST "$PURL" 0; fi
            report_body
            idx=$((idx+1))
            stop_if_stale || break
          done

          # Хвост: проба, дочитавшая ПРЕЖНЮЮ сборку, — не удачная проба.
          # Зелёный джоб над страницей «не найдено» опаснее красного: он врёт
          # ровно в ту сторону, в какую удобно поверить.
          if [ -n "$STALE_END" ] && [ "$ALLOW_STALE" != yes ]; then
            echo "════════════════════════════════════════════════"
            echo "ПРОБА НЕ УДАЛАСЬ: $STALE_END"
            echo "Данные выше — прежней сборки, читать их как ответ нельзя."
            echo "Если несвежесть и есть искомый ответ — \"allowStale\": true."
            exit 1
          fi
