name: Cron — Health Check (здоровье системы)

on:
  schedule:
    - cron: '20 * * * *'  # каждый час в :20 — AI-провайдеры, БД, платежи
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: System health check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET не задан в секретах репозитория — эндпоинт не вызван, прогон не состоялся"; exit 1; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/health")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
