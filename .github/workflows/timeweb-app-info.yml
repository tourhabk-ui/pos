name: Настройки приложения Timeweb (вручную)

# Зачем этот workflow существует.
#
# 16.08 прод встал: Timeweb успешно собирает и поднимает контейнер, но берёт
# revision восемнадцатичасовой давности. Все звенья со стороны GitHub
# проверены и исправны — приложение установлено, доступ к репозиторию есть,
# права на хуки есть. Осталось неизвестным ровно одно: к какому репозиторию
# и КАКОЙ ВЕТКЕ привязано само приложение и включён ли у него автодеплой.
#
# В `deploy.yml` записано «auto-deploy включён (is_auto_deploy: true)», но это
# КОММЕНТАРИЙ, а не проверенный факт: он мог устареть, как устарело в этом
# репозитории многое другое. Спросить надо у API.
#
# Токен для этого уже есть в секретах Actions (им пользуется deploy.yml), и
# выносить его на чью-то машину незачем: разовый запрос делается здесь.
#
# Инструмент разбора, а не наблюдение: без расписания. Второй запуск — по
# маркеру (10.09, #1762): агент из песочницы не может дёрнуть
# workflow_dispatch (403 без actions:write), а вопрос «есть ли у сборки
# переменная с SHA коммита» возник ровно тогда, когда ответ нужен был из
# API, а не из чьей-то памяти о панели. Тот же приём, что у
# timeweb-deploy-logs.yml.
#
# READ-ONLY: один GET, ничего не запускает и не меняет.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/timeweb-app-info.json'

# Токен GitHub здесь не нужен ВООБЩЕ: один GET к API Timeweb своим токеном,
# без checkout и без обращений к репозиторию.
permissions: {}

jobs:
  info:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Спросить настройки приложения
        env:
          TIMEWEB_TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
        run: |
          APP_ID="198048"

          # Cron-workflow при отсутствии секрета выходят с нулём — пропущенная
          # задача лучше красного прогона. Здесь наоборот: молчаливый успех
          # означал бы «посмотрели и всё хорошо», хотя не посмотрели вовсе.
          if [ -z "$TIMEWEB_TOKEN" ]; then
            echo "::error::TIMEWEB_TOKEN не задан в секретах репозитория — спросить нечего."
            exit 1
          fi

          HTTP=$(curl -sS -o /tmp/app.json -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer $TIMEWEB_TOKEN" \
            "https://api.timeweb.cloud/api/v1/apps/$APP_ID") || HTTP="000"

          echo "HTTP $HTTP"

          if [ "$HTTP" != "200" ]; then
            echo "::error::API Timeweb ответил $HTTP."
            exit 1
          fi

          # Печатается БЕЛЫЙ СПИСОК полей, а не весь ответ.
          #
          # В настройках приложения живут переменные окружения — там пароль
          # базы, JWT-секрет, ключи провайдеров. Лог прогона видят все, у кого
          # есть доступ к репозиторию, и хранится он по политике Actions.
          # Вывести ответ целиком «на всякий случай» значило бы разложить
          # секреты прода в общедоступный лог ради одного поля про ветку.
          #
          # Поэтому: перечисляем то, что спрашиваем, и ничего сверх того.
          # Если понадобится новое поле — добавить сюда осознанно.
          python3 - <<'PY'
          import json

          with open('/tmp/app.json') as f:
              app = (json.load(f) or {}).get('app') or {}

          FIELDS = [
              'id', 'name', 'status', 'type', 'framework',
              'provider', 'repository', 'repository_id', 'repository_url',
              'branch_name', 'branch', 'is_auto_deploy',
              'commit_sha', 'last_commit_sha',
              'build_cmd', 'run_cmd', 'index_dir',
              'created_at', 'updated_at',
          ]

          print('Настройки приложения (только запрошенные поля):')
          shown = 0
          for key in FIELDS:
              if key in app:
                  print(f'  {key}: {app[key]!r}')
                  shown += 1

          if shown == 0:
              print('  ни одно из ожидаемых полей не найдено')

          # Имена ОСТАЛЬНЫХ полей — без значений. Они подскажут, где искать
          # привязку, если API называет её иначе, и при этом ничего не
          # раскроют.
          rest = sorted(k for k in app if k not in FIELDS)
          if rest:
              print('')
              print('Прочие поля ответа (только имена, значения не выводятся):')
              print('  ' + ', '.join(rest))

          # Переменные окружения приложения — ТОЛЬКО ИМЕНА и только те, что
          # похожи на коммит/сборку (#1762: есть ли у сборки переменная с SHA).
          # Значения не печатаются никогда: среди них пароль базы и ключи.
          # Имена прочих переменных тоже не нужны — репозиторий публичный, и
          # перечень интеграций прода в логе Actions никому не полагается.
          # Форма поля envs заранее неизвестна (словарь или список записей),
          # поэтому разбираются обе, а неизвестная называется вслух.
          envs = app.get('envs')
          if isinstance(envs, dict):
              names = sorted(str(k) for k in envs)
          elif isinstance(envs, list):
              names = sorted(
                  str(e.get('key') or e.get('name') or '')
                  for e in envs if isinstance(e, dict)
              )
          else:
              names = None
          print('')
          if names is None:
              print(f'Переменные окружения: поле envs имеет неожиданную форму ({type(envs).__name__}) — не разобрано.')
          else:
              import re
              hit = [n for n in names if n and re.search(r'commit|sha|git|rev|build|version', n, re.I)]
              print(f'Переменные окружения: всего {len(names)}; похожих на коммит/сборку: {len(hit)}')
              if hit:
                  print('  ' + ', '.join(hit))
              else:
                  print('  ни одной — переменной с SHA коммита в настройках приложения нет')
          PY
