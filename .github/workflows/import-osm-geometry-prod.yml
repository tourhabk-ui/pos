name: Data — OSM Geometry via prod (обход файрвола БД Timeweb)

# Прогон импорта GPS-треков из OSM через прод-эндпоинт /api/cron/osm-import.
#
# Почему через прод: три прогона import-osm-geometry.yml с GitHub-раннера
# упали по connection timeout — файрвол managed PostgreSQL Timeweb не пускает
# внешние IP. Прод-сервер видит БД нативно, поэтому раннер лишь дёргает
# эндпоинт партиями (паттерн cron-kvert-acc.yml).
#
# Два способа запуска:
#   1. workflow_dispatch — кнопка Run workflow (входы dry_run/batch_limit).
#   2. push в main, меняющий .github/triggers/osm-import-prod.json — параметры
#      из этого файла (у Claude-интеграции нет actions:write, а мерж PR есть).
#
# Логика цикла:
#   - Сначала ждём деплой: probe без авторизации — 401 значит эндпоинт
#     задеплоен, 404 значит крутится старый билд (Timeweb собирает ~10 мин).
#   - dry_run=true — одна партия и выход (проверка достижимости Overpass с прода).
#   - dry_run=false — партии до remaining=0 или processed=0. offset двигается
#     на (processed - imported): маршруты без трека в OSM (skipped/error)
#     остаются с geometry IS NULL и без сдвига зациклили бы перебор.
#
# Требует secret CRON_SECRET (тот же, что у остальных крон-джобов).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (одна партия, без записи в БД)'
        required: false
        default: true
        type: boolean
      batch_limit:
        description: 'Маршрутов на партию (1-10)'
        required: false
        default: '8'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/triggers/osm-import-prod.json'

jobs:
  import-osm-via-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Run import through prod endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 1; fi

          if [ "${{ github.event_name }}" = "push" ]; then
            DRY=$(jq -r '.dry_run' .github/triggers/osm-import-prod.json)
            LIMIT=$(jq -r '.batch_limit' .github/triggers/osm-import-prod.json)
            DRY_BATCHES=$(jq -r '.dry_batches // 1' .github/triggers/osm-import-prod.json)
          else
            DRY="${{ github.event.inputs.dry_run }}"
            LIMIT="${{ github.event.inputs.batch_limit }}"
            DRY_BATCHES=1
          fi
          echo "event=${{ github.event_name }} dry_run=$DRY batch_limit=$LIMIT dry_batches=$DRY_BATCHES"

          BASE="https://vedarai.ru/api/cron/osm-import"

          # Ждём НУЖНЫЙ билд, а не просто живой эндпоинт: старый билд тоже
          # отвечает 401, поэтому в 401-теле новый код несёт маркер v=3
          # (починка битой синтетики + миграция 777 накатываются тем же деплоем).
          # До 30 минут (Docker-сборка Timeweb ~10 мин).
          READY=""
          for i in $(seq 1 30); do
            BODY=$(curl -s --max-time 30 "$BASE" || echo '{}')
            V=$(echo "$BODY" | jq -r '.v // 0' 2>/dev/null || echo 0)
            if [ "$V" = "4" ]; then READY=1; echo "endpoint deployed (401 c v=4 — билд с фильтром слитых)"; break; fi
            echo "нужный билд ещё не задеплоен (v=$V), жду 60с ($i/30)"
            sleep 60
          done
          if [ -z "$READY" ]; then echo "билд с v=4 так и не задеплоился за 30 мин"; exit 1; fi

          TOTAL_IMPORTED=0; TOTAL_SKIPPED=0; TOTAL_ERRORS=0; OFFSET=0; REMAIN="?"
          for i in $(seq 1 80); do
            RESP=$(curl -s --max-time 110 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BASE?limit=$LIMIT&dry_run=$DRY&offset=$OFFSET" || echo '')
            if ! echo "$RESP" | jq -e '.success == true' >/dev/null 2>&1; then
              echo "партия $i упала: $RESP"
              exit 1
            fi
            echo "партия $i: $(echo "$RESP" | jq -c '{offset,imported,skipped,errors,processed,routes_without_geometry,routes_synthetic,remaining_total}')"
            echo "$RESP" | jq -r '.details[] | "  [\(.status)\(if .reason and .reason != "ok" then ": " + .reason else "" end)] \(.title)\(if .pts then " (\(.pts) точек)" else "" end)"'
            echo "$RESP" | jq -r '.error_details[]? | "  ! \(.)"'

            IMP=$(echo "$RESP" | jq -r '.imported')
            SKIP=$(echo "$RESP" | jq -r '.skipped')
            ERRS=$(echo "$RESP" | jq -r '.errors')
            PROC=$(echo "$RESP" | jq -r '.processed')
            # remaining_total = NULL-геометрия + синтетика (пул апгрейда);
            # fallback на старое поле, если вдруг откатились на прежний билд
            REMAIN=$(echo "$RESP" | jq -r '.remaining_total // .routes_without_geometry')
            TOTAL_IMPORTED=$((TOTAL_IMPORTED + IMP))
            TOTAL_SKIPPED=$((TOTAL_SKIPPED + SKIP))
            TOTAL_ERRORS=$((TOTAL_ERRORS + ERRS))

            # Сухой прогон ничего не пишет, поэтому offset двигается на весь
            # processed (в боевом — на processed-imported: импортированные
            # выпадают из пула сами). dry_batches=1 сохраняет прежнее
            # поведение «одна партия и выход»; больше — полная перепись приза.
            if [ "$DRY" = "true" ]; then
              if [ "$i" -ge "$DRY_BATCHES" ] || [ "$PROC" = "0" ]; then echo "dry-run: партии кончились ($i из $DRY_BATCHES)"; break; fi
              OFFSET=$((OFFSET + PROC))
              sleep 5
              continue
            fi
            if [ "$PROC" = "0" ] || [ "$REMAIN" = "0" ]; then break; fi
            OFFSET=$((OFFSET + PROC - IMP))
            sleep 5
          done

          echo "=================================================="
          echo "ИТОГО: imported=$TOTAL_IMPORTED skipped=$TOTAL_SKIPPED errors=$TOTAL_ERRORS remaining_pool=$REMAIN dry_run=$DRY"
