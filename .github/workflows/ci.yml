name: CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.mts'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'next.config.*'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.mts'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'next.config.*'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: test-jwt-secret-for-ci-only-not-used-in-production
      DATABASE_URL: postgresql://user:password@localhost/test
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: README stats up to date
        run: node scripts/update-readme-stats.mjs --check

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build (Next.js)
        run: npm run build

      # Token gate — семантика каскада из computed styles (редизайн 31.07):
      # после редизайна базовая линия нарушений равна нулю и обязана такой
      # оставаться. Динамические маршруты без БД дают предупреждение, не провал.
      - name: Install Playwright Chromium (token gate)
        run: npx playwright install --with-deps chromium

      - name: Token gate (computed styles)
        run: |
          npx next start -p 3311 &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -sf http://localhost:3311/sos >/dev/null && break; sleep 1; done
          BASE_URL=http://localhost:3311 node scripts/token-gate.mjs
          kill $SERVER_PID

      - name: Run tests
        run: npx vitest run
