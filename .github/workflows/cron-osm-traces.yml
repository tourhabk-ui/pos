name: Cron — OSM Traces Scout (GPS-записи туристов)

# Ежесуточный сбор публичных GPS-треков с openstreetmap.org/traces
# по Камчатке через прод-эндпоинт /api/cron/osm-traces (БД видна только
# проду). Новые треки пишутся скрытыми на ревью, дайджест — в Telegram.
#
# Способы запуска:
#   1. schedule — ежедневно 05:30 UTC (17:30 по Камчатке)
#   2. workflow_dispatch — кнопка Run workflow
#   3. push в main, меняющий .github/triggers/osm-traces.json
#
# Требует secret CRON_SECRET.

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/osm-traces.json'

concurrency:
  group: osm-traces
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Scout (ждём деплой билда с feed_errors)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Билд с BrightData-фоллбэком отвечает полем feed_errors —
          # по нему отличаем свежий деплой от старого (эндпоинт 401 у обоих)
          RESP=""
          for i in $(seq 1 30); do
            RESP=$(curl -s --max-time 180 "https://vedarai.ru/api/cron/osm-traces?secret=${CRON_SECRET}")
            HAS_NEW=$(echo "$RESP" | python3 -c "import json,sys; print('yes' if 'feed_errors' in json.load(sys.stdin) else 'no')" 2>/dev/null || echo "no")
            if [ "$HAS_NEW" = "yes" ]; then
              break
            fi
            echo "probe $i: свежий билд ещё не задеплоен — ждём 60с"
            sleep 60
          done
          echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps({k:d.get(k) for k in ('success','feeds_ok','feed_errors','seen','in_bbox','new_traces','written','linked','errors','duration_ms')}, ensure_ascii=False))" || { echo "$RESP" | head -c 400; exit 1; }
          echo "── Новые треки ──"
          echo "$RESP" | python3 -c "import json,sys; [print(it.get('id'), it.get('title'), f\"{it.get('points')} тчк\", it.get('place') or '') for it in json.load(sys.stdin).get('items', []) if it.get('status') == 'written']"
