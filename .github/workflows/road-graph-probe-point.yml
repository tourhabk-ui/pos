name: Связность до точки (вручную, с параметрами)

# Многоразовая диагностика (владелец 29.08, продолжение
# road-graph-regions-probe.yml). Прямая линия между Петропавловском и Эссо
# не годится для бисекции — она не идёт по настоящей дороге и даёт
# только too_far_from_road на каждой точке, что ничего не говорит о разрыве.
# Нужны РЕАЛЬНЫЕ координаты сёл на трассе (сверенные, не по памяти), и их
# будет несколько подряд — поэтому один воркфлоу с параметрами, а не файл
# на каждое село. to_lat/to_lng редактируются прямо в форме запуска на
# GitHub — новый коммит для каждого села не нужен.
#
# Пуш .github/triggers/road-graph-probe-point.json запускает с дефолтами
# (Мильково) без формы — inputs.* на push-событии пустые, поэтому дефолты
# продублированы в bash через ${VAR:-...}.
#
# version.json печатается первым — иначе disconnected после мержа фикса
# нельзя отличить от «фикс не помог» и «Timeweb ещё не доехал» (владелец 29.08).
#
# READ-ONLY: два GET к нашим публичным эндпоинтам. Секрет не нужен.

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Название точки (для заголовка в логе)'
        required: false
        default: 'Мильково (трасса Р474, 300 км) — после фикса bbox подграфа'
      to_lat:
        description: 'Широта цели'
        required: true
        default: '54.695'
      to_lng:
        description: 'Долгота цели'
        required: true
        default: '158.62'
      from_lat:
        description: 'Широта старта (по умолчанию — Петропавловск)'
        required: false
        default: '53.0195'
      from_lng:
        description: 'Долгота старта'
        required: false
        default: '158.6494'
      mode:
        description: 'Режим (car|foot)'
        required: false
        default: 'car'
  push:
    branches: [main]
    paths:
      - '.github/triggers/road-graph-probe-point.json'

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Запрос связности
        env:
          LABEL: ${{ inputs.label }}
          TO_LAT: ${{ inputs.to_lat }}
          TO_LNG: ${{ inputs.to_lng }}
          FROM_LAT: ${{ inputs.from_lat }}
          FROM_LNG: ${{ inputs.from_lng }}
          MODE: ${{ inputs.mode }}
        run: |
          LABEL="${LABEL:-Мильково (трасса Р474, 300 км) — после фикса bbox подграфа}"
          TO_LAT="${TO_LAT:-54.695}"
          TO_LNG="${TO_LNG:-158.62}"
          FROM_LAT="${FROM_LAT:-53.0195}"
          FROM_LNG="${FROM_LNG:-158.6494}"
          MODE="${MODE:-car}"
          echo "── деплой (public/version.json) ──"
          curl -sS --max-time 15 "https://vedarai.ru/version.json" || echo "(нет version.json)"
          echo
          echo "── ${LABEL} (${FROM_LAT},${FROM_LNG} → ${TO_LAT},${TO_LNG}, mode=${MODE}) ──"
          curl -sS -w '\nHTTP %{http_code} · %{time_total}s\n' --max-time 30 \
            "https://vedarai.ru/api/routing/path?from_lat=${FROM_LAT}&from_lng=${FROM_LNG}&to_lat=${TO_LAT}&to_lng=${TO_LNG}&mode=${MODE}"
