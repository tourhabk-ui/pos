name: Связность до точки (вручную, с параметрами)

# Многоразовая диагностика (владелец 29.08, продолжение
# road-graph-regions-probe.yml). Прямая линия между Петропавловском и Эссо
# не годится для бисекции — она не идёт по настоящей дороге и даёт
# только too_far_from_road на каждой точке, что ничего не говорит о разрыве.
# Нужны РЕАЛЬНЫЕ координаты сёл на трассе (сверенные, не по памяти), и их
# будет несколько подряд — поэтому один воркфлоу с параметрами, а не файл
# на каждое село. to_lat/to_lng редактируются прямо в форме запуска на
# GitHub — новый коммит для каждого села не нужен.
#
# READ-ONLY: один GET к нашему публичному /api/routing/path. Секрет не нужен.

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Название точки (для заголовка в логе)'
        required: false
        default: 'Октябрьский (Усть-Большерецкий район, коса у устья р. Большой)'
      to_lat:
        description: 'Широта цели'
        required: true
        default: '52.663353'
      to_lng:
        description: 'Долгота цели'
        required: true
        default: '156.241899'
      from_lat:
        description: 'Широта старта (по умолчанию — Петропавловск)'
        required: false
        default: '53.0195'
      from_lng:
        description: 'Долгота старта'
        required: false
        default: '158.6494'
      mode:
        description: 'Режим (car|foot)'
        required: false
        default: 'car'

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Запрос связности
        env:
          LABEL: ${{ inputs.label }}
          TO_LAT: ${{ inputs.to_lat }}
          TO_LNG: ${{ inputs.to_lng }}
          FROM_LAT: ${{ inputs.from_lat }}
          FROM_LNG: ${{ inputs.from_lng }}
          MODE: ${{ inputs.mode }}
        run: |
          echo "── ${LABEL} (${FROM_LAT},${FROM_LNG} → ${TO_LAT},${TO_LNG}, mode=${MODE}) ──"
          curl -sS -w '\nHTTP %{http_code} · %{time_total}s\n' --max-time 30 \
            "https://vedarai.ru/api/routing/path?from_lat=${FROM_LAT}&from_lng=${FROM_LNG}&to_lat=${TO_LAT}&to_lng=${TO_LNG}&mode=${MODE}"
