# Одноразовый probe: есть ли рейл иконок в реальном HTML каталога на проде.
# Владелец 07.08: «иконки пропали с карточки туров» (каталог). По коду рейл
# рисуется всегда — снимаем факт с прода, а не гадаем. Удаляется после чтения.
name: catalog-probe
on:
  push:
    branches: [claude/pos-repository-ercvsa]
    paths: ['.github/workflows/catalog-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Снять HTML каталога
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -sSL -A "$UA" --max-time 40 -o /tmp/cat.html -w 'code=%{http_code} size=%{size_download}b\n' "https://vedarai.ru/catalog"
          flat() { tr -d '\n\r' < /tmp/cat.html; }

          echo "=== версия прода ==="
          curl -sS --max-time 15 https://vedarai.ru/version.json || true; echo

          echo "=== карточки туров (ссылки /marketplace/tours/) ==="
          flat | grep -o 'href="/marketplace/tours/[0-9]*"' | sort -u | head -20
          echo "карточек: $(flat | grep -o 'href=\"/marketplace/tours/[0-9]*\"' | sort -u | wc -l)"

          echo "=== рейл иконок: стеклянный контейнер top-3 left-3 ==="
          echo "контейнеров рейла: $(flat | grep -o 'top-3 left-3 z-\[2\]' | wc -l)"

          echo "=== SVG-иконки lucide в разметке ==="
          echo "lucide-svg всего: $(flat | grep -o 'lucide' | wc -l)"
          flat | grep -o 'lucide-[a-z-]*' | sort | uniq -c | sort -rn | head -20

          echo "=== упоминания рыбалки/видов в тексте карточек ==="
          flat | grep -o 'Летн[а-яё]* рыбалка[^<]*' | head -5
          flat | grep -oi 'чавыч[а-яё]*\|нерк[а-яё]*\|кижуч[а-яё]*' | sort | uniq -c | head

          echo "=== title фич (иконки с title=) ==="
          flat | grep -o 'title="[А-Яа-яё]*"' | sort | uniq -c | sort -rn | head -15
