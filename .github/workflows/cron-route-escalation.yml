name: Cron — Route Escalation (маршруты без ответа)

on:
  schedule:
    - cron: '30 */2 * * *'  # каждые 2 часа (смещение 30 мин от support-escalate)
  workflow_dispatch:

jobs:
  route-escalation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Escalate route issues
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/route-escalation")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
