name: Секреты в новых строках

# Аудит перед запуском (22.10): ключи провайдеров лежат в публичной истории
# репозитория, а сканер detect-secrets.sh не звал никто. Хук pre-commit —
# ранний сигнал, но обходится (--no-verify, core.hooksPath у коммитов
# маркеров), а пуш в main и чужой PR не проверял никто.
#
# Здесь проверяются только ДОБАВЛЕННЫЕ строки: PR — от точки ветвления,
# пуш в main — между прежней и новой головой. Фильтра путей нет намеренно:
# ключ кладут и в .md, и в .yml, и в .json. Значение ключа в лог не попадает
# (лог публичен так же, как репозиторий) — только файл, строка и род ключа.
# Шаблоны и разбор — scripts/security/secret-scan.mjs, общий с хуком.
# Сторож: tests/unit/secret-scan.test.ts.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Новые строки без секретов
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node scripts/security/secret-scan.mjs --range "$PR_BASE" "$PR_HEAD" --merge-base --format=github
          else
            node scripts/security/secret-scan.mjs --range "$PUSH_BEFORE" "$PUSH_AFTER" --format=github
          fi
