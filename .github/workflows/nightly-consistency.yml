name: Nightly — не врёт ли тишина

# Проверка не «зелёное ли в CI», а «одно ли говорят каналы».
#
# Платформа рассказывает о турах трижды и по-разному: людям — каталогом,
# поисковикам — картой сайта, ИИ-агентам — llms.txt и протоколом MCP. Источник
# один, код разный, и расхождение между ними НИКОГДА не падает: каждый канал по
# отдельности отвечает 200 и выглядит исправным.
#
# Так уже было дважды, и оба раза нашёл владелец, глазами, спустя недели:
# get_tours отдавал «Туры не найдены» при живых карточках (#1048); карта сайта
# собиралась на билде без базы и несла полсотни ссылок вместо сотен (#1049).
#
# Пороги взяты с ЖИВЫХ значений 10.08, а не с желаемых: сторож, рождённый
# красным, выключают в первую же неделю.
#
# Что здесь НЕ проверяется и не может: компас, пустое состояние экрана, «карта
# сохранена» после очистки кэша ОС, доверие на карточке партнёра. Это глаза и
# руки — docs/manual-field-check.md.

on:
  schedule:
    - cron: '40 4 * * *'   # после ночного smoke, до утреннего дайджеста
  workflow_dispatch:
  # Файл-маркер: правка .github/triggers/nightly-consistency.json в main
  # запускает сверку сейчас. Тот же приём, что у переписи, смоука и разбора
  # находок, и по той же причине: у агента в репозитории нет права
  # actions:write, а проверять починку сторожа, ожидая расписания сутки, —
  # значит проверять её вслепую. Ровно это и вышло 19.08: разбор причины,
  # почему канал mcp молчит, лёг в код через два часа ПОСЛЕ ночного прогона,
  # и без маркера первый ответ пришёл бы только назавтра.
  push:
    branches: [main]
    paths:
      - '.github/triggers/nightly-consistency.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-consistency
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://vedarai.ru
      ALT_DOMAIN: https://tourhab.ru
      # Живое значение 10.08 — 893. Порог с запасом: просадка на сотню бывает
      # штатной (снятие с публикации), падение вдвое — нет.
      MIN_SITEMAP_URLS: '600'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }

      - name: Снять три канала
        run: |
          set -uo pipefail
          curl -s --max-time 60 "$BASE/llms.txt"    -o llms.txt    || true
          curl -s --max-time 60 "$BASE/sitemap.xml" -o sitemap.xml || true
          # Код ответа снимается ОТДЕЛЬНО: `|| true` глушит и сетевой отказ, и
          # пятисотку, а разбор тела их не различает — тело в обоих случаях
          # пустое. Восемь суток issue #1155 повторяла «канал mcp не отдал
          # туров», не называя ни одной из пяти возможных причин.
          #
          # #2362: get_tours отдаёт каталог СТРАНИЦАМИ по 7 туров (#2314: клиент
          # MCP резал длинный ответ), а сверка читала одну первую — и 15 из 22
          # туров числились «в llms есть, в mcp нет» при живом канале. Листаем
          # до последней: число страниц — из хвоста первой («Страница 1 из N»),
          # страницы 2..N дописываются в mcp.json к content первой, для разбора
          # это один ответ. Страница не пришла — это «не смог снять канал», и
          # так и называется (mcp-pages.problem), а не расхождение каналов.
          mcp_page() {
            curl -s --max-time 60 -X POST "$BASE/api/mcp" \
              -H 'Content-Type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":$1,\"method\":\"tools/call\",\"params\":{\"name\":\"get_tours\",\"arguments\":{\"page\":\"$1\"}}}" \
              -o "$2" -w '%{http_code}' || true
          }
          MCP_CODE=$(mcp_page 1 mcp.json)
          echo "MCP HTTP: $MCP_CODE"
          PAGES=$(grep -oE 'Страница 1 из [0-9]+' mcp.json | head -1 | grep -oE '[0-9]+$' || true)
          if [ -n "$PAGES" ] && [ "$PAGES" -gt 1 ]; then
            for P in $(seq 2 "$PAGES"); do
              CODE=$(mcp_page "$P" "mcp-page-$P.json")
              if [ "$CODE" != "200" ] || ! jq -e '.result.content | length > 0' "mcp-page-$P.json" >/dev/null 2>&1; then
                echo "страница $P из $PAGES не получена (HTTP $CODE)" > mcp-pages.problem
                echo "::error::get_tours: $(cat mcp-pages.problem) — канал mcp снят не целиком."
                break
              fi
              jq '.result.content += input.result.content' mcp.json "mcp-page-$P.json" > mcp.merged.json \
                && mv mcp.merged.json mcp.json
            done
            echo "MCP: страниц $PAGES, в mcp.json склеено $(jq '.result.content | length' mcp.json) частей"
          fi
          # Второй домен: интересует КОД ответа, а не тело.
          echo "$(curl -s -o alt.body -w '%{http_code}' --max-time 60 "$ALT_DOMAIN/llms.txt" || echo 000)" > alt.code
          for f in llms.txt sitemap.xml mcp.json; do
            echo "$f: $( [ -s "$f" ] && wc -c < "$f" || echo 0) байт"
          done

      - name: Сверить
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --ignore-scripts
          npx tsx scripts/check-channel-consistency.ts

      # Красное без адресата читать некому. Дедуп по заголовку: свежий прогон
      # дописывается в открытую issue, вторая не заводится.
      - name: Завести issue при расхождении
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE='Каналы видимости разошлись'
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || true)
          BODY=$(printf 'Ночная сверка каналов нашла расхождение.\n\nПрогон: %s\n\n%s\n\nЧто это значит: платформа рассказывает о турах трижды — каталогом, картой сайта и агентам. Расхождение не падает само: каждый канал по отдельности отвечает 200.\n' \
            "$RUN_URL" "$(cat problems.txt 2>/dev/null || echo 'подробности в логе прогона')")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY" || true
          else
            gh label create evo --repo "${{ github.repository }}" --color B4761F --force || true
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --label evo --body "$BODY"
          fi
