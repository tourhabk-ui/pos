name: Diag — прод-диагностика (аудит P0)

# Одноразовая диагностика прода с раннера (аудит 11.07: /catalog 404, /routes
# «0 мест», /operators пусто). Раннер свободно ходит на vedarai.ru.
#
# Методика чистого замера (по решению владельца): fingerprint фронтовых чанков
# главной снимается в начале и в конце — совпал, значит прод не менялся во
# время диагностики и результату можно верить; разошёлся — гоняли по движущейся
# мишени, перезапустить.
#
# Запуск: workflow_dispatch ИЛИ push в main, меняющий .github/triggers/diag-prod.json.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/diag-prod.json'

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Diagnose prod
        env:
          BASE: https://vedarai.ru
        run: |
          set -uo pipefail
          fp() { curl -s --max-time 30 "$BASE/" | grep -o 'src="/_next/static/[^"]*"' | sort | md5sum | cut -d' ' -f1; }

          # v3: ждём деплой SSR-листинга (#457) — признак нового кода: в первом
          # HTML /routes появился ItemList JSON-LD. Если SSR на проде упал
          # (initial=null), признак не появится — тогда после 25 попыток
          # снимаем замер как есть: провал тоже результат.
          for i in $(seq 1 25); do
            N=$(curl -s --max-time 30 "$BASE/routes" | grep -c 'ItemList' || true)
            if [ "${N:-0}" -ge 1 ]; then echo "SSR-деплой доехал (ItemList в /routes, попытка $i)"; break; fi
            echo "деплой ещё не доехал (ItemList=0), жду 60с ($i/25)"; sleep 60
          done

          # Стабилизация: два fingerprint с интервалом 60с.
          FP1=$(fp); echo "fingerprint#1: $FP1"
          sleep 60
          FP2=$(fp); echo "fingerprint#2: $FP2"
          if [ "$FP1" != "$FP2" ]; then
            echo "ВНИМАНИЕ: прод менялся между замерами — жду ещё 3 мин"; sleep 180
            FP1=$(fp); echo "fingerprint#1' (повтор): $FP1"
          fi

          echo ""
          echo "=== Версия прода: пробы недавних эндпоинтов (не-404 = коммит задеплоен) ==="
          probe() { echo "$1 ($2): HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE$1" || echo 000)"; }
          probe /api/cron/places-audit "с #443"
          probe /api/cron/places-dedup "с #448"
          probe /api/cron/places-unmerge "с #450"
          probe /api/agents/rescue-briefing "с #452"

          echo ""
          echo "=== HTTP-коды ключевых страниц (без редиректов | с редиректами -> итоговый URL) ==="
          for p in /catalog /catalog/tours/30 /marketplace/tours/30 /operators /routes /sos; do
            RAW=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE$p" || echo 000)
            EFF=$(curl -s -o /dev/null -w '%{http_code} %{url_effective}' -L --max-time 30 "$BASE$p" || echo 000)
            echo "$p -> $RAW | -L: $EFF"
          done

          echo ""
          echo "=== /api/health (тело целиком; uptime мал = свежий деплой) ==="
          curl -s --max-time 30 "$BASE/api/health" | head -c 4000; echo ""

          echo ""
          echo "=== /api/routes?kind=place&limit=5 (полный JSON) ==="
          curl -s --max-time 60 "$BASE/api/routes?kind=place&limit=5" | python3 -m json.tool --no-ensure-ascii 2>/dev/null | head -200 \
            || curl -s --max-time 60 "$BASE/api/routes?kind=place&limit=5" | head -c 4000

          echo ""
          echo "=== /api/routes?kind=route&limit=5 (полный JSON) ==="
          curl -s --max-time 60 "$BASE/api/routes?kind=route&limit=5" | python3 -m json.tool --no-ensure-ascii 2>/dev/null | head -200 \
            || curl -s --max-time 60 "$BASE/api/routes?kind=route&limit=5" | head -c 4000

          echo ""
          echo "=== SSR-проба /routes: контент в ПЕРВОМ HTML (до гидрации) — замер ПОСЛЕ #457 ==="
          HTML=$(curl -s --max-time 30 "$BASE/routes" || true)
          echo "байт HTML: $(printf %s "$HTML" | wc -c)"
          echo "вхождений «0 природных мест»: $(printf %s "$HTML" | grep -c '0 природных мест' || true)"
          echo "ItemList JSON-LD: $(printf %s "$HTML" | grep -c 'ItemList' || true)"
          echo "ссылок пагинации ?page=: $(printf %s "$HTML" | grep -o 'href="/routes?[^"]*page=[^"]*"' | wc -l)"
          for name in Авачинск Мутновск Курильское Толбачик Налычево Вилючинск; do
            echo "  «$name» в первом HTML: $(printf %s "$HTML" | grep -c "$name" || true)"
          done

          echo ""
          echo "=== SSR-проба deep-link /routes?kind=place&location_type=volcano&page=2 ==="
          DL=$(curl -s --max-time 30 "$BASE/routes?kind=place&location_type=volcano&page=2" || true)
          echo "байт HTML: $(printf %s "$DL" | wc -c); ItemList: $(printf %s "$DL" | grep -c 'ItemList' || true); «вулкан»: $(printf %s "$DL" | grep -ci 'вулкан' || true)"

          echo ""
          echo "=== Проба главной: честные цифры StatsBand (после #458) ==="
          HP=$(curl -s --max-time 30 "$BASE/" || true)
          echo "старый хардкод «778»: $(printf %s "$HP" | grep -c '778' || true) (0 = хардкод умер)"
          echo "старый лейбл «маршрута в базе»: $(printf %s "$HP" | grep -c 'маршрута в базе' || true)"
          echo "новый лейбл «маршрутов в базе»: $(printf %s "$HP" | grep -c 'маршрутов в базе' || true)"
          echo "лейбл «локаций с координатами»: $(printf %s "$HP" | grep -c 'локаций с координатами' || true)"

          echo ""
          echo "=== SSR-проба /operators ==="
          OH=$(curl -s --max-time 30 "$BASE/operators" || true)
          echo "байт HTML: $(printf %s "$OH" | wc -c)"
          echo "ссылок на карточки операторов в первом HTML: $(printf %s "$OH" | grep -o 'href="/operators/[^"]*"' | wc -l)"

          echo ""
          echo "=== SSR-проба /catalog ==="
          CH=$(curl -s --max-time 30 "$BASE/catalog" || true)
          echo "байт HTML: $(printf %s "$CH" | wc -c)"
          echo "ссылок на туры в первом HTML: $(printf %s "$CH" | grep -oE 'href="/(marketplace|catalog)/tours/[^"]*"' | wc -l)"

          echo ""
          echo "=== SSR-проба ДЕТАЛЬНЫХ страниц (периметр шага 3: листинги или листинги+детальные) ==="
          # Реальные id из diag run#1: место «Авачинская сопка», маршрут «5 стройка–Центральный»
          DP=$(curl -s --max-time 30 "$BASE/routes/c0dc11a3-ff21-4e7c-af9d-79163d19a220" || true)
          echo "/routes/<place-id> байт: $(printf %s "$DP" | wc -c); «Авачинск»: $(printf %s "$DP" | grep -c 'Авачинск' || true); «стратовулкан»: $(printf %s "$DP" | grep -c 'стратовулкан' || true)"
          DR=$(curl -s --max-time 30 "$BASE/routes/1f7a560d-c25d-4403-a889-34ebbda70f59" || true)
          echo "/routes/<route-id> байт: $(printf %s "$DR" | wc -c); «стройка»: $(printf %s "$DR" | grep -c 'стройка' || true); «Центральн»: $(printf %s "$DR" | grep -c 'Центральн' || true)"
          PP=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE/places/c0dc11a3-ff21-4e7c-af9d-79163d19a220" || echo 000)
          echo "/places/<place-id> HTTP: $PP"
          if [ "$PP" = "200" ]; then
            PH=$(curl -s --max-time 30 "$BASE/places/c0dc11a3-ff21-4e7c-af9d-79163d19a220" || true)
            echo "/places/<place-id> байт: $(printf %s "$PH" | wc -c); «Авачинск»: $(printf %s "$PH" | grep -c 'Авачинск' || true)"
          fi

          echo ""
          echo "=== Проба tourhab.ru (судьба SOS-SMS-строк «TourHab.ru») ==="
          for u in https://tourhab.ru https://tourhab.ru/routes https://www.tourhab.ru; do
            R=$(curl -s -o /dev/null -w '%{http_code} loc=%{redirect_url}' --max-time 20 "$u" || echo 000)
            E=$(curl -s -o /dev/null -w '%{http_code} %{url_effective}' -L --max-time 20 "$u" || echo 000)
            echo "$u -> $R | -L: $E"
          done

          echo ""
          FP3=$(fp); echo "fingerprint#final: $FP3"
          if [ "$FP1" = "$FP3" ]; then
            echo "СТАБИЛЬНО: прод не менялся за время диагностики — результатам можно верить"
          else
            echo "НЕСТАБИЛЬНО: прод изменился во время диагностики ($FP1 -> $FP3) — ПЕРЕЗАПУСТИТЬ diag"
          fi
