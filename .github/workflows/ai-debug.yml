name: Diag — AI waterfall

# Диагностика AI-конвейера с раннера: /api/ai/debug-waterfall показывает,
# какой провайдер отвечает с IP Timeweb, а какой падает (ключ/geo/лимит).
# Запуск: правка .github/triggers/ai-debug.json в main.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/ai-debug.json'

jobs:
  debug:
    runs-on: ubuntu-latest
    # 35, а не 10: шаг ожидания деплоя длится до 20 мин, а run 5 (04.09) был
    # снят самим таймаутом задачи на 20-й попытке.
    timeout-minutes: 35
    steps:
      # Маркер уезжает в main вместе с кодом, а деплой Timeweb доезжает
      # минут через 5-10. Проба на старом коде отвечает на вчерашний вопрос
      # (run 4, 04.09: пробовали снятый с эксплуатации id Gemini). Ждём
      # свежего рестарта приложения по uptime из /api/health; не дождались —
      # говорим об этом вслух и пробуем как есть: провал тоже результат.
      - name: Wait for fresh deploy
        env:
          BASE: https://vedarai.ru
        run: |
          # Три исхода, не два: «свежий», «старый» и «uptime не прочитан» —
          # последний показывает тело: run 5 двадцать раз печатал 10^9 вместо
          # признания, что в ответе нет поля uptime.
          # ?deploy=1 обязателен: start.js перехватывает ровно '/api/health'
          # (строгое сравнение req.url) и отвечает {"status":"ok"} ещё до Next —
          # run 6 сорок раз прочитал это тело без uptime. С параметром запрос
          # проходит в Next, и /api/health отдаёт настоящий uptime процесса.
          for i in $(seq 1 40); do
            BODY=$(curl -s --max-time 20 "$BASE/api/health?deploy=1" || true)
            UP=$(printf '%s' "$BODY" | python3 -c 'import json,sys
          try:
              d = json.load(sys.stdin)
              u = d.get("uptime", (d.get("data") or {}).get("uptime") if isinstance(d.get("data"), dict) else None)
              print(int(float(u)) if u is not None else -1)
          except Exception:
              print(-1)' 2>/dev/null || echo -1)
            if [ "$UP" -lt 0 ]; then
              echo "uptime не прочитан (попытка $i/40); тело: $(printf '%s' "$BODY" | head -c 200)"
            elif [ "$UP" -lt 300 ]; then
              echo "свежий рестарт: uptime ${UP}с (попытка $i)"; exit 0
            else
              echo "uptime ${UP}с — деплой ещё не доехал, жду 30с ($i/40)"
            fi
            sleep 30
          done
          echo "ВНИМАНИЕ: свежего рестарта не дождались за 20 мин — проба идёт на том коде, что есть"

      - name: Debug waterfall
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE: https://vedarai.ru
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          curl -H "Authorization: Bearer $CRON_SECRET" -s --max-time 240 "$BASE/api/ai/debug-waterfall" \
            | python3 -m json.tool --no-ensure-ascii || true

      # E2E: живой путь пользователя (виджет → /api/ai/chat → waterfall).
      # Пробы провайдеров выше ходят коротким промптом; этот шаг проверяет
      # полный конвейер с реальным Кузьмич-промптом и RAG-контекстом.
      - name: E2E chat probe
        env:
          BASE: https://vedarai.ru
        run: |
          RESP=$(curl -s --max-time 120 -X POST "$BASE/api/ai/chat" \
            -H 'Content-Type: application/json' \
            -d '{"message":"Расскажи коротко про гору Замок на Камчатке","role":"tourist"}') || true
          echo "$RESP" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception as e:
              print("RAW (not JSON):", sys.stdin.read()[:500]); raise SystemExit(0)
          answer = (d.get("data") or {}).get("answer") or ""
          print("success:", d.get("success"))
          print("answer:", answer[:600])
          if answer.startswith("Извините, сервис временно недоступен"):
              print("VERDICT: FALLBACK — весь waterfall упал на живом запросе")
          elif answer:
              print("VERDICT: OK — конвейер отвечает")
          else:
              print("VERDICT: EMPTY —", json.dumps(d, ensure_ascii=False)[:400])
          '
