name: Diag — AI waterfall

# Диагностика AI-конвейера с раннера: /api/ai/debug-waterfall показывает,
# какой провайдер отвечает с IP Timeweb, а какой падает (ключ/geo/лимит).
# Запуск: правка .github/triggers/ai-debug.json в main.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/ai-debug.json'

jobs:
  debug:
    runs-on: ubuntu-latest
    # 35, а не 10: шаг ожидания деплоя длится до 20 мин, а run 5 (04.09) был
    # снят самим таймаутом задачи на 20-й попытке.
    timeout-minutes: 35
    steps:
      # Ждём НЕ любой рестарт, а сборку, которая новее этого коммита.
      # uptime отвечает «давно ли перезапускались», а спросить надо «тот ли
      # код на проде»: 04.09 два замера подряд поймали деплой предыдущего
      # мержа и молча измерили старый код (run 9 — таймаут ровно 15 с и ни
      # одной новой строки). build_time приходит из next.config.js, то есть
      # ставится в момент сборки образа.
      - name: Wait for fresh deploy
        env:
          BASE: https://vedarai.ru
          NEED_AFTER: ${{ github.event.head_commit.timestamp }}
        run: |
          iso2epoch() { python3 -c 'import sys,datetime
          v=(sys.argv[1] or "").strip()
          try: print(int(datetime.datetime.fromisoformat(v.replace("Z","+00:00")).timestamp()))
          except Exception: print(0)' "$1"; }

          NEED=$(iso2epoch "$NEED_AFTER")
          echo "нужна сборка новее коммита: $NEED_AFTER (epoch $NEED)"

          for i in $(seq 1 50); do
            BODY=$(curl -s --max-time 20 "$BASE/api/health?deploy=1" || true)
            PAIR=$(printf '%s' "$BODY" | python3 -c 'import json,sys,datetime
          try:
              d=json.load(sys.stdin); bt=d.get("build_time"); u=d.get("uptime")
              ts=int(datetime.datetime.fromisoformat(bt.replace("Z","+00:00")).timestamp()) if bt else -1
              print(ts, int(float(u)) if u is not None else -1)
          except Exception: print(-1,-1)' 2>/dev/null || echo "-1 -1")
            BT=${PAIR%% *}; UP=${PAIR##* }
            if [ "$BT" -gt 0 ] && [ "$NEED" -gt 0 ]; then
              if [ "$BT" -ge "$NEED" ]; then echo "своя сборка на проде (build_time $BT >= $NEED, попытка $i)"; exit 0; fi
              echo "на проде сборка старее коммита (build_time $BT < $NEED), жду 30с ($i/50)"
            elif [ "$UP" -ge 0 ] && [ "$UP" -lt 300 ]; then
              echo "build_time не отдан (сборка старше этой правки), но рестарт свежий: uptime ${UP}с (попытка $i)"; exit 0
            else
              echo "ещё не доехало (build_time $BT, uptime $UP), жду 30с ($i/50)"
            fi
            sleep 30
          done
          echo "ВНИМАНИЕ: своей сборки не дождались за 25 мин — прогон идёт на том коде, что есть"

      - name: Debug waterfall
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE: https://vedarai.ru
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          curl -H "Authorization: Bearer $CRON_SECRET" -s --max-time 240 "$BASE/api/ai/debug-waterfall" \
            | python3 -m json.tool --no-ensure-ascii || true

      # E2E: живой путь пользователя (виджет → /api/ai/chat → waterfall).
      # Пробы провайдеров выше ходят коротким промптом; этот шаг проверяет
      # полный конвейер с реальным Кузьмич-промптом и RAG-контекстом.
      - name: E2E chat probe
        env:
          BASE: https://vedarai.ru
        run: |
          RESP=$(curl -s --max-time 120 -X POST "$BASE/api/ai/chat" \
            -H 'Content-Type: application/json' \
            -d '{"message":"Расскажи коротко про гору Замок на Камчатке","role":"tourist"}') || true
          echo "$RESP" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception as e:
              print("RAW (not JSON):", sys.stdin.read()[:500]); raise SystemExit(0)
          answer = (d.get("data") or {}).get("answer") or ""
          print("success:", d.get("success"))
          print("answer:", answer[:600])
          if answer.startswith("Извините, сервис временно недоступен"):
              print("VERDICT: FALLBACK — весь waterfall упал на живом запросе")
          elif answer:
              print("VERDICT: OK — конвейер отвечает")
          else:
              print("VERDICT: EMPTY —", json.dumps(d, ensure_ascii=False)[:400])
          '
