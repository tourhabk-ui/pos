# Разовая перепись: где на самом деле лежит то, что владелец записал 29.08.
#
# Два месяца назад заведены ДВА разных полевых пути, и по словам «форма» и
# «трек» они неотличимы:
#   route_track_imports  — кнопка «Записать трек» на /planning?mode=trail;
#   route_field_checks   — форма полевой проверки /field-check.
# В первой таблице ноль; вторую я не смотрел ни разу. Прежде чем чинить
# дальше, надо знать, куда попала работа человека.
#
# Только чтение. Каждый ответ печатается сырым: «пусто» и «спросить не смог»
# должны быть различимы (§4.0).
#
# Не мержится в main — это разбор, а не расписание.
name: Track deploy probe

on:
  push:
    branches: [track-deploy-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Очередь треков (route_track_imports)
        if: always()
        run: |
          code=$(curl -sS --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            'https://vedarai.ru/api/cron/track-import-queue?status=all' \
            -o out.json -w '%{http_code}' || echo '000')
          echo "HTTP $code"
          cat out.json || echo '(тело пустое)'
          echo

      - name: Очередь полевых проверок (route_field_checks)
        if: always()
        run: |
          code=$(curl -sS --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            'https://vedarai.ru/api/cron/field-check-queue?status=all' \
            -o out.json -w '%{http_code}' || echo '000')
          echo "HTTP $code"
          cat out.json || echo '(тело пустое)'
          echo

      - name: Снимки полевых проверок (route_field_check_photos)
        if: always()
        run: |
          code=$(curl -sS --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            'https://vedarai.ru/api/cron/field-check-photo' \
            -o out.json -w '%{http_code}' || echo '000')
          echo "HTTP $code"
          head -c 4000 out.json || echo '(тело пустое)'
          echo
