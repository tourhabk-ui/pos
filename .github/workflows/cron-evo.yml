name: Cron — Evo System (Growth + Evolution)

# Runs every 6 hours: scans project health, proposes fixes
on:
  schedule:
    # 3× внутри окна скидки DeepSeek off-peak (16:30–00:30 UTC): решатель эволюции
    # (DeepSeek→Qwen) считается по off-peak-тарифу. Сканы дешёвые, кластеризуем в
    # окно ради скидки. Срочная безопасность — на отдельном кроне Watchdog (30 мин),
    # его не трогаем, поэтому больший разрыв в скане здоровья не влияет на SOS.
    - cron: '13 17,20,23 * * *'
  workflow_dispatch:        # manual trigger

# Два прогона Evo не должны идти одновременно: оркестратор пишет в
# evo_growth_scans/evo_agent_state без advisory-лока, и параллельный запуск
# (расписание догнало ручной dispatch) удваивал бы находки и сбивал тормоз
# точности. Не отменяем идущий — второй ждёт своей очереди.
concurrency:
  group: cron-evo
  cancel-in-progress: false

jobs:
  evo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Evo Growth Scan + Evolution Loop
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipping"
            exit 0
          fi

          # 300, а не 180: полный прогон занимает ~145 с, и 03.08 он уже упёрся
          # в лимит (exit 28). Запас в 35 секунд означал, что любой медленный
          # ответ решателя красит крон, хотя скан отработал.
          HTTP=$(curl -s -o /tmp/evo_resp.json -w "%{http_code}" \
            --max-time 300 \
            "https://vedarai.ru/api/cron/evo?type=full" \
            -H "Authorization: Bearer $CRON_SECRET")

          echo "Evo HTTP: $HTTP"
          cat /tmp/evo_resp.json 2>/dev/null || true

          if [ "$HTTP" != "200" ]; then
            echo "Evo Scan failed: HTTP $HTTP"
            exit 1
          fi

          # HTTP 200 означает, что частичные результаты доступны, а не что все
          # стадии успешны. Истину берём из JSON-контракта route.ts.
          if ! jq -e '.success == true and .status == "completed"' /tmp/evo_resp.json >/dev/null 2>&1; then
            STATUS=$(jq -r '.status // "invalid-response"' /tmp/evo_resp.json 2>/dev/null || echo "invalid-response")
            ERRORS=$(jq -c '.errors // []' /tmp/evo_resp.json 2>/dev/null || echo '[]')
            echo "Evo Scan incomplete: status=$STATUS errors=$ERRORS"
            exit 1
          fi

          # Терминальная запись прогона в agent_run_history — часть контракта:
          # прогон без записанного итога не восстановить и не посчитать.
          if jq -e '.run_logged == false' /tmp/evo_resp.json >/dev/null 2>&1; then
            echo "Evo run NOT recorded in agent_run_history — терминальная запись обязательна"
            exit 1
          fi

          echo "Evo Scan OK"
