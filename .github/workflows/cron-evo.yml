name: Cron — Evo System (Growth + Evolution)

# Runs every 6 hours: scans project health, proposes fixes
on:
  schedule:
    # 3× внутри окна скидки DeepSeek off-peak (16:30–00:30 UTC): решатель эволюции
    # (DeepSeek→Qwen) считается по off-peak-тарифу. Сканы дешёвые, кластеризуем в
    # окно ради скидки. Срочная безопасность — на отдельном кроне Watchdog (30 мин),
    # его не трогаем, поэтому больший разрыв в скане здоровья не влияет на SOS.
    - cron: '13 17,20,23 * * *'
  workflow_dispatch:        # manual trigger

# Два прогона Evo не должны идти одновременно: оркестратор пишет в
# evo_growth_scans/evo_agent_state без advisory-лока, и параллельный запуск
# (расписание догнало ручной dispatch) удваивал бы находки и сбивал тормоз
# точности. Не отменяем идущий — второй ждёт своей очереди.
concurrency:
  group: cron-evo
  cancel-in-progress: false

jobs:
  evo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Evo Growth Scan + Evolution Loop
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipping"
            exit 0
          fi

          # ── Терпение вызывающего > собственного бюджета роута ─────────────
          #
          # 03.08 лимит подняли 180 → 300, и это было верно тогда, но создало
          # РАВЕНСТВО: у роута `maxDuration = 300` (app/api/cron/evo/route.ts),
          # и клиент сдавался ровно в ту же секунду, когда серверу ещё только
          # разрешено работать. Запаса не было вообще, и два разных исхода —
          # «сервер не уложился в свой бюджет» и «мы не дождались» — стали
          # неразличимы по построению (аудит 30.08, находка E-1).
          #
          # Замер: прогоны 366-369 занимали 7-180 с, прогоны 370-373 — ровно
          # 300+ с с exit 28. Это стена таймаута, а не рост нагрузки.
          #
          # 330 даёт тридцать секунд сверх серверного потолка. Теперь молчание
          # клиента значит именно «сервер не вернул ответа, исчерпав СВОИ 300»,
          # а не «мы не дождались того, что ещё шло».
          #
          # Почему НЕ `?ack=1`: тот режим отдаёт 202 сразу и заведён под внешние
          # планировщики, рвущие связь за 30 с. Здесь он сделал бы крон
          # вечнозелёным — воркфлоу читает success/status из тела, а 202 их не
          # несёт. Это записано и в шапке самого роута. Замена ложного красного
          # на ложный зелёный по §4.0 строго хуже: красное хотя бы смотрят.
          CURL_RC=0
          HTTP=$(curl -s -o /tmp/evo_resp.json -w "%{http_code}" \
            --max-time 330 \
            "https://vedarai.ru/api/cron/evo?type=full" \
            -H "Authorization: Bearer $CRON_SECRET") || CURL_RC=$?

          # Шаг идёт под `bash -e`: до этой правки отказ curl убивал скрипт
          # МОЛЧА, ещё до единой строки вывода. Именно поэтому в логе прогона
          # 373 не было ничего, кроме кода выхода, — отказ не мог назвать себя.
          if [ "$CURL_RC" != "0" ]; then
            if [ "$CURL_RC" = "28" ]; then
              echo "::error::Evo не ответил за 330 с при собственном бюджете роута 300 с. Значит дело НЕ в терпении вызывающего: сервер исчерпал maxDuration и ответа не вернул. Смотреть надо длительность стадий прогона (agent_run_history, kernel_task_id), а не лимиты этого воркфлоу."
            else
              echo "::error::curl отказал с кодом $CURL_RC (не таймаут) — сеть или адрес, тело ответа ниже."
            fi
            cat /tmp/evo_resp.json 2>/dev/null || true
            exit 1
          fi

          echo "Evo HTTP: $HTTP"
          cat /tmp/evo_resp.json 2>/dev/null || true

          if [ "$HTTP" != "200" ]; then
            echo "Evo Scan failed: HTTP $HTTP"
            exit 1
          fi

          # skipped_already_running — concurrency-guard прода отказал НЕ из-за
          # ошибки, а потому что другой живой прогон evo.run уже шёл (задание
          # владельца 28.08, готовит почву под внешний cron поверх нативного
          # расписания). Оркестратор в этом случае НЕ звался — run_logged
          # честно false, и это не «терминальная запись потеряна», а «записи
          # не было и не должно быть».
          if jq -e '.status == "skipped_already_running"' /tmp/evo_resp.json >/dev/null 2>&1; then
            ACTIVE=$(jq -r '.active_task_id // "?"' /tmp/evo_resp.json)
            echo "Evo Scan skipped: другой прогон уже активен (kernel task $ACTIVE) — это не отказ"
            exit 0
          fi

          # HTTP 200 означает, что частичные результаты доступны, а не что все
          # стадии успешны. Истину берём из JSON-контракта route.ts.
          if ! jq -e '.success == true and .status == "completed"' /tmp/evo_resp.json >/dev/null 2>&1; then
            STATUS=$(jq -r '.status // "invalid-response"' /tmp/evo_resp.json 2>/dev/null || echo "invalid-response")
            ERRORS=$(jq -c '.errors // []' /tmp/evo_resp.json 2>/dev/null || echo '[]')
            echo "Evo Scan incomplete: status=$STATUS errors=$ERRORS"
            exit 1
          fi

          # Терминальная запись прогона в agent_run_history — часть контракта:
          # прогон без записанного итога не восстановить и не посчитать.
          if jq -e '.run_logged == false' /tmp/evo_resp.json >/dev/null 2>&1; then
            echo "Evo run NOT recorded in agent_run_history — терминальная запись обязательна"
            exit 1
          fi

          echo "Evo Scan OK"
