name: Weekly Chronicle

# Петля loop engineering, блок Memory/State: прогон собирает смерженные за
# неделю PR и дописывает «Хронику недели» в .claude/MEMORY.md draft-PR'ом
# (уровень L2 — мержит человек).
#
# Расписания нет — снято 15.10 (аудит, находка A27; правило 10.09 «объявленный
# исход без источника»). Воскресный прогон звал платный флагман, а потребителя
# у результата не было: черновики хроники не вливались, .claude/MEMORY.md с
# 29.07 хроникой не пополнялся, из трёх последних прогонов два (15 и 17) —
# failure. Цена каждую неделю, пользы ноль. Ручной вход остался —
# workflow_dispatch и маркер .github/triggers/weekly-chronicle.json. Вернуть
# расписание — решение владельца вместе с тем, кто черновики вливает.
# Сторож: tests/unit/weekly-chronicle-manual.test.ts.

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/weekly-chronicle.json'
  workflow_dispatch:

concurrency:
  group: weekly-chronicle
  cancel-in-progress: false

jobs:
  # То же, что у issue-triage: claude-code-action на push отвечает
  # «Unsupported event type: push», поэтому маркер переводится в
  # workflow_dispatch. Без этого летописец запускался бы
  # маркером вхолостую — красный ран за две секунды и ни строки хроники.
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-fire as workflow_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run weekly-chronicle.yml --repo "$GITHUB_REPOSITORY" --ref main

  chronicle:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    # Учёт расхода руки — отдельной работой usage-books ниже (аудит 15.10,
    # AC-1): ей нужен исход шага руки и путь файла выполнения, названный
    # самим экшеном, — чтобы отличить «рука не дошла до модели» от потери.
    outputs:
      hand_outcome: ${{ steps.hand.outcome }}
      execution_file: ${{ steps.hand.outputs.execution_file }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Collect merged PRs of the week
        id: merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%d)
          gh pr list --state merged --search "merged:>=$SINCE" --limit 100 \
            --json number,title,mergedAt --jq 'sort_by(.mergedAt) | .[] | "#\(.number) \(.title)"' > /tmp/merged.txt
          COUNT=$(wc -l < /tmp/merged.txt)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo 'LIST<<HEREDOC'
            cat /tmp/merged.txt
            echo 'HEREDOC'
          } >> "$GITHUB_OUTPUT"
          echo "Смержено за неделю: $COUNT PR"

      - name: Run Claude chronicler
        id: hand
        if: steps.merged.outputs.count != '0'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          # Ключ Console из репозиторного секрета — решение владельца 13.10:
          # «я пополню лучше баланс», после того как выпуск токена подписки
          # (claude setup-token) с компьютера упёрся в гео-блок claude.ai.
          # Что известно (#2396, пробы 19–22 и документация Anthropic,
          # api-credits-for-subscribers): 238 $ на счету Console — месячные
          # кредиты плана Max, они покрывают API, Agent SDK и playground, но НЕ
          # Claude Code; любой запрос с подписью Claude Code (бета-заголовок
          # claude-code-20250219 или user-agent claude-cli) получал 400 «credit
          # balance is too low», потому что купленного баланса было 0. Купленные
          # кредиты эту дыру закрывают: Claude Code списывает с них, обычные
          # запросы — по-прежнему с месячных. Руки оживают в момент пополнения,
          # без правок; пока баланс не куплен, отказ тот же 400, читать его как
          # «не пополнено», а не «ключ сломан». Токен подписки рядом НЕ держать:
          # отказ должен читаться как «ключ», а не «какой из двух».
          # Сторож: tests/unit/issue-hand-model-pinned.test.ts.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # То же, что у issue-triage: прогон от переводчика инициирует
          # github-actions. Разрешён именно он, не '*'.
          allowed_bots: github-actions
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
            --max-turns 40
          show_full_output: true
          prompt: |
            Ты — летописец кодовой базы Ведар. Раз в неделю ты дописываешь
            короткую «Хронику недели» в .claude/MEMORY.md, чтобы следующие
            рабочие сессии агентов начинали с актуального контекста.

            ══ СМЕРЖЕНО ЗА НЕДЕЛЮ ══
            ${{ steps.merged.outputs.LIST }}

            Задача:
            1. Прочитай .claude/MEMORY.md — пойми его структуру и стиль.
            2. Добавь (или дополни, если раздел уже есть) раздел
               «## Хроника» с подразделом за эту неделю (дата — сегодня):
               3-6 строк СУТИ — что уехало на прод, какие новые конвенции,
               модули или петли появились, что владельцу стоит помнить.
               Группируй по смыслу, не перечисляй PR механически.
               Ссылки на PR — формой #N. Никаких эмодзи.
            3. Старые недели не переписывай. Если хроника длиннее ~10 недель —
               сожми самые старые недели до одной строки каждая.
            4. Ветка + draft-PR:
               git checkout -b claude/chronicle-$(date -u +%Y%m%d)
               git push и gh pr create --draft --title "Хроника недели в MEMORY.md" --body "<1-2 предложения>"

            НИКОГДА не пушь в main. Меняй ТОЛЬКО .claude/MEMORY.md.

      # ── Расход руки — в книги (аудит 15.10, AC-1) ──────────────────────
      # К работе учёта usage-books уезжают ОДНИ СЧЁТЧИКИ, а не файл выполнения.
      # Файл выполнения — полный транскрипт агента: выводы Bash и Read, тексты
      # чужих issues, логи CI. Репозиторий публичный, артефакт скачивает любой
      # пользователь GitHub, а маски секретов в файлах артефакта нет — она есть
      # только в логе. Поэтому выжимка собирается здесь, белым списком полей:
      # тип сообщения, total_cost_usd, modelUsage (четыре счётчика на модель),
      # у ответа модели — id, модель и четыре счётчика usage. Текста, content и
      # tool_use в ней нет; не число на месте числа и не имя на месте имени —
      # null, и учёт назовёт расход неразобранным. Агент может переписать
      # числа — сервер проверит их схемой. Секрета учёта (CRON_SECRET) в этой
      # работе нет и быть не должно: у агента Bash на этом раннере. Отказ
      # выжимки или загрузки не красит руку — потерю назовёт учёт.
      - name: Выжимка расхода руки — одни счётчики
        if: always() && steps.hand.outcome != 'skipped'
        continue-on-error: true
        env:
          HAND_EXECUTION_FILE: ${{ steps.hand.outputs.execution_file }}
        run: |
          src="${HAND_EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          dst="$RUNNER_TEMP/hand-usage/hand-usage.json"
          mkdir -p "$RUNNER_TEMP/hand-usage"
          rm -f "$dst" "$dst.tmp"
          if [ ! -f "$src" ]; then
            echo "Файла выполнения нет — выжимать нечего; что это значит, скажет учёт"
            exit 0
          fi
          if ! jq -c '
            def n: if type == "number" then . else null end;
            def ident: if type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._:@/\\[\\]-]{0,127}$") then . else null end;
            def model_usage: if type == "object" then {inputTokens: (.inputTokens | n), outputTokens: (.outputTokens | n), cacheCreationInputTokens: (.cacheCreationInputTokens | n), cacheReadInputTokens: (.cacheReadInputTokens | n)} else null end;
            def msg_usage: if type == "object" then {input_tokens: (.input_tokens | n), output_tokens: (.output_tokens | n), cache_creation_input_tokens: (.cache_creation_input_tokens | n), cache_read_input_tokens: (.cache_read_input_tokens | n)} else null end;
            if type == "array" then [ .[] | objects |
              if .type == "result" then
                {type: "result", total_cost_usd: (.total_cost_usd | n),
                 modelUsage: (if (.modelUsage | type) == "object" then (.modelUsage | with_entries({key: (.key | ident // ""), value: (.value | model_usage)})) else null end)}
              elif .type == "assistant" and (.message | type) == "object" then
                {type: "assistant", message: {id: (.message.id | ident), model: (.message.model | ident), usage: (.message.usage | msg_usage)}}
              else empty end
            ] else null end
          ' "$src" > "$dst.tmp"; then
            echo "::warning::Файл выполнения руки не выжат: jq его не прочёл — учёт назовёт расход неразобранным"
            echo '{"hands_usage":"unreadable"}' > "$dst.tmp"
          fi
          mv "$dst.tmp" "$dst"

      - name: Счётчики расхода руки — к учёту
        if: always() && steps.hand.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: hand-usage
          path: ${{ runner.temp }}/hand-usage/hand-usage.json
          if-no-files-found: warn
          retention-days: 1
          overwrite: true

  # ── Расход руки — в книги llm_usage_log (аудит 15.10, AC-1) ─────────────
  #
  # Руки считают ключом Anthropic мимо logLLMUsage, и их расход до книг не
  # доходил: дневной бюджет (llm-budget-check) по ним не мог сработать. Здесь
  # выжимка файла выполнения (одни счётчики, собрана в работе руки) разбирается
  # (scripts/hands-usage.mjs), и строки уходят на прод
  # (POST /api/admin/llm-usage/report) с CRON_SECRET. Цену, включая кэш
  # подсказок, считает прод; заявление экшена (total_cost_usd) — в сводку
  # прогона для сверки, в книги не пишется.
  #
  # Отдельная работа на чистом раннере, а не шаг рядом с рукой: CRON_SECRET
  # открывает /api/admin/* на проде (§7), а у агента Bash — шаг после него
  # исполнял бы файл, который агент мог переписать. Скрипт берётся из main,
  # а не из рабочей копии руки. Сторож: tests/unit/llm-usage-reaches-books.test.ts.
  usage-books:
    needs: chronicle
    if: always() && needs.chronicle.outputs.hand_outcome != '' && needs.chronicle.outputs.hand_outcome != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Скрипт учёта из main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: scripts/hands-usage.mjs
          sparse-checkout-cone-mode: false

      # Артефакта нет — экшен файла не оставил, или выжимка либо загрузка не
      # удались; потеря это или «рука не дошла до модели», решает учёт по
      # HAND_EXECUTION_FILE, а не этот шаг.
      - name: Счётчики расхода руки — из работы руки
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: hand-usage
          path: ${{ runner.temp }}/hand

      - name: Расход руки — в книги
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AGENT_ID: weekly-chronicle
          EXECUTION_FILE: ${{ runner.temp }}/hand/hand-usage.json
          HAND_EXECUTION_FILE: ${{ needs.chronicle.outputs.execution_file }}
        run: node scripts/hands-usage.mjs --run
