name: Evo Judge — разбор находок эволюции сильной моделью

# Решатель эволюции живёт на DeepSeek с Qwen на подхвате не потому, что они
# лучше, а потому что api.anthropic.com закрыт по гео из России, где стоит
# прод. Наши кроны — это curl с раннера В прод, то есть модель зовёт сервер в
# РФ, и ключ Anthropic в секретах GitHub делу бы не помог.
#
# Здесь наоборот: находки скачиваются с прода, а модель зовётся С РАННЕРА —
# он вне РФ, гео-блока нет, релей не нужен.
#
# ── Идемпотентность отчёта (задание владельца 27.08) ────────────────────────
#
# `schedule`, marker `push` и ручной запуск разбирают ОДИН И ТОТ ЖЕ прод-
# снимок, доставленный по-разному: планировщик GitHub деградирует и
# доставляет очередь с многочасовым опозданием (27.08 — marker в 09:07,
# запоздавший scheduled той же очереди в 17:38 — вход не изменился ни в чём).
# Раньше это давало ДВА выпуска на один и тот же анализ. Теперь: concurrency
# сериализует публикации, «Prepare & check duplicate» считает отпечаток входа
# ДО модели и останавливается без вызова LLM, если он совпал с каноническим
# Issue (и тот не degraded), а «Publish report» пишет в ОДИН канонический
# Issue на report_key вместо нового выпуска на каждую доставку. Подробности —
# scripts/evo-judge-publish.ts.
#
# Скрипт ничего не чинит и ничего не пишет в базу: он судит и объясняет.
# Финальное решение по находке остаётся за человеком и за Claude Code в репо.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'За сколько дней брать находки'
        required: false
        default: '7'
      force_refresh:
        description: 'Разобрать заново, даже если вход не изменился с прошлого канонического выпуска'
        required: false
        type: boolean
        default: false
  schedule:
    # 06:20 UTC — после ночного Growth Scan, до рабочего дня владельца.
    - cron: '20 6 * * *'
  # Файл-маркер: правка .github/triggers/evo-judge.json в main запускает разбор
  # сейчас. Тот же приём, что у переписи и смоука, и по той же причине: у
  # агента в репозитории нет права actions:write, а ждать расписания сутки,
  # проверяя починку решателя, — значит проверять её вслепую. force_refresh
  # маркера читается из самого файла (поле force_refresh) — факт push сам по
  # себе не означает force, иначе каждый маркер-прогон заново тратил бы токены
  # даже без изменений во входе.
  push:
    branches: [main]
    paths:
      - '.github/triggers/evo-judge.json'

# Один канонический Issue на report_key — значит и публикация должна идти по
# очереди, а не гонкой: schedule, marker push и workflow_dispatch одного дня
# сериализуются здесь, а не в publish-логике. Группа НЕ содержит run_id, event
# или branch — иначе marker и запоздавший schedule снова смогли бы публиковать
# параллельно, что и было исходным отказом.
concurrency:
  group: evo-judge-report-${{ github.repository }}
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      issues: write
    env:
      DAYS: ${{ github.event.inputs.days || '7' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Fetch findings
        env:
          # CRON_SECRET уходит ТОЛЬКО своему крон-роуту на vedarai.ru. Адрес
          # зашит здесь, а не приходит параметром: правило, зависящее от
          # дисциплины заполняющего конфиг, — не защита (урок 08.08).
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          CODE=$(curl -sS -o /tmp/findings.json -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://vedarai.ru/api/cron/evo-issues?days=${DAYS}")
          echo "HTTP: $CODE"
          # Пустой файл при 200 читался бы как «находок нет». Падаем громко.
          if [ "$CODE" != "200" ]; then
            echo "Прод не отдал находки (HTTP $CODE) — разбирать нечего, и это не «чисто»."
            exit 1
          fi
          python3 -c "import json;d=json.load(open('/tmp/findings.json'));print('находок:',len(d.get('issues',[])))"

      # Считает input_hash ДО модели и спрашивает GitHub: есть ли уже
      # канонический Issue этого report_key с тем же входом. Ключа модели тут
      # не нужно вовсе — только GITHUB_TOKEN на чтение.
      - name: Prepare & check duplicate
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISPATCH_FORCE: ${{ github.event.inputs.force_refresh || '' }}
        run: |
          if [ -n "$DISPATCH_FORCE" ]; then
            FORCE="$DISPATCH_FORCE"
          else
            FORCE=$(jq -r '.force_refresh // false' .github/triggers/evo-judge.json 2>/dev/null || echo false)
          fi
          echo "force_refresh=$FORCE"
          FORCE_REFRESH="$FORCE" npx tsx scripts/evo-judge-publish.ts check "$DAYS" /tmp/findings.json /tmp/dedup.json

      # Пропускается, если «Prepare & check duplicate» нашёл тот же вход в
      # НЕ-degraded каноническом Issue: тратить токены не на что.
      - name: Judge with strong model
        if: steps.prepare.outputs.skip_llm != 'true'
        env:
          # Ключи уходят только своим провайдерам — вызов идёт через
          # sanctioned-путь lib/ai/providers (водопад callAIDecisionDetailed),
          # а не сырым fetch: провайдеры остаются в замороженном реестре
          # compliance.
          #
          # OPENROUTER_API_KEY — ПЕРВАЯ ступень водопада. Гео-блок, из-за
          # которого на проде нужен релей, к раннеру не относится — он вне РФ,
          # и openrouter.ai достижим напрямую. Поэтому OPENROUTER_BASE_URL
          # здесь НЕ задаётся: релей тут только добавил бы точку отказа.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Ключ УПРАВЛЕНИЯ — только чтобы спросить счёт (/api/v1/credits).
          OPENROUTER_MANAGEMENT_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          # Сдвиг окна добора теперь берёт scripts/evo-judge.ts сам — УТС-сутки,
          # а не номер прогона. github.run_number раньше сдвигал окно на
          # пустом месте: marker и запоздавший schedule ОДНОГО дня получали
          # разные номера при одном и том же входе, и их input_hash расходился
          # без единого смыслового отличия во входе. EVO_JUDGE_OFFSET здесь
          # намеренно НЕ передаётся — дефолт скрипта самодостаточен.
          EVO_JUDGE_DAYS: ${{ env.DAYS }}
        run: npx tsx scripts/evo-judge.ts /tmp/findings.json /tmp/report.md /tmp/report-meta.json

      # Публикует-или-переиспользует канонический Issue. Если предыдущий шаг
      # был пропущен (тот же вход), report.md/report-meta.json не существуют —
      # publish читает /tmp/dedup.json и завершается без единой мутации
      # GitHub. GITHUB_TOKEN тут даёт ТОЛЬКО issues:write (permissions job'а) —
      # merge и запись кода эта задача не может по построению.
      - name: Publish report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          REPORT=""
          META=""
          [ -f /tmp/report.md ] && REPORT=/tmp/report.md
          [ -f /tmp/report-meta.json ] && META=/tmp/report-meta.json
          npx tsx scripts/evo-judge-publish.ts publish /tmp/dedup.json "$REPORT" "$META" /tmp/publish-result.json

      # Artifacts — история диагностики каждого фактического запуска; Issue —
      # текущая проекция решений. Разные вещи, оба нужны.
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evo-judge-run-${{ github.run_id }}
          path: |
            /tmp/report.md
            /tmp/report-meta.json
            /tmp/dedup.json
            /tmp/publish-result.json
          if-no-files-found: ignore
          retention-days: 30

      # Прогон, разобравший НОЛЬ находок, — это отказ, а не работа.
      #
      # 16, 18 и 19 августа отчёт выходил «41 из 41 не разобрана», а прогон
      # при этом числился успешным. Проверка стоит ПОСЛЕ публикации намеренно:
      # отчёт должен выйти в любом случае, иначе, чиня немоту, мы потеряем и
      # список находок.
      #
      # Пропущенный Judge (тот же вход, канонический Issue уже complete) не
      # обязан проходить эту проверку заново — «Prepare & check duplicate»
      # пропускает LLM ТОЛЬКО когда analysis_status прошлого выпуска НЕ
      # degraded (см. checkDuplicate в scripts/evo-judge-publish.ts): немота
      # никогда не застревает пропуском, она всегда перезапускает разбор.
      - name: Красный, если не разобрано ничего
        run: |
          set -uo pipefail
          if [ ! -f /tmp/report.md ]; then
            echo "Вход не изменился с прошлого КОМПЛЕТНОГО разбора — LLM не вызывался, существующий канонический выпуск уже полон."
            exit 0
          fi
          # Числа берутся из самого отчёта — из того, что прочитает человек,
          # а не из отдельного счётчика, который может с ним разойтись.
          TOTAL=$(grep -oP 'Разобрано находок: \*\*\K[0-9]+' /tmp/report.md || echo 0)
          UNJUDGED=$(grep -oP '^\| не разобрана \| \K[0-9]+' /tmp/report.md || echo 0)
          echo "разобрано: $TOTAL, из них не разобрано: $UNJUDGED"
          if [ "$TOTAL" -gt 0 ] && [ "$TOTAL" = "$UNJUDGED" ]; then
            echo "Решатель не ответил НИ ПО ОДНОЙ находке из $TOTAL."
            echo "Причина — в отчёте: https://github.com/tourhabk-ui/pos/issues?q=is:issue+label:evo-judge-report"
            echo "Чаще всего это отсутствующий ключ: водопад зовёт Anthropic, затем DeepSeek, затем Qwen."
            exit 1
          fi
