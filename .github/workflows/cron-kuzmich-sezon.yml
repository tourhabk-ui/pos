name: Cron Kuzmich Sezon

on:
  schedule:
    - cron: '0 16 * * 2,6'  # 16:00 UTC вт/сб — сезонный пост Кузьмича
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Kuzmich seasonal post
        run: |
          curl -X GET "https://vedarai.ru/api/cron/kuzmich?type=sezon" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions" \
            --max-time 120 \
            --fail
