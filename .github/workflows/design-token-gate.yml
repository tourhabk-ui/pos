name: Design — токен-гейт (цвета вне дизайн-системы)

# Проверка рантайма, а не исходников: страница рендерится в Chromium, снимаются
# вычисленные стили, палитра сверяется с токенами из app/globals.css. Grep по CSS
# этого не заменяет — локальное правило может перекрасить SOS при формально
# «чистых» токенах (теневой --danger внутри .v7 — ровно такой случай).
#
# Почему не проверка на PR: гейту нужно запущенное приложение. Гонять его против
# прода в PR бессмысленно — там ещё нет изменений PR. Поэтому ночью по проду плюс
# ручной запуск; локально то же самое против localhost:3000 (npm run design:tokens).
#
# Секретов не требует: все страницы выборки публичные.

on:
  schedule:
    - cron: '40 4 * * *'  # каждый день в 04:40 UTC, до утреннего разбора
  # Ручной прогон — маркером, как у остальных workflow репозитория: запуск
  # workflow_dispatch из агентной сессии закрыт (403 Resource not accessible by
  # integration, 12.10), а правка маркера в main — обычный пуш.
  push:
    branches: [main]
    paths:
      - '.github/triggers/design-token-gate.json'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Адрес приложения (по умолчанию прод)'
        required: false
        default: 'https://vedarai.ru'

# Токену — только чтение: checkout и запись выката, по которой
# scripts/wait-for-deploy.sh ждёт свою сборку (15.10). Другим шагам
# этого workflow токен не нужен.
permissions:
  contents: read
  deployments: read

jobs:
  token-gate:
    runs-on: ubuntu-latest
    # 80, а не 15: ожидание своей сборки (до 70 мин) плюс Chromium и гейт.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7

      # Маркер едет в main вместе с кодом, а Timeweb собирает образ 5–20 минут:
      # прогон по маркеру без ожидания проверил бы вчерашний прод (сторож
      # marker-waits-for-deploy). Только при запуске маркером: по расписанию и
      # кнопке head_commit пуст, и шаг отсиживал бы зря.
      - name: Wait for fresh deploy
        if: github.event_name == 'push'
        env:
          BASE: https://vedarai.ru
          WANT_SHA: ${{ github.sha }}
          # Запись выката (deploy.yml) читается с токеном — без него ждём по built_at.
          GH_TOKEN: ${{ github.token }}
          NEED_AFTER: ${{ github.event.head_commit.timestamp }}
        run: bash scripts/wait-for-deploy.sh

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Браузер ставит сам извлекатель (dembrandt install-browser) — той версией
      # playwright-core, которую бандлит закреплённый в скрипте dembrandt. До 12.10
      # здесь стоял playwright@1.62.1, а dembrandt@0.26.1 держал playwright-core
      # диапазоном ^1.60.0: диапазон уплыл на 1.64, ревизии Chromium разошлись, и
      # гейт был красным 67 прогонов подряд с диагнозом «приложение недоступно»
      # (#2378). Пин один, в скрипте; своей версии Playwright у workflow нет.
      - name: Chromium под закреплённый dembrandt
        run: node scripts/design-token-gate.mjs --install-browser

      - name: Токен-гейт
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://vedarai.ru' }}
        run: node scripts/design-token-gate.mjs
