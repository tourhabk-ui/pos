name: OpenRouter — какие модели есть на самом деле (с раннера)

# Прод спросить не может: OpenRouter отвечает ему 403 и напрямую, и через
# релей (замер 07.09). Раннер GitHub не в РФ и каталог видит.
#
# Зачем отдельная проба: id модели НЕ ВЫДУМЫВАЮТ. Неверный id — это не «модель
# не отвечает», а тихий отказ на каждом вызове; в CLAUDE.md §8 это правило уже
# записано для решателя эволюции («без привязки к id, спрашивать /v1/models»).
# Здесь то же самое, только для выбора модели Editor'у.
#
# Только чтение каталога: ни одного запроса к модели, ни рубля расхода.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/openrouter-models.json'

permissions:
  contents: read

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Каталог OpenRouter ПУБЛИЧНЫЙ: 200 от него не говорит о ключе ничего.
      # Отчёт судьи 18.09 (#1428) показал `flagship(z-ai/glm-5.3): HTTP 401
      # {"error":{"message":"Missing Authentication header","code":401}}` — и
      # по каталогу нельзя было отличить «наш ключ отвергнут» от «отказ пришёл
      # с маршрута к z.ai». Разница решает, что чинить: секрет репозитория или
      # интеграцию в кабинете OpenRouter.
      #
      # /api/v1/key требует авторизации и не стоит ни одного токена: это и есть
      # разделяющий замер. Наружу печатаются только метаданные ключа (метка,
      # расход, лимит) — ни одного символа самого ключа.
      - name: Ключ жив? (/api/v1/key, без единого токена)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY не задан в секретах — о ключе сказать нечего."
            exit 1
          fi
          CODE=$(curl -sS -o /tmp/key.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            https://openrouter.ai/api/v1/key)
          echo "HTTP: $CODE"
          if [ "$CODE" = "200" ]; then
            python3 - <<'PY'
          import json
          d = json.load(open('/tmp/key.json')).get('data', {}) or {}
          keep = ('label', 'usage', 'limit', 'limit_remaining', 'is_free_tier', 'is_provisioning_key')
          print('КЛЮЧ ПРИНЯТ. Метаданные:', json.dumps({k: d.get(k) for k in keep}, ensure_ascii=False))
          print('Значит 401 на z-ai/glm-5.3 — НЕ про наш ключ: смотреть интеграции (BYOK) в кабинете OpenRouter.')
          PY
          else
            echo "::error::Ключ отвергнут (HTTP $CODE) — вот это и чинится заменой секрета OPENROUTER_API_KEY."
            head -c 400 /tmp/key.json
            echo
            # Форма ключа БЕЗ его содержимого — тот же приём, что у
            # describeOpenRouterKey() для прода. «Ключ отозван» и «ключ вставлен
            # с переводом строки» чинятся по-разному, а по одному 401 они
            # неотличимы: OpenRouter на оба отвечает «Missing Authentication
            # header», потому что заголовок с пробелом внутри для него
            # отсутствует. Ни одного символа ключа наружу: длина, признак
            # ожидаемого начала и флаг пробелов.
            LEN=$(printf '%s' "$OPENROUTER_API_KEY" | wc -c | tr -d ' ')
            case "$OPENROUTER_API_KEY" in
              sk-or-*) PREFIX=да ;;
              *)       PREFIX=НЕТ ;;
            esac
            case "$OPENROUTER_API_KEY" in
              *[[:space:]]*) SPACE=ДА ;;
              *)             SPACE=нет ;;
            esac
            # Чей это ключ ВООБЩЕ. Прогон 4 показал длину 108 без `sk-or-`, а
            # ключи OpenRouter короче и с этим началом всегда. Значит в секрете
            # может лежать ключ другого поставщика — и тогда чинится не
            # выпуском нового, а возвратом ключей по своим местам. Сравниваются
            # только НАЧАЛА известных форм, наружу уходит одно слово.
            case "$OPENROUTER_API_KEY" in
              sk-or-*)   FAMILY="OpenRouter (sk-or-)" ;;
              sk-ant-*)  FAMILY="ANTHROPIC (sk-ant-) — ключ лежит не в своём секрете" ;;
              sk-proj-*) FAMILY="OpenAI project (sk-proj-) — ключ лежит не в своём секрете" ;;
              sk-*)      FAMILY="иной sk-ключ" ;;
              *)         FAMILY="не похож ни на одну известную форму" ;;
            esac
            echo "форма ключа: длина=$LEN, начинается на sk-or-=$PREFIX, пробелы внутри=$SPACE"
            echo "чей ключ по началу: $FAMILY"
            echo "sk-or- и длина около 73 — ключ отозван, нужен новый; иная форма — в секрете лежит чужой ключ."

            # Прогон 5 нашёл здесь ключ Anthropic, а прогон 11 пробы
            # anthropic-path-probe — ключ Anthropic и в СВОЁМ секрете, но
            # отвергнутый («API key is invalid»). Два ключа одной формы и
            # одной длины дают две РАЗНЫЕ починки, и по началу ключа они
            # неотличимы:
            #   живой ключ лежит не в своём секрете → переложить;
            #   оба ключа мертвы                    → выпустить новый.
            # Различает только сам Anthropic. /v1/models требует авторизации
            # и не стоит ни одного токена; раннер не в РФ, гео-блок тут не
            # мешает. Наружу — код ответа и вердикт, ни символа ключа.
            case "$OPENROUTER_API_KEY" in
              sk-ant-*)
                AC=$(curl -sS -o /tmp/ant.json -w '%{http_code}' --max-time 30 \
                  -H "x-api-key: ${OPENROUTER_API_KEY}" -H 'anthropic-version: 2023-06-01' \
                  'https://api.anthropic.com/v1/models?limit=1' || echo '000')
                echo "этот же ключ у Anthropic: HTTP $AC"
                case "$AC" in
                  200) echo "::warning::ЖИВОЙ ключ Anthropic лежит в секрете OPENROUTER_API_KEY. Починка — переложить его в ANTHROPIC_API_KEY (там сейчас отвергнутый) и завести настоящий sk-or- для OpenRouter. Новый ключ Anthropic выпускать НЕ нужно." ;;
                  000) echo "::warning::До Anthropic не дошли (сеть) — какой из двух ключей живой, НЕ ЗНАЮ. Это третий исход, не «оба мертвы»." ;;
                  *)   echo "Anthropic тоже отверг этот ключ — значит живого ключа Anthropic нет ни в одном секрете, нужен новый. Тело:"
                       head -c 200 /tmp/ant.json; echo ;;
                esac
                ;;
            esac
            exit 1
          fi

      - name: Спросить каталог
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY не задан в секретах — каталог не спрошен."
            exit 1
          fi
          CODE=$(curl -sS -o /tmp/models.json -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            https://openrouter.ai/api/v1/models)
          echo "HTTP: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Каталог не отдан (HTTP $CODE)."
            head -c 500 /tmp/models.json
            exit 1
          fi

      # Что ищем — из маркера, чтобы не править workflow ради каждого вопроса.
      - name: Показать найденное и цену
        run: |
          PATTERN=$(python3 -c "
          import json
          try:
              print(json.load(open('.github/triggers/openrouter-models.json')).get('match') or 'gpt')
          except Exception:
              print('gpt')
          ")
          echo "ищем: $PATTERN"
          python3 - "$PATTERN" <<'PY'
          import json, re, sys
          pat = re.compile(sys.argv[1], re.I)
          data = json.load(open('/tmp/models.json')).get('data', [])
          print(f'всего моделей в каталоге: {len(data)}')
          hits = [m for m in data if pat.search(m.get('id', '')) or pat.search(m.get('name', ''))]
          if not hits:
              # Пусто — это ответ «такого id нет», а не «проба не сработала».
              print('СОВПАДЕНИЙ НЕТ: модели с таким именем в каталоге не существует.')
              sys.exit(0)
          for m in sorted(hits, key=lambda x: x.get('id', '')):
              p = m.get('pricing', {}) or {}
              print(f"{m.get('id')}  |  {m.get('name')}  |  вход {p.get('prompt')} / выход {p.get('completion')} за токен  |  контекст {m.get('context_length')}")
          PY
