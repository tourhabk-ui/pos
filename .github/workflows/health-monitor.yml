name: Health Monitor
on:
  push:
    paths:
      - .trigger-health

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check site health
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TW: ${{ secrets.TIMEWEB_TOKEN }}
        run: |
          H1=$(curl -sf --max-time 15 -o /dev/null -w "%{http_code}" https://vedarai.ru/api/health 2>/dev/null || echo FAIL)
          H2=$(curl -sf --max-time 15 https://vedarai.ru/api/debug-start 2>/dev/null || echo NOT_RESPONDING)
          TW_OUT=no_token
          TW_ENVS=no_token
          if [ -n "$TW" ]; then
            TW_APP=$(curl -sf --max-time 10 -H "Authorization: Bearer $TW" https://api.timeweb.cloud/api/v1/apps/175477 2>/dev/null || echo "{}")
            TW_OUT=$(echo "$TW_APP" | jq -r ".app.status + \" commit=\" + .app.commit_sha[:8]" 2>/dev/null || echo tw_api_fail)
            TW_ENVS_R=$(curl -sf --max-time 10 -H "Authorization: Bearer $TW" https://api.timeweb.cloud/api/v1/apps/175477/envs 2>/dev/null || echo "{}")
            TW_ENVS=$(echo "$TW_ENVS_R" | jq -r "[.envs[].name]|sort|join(\", \")" 2>/dev/null || echo none)
          fi
          BODY="Diagnostic $(date -u +%H:%M:%SZ): health=$H1 | debug=$H2 | tw=$TW_OUT | envs=$TW_ENVS"
          echo "$BODY"
          curl -f -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/tourhabk-ui/pos/issues/20/comments \
            -d "{\"body\":\"$BODY\"}" \
            && echo "Posted OK" || echo "Post failed: check token permissions"
