name: Health Monitor
on:
  push:
    paths:
      - .trigger-health

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check vedarai.ru and post results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TW: ${{ secrets.TIMEWEB_TOKEN }}
        run: |
          H1=$(curl -sf --max-time 15 -o /dev/null -w "%{http_code}" https://vedarai.ru/api/health 2>/dev/null || echo FAIL)
          H2=$(curl -sf --max-time 15 https://vedarai.ru/api/debug-start 2>/dev/null || echo NOT_RESPONDING)
          TW_OUT=no_token
          if [ -n "$TW" ]; then
            TW_OUT=$(curl -sf --max-time 10 -H "Authorization: Bearer $TW" https://api.timeweb.cloud/api/v1/apps/175477 2>/dev/null | jq -r ".app | \"status=\" + .status" 2>/dev/null || echo tw_api_fail)
            TW_ENVS=$(curl -sf --max-time 10 -H "Authorization: Bearer $TW" https://api.timeweb.cloud/api/v1/apps/175477/envs 2>/dev/null | jq -r "[.envs[].name]|sort|join(\", \")" 2>/dev/null || echo none)
          fi
          BODY=$(printf "Health %s\n- /api/health: %s\n- /api/debug-start: %s\n- TW: %s\n- TW envs: %s" "$(date -u +%H:%M)" "$H1" "$H2" "$TW_OUT" "$TW_ENVS")
          echo "$BODY"
          jq -n --arg b "$BODY" "{\"body\":\$b}" | curl -sf -X POST -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" https://api.github.com/repos/tourhabk-ui/pos/issues/20/comments -d @- || true
