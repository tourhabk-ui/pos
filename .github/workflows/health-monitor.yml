name: Health Monitor
on:
  push:
    paths:
      - .trigger-health

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check vedarai.ru
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TW: ${{ secrets.TIMEWEB_TOKEN }}
        run: |
          H1=$(curl -sf --max-time 15 -o /dev/null -w "%{http_code}" https://vedarai.ru/api/health 2>/dev/null || echo FAIL)
          H2=$(curl -sf --max-time 15 https://vedarai.ru/api/debug-start 2>/dev/null || echo NOT_RESPONDING)
          TW_OUT=no_token
          TW_ENVS=no_token
          if [ -n "$TW" ]; then
            TW_OUT=$(curl -sf --max-time 10 -H "Authorization: Bearer $TW" https://api.timeweb.cloud/api/v1/apps/175477 2>/dev/null | jq -r ".app | \"status=\" + .status + \" commit=\" + .commit_sha[:8]" 2>/dev/null || echo tw_api_fail)
            TW_ENVS=$(curl -sf --max-time 10 -H "Authorization: Bearer $TW" https://api.timeweb.cloud/api/v1/apps/175477/envs 2>/dev/null | jq -r "[.envs[].name]|sort|join(\", \")" 2>/dev/null || echo none)
          fi
          cat > diagnostic-result.txt << EOF
ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
health_http=$H1
debug_start=$H2
tw_app=$TW_OUT
tw_envs=$TW_ENVS
EOF
          cat diagnostic-result.txt
      - name: Commit results
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add diagnostic-result.txt
          git diff --staged --quiet || git commit -m "chore: diagnostic results [skip ci]"
          git push
