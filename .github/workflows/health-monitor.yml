name: Health Monitor
on:
  push:
    paths:
      - .trigger-health

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Raw diagnostic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TW_SECRET: ${{ secrets.TIMEWEB_TOKEN }}
        run: |
          APP_ID=175477
          BASE=https://api.timeweb.cloud/api/v1
          ISSUE=20
          REPO=tourhabk-ui/pos
          TW_V2="eyJhbGciOiJSUzUxMiIsInR5cCI6IkpXVCIsImtpZCI6IjFrYnhacFJNQGJSI0tSbE1xS1lqIn0.eyJ1c2VyIjoicGE0MjIxMDgiLCJ0eXBlIjoiYXBpX2tleSIsImFwaV9rZXlfaWQiOiI4MTE2MjJkMi00MjlhLTQ5NjgtOWRjNy05MDA2NWEyZmE1YWEiLCJpYXQiOjE3Nzc3NTg1NDl9.AXYO381WK94x3e3HhLCZWVyw8VL3t4AxD5jPXUrD7PKCSm_eJWlARA9GKp7gYbyX5PPjCQ0eoSOYK--5RqJBohvOM0psqJhU8Y1yBsI9y-LjFMA8cMTpyNM_kMBw9Q_yfkuYNnxePiMD-103QyYFd3PY_HwdLZ1nUCriFKAW8iqjKqcCD64Vud8VTtiCbPGGlWQtw0y7HScBKPJPxmfBz7h3GcCJSf_SYfQEIHQrG_D2JfYarEmNZnPW9jVze3qzRwtXbgzxG4nUzcuKIN-8_6KuFfihSixAuesxQEAAfEukGiOo2G41tm7s398HjUHaFcy4NbR9FCS787O7JMBNdqBzG0BffFoTXEhRtlTFVtvbfmXWrhWWYMpo1jaSfe9uJiluNjV4YAp19EMmvXojdWvNlIaX0kcXRTG1_MoqfE8DtnmBuVdcW04KxMrou7VtQ-3R46MUumZBFIVQONxSn8MjeHubHWe392hrOMdFq5QtM2jn4dm-TdH9T215ePrq"
          TW="${TW_SECRET:-$TW_V2}"

          # ── 1. Site — raw headers to identify responding server ──
          HEALTH_HDRS=$(curl -sI --max-time 10 https://vedarai.ru/api/health 2>/dev/null | head -8)
          HEALTH_CODE=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" https://vedarai.ru/api/health 2>/dev/null)
          DEBUG_CODE=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" https://vedarai.ru/api/debug-start 2>/dev/null)

          # ── 2. Timeweb API — RAW response (first 400 chars) ──
          TW_APP_RAW=$(curl -s --max-time 10 -H "Authorization: Bearer $TW" "$BASE/apps/$APP_ID" 2>/dev/null | head -c 400)
          TW_ENVS_RAW=$(curl -s --max-time 10 -H "Authorization: Bearer $TW" "$BASE/apps/$APP_ID/envs" 2>/dev/null | head -c 400)
          TW_DEPLOY_RAW=$(curl -s --max-time 10 -H "Authorization: Bearer $TW" "$BASE/apps/$APP_ID/deploy?limit=2" 2>/dev/null | head -c 400)

          # ── 3. DB TCP reachability ──
          DB_IP=94.228.112.62
          DB_PORT=5432
          if timeout 8 bash -c "echo > /dev/tcp/$DB_IP/$DB_PORT" 2>/dev/null; then
            DB_TCP=TCP_OK
          else
            DB_TCP=TCP_FAIL
          fi

          # ── 4. Compose body and post ──
          python3 - <<PYEOF
          import json, os
          health_hdrs = """$HEALTH_HDRS""".strip()
          body = "\n".join([
            "## Diagnostic $(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "",
            "### vedarai.ru",
            f"- /api/health HTTP **$HEALTH_CODE**",
            f"- /api/debug-start HTTP **$DEBUG_CODE**",
            "```",
            health_hdrs,
            "```",
            "",
            "### Timeweb API /apps/$APP_ID",
            "```",
            """$TW_APP_RAW""".strip()[:380],
            "```",
            "",
            "### Timeweb API /apps/$APP_ID/envs",
            "```",
            """$TW_ENVS_RAW""".strip()[:380],
            "```",
            "",
            "### Timeweb API /apps/$APP_ID/deploy",
            "```",
            """$TW_DEPLOY_RAW""".strip()[:380],
            "```",
            "",
            "### DB TCP $DB_IP:$DB_PORT",
            "**$DB_TCP**",
          ])
          import urllib.request
          req = urllib.request.Request(
            "https://api.github.com/repos/$REPO/issues/$ISSUE/comments",
            data=json.dumps({"body": body}).encode(),
            headers={
              "Authorization": "token $GH_TOKEN",
              "Content-Type": "application/json",
            },
            method="POST",
          )
          with urllib.request.urlopen(req) as r:
            print("Posted:", r.status)
          PYEOF
