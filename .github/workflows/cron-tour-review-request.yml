name: Cron — Tour Review Request

# Runs daily at 08:00 UTC (20:00 Kamchatka time):
# Asks tourists whose booking an operator marked "completed" to leave a review.

on:
  schedule:
    - cron: '0 8 * * *'    # 08:00 UTC = 20:00 KMT (Камчатское время)
  workflow_dispatch:        # manual trigger

jobs:
  tour-review-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send review requests for completed bookings
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipping"
            exit 0
          fi

          HTTP=$(curl -s -o /tmp/review_request_resp.json -w "%{http_code}" \
            --max-time 120 \
            "https://vedarai.ru/api/cron/tour-review-request" \
            -H "Authorization: Bearer $CRON_SECRET")

          echo "HTTP: $HTTP"
          cat /tmp/review_request_resp.json 2>/dev/null || true

          if [ "$HTTP" = "200" ]; then
            echo "Review requests sent OK"
          else
            echo "Unexpected HTTP $HTTP"
            exit 1
          fi
