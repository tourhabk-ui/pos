name: Cron — Tour Review Request

# Runs daily at 08:00 UTC (20:00 Kamchatka time):
# 1. Completes confirmed bookings whose tour ended yesterday or earlier
#    (owner's decision 13.10: «тур завершать автоматически»).
# 2. Asks tourists with completed bookings to leave a review — the same
#    evening for tours completed by step 1.

on:
  schedule:
    - cron: '0 8 * * *'    # 08:00 UTC = 20:00 KMT (Камчатское время)
  workflow_dispatch:        # manual trigger

jobs:
  tour-review-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Complete bookings whose tour has ended
        id: autocomplete
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET не задан в секретах репозитория — эндпоинт не вызван, прогон не состоялся"
            exit 1
          fi

          HTTP=$(curl -s -o /tmp/auto_complete_resp.json -w "%{http_code}" \
            --max-time 120 \
            "https://vedarai.ru/api/cron/booking-auto-complete" \
            -H "Authorization: Bearer $CRON_SECRET")

          echo "HTTP: $HTTP"
          cat /tmp/auto_complete_resp.json 2>/dev/null || true

          if [ "$HTTP" != "200" ]; then
            echo "Unexpected HTTP $HTTP"
            exit 1
          fi

      - name: Send review requests for completed bookings
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET не задан в секретах репозитория — эндпоинт не вызван, прогон не состоялся"
            exit 1
          fi

          HTTP=$(curl -s -o /tmp/review_request_resp.json -w "%{http_code}" \
            --max-time 120 \
            "https://vedarai.ru/api/cron/tour-review-request" \
            -H "Authorization: Bearer $CRON_SECRET")

          echo "HTTP: $HTTP"
          cat /tmp/review_request_resp.json 2>/dev/null || true

          if [ "$HTTP" = "200" ]; then
            echo "Review requests sent OK"
          else
            echo "Unexpected HTTP $HTTP"
            exit 1
          fi

      # Отказ автозавершения не отменяет просьбы об отзыве по уже завершённым
      # броням (у первого шага continue-on-error), но job краснеет: молча
      # пропущенное завершение — тот же «не смог», что и в ответе роута.
      - name: Fail if auto-complete failed
        if: steps.autocomplete.outcome == 'failure'
        run: |
          echo "Автозавершение броней не прошло — см. шаг «Complete bookings whose tour has ended»"
          exit 1
