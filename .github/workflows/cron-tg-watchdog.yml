name: Cron — Telegram Webhook Watchdog

on:
  schedule:
    - cron: '5,35 * * * *'  # каждые 30 минут — проверка вебхука бота
  workflow_dispatch:

jobs:
  tg-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check and repair Telegram webhook
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/telegram-webhook-watchdog")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
