name: Data — Аудит качества маршрутов (печать в лог)

# Дёргает GET /api/cron/routes-audit (Bearer CRON_SECRET) на проде и печатает
# JSON-диагностику качества kamchatka_routes в лог Actions. Так агент видит
# реальные цифры прода, не имея прямого доступа к БД (файрвол managed-PostgreSQL).
#
# Запуск: workflow_dispatch ИЛИ push в main, меняющий
# .github/triggers/routes-audit.json (нет actions:write у интеграции).

on:
  # Еженедельно (Ф6 плана порядка маршрутов). Перепись, которую запускают
  # руками, меряет ровно то, о чём и так вспомнили; регрессию ловит только
  # регулярная. Понедельник 04:10 UTC — до рабочего дня владельца.
  schedule:
    - cron: '10 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/routes-audit.json'

jobs:
  routes-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Fetch audit
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE: https://vedarai.ru
        run: |
          set -uo pipefail
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 1; fi

          # Ждём деплой: без ключа новый билд отвечает 401.
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE/api/cron/routes-audit" || echo 000)
            if [ "$CODE" = "401" ]; then echo "endpoint deployed"; break; fi
            echo "endpoint not ready (HTTP $CODE), жду 60с ($i/20)"; sleep 60
          done

          echo "=== routes audit ==="
          curl -s --max-time 60 -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE/api/cron/routes-audit" -o /tmp/census.json
          python3 -m json.tool --no-ensure-ascii /tmp/census.json 2>/dev/null || cat /tmp/census.json

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }

      # Суждение, а не печать. Цифры в логе решает человек, если посмотрел, —
      # то есть не решает никто. Пороги измерены и лежат в репозитории
      # (lib/routes/census-verdict.ts), у каждой находки названо действие.
      - name: Судить перепись по порогам
        id: verdict
        run: |
          set -uo pipefail
          npm ci --prefer-offline --no-audit --ignore-scripts
          npx tsx scripts/census-verdict.ts /tmp/census.json /tmp/verdict.md
          echo "red=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # Отчёт выходит В ЛЮБОМ случае и ДО падения: чиня регрессию, нельзя
      # потерять сам список цифр.
      - name: Вынести вердикт в задачу
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          [ -s /tmp/verdict.md ] || { echo "вердикта нет"; exit 0; }
          grep -q 'в пределах порогов' /tmp/verdict.md && { echo "порядок, задачу не заводим"; exit 0; }
          TITLE='Перепись маршрутов вышла за пороги'
          BODY=$(printf '%s\n\nПрогон: %s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' \
            "$(cat /tmp/verdict.md)" "$RUN_URL")
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY" || true
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --label evo --body "$BODY"
          fi
        # RUN_URL нужен и в этом шаге.
        continue-on-error: true

      - name: Красный, если перепись вышла за пороги
        run: |
          grep -q 'в пределах порогов' /tmp/verdict.md || {
            echo "Перепись вне порогов — подробности и действия в /tmp/verdict.md и в задаче."
            cat /tmp/verdict.md
            exit 1
          }
