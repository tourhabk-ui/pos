name: Cron — Kuzmich Faithfulness Eval

on:
  schedule:
    - cron: '0 5 * * 1'  # каждый понедельник 05:00 UTC
  workflow_dispatch:

jobs:
  kuzmich-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kuzmich Eval — faithfulness-регрессия ответов
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 280 \
            "https://vedarai.ru/api/cron/kuzmich-eval" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
