# Диагностика: какие User-Agent'ы пропускает защита перед vedarai.ru.
#
# Владелец: «у нас настроен обход». Фетчер claude.ai получает 403, но его UA —
# не UA краулеров. Этот прогон отвечает фактами: с раннера GitHub (обычный curl
# отсюда проходит) дёргаем /robots.txt с UA реальных ботов и сравниваем коды.
#
# Временный файл: живёт только в рабочей ветке, в main не мержится,
# удаляется после снятия показаний.

name: UA probe (диагностика, не мержить)

on:
  push:
    branches: [claude/pos-repository-ercvsa]
    paths: ['.github/workflows/ua-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe vedarai.ru with crawler user agents
        run: |
          probe() {
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              -A "$2" "https://vedarai.ru$3" || echo 000)
            echo "$1 -> HTTP $CODE"
          }
          P=/robots.txt
          probe "curl-default        " "curl/8.5.0" "$P"
          probe "Browser (Chrome)    " "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" "$P"
          probe "Googlebot           " "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" "$P"
          probe "YandexBot           " "Mozilla/5.0 (compatible; YandexBot/3.0; +http://yandex.com/bots)" "$P"
          probe "GPTBot              " "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; GPTBot/1.2; +https://openai.com/gptbot" "$P"
          probe "ClaudeBot           " "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; ClaudeBot/1.0; +claudebot@anthropic.com)" "$P"
          probe "Claude-User         " "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; Claude-User/1.0; +Claude-User@anthropic.com" "$P"
          probe "PerplexityBot       " "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; PerplexityBot/1.0; +https://perplexity.ai/perplexitybot)" "$P"
          probe "CCBot               " "CCBot/2.0 (https://commoncrawl.org/faq/)" "$P"
          echo "---"
          probe "GPTBot на /llms.txt " "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; GPTBot/1.2; +https://openai.com/gptbot" "/llms.txt"
          probe "GPTBot на / (главная)" "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; GPTBot/1.2; +https://openai.com/gptbot" "/"
