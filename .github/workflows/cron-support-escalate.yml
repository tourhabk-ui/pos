name: Cron — Support Escalate (тикеты >24ч)

on:
  schedule:
    - cron: '0 */2 * * *'  # каждые 2 часа: эскалация зависших тикетов поддержки
  workflow_dispatch:

jobs:
  support-escalate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Escalate stale support tickets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/support-escalate")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
