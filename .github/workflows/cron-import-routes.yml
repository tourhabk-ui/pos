name: Import Route Passports

on:
  schedule:
    # 00:00 UTC — после editor (22:00) и enrich-routes (23:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Routes per run (default 20)'
        default: '20'

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Import visitkamchatka.ru route passports
        run: |
          BATCH="${{ github.event.inputs.batch || '20' }}"
          curl -sf \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://vedarai.ru/api/cron/import-routes?batch=${BATCH}" \
            | jq .
