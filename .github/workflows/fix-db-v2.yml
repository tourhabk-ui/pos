name: Fix — DB Connection (correct API)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
      APP_ID: "175477"
      BASE: "https://api.timeweb.cloud/api/v1"

    steps:
      - name: Check API access
        run: |
          HTTP=$(curl -s -o /tmp/check.txt -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE/apps/$APP_ID")
          echo "API check: HTTP $HTTP"
          cat /tmp/check.txt | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          a=d.get('app',{})
          print(f'App: {a.get(\"name\")} status={a.get(\"status\")} branch={a.get(\"branch\")}')
          " 2>/dev/null || cat /tmp/check.txt | head -3

      - name: Update DATABASE_URL via PATCH /apps/{id}
        run: |
          # Correct endpoint from timeweb-mcp-server.ts: PATCH /apps/{id} with {envs: {KEY:VAL}}
          NEW_URL="postgresql://gen_user:b%3E%3DPHE1g40PUL%23@188.225.36.161:5432/default_db"

          PAYLOAD=$(python3 -c "
          import json
          payload = {
            'envs': {
              'DATABASE_URL': 'postgresql://gen_user:b%3E%3DPHE1g40PUL%23@188.225.36.161:5432/default_db',
              'DATABASE_SSL': 'true'
            }
          }
          print(json.dumps(payload))
          ")

          echo "Payload: $PAYLOAD"

          HTTP=$(curl -s -o /tmp/patch.txt -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$BASE/apps/$APP_ID")

          echo "PATCH /apps/$APP_ID → HTTP $HTTP"
          cat /tmp/patch.txt | python3 -m json.tool 2>/dev/null | head -30 || cat /tmp/patch.txt | head -10

          if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then
            echo "✅ ENV VARS UPDATED"
          else
            echo "❌ PATCH failed — trying alternative env format"

            # Try array format as fallback
            PAYLOAD2=$(python3 -c "
          import json
          payload = {
            'envs': [
              {'name': 'DATABASE_URL', 'value': 'postgresql://gen_user:b%3E%3DPHE1g40PUL%23@188.225.36.161:5432/default_db', 'is_secret': True},
              {'name': 'DATABASE_SSL', 'value': 'true', 'is_secret': False}
            ]
          }
          print(json.dumps(payload))
            ")

            HTTP2=$(curl -s -o /tmp/patch2.txt -w "%{http_code}" \
              -X PATCH \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD2" \
              "$BASE/apps/$APP_ID")

            echo "PATCH (array format) → HTTP $HTTP2"
            cat /tmp/patch2.txt | head -10
          fi

      - name: Trigger deployment
        run: |
          # From timeweb-mcp-server.ts: POST /apps/{id}/deployments
          HTTP=$(curl -s -o /tmp/deploy.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "$BASE/apps/$APP_ID/deployments")

          echo "POST /deployments → HTTP $HTTP"
          cat /tmp/deploy.txt | head -5

          # Also try /deploy as fallback
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            HTTP2=$(curl -s -o /tmp/deploy2.txt -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              "$BASE/apps/$APP_ID/deploy")
            echo "POST /deploy fallback → HTTP $HTTP2"
            cat /tmp/deploy2.txt | head -5
          fi

      - name: Wait and verify
        run: |
          echo "Waiting 90s for deploy..."
          sleep 90
          for url in "https://tourhab.ru/api/health" "https://vedarai.ru/api/health"; do
            HTTP=$(curl -s -o /tmp/h.txt -w "%{http_code}" --max-time 15 "$url" 2>/dev/null || echo "0")
            echo "$url → HTTP $HTTP"
            [ "$HTTP" = "200" ] && echo "✅ SITE UP" && cat /tmp/h.txt
          done
