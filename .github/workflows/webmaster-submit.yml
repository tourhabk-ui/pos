name: Загрузка в Яндекс Вебмастер — карта сайта и переобход

# ── Зачем ─────────────────────────────────────────────────────────────────
#
# Владелец 11.11: «поработай с вебмастером, загрузи им наши файлы». Сайт
# https://vedarai.ru/ добавлен в Вебмастер и подтверждён 11.11 (#3240). Здесь
# два пишущих метода API Вебмастера и только они: добавить карту сайта и
# поставить страницы в очередь переобхода (в пределах дневной квоты). Адреса —
# из маркера; не наши (не https://vedarai.ru/…) не отправляются. Правила —
# lib/seo/webmaster-submit.ts.
#
# Токен — секрет YANDEX_WEBMASTER_TOKEN (имя установлено переписью 11.11).
# Переменные репозитория (vars) сюда не кладутся: окружение шага печатается в
# публичный журнал, а vars не маскируются. Значение токена не печатается.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/webmaster-submit.json'

permissions:
  contents: read

concurrency:
  group: webmaster-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Загрузка
        env:
          YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
        run: npx tsx scripts/webmaster-submit.ts .github/triggers/webmaster-submit.json
