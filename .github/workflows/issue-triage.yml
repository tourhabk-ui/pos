name: Issue Triage

# Петля loop engineering: ночной триаж issues. Владелец пишет тикет как
# думает — утром он либо размечен и ждёт решения, либо тривиальный уже
# ушёл в существующий конвейер claude.yml через лейбл agent-proposal
# и превратился в draft-PR.
#
# Кода петля не касается вовсе: permissions только issues. Идемпотентность —
# лейбл triaged: размеченный тикет второй раз не трогается.
#
# Маршрутизация:
#   safety / money / большой объём (L) → needs-owner, бота НЕ запускать
#   тривиальные S/M не-safety           → agent-proposal (триггер claude.yml)

on:
  schedule:
    - cron: '0 21 * * *'  # 21:00 UTC ≈ 09:00 утра Камчатки
  push:
    branches: [main]
    paths:
      - '.github/triggers/issue-triage.json'
  workflow_dispatch:

concurrency:
  group: issue-triage
  cancel-in-progress: false

# Провайдер рук (решение владельца 03.11 «агентов переключи пока на
# оупенррут»): Anthropic отвечает 403 verification_required (проверка
# организации). По умолчанию руки идут через OpenRouter (его
# Anthropic-совместимый /api/v1/messages, ключ OPENROUTER_API_KEY, модель
# anthropic/claude-opus-5.5). Вернуть Anthropic без правки кода:
# переменная репозитория AGENTS_PROVIDER=anthropic.
# Сторож: tests/unit/issue-hand-model-pinned.test.ts.
jobs:
  # Маркер в main запустить руку НАПРЯМУЮ не может: claude-code-action знает
  # issue/PR/comment, schedule, workflow_dispatch, repository_dispatch и
  # workflow_run — а на push падает «Unsupported event type: push»
  # (src/github/context.ts). Замер 06.09: прогон 59 умер на этом за две
  # секунды, и так же молча умирал бы всякий запуск маркером. Поэтому push
  # ПЕРЕВОДИТСЯ в workflow_dispatch — событие, которое рука понимает.
  # GITHUB_TOKEN это умеет: workflow_dispatch и repository_dispatch —
  # именованное исключение из правила «события от GITHUB_TOKEN не создают
  # прогонов».
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-fire as workflow_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run issue-triage.yml --repo "$GITHUB_REPOSITORY" --ref main

  triage:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write
      contents: read
      id-token: write
    # Учёт расхода руки — отдельной работой usage-books ниже (аудит 15.10,
    # AC-1): ей нужен исход шага руки и путь файла выполнения, названный
    # самим экшеном, — чтобы отличить «рука не дошла до модели» от потери.
    outputs:
      hand_outcome: ${{ steps.hand.outcome }}
      execution_file: ${{ steps.hand.outputs.execution_file }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh label create triaged        --color BFD4F2 --description "Размечен ночным триажем" 2>/dev/null
          gh label create needs-owner    --color D93F0B --description "Решение за владельцем (safety/деньги/крупное)" 2>/dev/null
          gh label create size-S         --color C2E0C6 --description "Мелкая задача" 2>/dev/null
          gh label create size-M         --color FBCA04 --description "Средняя задача" 2>/dev/null
          gh label create size-L         --color B60205 --description "Крупная задача" 2>/dev/null
          gh label create type-bug       --color D73A4A --description "Баг" 2>/dev/null
          gh label create type-feature   --color A2EEEF --description "Фича" 2>/dev/null
          gh label create type-content   --color 0E8A16 --description "Контент/данные" 2>/dev/null
          gh label create type-infra     --color 5319E7 --description "Инфраструктура/CI" 2>/dev/null
          gh label create type-safety    --color B60205 --description "Безопасность туристов" 2>/dev/null
          gh label create type-money     --color 006B75 --description "Платежи/деньги" 2>/dev/null
          exit 0

      - name: Collect untriaged issues
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .agent-out
          if [ -d .git/info ]; then echo '.agent-out/' >> .git/info/exclude; fi
          gh issue list --state open --search '-label:triaged' --limit 100 --json number,title,body,author > .agent-out/issues.json
          COUNT=$(jq 'length' .agent-out/issues.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Непроразмеченных issues: $COUNT"

      # Claude Code (с 2.1.288) с CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 требует
      # bubblewrap («bubblewrap is required for subprocess env scrubbing»).
      # Экшен ставит его сам только при allowed_non_write_users — ставим здесь.
      - name: bubblewrap для изоляции подпроцессов
        if: steps.pending.outputs.count != '0'
        run: |
          # Вне раннера GitHub (симуляция шагов в tests/unit) — не ставим ничего.
          [ "${GITHUB_ACTIONS:-}" = "true" ] || exit 0
          command -v bwrap >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat; }
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run Claude triage
        id: hand
        if: steps.pending.outputs.count != '0'
        uses: anthropics/claude-code-action@115e0b2c49222c831de6748ccdf365bb8d3ea9a3 # v1 от 06.11.2026, ставит Claude Code 2.1.319
        # Токена GitHub у агента нет (аудит агентов 02.11, разрыв №1): ни
        # GH_TOKEN в env, ни учётки git в .git/config (persist-credentials:
        # false), а SUBPROCESS_ENV_SCRUB вычищает из окружения Bash и токен,
        # который экшен выпускает себе сам. Данные агент получает файлами из
        # шагов ДО, запись делает шаг ПОСЛЕ по его выводу в .agent-out/.
        # Сторож: tests/unit/loop-agents-no-token.test.ts.
        env:
          ANTHROPIC_BASE_URL: ${{ vars.AGENTS_PROVIDER == 'anthropic' && 'https://api.anthropic.com' || 'https://openrouter.ai/api' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.AGENTS_PROVIDER != 'anthropic' && 'anthropic/claude-haiku-5.5' || '' }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          # Ключ Console из репозиторного секрета — решение владельца 13.10:
          # «я пополню лучше баланс», после того как выпуск токена подписки
          # (claude setup-token) с компьютера упёрся в гео-блок claude.ai.
          # Что известно (#2396, пробы 19–22 и документация Anthropic,
          # api-credits-for-subscribers): 238 $ на счету Console — месячные
          # кредиты плана Max, они покрывают API, Agent SDK и playground, но НЕ
          # Claude Code; любой запрос с подписью Claude Code (бета-заголовок
          # claude-code-20250219 или user-agent claude-cli) получал 400 «credit
          # balance is too low», потому что купленного баланса было 0. Купленные
          # кредиты эту дыру закрывают: Claude Code списывает с них, обычные
          # запросы — по-прежнему с месячных. Руки оживают в момент пополнения,
          # без правок; пока баланс не куплен, отказ тот же 400, читать его как
          # «не пополнено», а не «ключ сломан». Токен подписки рядом НЕ держать:
          # отказ должен читаться как «ключ», а не «какой из двух».
          # Сторож: tests/unit/issue-hand-model-pinned.test.ts.
          anthropic_api_key: ${{ vars.AGENTS_PROVIDER == 'anthropic' && secrets.ANTHROPIC_API_KEY || secrets.OPENROUTER_API_KEY }}
          # Прогон, рождённый переводчиком, инициирует github-actions — бот,
          # и рука по умолчанию таких не пускает («Workflow initiated by
          # non-human actor», прогон 61). Разрешён ИМЕННО он, а не '*':
          # звёздочка пустила бы к руке любое приложение с правом писать в
          # репозиторий, а нам нужен один известный инициатор.
          allowed_bots: github-actions
          claude_args: |
            --model ${{ vars.AGENTS_PROVIDER == 'anthropic' && 'claude-opus-5-5' || 'anthropic/claude-opus-5.5' }}
            --allowedTools "Read,Write,Glob,Grep"
            --max-turns 60
          show_full_output: true
          prompt: |
            Ты — ночной триаж issues платформы Ведар (туристическая
            safety-платформа Камчатки; Next.js 15, TypeScript, PostgreSQL).
            Кода ты НЕ меняешь — только читаешь и размечаешь тикеты.

            CLAUDE.md уже у тебя в контексте (Claude Code кладёт его сам) — не
            перечитывай его целиком. Опирайся на §7 «НЕ ТРОГАТЬ», чтобы понимать,
            что относится к safety и деньгам.

            Список неразмеченных тикетов уже лежит в .agent-out/issues.json
            (number, title, body, author). Доступа к GitHub у тебя нет —
            разметку применяет следующий шаг по твоему выводу.

            Для КАЖДОГО тикета:
            1. Тип — один лейбл: type-bug / type-feature / type-content /
               type-infra / type-safety / type-money. Safety — всё, что
               касается SOS, МЧС, статусов опасности, экстренных телефонов.
               Money — платежи, возвраты, цены, брони с оплатой.
            2. Объём — один лейбл: size-S (до пары файлов), size-M (несколько
               файлов, без миграций схемы), size-L (миграции БД, авторизация,
               архитектура, много файлов). При сомнении — больший размер.
            3. Маршрутизация:
               - type-safety ИЛИ type-money ИЛИ size-L → добавь лейбл needs-owner.
                 Конвейер НЕ запускать.
               - Иначе (S/M, не safety, не money) → добавь лейбл agent-proposal —
                 это запустит существующий конвейер claude.yml, и по тикету
                 родится draft-PR.
            4. Один короткий комментарий (2-3 предложения, по-русски): как
               разметил и почему; если needs-owner — что именно требует
               решения владельца.
            5. ВСЕГДА в конце добавь лейбл triaged — идемпотентность петли.

            Итог запиши в .agent-out/triage.json — массив:
            [{"number": N, "labels": ["type-…", "size-…", "needs-owner"|"agent-proposal", "triaged"], "comment": "…"}]
            Лейблы вне перечисленных выше шаг после тебя отбросит.

            Если тикет непонятен настолько, что тип не определить — лейблы
            triaged + needs-owner и комментарий с уточняющим вопросом.
            Не закрывай тикеты и не меняй их заголовки/тексты.

      # ── Запись — отдельным шагом ПОСЛЕ агента (аудит агентов 02.11) ──────
      # Токен только здесь. Номер — из собранного списка, лейблы — из белого
      # списка, triaged ставится всегда; комментарий — строкой, до 1500 знаков.
      - name: Разметка — применить вывод триажа
        if: steps.hand.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=.agent-out/triage.json
          if [ ! -f "$out" ]; then echo "::warning::Агент не оставил $out"; exit 0; fi
          allowed='["type-bug","type-feature","type-content","type-infra","type-safety","type-money","size-S","size-M","size-L","needs-owner","agent-proposal","triaged"]'
          jq -c --argjson ok "$allowed" --slurpfile known .agent-out/issues.json '
            ($known[0] | map(.number)) as $nums
            | if type == "array" then .[] else empty end
            | select((.number | type) == "number" and (.number as $n | $nums | index($n)))
            | {number, labels: ((.labels // []) | map(select(type == "string" and ($ok | index(.)))) + ["triaged"] | unique),
               comment: ((.comment // "") | tostring | .[0:1500])}' "$out" |
          while read -r row; do
            n=$(jq -r .number <<<"$row")
            labels=$(jq -r '.labels | join(",")' <<<"$row")
            comment=$(jq -r .comment <<<"$row")
            gh issue edit "$n" --add-label "$labels"
            [ -z "$comment" ] || gh issue comment "$n" --body "$comment"
          done

      # ── Расход руки — в книги (аудит 15.10, AC-1) ──────────────────────
      # К работе учёта usage-books уезжают ОДНИ СЧЁТЧИКИ, а не файл выполнения.
      # Файл выполнения — полный транскрипт агента: выводы Bash и Read, тексты
      # чужих issues, логи CI. Репозиторий публичный, артефакт скачивает любой
      # пользователь GitHub, а маски секретов в файлах артефакта нет — она есть
      # только в логе. Поэтому выжимка собирается здесь, белым списком полей:
      # тип сообщения, total_cost_usd, modelUsage (четыре счётчика на модель),
      # у ответа модели — id, модель и четыре счётчика usage. Текста, content и
      # tool_use в ней нет; не число на месте числа и не имя на месте имени —
      # null, и учёт назовёт расход неразобранным. Агент может переписать
      # числа — сервер проверит их схемой. Секрета учёта (CRON_SECRET) в этой
      # работе нет и быть не должно: у агента Bash на этом раннере. Отказ
      # выжимки или загрузки не красит руку — потерю назовёт учёт.
      - name: Выжимка расхода руки — одни счётчики
        if: always() && steps.hand.outcome != 'skipped'
        continue-on-error: true
        env:
          HAND_EXECUTION_FILE: ${{ steps.hand.outputs.execution_file }}
        run: |
          src="${HAND_EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          dst="$RUNNER_TEMP/hand-usage/hand-usage.json"
          mkdir -p "$RUNNER_TEMP/hand-usage"
          rm -f "$dst" "$dst.tmp"
          if [ ! -f "$src" ]; then
            echo "Файла выполнения нет — выжимать нечего; что это значит, скажет учёт"
            exit 0
          fi
          if ! jq -c '
            def n: if type == "number" then . else null end;
            def ident: if type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._:@/\\[\\]-]{0,127}$") then . else null end;
            def model_usage: if type == "object" then {inputTokens: (.inputTokens | n), outputTokens: (.outputTokens | n), cacheCreationInputTokens: (.cacheCreationInputTokens | n), cacheReadInputTokens: (.cacheReadInputTokens | n)} else null end;
            def msg_usage: if type == "object" then {input_tokens: (.input_tokens | n), output_tokens: (.output_tokens | n), cache_creation_input_tokens: (.cache_creation_input_tokens | n), cache_read_input_tokens: (.cache_read_input_tokens | n)} else null end;
            if type == "array" then [ .[] | objects |
              if .type == "result" then
                {type: "result", total_cost_usd: (.total_cost_usd | n),
                 modelUsage: (if (.modelUsage | type) == "object" then (.modelUsage | with_entries({key: (.key | ident // ""), value: (.value | model_usage)})) else null end)}
              elif .type == "assistant" and (.message | type) == "object" then
                {type: "assistant", message: {id: (.message.id | ident), model: (.message.model | ident), usage: (.message.usage | msg_usage)}}
              else empty end
            ] else null end
          ' "$src" > "$dst.tmp"; then
            echo "::warning::Файл выполнения руки не выжат: jq его не прочёл — учёт назовёт расход неразобранным"
            echo '{"hands_usage":"unreadable"}' > "$dst.tmp"
          fi
          mv "$dst.tmp" "$dst"

      - name: Счётчики расхода руки — к учёту
        if: always() && steps.hand.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: hand-usage
          path: ${{ runner.temp }}/hand-usage/hand-usage.json
          if-no-files-found: warn
          retention-days: 1
          overwrite: true

  # ── Расход руки — в книги llm_usage_log (аудит 15.10, AC-1) ─────────────
  #
  # Руки считают ключом Anthropic мимо logLLMUsage, и их расход до книг не
  # доходил: дневной бюджет (llm-budget-check) по ним не мог сработать. Здесь
  # выжимка файла выполнения (одни счётчики, собрана в работе руки) разбирается
  # (scripts/hands-usage.mjs), и строки уходят на прод
  # (POST /api/admin/llm-usage/report) с CRON_SECRET. Цену, включая кэш
  # подсказок, считает прод; заявление экшена (total_cost_usd) — в сводку
  # прогона для сверки, в книги не пишется.
  #
  # Отдельная работа на чистом раннере, а не шаг рядом с рукой: CRON_SECRET
  # открывает /api/admin/* на проде (§7), а у агента Bash — шаг после него
  # исполнял бы файл, который агент мог переписать. Скрипт берётся из main,
  # а не из рабочей копии руки. Сторож: tests/unit/llm-usage-reaches-books.test.ts.
  usage-books:
    needs: triage
    if: always() && needs.triage.outputs.hand_outcome != '' && needs.triage.outputs.hand_outcome != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Скрипт учёта из main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: scripts/hands-usage.mjs
          sparse-checkout-cone-mode: false

      # Артефакта нет — экшен файла не оставил, или выжимка либо загрузка не
      # удались; потеря это или «рука не дошла до модели», решает учёт по
      # HAND_EXECUTION_FILE, а не этот шаг.
      - name: Счётчики расхода руки — из работы руки
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: hand-usage
          path: ${{ runner.temp }}/hand

      - name: Расход руки — в книги
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AGENT_ID: issue-triage
          EXECUTION_FILE: ${{ runner.temp }}/hand/hand-usage.json
          HAND_EXECUTION_FILE: ${{ needs.triage.outputs.execution_file }}
        run: node scripts/hands-usage.mjs --run
