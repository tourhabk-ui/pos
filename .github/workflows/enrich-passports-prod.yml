name: Data — Обогащение карточек из OCR-паспортов (через прод)

# Разбирает markdown OCR-паспортов (route_passport_ocr) в поля карточек
# маршрутов (hazards/equipment/season/difficulty/... — §10) через LLM.
# Пишет ТОЛЬКО пустые поля (кураторские данные не затираются). Исполнение
# на прод-сервере через /api/cron/enrich-passports — файрвол БД Timeweb
# (паттерн ocr-passports-prod).
#
# Запуск: workflow_dispatch ИЛИ push в main, меняющий
# .github/triggers/enrich-passports.json (нет actions:write).
#
# dry_run=true — одна партия: разобрать и показать, что записалось бы, без
# UPDATE. dry_run=false — партии до routes_pending=0.
#
# Требует secret CRON_SECRET. Ключи LLM-провайдеров — в env прода.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (разобрать без записи)'
        required: false
        default: true
        type: boolean
      batch_limit:
        description: 'Паспортов на партию (1-5)'
        required: false
        default: '3'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/triggers/enrich-passports.json'

jobs:
  enrich-via-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Run enrichment through prod endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 1; fi

          if [ "${{ github.event_name }}" = "push" ]; then
            DRY=$(jq -r '.dry_run' .github/triggers/enrich-passports.json)
            LIMIT=$(jq -r '.batch_limit' .github/triggers/enrich-passports.json)
          else
            DRY="${{ github.event.inputs.dry_run }}"
            LIMIT="${{ github.event.inputs.batch_limit }}"
          fi
          echo "event=${{ github.event_name }} dry_run=$DRY batch_limit=$LIMIT"

          BASE="https://vedarai.ru/api/cron/enrich-passports"

          READY=""
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE" || echo 000)
            if [ "$CODE" = "401" ]; then READY=1; echo "endpoint deployed (HTTP 401 без ключа)"; break; fi
            echo "endpoint not ready (HTTP $CODE), жду 60с ($i/30)"
            sleep 60
          done
          if [ -z "$READY" ]; then echo "эндпоинт так и не задеплоился за 30 мин"; exit 1; fi

          TOTAL_ENRICHED=0; TOTAL_FIELDS=0; TOTAL_ERRORS=0; PENDING="?"; FAILS=0
          for i in $(seq 1 120); do
            RESP=$(curl -s --max-time 115 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BASE?limit=$LIMIT&dry_run=$DRY" || echo '')
            if ! echo "$RESP" | jq -e '.success == true' >/dev/null 2>&1; then
              FAILS=$((FAILS + 1))
              echo "партия $i не прошла (попытка $FAILS/5): $(echo "$RESP" | head -c 300)"
              if [ "$FAILS" -ge 5 ]; then echo "5 подряд неудач — стоп"; exit 1; fi
              sleep 60
              continue
            fi
            FAILS=0
            echo "партия $i: $(echo "$RESP" | jq -c '{processed,enriched,fields_written,errors,routes_pending}')"
            echo "$RESP" | jq -r '.details[] | "  [\(.status)] \(.title)\(if .fields then " → \(.fields | join(\", \"))" else "" end)"'
            echo "$RESP" | jq -r '.error_details[]? | "  ! \(.)"'

            ENR=$(echo "$RESP" | jq -r '.enriched')
            FLD=$(echo "$RESP" | jq -r '.fields_written')
            ERRS=$(echo "$RESP" | jq -r '.errors')
            PROC=$(echo "$RESP" | jq -r '.processed')
            PENDING=$(echo "$RESP" | jq -r '.routes_pending')
            TOTAL_ENRICHED=$((TOTAL_ENRICHED + ENR))
            TOTAL_FIELDS=$((TOTAL_FIELDS + FLD))
            TOTAL_ERRORS=$((TOTAL_ERRORS + ERRS))

            if [ "$DRY" = "true" ]; then echo "dry-run: одна партия, выходим"; break; fi
            if [ "$PROC" = "0" ] || [ "$PENDING" = "0" ]; then break; fi
            sleep 3
          done

          echo "=================================================="
          echo "ИТОГО: enriched=$TOTAL_ENRICHED fields_written=$TOTAL_FIELDS errors=$TOTAL_ERRORS pending=$PENDING dry_run=$DRY"
