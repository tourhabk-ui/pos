name: Claude

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Один агент на один тикет.
#
# Замер 06.09, прогон 550: 17 минут 36 секунд, 70 ходов, полный vitest внутри
# — и результат выброшен целиком. Его собственный отчёт: «Draft-PR уже
# существует #1644, его открыл параллельный прогон… мой пуш отклонён… этот
# вариант остался только у меня, в репозиторий не попал». Два агента делали
# одну работу одновременно, и половина оплаченного труда ушла в никуда.
#
# У issue-triage и летописца группа есть с самого начала, у руки её не было.
# cancel-in-progress: true, а не false, осознанно: очередь дала бы ДВА
# прогона подряд вместо двух параллельных — то же самое по деньгам. Здесь
# нужен один, и побеждает последнее событие: новая просьба человека важнее
# начатой работы по старой.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude:
    # Issues от владельца/коллабораторов обрабатываются БЕЗ маркеров — раньше
    # 144 из 148 ранов скипались, потому что issues создавались без «@claude»
    # и без лейбла agent-proposal, и владелец ждал автоматику впустую.
    # Репо публичный, поэтому чужие issues — по-прежнему только через лейбл
    # (его вешает владелец) или @claude-упоминание в комментарии владельца.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent-proposal') ||
      (github.event_name == 'issues' && github.event.action != 'labeled' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    # Учёт расхода руки — отдельной работой usage-books ниже (аудит 15.10,
    # AC-1): ей нужен исход шага руки и путь файла выполнения, названный
    # самим экшеном, — чтобы отличить «рука не дошла до модели» от потери.
    outputs:
      hand_outcome: ${{ steps.hand.outcome }}
      execution_file: ${{ steps.hand.outputs.execution_file }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Read codebase context
        id: ctx
        run: |
          {
            echo 'RULES<<HEREDOC'
            grep -A 200 '## 4. КОД' CLAUDE.md | head -80 || true
            echo ''
            grep -A 50 '## 7. НЕ ТРОГАТЬ' CLAUDE.md | head -30 || true
            echo 'HEREDOC'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude
        id: hand
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1
        with:
          # Ключ Console из репозиторного секрета — решение владельца 13.10:
          # «я пополню лучше баланс», после того как выпуск токена подписки
          # (claude setup-token) с компьютера упёрся в гео-блок claude.ai.
          # Что известно (#2396, пробы 19–22 и документация Anthropic,
          # api-credits-for-subscribers): 238 $ на счету Console — месячные
          # кредиты плана Max, они покрывают API, Agent SDK и playground, но НЕ
          # Claude Code; любой запрос с подписью Claude Code (бета-заголовок
          # claude-code-20250219 или user-agent claude-cli) получал 400 «credit
          # balance is too low», потому что купленного баланса было 0. Купленные
          # кредиты эту дыру закрывают: Claude Code списывает с них, обычные
          # запросы — по-прежнему с месячных. Руки оживают в момент пополнения,
          # без правок; пока баланс не куплен, отказ тот же 400, читать его как
          # «не пополнено», а не «ключ сломан». Токен подписки рядом НЕ держать:
          # отказ должен читаться как «ключ», а не «какой из двух».
          # Сторож: tests/unit/issue-hand-model-pinned.test.ts.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # --max-turns 60, как у ночного триажа (решение владельца 06.09).
          # Прогон 550 без потолка ушёл на 70 ходов; у соседних рук потолки
          # стояли с самого начала, у этой не было. Потолок может обрезать
          # работу на середине — принятая цена против прогона без границ.
          #
          # Комментарии тут ТОЛЬКО снаружи блока: содержимое claude_args уходит
          # в CLI как аргументы, и строка с решёткой стала бы аргументом «#»,
          # а не пояснением.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
            --max-turns 60
          show_full_output: true
          # ВАЖНО: кастомный prompt ЗАМЕНЯЕТ дефолтный контекст action —
          # без явной вставки текста issue агент получал одни правила,
          # отвечал «чем помочь?» и завершался (все старые success-раны
          # были такими пустышками). Текст задачи обязан быть в prompt.
          prompt: |
            Ты работаешь с кодовой базой Ведар (Next.js 15, TypeScript strict, PostgreSQL).

            ══ ЗАДАЧА ══
            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            Комментарий-триггер (если есть):
            ${{ github.event.comment.body || github.event.review.body || '—' }}

            Выполни эту задачу до конца — от чтения кода до draft-PR. Не
            спрашивай уточнений: если что-то неоднозначно, выбери разумный
            вариант и опиши выбор в PR. Если задача не требует изменений кода
            (анализ/разведка) — оставь развёрнутый результат комментарием:
            gh issue comment ${{ github.event.issue.number }} --body "..."

            ОБЯЗАТЕЛЬНО ПЕРЕД ЛЮБЫМИ ИЗМЕНЕНИЯМИ:
            1. Прочитай CLAUDE.md полностью (он есть в корне репозитория)
            2. Найди и прочитай 2-3 похожих существующих файла — не угадывай паттерны
            3. Проверь типы: npx tsc --noEmit после всех изменений

            ПРОВЕРКИ — ЦЕЛЕВЫЕ, НЕ ВЕСЬ НАБОР:
            Гоняй только затронутые тест-файлы: npx vitest run tests/unit/<файл>.
            Полный `npx vitest run` здесь ЗАПРЕЩЁН: это ~8900 тестов и шесть
            минут, весь их вывод оседает в твоём контексте, и ровно то же самое
            CI прогонит на твоём PR — второй раз и без расхода на модель.
            Замер 06.09 (прогон 550): 70 ходов и 17 минут, значительная часть
            которых — ожидание полного набора, а результат ушёл в никуда.
            В теле PR так и пиши: «целевые тесты зелёные, полный набор — за CI».

            ЗАПРЕЩЕНО (нарушения блокируют коммит):
            ${{ steps.ctx.outputs.RULES }}

            ПРАВИЛА GIT (СТРОГО):
            - НИКОГДА не делай git push origin main — это сломает прод
            - Всегда создавай ветку: git checkout -b claude/issue-${{ github.event.issue.number }}
            - После реализации: git push origin claude/issue-${{ github.event.issue.number }}
            - Открой PR в main через gh pr create с описанием что сделано
            - В body PR укажи «Closes #${{ github.event.issue.number }}» — GitHub закроет issue при мерже
            - PR создаётся как draft: gh pr create --draft

      # ── Расход руки — в книги (аудит 15.10, AC-1) ──────────────────────
      # К работе учёта usage-books уезжают ОДНИ СЧЁТЧИКИ, а не файл выполнения.
      # Файл выполнения — полный транскрипт агента: выводы Bash и Read, тексты
      # чужих issues, логи CI. Репозиторий публичный, артефакт скачивает любой
      # пользователь GitHub, а маски секретов в файлах артефакта нет — она есть
      # только в логе. Поэтому выжимка собирается здесь, белым списком полей:
      # тип сообщения, total_cost_usd, modelUsage (четыре счётчика на модель),
      # у ответа модели — id, модель и четыре счётчика usage. Текста, content и
      # tool_use в ней нет; не число на месте числа и не имя на месте имени —
      # null, и учёт назовёт расход неразобранным. Агент может переписать
      # числа — сервер проверит их схемой. Секрета учёта (CRON_SECRET) в этой
      # работе нет и быть не должно: у агента Bash на этом раннере. Отказ
      # выжимки или загрузки не красит руку — потерю назовёт учёт.
      - name: Выжимка расхода руки — одни счётчики
        if: always() && steps.hand.outcome != 'skipped'
        continue-on-error: true
        env:
          HAND_EXECUTION_FILE: ${{ steps.hand.outputs.execution_file }}
        run: |
          src="${HAND_EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          dst="$RUNNER_TEMP/hand-usage/hand-usage.json"
          mkdir -p "$RUNNER_TEMP/hand-usage"
          rm -f "$dst" "$dst.tmp"
          if [ ! -f "$src" ]; then
            echo "Файла выполнения нет — выжимать нечего; что это значит, скажет учёт"
            exit 0
          fi
          if ! jq -c '
            def n: if type == "number" then . else null end;
            def ident: if type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._:@/\\[\\]-]{0,127}$") then . else null end;
            def model_usage: if type == "object" then {inputTokens: (.inputTokens | n), outputTokens: (.outputTokens | n), cacheCreationInputTokens: (.cacheCreationInputTokens | n), cacheReadInputTokens: (.cacheReadInputTokens | n)} else null end;
            def msg_usage: if type == "object" then {input_tokens: (.input_tokens | n), output_tokens: (.output_tokens | n), cache_creation_input_tokens: (.cache_creation_input_tokens | n), cache_read_input_tokens: (.cache_read_input_tokens | n)} else null end;
            if type == "array" then [ .[] | objects |
              if .type == "result" then
                {type: "result", total_cost_usd: (.total_cost_usd | n),
                 modelUsage: (if (.modelUsage | type) == "object" then (.modelUsage | with_entries({key: (.key | ident // ""), value: (.value | model_usage)})) else null end)}
              elif .type == "assistant" and (.message | type) == "object" then
                {type: "assistant", message: {id: (.message.id | ident), model: (.message.model | ident), usage: (.message.usage | msg_usage)}}
              else empty end
            ] else null end
          ' "$src" > "$dst.tmp"; then
            echo "::warning::Файл выполнения руки не выжат: jq его не прочёл — учёт назовёт расход неразобранным"
            echo '{"hands_usage":"unreadable"}' > "$dst.tmp"
          fi
          mv "$dst.tmp" "$dst"

      - name: Счётчики расхода руки — к учёту
        if: always() && steps.hand.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: hand-usage
          path: ${{ runner.temp }}/hand-usage/hand-usage.json
          if-no-files-found: warn
          retention-days: 1
          overwrite: true

  # ── Расход руки — в книги llm_usage_log (аудит 15.10, AC-1) ─────────────
  #
  # Руки считают ключом Anthropic мимо logLLMUsage, и их расход до книг не
  # доходил: дневной бюджет (llm-budget-check) по ним не мог сработать. Здесь
  # выжимка файла выполнения (одни счётчики, собрана в работе руки) разбирается
  # (scripts/hands-usage.mjs), и строки уходят на прод
  # (POST /api/admin/llm-usage/report) с CRON_SECRET. Цену, включая кэш
  # подсказок, считает прод; заявление экшена (total_cost_usd) — в сводку
  # прогона для сверки, в книги не пишется.
  #
  # Отдельная работа на чистом раннере, а не шаг рядом с рукой: CRON_SECRET
  # открывает /api/admin/* на проде (§7), а у агента Bash — шаг после него
  # исполнял бы файл, который агент мог переписать. Скрипт берётся из main,
  # а не из рабочей копии руки. Сторож: tests/unit/llm-usage-reaches-books.test.ts.
  usage-books:
    needs: claude
    if: always() && needs.claude.outputs.hand_outcome != '' && needs.claude.outputs.hand_outcome != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Скрипт учёта из main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: scripts/hands-usage.mjs
          sparse-checkout-cone-mode: false

      # Артефакта нет — экшен файла не оставил, или выжимка либо загрузка не
      # удались; потеря это или «рука не дошла до модели», решает учёт по
      # HAND_EXECUTION_FILE, а не этот шаг.
      - name: Счётчики расхода руки — из работы руки
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: hand-usage
          path: ${{ runner.temp }}/hand

      - name: Расход руки — в книги
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AGENT_ID: claude
          EXECUTION_FILE: ${{ runner.temp }}/hand/hand-usage.json
          HAND_EXECUTION_FILE: ${{ needs.claude.outputs.execution_file }}
        run: node scripts/hands-usage.mjs --run
