# Снимки мест живут в объектном хранилище, а не в базе.
#
# ── Зачем расписание, а не рука ───────────────────────────────────────────
#
# 18.09 владелец спросил «фото все на s3?». Ответ был: ни одного. Переезд
# (`POST /api/cron/images-to-s3`) был НАПИСАН ещё 08.09 и написан осторожно —
# залить, прочитать обратно, сверить размер, и только потом обнулить байты в
# базе. Но позвать его было нечем: ни расписания, ни маркера. Он числился
# ручным и не запускался ни разу, а таблица снимков доросла до 441,8 МБ при
# базе 882,2 — ровно половина.
#
# Это третий случай за сутки одной и той же болезни: механизм есть, хода до
# прода у него нет (миграция без CI, фильтр фотографий с чужим списком родов,
# переезд без вызова). Поэтому правило владельца 18.09 — «фото всегда на
# S3» — заведено не абзацем, а расписанием: у обещания должен быть
# производитель.
#
# ── Почему уборщик, а не только правка писателей ──────────────────────────
#
# Писатели снимков (`admin/places/[id]/photo`, `wiki-candidates`, миграции с
# кадрами владельца) кладут байты в базу. Их можно переучить по одному — и
# каждый следующий писатель снова забудет. Уборщик закрывает класс: что бы
# в базу ни легло, к следующему прогону оно уедет в хранилище.
#
# Он не отменяет правки писателей, он делает их необязательными для
# правильности. Сторож `photos-live-on-s3` держит связку: расписание есть,
# адрес тот самый, партия и причина на месте.
#
# ── Почему раз в сутки и вне пика ─────────────────────────────────────────
#
# Спешить некуда: снимок, пролежавший в базе лишние часы, ничего не ломает.
# Прогон идёт партиями по 10 до исчерпания, ночью по UTC — это утро Камчатки
# до выхода людей на маршруты, и заливка не делит полосу с полевым трафиком.
name: Cron — снимки мест в хранилище

on:
  schedule:
    - cron: '41 18 * * *'
  workflow_dispatch:

concurrency:
  # Та же группа, что у ручного актуатора images-repack: две руки на одной
  # таблице снимков — это гонка, в которой одна партия читает байты, которые
  # другая уже обнулила.
  group: images-repack
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Перевезти остаток снимков в хранилище
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE: https://vedarai.ru
        run: |
          set -u
          if [ -z "${CRON_SECRET:-}" ]; then
            echo '::error::CRON_SECRET не задан в секретах репозитория'
            exit 1
          fi

          REASON='Плановый перенос снимков мест в объектное хранилище: правило владельца 18.09 — фото всегда на S3, в базе байтам не место'
          TOTAL=0
          ROUND=0

          while [ "$ROUND" -lt 40 ]; do
            ROUND=$((ROUND + 1))
            CODE=$(curl -s -o /tmp/s3.json -w '%{http_code}' --max-time 300 \
              -X POST "$BASE/api/cron/images-to-s3" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H 'Content-Type: application/json' \
              -d "{\"reason\": \"$REASON\", \"dry_run\": false}" || echo 000)

            if [ "$CODE" != '200' ]; then
              echo "::error::переезд ответил HTTP $CODE на партии $ROUND"
              head -c 1000 /tmp/s3.json || true
              exit 1
            fi

            read -r DID FAILED LEFT < <(
              python3 - <<'PY'
          import json
          a = json.load(open('/tmp/s3.json'))
          print(a.get('moved_count', 0), a.get('failed_count', 0), a.get('pending_before', 0))
          PY
            )
            TOTAL=$((TOTAL + DID))
            echo "партия $ROUND: перевезено $DID, не смог $FAILED, оставалось до партии $LEFT"

            # Ни одной перевезённой строки — либо всё уже в хранилище, либо
            # каждая партия падает. Крутить дальше бессмысленно, и «нечего
            # везти» здесь honest: pending_before печатается рядом.
            [ "$DID" -gt 0 ] || break
          done

          {
            echo '### Снимки мест в хранилище'
            echo "- перевезено за прогон: **$TOTAL**"
            echo "- партий: $ROUND"
            echo ''
            echo 'Последний ответ:'
            echo '```json'
            python3 -m json.tool /tmp/s3.json 2>/dev/null | head -c 4000 || head -c 4000 /tmp/s3.json
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
