name: Связность своего роутера по регионам (вручную)

# Разовая диагностика (владелец 29.08). Приёмка нашла disconnected для
# Петропавловск→Эссо; полная пересборка графа (import-road-graph run 7,
# 40989 узлов/50367 рёбер) разрыв не починила — значит дело не в неаккуратном
# импорте, а в самих данных OSM/фильтре highway для этого участка.
#
# Перед тем как чинить один конкретный разрыв, нужно знать масштаб: сколько
# из 10 регионов платформы (lib/geo/regions.ts) вообще достижимы по нашему
# графу от Петропавловска, и где именно рвётся связность на линии к Эссо —
# рядом со стыком плиток (широта 55.5) или где-то ещё.
#
# READ-ONLY: GET-запросы к нашему публичному /api/routing/path. Секрет не
# нужен. Только workflow_dispatch — инструмент разбора, не наблюдение.

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Связность до центров всех 10 регионов
        run: |
          BASE="https://vedarai.ru/api/routing/path"
          FROM_LAT="53.0195"
          FROM_LNG="158.6494"

          run() {
            local label="$1" to_lat="$2" to_lng="$3"
            echo "── ${label} ──"
            curl -sS -w '\nHTTP %{http_code} · %{time_total}s\n' --max-time 30 \
              "${BASE}?from_lat=${FROM_LAT}&from_lng=${FROM_LNG}&to_lat=${to_lat}&to_lng=${to_lng}&mode=car"
            echo
            echo
          }

          echo "=== Регионы (lib/geo/regions.ts, REGIONS_LIST) ==="
          run "avacha-group (Авачинская группа)"        53.26  158.83
          run "mutnovsky-gorely (Мутновский/Горелый)"    52.45  158.19
          run "nalychevo (Налычево)"                     53.52  159.2
          run "klyuchevskoy (Ключевская группа)"         56.07  160.64
          run "south-kamchatka (Южная Камчатка)"         51.5   157.4
          run "paratunka (Паратунка/Малки)"               52.9   158.17
          run "esso-bystrinsky (Эссо/Быстринский)"        55.93  158.7
          run "kronotsky (Кроноцкий — офиц. только вертолёт)" 54.45 160.6
          run "commander-islands (Командорские острова)"  55.2   166.3
          run "central-volcanoes (Центральные вулканы)"   54.05  159.44

      - name: Бисекция линии Петропавловск → Эссо (грубая, по прямой)
        run: |
          BASE="https://vedarai.ru/api/routing/path"
          FROM_LAT="53.0195"
          FROM_LNG="158.6494"

          run() {
            local label="$1" to_lat="$2" to_lng="$3"
            echo "── ${label} ──"
            curl -sS -w '\nHTTP %{http_code} · %{time_total}s\n' --max-time 30 \
              "${BASE}?from_lat=${FROM_LAT}&from_lng=${FROM_LNG}&to_lat=${to_lat}&to_lng=${to_lng}&mode=car"
            echo
            echo
          }

          echo "=== Бисекция: где рвётся связность на пути к Эссо ==="
          # Линейная интерполяция 53.0195,158.6494 -> 55.93,158.70 по широте
          run "20% пути (~53.6)"  53.60  158.66
          run "40% пути (~54.2)"  54.20  158.67
          run "50% пути (~54.5)"  54.50  158.67
          run "60% пути (~54.8)"  54.80  158.68
          run "70% пути (~55.0, стык плиток 2/3)" 55.05  158.68
          run "80% пути (~55.3)"  55.30  158.69
          run "90% пути (~55.6)"  55.60  158.69
