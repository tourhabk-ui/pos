name: Deploy to Timeweb Cloud

# Quality gate: runs only after CI succeeds on main.
# Manual dispatch bypasses the CI gate (e.g. force-redeploy without code change).
#
# Timeweb auto-deploy IS enabled but this workflow is the authoritative trigger:
# 1. CI passes → this workflow fires → POST /deploy → polls until healthy
# This removes the dependency on Timeweb's GitHub webhook and makes
# the CI→deploy pipeline explicit and observable.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
      APP_ID: "175477"
      BASE: "https://api.timeweb.cloud/api/v1"
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Trigger Timeweb redeploy
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::TIMEWEB_TOKEN secret is not set"
            exit 1
          fi

          HTTP=$(curl -s -o /tmp/deploy.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"commit_sha\": \"$COMMIT_SHA\"}" \
            "$BASE/apps/$APP_ID/deploy")

          echo "POST /deploy → HTTP $HTTP"
          cat /tmp/deploy.json | python3 -m json.tool 2>/dev/null | head -20 || cat /tmp/deploy.json

          if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then
            echo "Deploy triggered via API."
          else
            echo "::warning::API trigger returned HTTP $HTTP — Timeweb auto-deploy webhook should handle it."
          fi

      - name: Poll until healthy (max 6 min)
        run: |
          echo "Waiting for deploy to complete..."
          for i in $(seq 1 36); do
            sleep 10
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 \
              https://vedarai.ru/api/health 2>/dev/null || echo "0")
            echo "[${i}0s] /api/health → $HTTP"
            if [ "$HTTP" = "200" ]; then
              echo ""
              echo "════════════════════════════════════════════"
              echo "  DEPLOYED — https://vedarai.ru"
              echo "════════════════════════════════════════════"
              exit 0
            fi
          done
          echo "::warning::Health check timed out (6 min) — check Timeweb panel"
          echo "https://app.timeweb.cloud/apps/$APP_ID"
