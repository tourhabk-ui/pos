name: Deploy to Timeweb Cloud

# ── Схема выката: только проверенный коммит (аудит 15.10, находка AR-deploy) ──
#
# Push в main → CI (на все пути, без фильтра — ci.yml) → по ЗЕЛЁНОМУ прогону
# этот workflow просит Timeweb собрать ровно тот коммит, который CI проверил
# (EXPECTED_SHA = workflow_run.head_sha, POST /api/v1/apps/198048/deploy
# {commit_sha}), и сверяет, что прод его отдаёт. Красный CI на main — выката
# нет, и джоб ci-red-alert ниже говорит об этом владельцу (Telegram + issue):
# иначе прод молча застыл бы на прошлой сборке.
#
# Автодеплой Timeweb (is_auto_deploy) по этой схеме ВЫКЛЮЧЕН: вебхук выкатывал
# каждый пуш, включая непроверенные и авто-коммиты README-stats (замер 15.10:
# 805 коммитов в main за 7 дней, 183 из них [skip ci]). Выключается маркером
# .github/triggers/timeweb-configure.json, задача auto_deploy (там же откат —
# `auto_deploy: true`). Включён он или нет, шаг «Ask Timeweb» ниже СПРАШИВАЕТ
# у API на каждом прогоне, а не читает этот комментарий (урок 17.08 ниже).
#
# Ручной выкат — workflow_dispatch: собирает голову main и гейт CI обходит.
# Это рука владельца, а не путь по умолчанию.
#
# Подтверждённый выкат оставляет ЗАПИСЬ: GitHub Deployment в окружении
# vedarai.ru с sha, который сверка признала работающим на проде (шаг «Запись
# выката», 15.10). По ней scripts/wait-for-deploy.sh у трёх десятков
# workflow отвечает «тот ли код на проде» точно, а не по времени сборки:
# без автодеплоя образ предыдущего коммита кончается позже пуша нашего на
# 15–60 минут, и built_at его от нашего не отличает. Сверка не подтвердила —
# записи нет: запись говорит о проде, а не о намерении.
#
# Env vars управляются через Timeweb UI. (Скрипта scripts/sync-timeweb-envs.js,
# на который ссылалась эта строка, в репозитории нет — снято 04.09.)
#
# 04.08 — почему здесь появилось ожидание вместо одного curl.
# Прежний шаг спрашивал статус приложения ЧЕРЕЗ СЕКУНДУ после старта сборки,
# печатал «Status: deploy» (это «идёт сборка») и завершался зелёным. Никто
# никогда не проверял, ЧЕМ кончилась сборка. Итог: пять смерженных PR подряд,
# зелёные галочки везде, а прод сутки отдавал старый контейнер — владелец
# третий день видел на телефоне баги, которые в main давно исправлены.
# «Задеплоено» подтверждалось словом, а не фактом.
#
# Теперь ждём терминального статуса и сверяем commit_sha приложения с тем, что
# в main. Не совпало или сборка упала — workflow краснеет.
#
# 16–17.08 — этот шаг отработал ровно так, как задуман, и это стоит записать.
# Timeweb собирал и поднимал контейнер УСПЕШНО, но брал revision `8c891a8` от
# 07:54 — сутки подряд, четыре прогона подряд, по 40 опросов в каждом. Прод всё
# это время отдавал каталог с ошибкой 42702 и рисовал на карте линию через весь
# край, хотя оба фикса лежали в main. Со стороны GitHub исправно было всё:
# приложение установлено, доступ к репозиторию есть, права на хуки есть —
# а доставок по вебхуку не было с 12:35 (тикет поддержки 12479061).
#
# И вот чего стоит комментарий вместо факта. Строка выше про
# «is_auto_deploy: true» пролежала здесь месяцами как самоочевидная. Когда её
# наконец СПРОСИЛИ у API (.github/workflows/timeweb-app-info.yml), выяснилось,
# что значение живое: 17.08 в 06:05 — True, в 07:43, после переподключения
# репозитория по инструкции поддержки, — False. Процедура восстановления
# молча погасила автодеплой. Настройки приложения проверять запросом, а не
# чтением этого файла.
#
# Вывод на будущее: зелёная сборка у провайдера не означает, что выложен наш
# коммит. Единственное доказательство — сверка commit_sha ниже.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Заголовок тревоги «выкат остановлен» — один на оба джоба: ci-red-alert её
# открывает, успешный выкат закрывает. Два литерала разошлись бы, и закрытие
# молча перестало бы находить открытое.
#
# Окружение записи выката — тоже одно имя на двоих: его пишет шаг «Запись
# выката», а читает scripts/wait-for-deploy.sh (там то же умолчание; паритет
# держит сторож wait-for-deploy-record исполнением скрипта). Имя — домен, а не
# «production»: так запись ни с чем чужим не смешается.
env:
  STOP_ISSUE_TITLE: 'Выкат остановлен: CI на main красный'
  DEPLOY_ENVIRONMENT: vedarai.ru

jobs:
  deploy:
    runs-on: ubuntu-latest
    # issues: write — только чтобы закрыть тревогу о красном CI после выката.
    # deployments: write — запись выката после сверки (15.10).
    permissions:
      contents: read
      issues: write
      deployments: write
    # Потолок задачи должен быть БОЛЬШЕ суммы всех окон ожидания внутри неё,
    # иначе он и есть настоящее окно, а цифры ниже — украшение. Считаем
    # худший случай: фаза 1 — 20 минут, фаза 2 — 45 (измерено 07.09: сборка
    # шла 26 минут), сверка ответа сайта — 15. Итого 80 плюс запас.
    #
    # Сверка выросла с 5 до 15 минут 19.09, и вот почему она и есть настоящее
    # окно ожидания. Фазы 1 и 2 спрашивают ПАНЕЛЬ, а панель отвечает про свой
    # запрос: в прогоне 1823 она сказала `status=active commit=680e0ec` через
    # ОДНУ секунду после старта, и обе фазы прошли мгновенно, не подождав ни
    # секунды. Весь настоящий выкат — те самые 7-9 минут — пришёлся на третью
    # проверку, у которой бюджета было пять.
    timeout-minutes: 95
    # Выкатывается только прогон CI по ПУШУ в main из этого же репозитория
    # (аудит 15.10, AR-deploy). Фильтр `branches: [main]` у workflow_run
    # сверяет лишь ИМЯ ветки: PR из форка, чья ветка названа main, проходит
    # его так же, и без этих двух условий его зелёный CI заказал бы у
    # Timeweb сборку чужого коммита — GitHub отдаёт коммиты форков и по
    # адресу основного репозитория.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      # История нужна ДО проверки: подтверждение «прод содержит наш коммит»
      # считается по предкам, а не по совпадению строк (см. ниже).
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # ── Сборку просим САМИ, а не ждём чужого решения ───────────────────
      #
      # 17.08 выкладка встала дважды за день, и оба раза не по нашей вине.
      # Утром вебхук молчал сутки. Вечером GitHub доставил пуш, Timeweb ответил
      # «успешно» — и не начал сборку: панель показывала последний коммит
      # четырёхчасовой давности, а очередь стояла после четырёх подряд упавших
      # сборок.
      #
      # Пока единственный запуск — реакция чужого приложения на событие, у нас
      # нет ни способа её вызвать, ни способа отличить «не дошло» от «дошло и
      # проигнорировано». Просьба напрямую снимает обе неизвестности.
      #
      # Шаг НЕ роняет прогон при отказе: если вебхук всё-таки сработал, сборка
      # уже идёт, и вторая просьба лишь вернёт ошибку. Судит по-прежнему сверка
      # ниже — по факту того, что отдаёт САЙТ. Здесь только попытка и запись
      # ответа, чтобы в следующий раз не гадать.
      #
      # 24.08: пустое тело `{}` API не принимал НИКОГДА — 400 на каждом
      # прогоне, с самого создания шага. Причина в собственном ответе API:
      #   "commit_sha should not be null or undefined",
      #   "commit_sha must match ^[0-9a-f]{40}$ regular expression".
      # То есть просьба о сборке не работала ни разу; всё это время
      # деплой держался ЦЕЛИКОМ на вебхуке Timeweb. commit_sha теперь в теле.
      - name: Ask Timeweb to build this commit
        id: ask
        env:
          TIMEWEB_TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          APP_ID="198048"

          if [ -z "$TIMEWEB_TOKEN" ]; then
            echo "::warning::TIMEWEB_TOKEN не задан — заказать сборку проверенного коммита нечем. При выключенном автодеплое прод так не обновится; сверка ниже это покажет."
            exit 0
          fi

          # Тело ответа печатается урезанным: в нём приходит объект приложения,
          # а у него в настройках живут переменные окружения прода.
          ask() {
            CODE=$(curl -sS -o /tmp/deploy-ask.json -w "%{http_code}" --max-time 60 \
              -X POST -H "Authorization: Bearer $TIMEWEB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"commit_sha\":\"$EXPECTED_SHA\"}" "$1") || CODE="000"
            echo "POST $1 -> $CODE"
            head -c 200 /tmp/deploy-ask.json 2>/dev/null || true
            echo ""
          }

          # ── Не гасить чужую сборку (24.09) ──────────────────────────────
          #
          # Каждый коммит собирался ДВАЖДЫ: сразу вебхуком Timeweb и ещё раз
          # этой просьбой — через 15 минут, после CI. Timeweb новую сборку
          # запускает, ОСТАНАВЛИВАЯ идущую. Итог 24.09: восемь сборок подряд
          # в статусе stopped, прод три часа на образе 07:47 при двенадцати
          # мержах — просьба про СТАРЫЙ коммит гасила уже идущую сборку более
          # нового (вебхук успевал взять голову main, в том числе авто-коммит
          # README-stats). Просим только когда просить есть о чём:
          #  1) main ушёл вперёд — нашу правку повезёт более новая сборка
          #     (вебхук или прогон этого workflow про новую голову);
          #  2) Timeweb уже собирает или собрал коммит, содержащий наш.
          # Отказ проверки — не повод молчать: тогда просим, как раньше.
          #
          # ── Правило 1 — только пока автодеплой ВКЛЮЧЁН (аудит 15.10) ────
          #
          # «Повезёт более новая сборка» держалось на вебхуке: он собирал
          # голову main, какой бы она ни была. С выключенным автодеплоем
          # голову не соберёт никто, пока её не проверит CI, а авто-коммит
          # README-stats [skip ci] — почти всегда голова main через минуту
          # после мержа — CI не проходит НИКОГДА. Прогон 38716588819 (15.10)
          # так и написал: «main ушёл вперёд (e8bef39) — сборку не просим».
          # Без автодеплоя такой пропуск оставил бы прод на прошлой сборке
          # навсегда. Поэтому настройку спрашиваем у API на каждом прогоне
          # (урок 17.08: переподключение репозитория молча её меняло), и при
          # `false` или «не прочитали» просим сборку проверенного коммита.
          # Правило 2 остаётся в силе всегда: более новый коммит, который
          # Timeweb уже собирает, этой просьбой не гасится.
          #
          # Из ответа берётся одно поле: в объекте приложения лежат
          # переменные окружения прода, и печатать его нельзя.
          AUTO=$(curl -sS --max-time 30 -H "Authorization: Bearer $TIMEWEB_TOKEN" \
            "https://api.timeweb.cloud/api/v1/apps/$APP_ID" 2>/dev/null \
            | jq -r 'if (.app.is_auto_deploy | type) == "boolean" then (.app.is_auto_deploy | tostring) else "unknown" end' 2>/dev/null || true)
          [ -n "$AUTO" ] || AUTO="unknown"
          echo "Автодеплой Timeweb (is_auto_deploy): $AUTO"
          if [ "$AUTO" = "true" ]; then
            echo "::warning::Автодеплой Timeweb ВКЛЮЧЁН: вебхук выкатывает каждый пуш в main, в том числе не прошедший CI. Выключение — маркер timeweb-configure.json, задача auto_deploy (CLAUDE.md §6)."
            git fetch --quiet origin main || true
            HEAD_MAIN=$(git rev-parse origin/main 2>/dev/null || echo "")
            if [ -n "$HEAD_MAIN" ] && [ "${HEAD_MAIN:0:7}" != "${EXPECTED_SHA:0:7}" ] \
               && git merge-base --is-ancestor "$EXPECTED_SHA" "$HEAD_MAIN" 2>/dev/null; then
              echo "main ушёл вперёд (${HEAD_MAIN:0:7}) — сборку не просим, её повезёт вебхук по новой голове. Судит проверка ниже."
              exit 0
            fi
          else
            echo "Сборку проверенного коммита ${EXPECTED_SHA:0:7} заказываем сами: голова main, ушедшая вперёд, ещё не проверена CI (или это README-stats [skip ci], который его не проходит)."
          fi
          LIST=$(curl -sS --max-time 30 -H "Authorization: Bearer $TIMEWEB_TOKEN" \
            "https://api.timeweb.cloud/api/v1/apps/$APP_ID/deploys?limit=5&offset=0" 2>/dev/null || echo "")
          COVERING=$(printf '%s' "$LIST" | jq -r '(.deploys // .app_deploys // [])[] | select(.status == "building" or .status == "deploy" or .status == "success" or .status == "active") | "\(.status) \(.commit_sha // .commit.sha // "")"' 2>/dev/null || true)
          while read -r ST C; do
            [ -n "$C" ] || continue
            if [ "${C:0:7}" = "${EXPECTED_SHA:0:7}" ] || \
               { git cat-file -e "${C}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$EXPECTED_SHA" "$C" 2>/dev/null; }; then
              echo "Timeweb уже $ST коммит ${C:0:7}, содержащий наш — вторую сборку не просим (она остановила бы эту)."
              exit 0
            fi
          done <<< "$COVERING"

          # Время заказа — ДО запроса: образ, начатый позже него, собран по
          # нашему заказу или по более новому (сверка ниже, 15.10).
          ORDERED_AT=$(date +%s)
          ask "https://api.timeweb.cloud/api/v1/apps/$APP_ID/deploy"

          # Путь взят из документации провайдера (метод createDeploy) и из этой
          # среды не проверялся. Если версия API другая — пробуем вторую и
          # оставляем код в логе: следующий разбор начнётся не с нуля.
          if [ "$CODE" = "404" ] || [ "$CODE" = "405" ]; then
            ask "https://api.timeweb.cloud/api/v2/apps/$APP_ID/deploy"
          fi

          case "$CODE" in
            2*) echo "Сборка запрошена."
                echo "ordered_at=$ORDERED_AT" >> "$GITHUB_OUTPUT" ;;
            *)  echo "::warning::Timeweb не принял просьбу о сборке ($CODE). При выключенном автодеплое другой сборки не будет; судит проверка ниже." ;;
          esac

      - name: Verify deploy reached production
        id: verify
        env:
          TIMEWEB_TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
          # SHA коммита, ради которого этот прогон запущен. Для workflow_run это
          # голова main на момент запуска CI, а не head самого workflow-файла.
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Время нашего заказа сборки (epoch); пусто — сборку не заказывали.
          ORDERED_AT: ${{ steps.ask.outputs.ordered_at }}
          # Гейт схемы (аудит 15.10, A08): warn — отказ наката называется
          # ::error, но запись выката пишется; block — выкат не признаётся.
          # Включается двумя шагами: пока прод ни разу не назвал
          # migrations.state, постоянно падающая старая миграция заперла бы
          # КАЖДЫЙ выкат и все ожидания по записи разом. block — после того,
          # как prod-check увидит на проде migrations.state = ok.
          MIGRATIONS_GATE: warn
        run: |
          # 29.07: 175477 отдавал 404. Настоящий id получен из GET /api/v1/apps
          # (name=Tourhab). Проверка статуса деплоя была мертва из-за константы.
          APP_ID="198048"

          if [ -z "$TIMEWEB_TOKEN" ]; then
            echo "TIMEWEB_TOKEN не задан — подтвердить деплой нечем."
            echo "Это не «всё хорошо», а «проверить невозможно»: добавь токен в секреты репозитория."
            exit 1
          fi

          echo "Приложение $APP_ID, ждём коммит ${EXPECTED_SHA:0:7}"

          # Успех — «прод СОДЕРЖИТ наш коммит», а не «прод РАВЕН нашему».
          #
          # 16.08: мерж 7609965 и авто-коммит счётчиков README легли в main с
          # разницей в минуты. Timeweb собирает голову ветки, а не конкретный
          # коммит, — он собрал 22ae4d1 (потомок 7609965), прод получил фикс,
          # а проверка ждала ровно 7609965, не дождалась за 20 минут и
          # покраснела. Двадцать минут ожидания того, что уже произошло.
          #
          # Ложная тревога здесь дороже, чем кажется: она неотличима от
          # настоящего «автодеплой не сработал», и следующая такая же будет
          # прочитана как шум. Поэтому обгон более новым коммитом — успех,
          # а вот прод БЕЗ нашего коммита (откат, застрявшая сборка) —
          # по-прежнему провал.
          contains_expected() {
            CANDIDATE="$1"
            [ -n "$CANDIDATE" ] || return 1
            [ "${CANDIDATE:0:7}" = "${EXPECTED_SHA:0:7}" ] && return 0
            # Коммита может не быть в клоне: собрано не из этой ветки или
            # история ушла вперёд. Дотягиваем точечно, молча.
            git cat-file -e "${CANDIDATE}^{commit}" 2>/dev/null \
              || git fetch --quiet origin "$CANDIDATE" 2>/dev/null \
              || return 1
            git merge-base --is-ancestor "$EXPECTED_SHA" "$CANDIDATE" 2>/dev/null
          }

          # Две фазы, а не одна. Первый вариант этой проверки спрашивал статус
          # через секунду после мержа, видел «active» на ПРОШЛОМ коммите, считал
          # это терминальным состоянием и краснел: сборка ещё не начиналась, а
          # он уже вынес приговор (прогон 05.08 00:40 по 822a9b8). Ждать надо не
          # «любого терминального статуса», а появления НУЖНОГО коммита.
          ATTEMPTS=40
          SLEEP=30
          # Фаза 2 ждёт ДОЛЬШЕ фазы 1, и это измерено, а не прикинуто.
          #
          # 07.09: прогон 1609 попросил сборку 63a1ab0 в 13:17 UTC, ждал
          # рабочего состояния 40 опросов по 30 секунд и в 13:39 объявил:
          # «Сборка не дошла до рабочего состояния. Прод остаётся на прежнем
          # контейнере». Панель Timeweb показывает по тому же коммиту
          # «Успешно», а /version.json прода отвечает built_at=13:43:16Z.
          # То есть сборка шла 26 минут и закончилась успехом — workflow
          # разминулся с ней на четыре минуты и покрасил живой выкат в
          # провал.
          #
          # Цена такой ошибки записана выше в этом же файле: ложная тревога
          # здесь НЕОТЛИЧИМА от настоящего «автодеплой не сработал», и
          # следующая настоящая будет прочитана как шум. Поэтому окно фазы 2
          # — 45 минут: почти вдвое больше измеренных 26, с запасом на
          # сборку потяжелее и на очередь у провайдера.
          #
          # Фазу 1 не трогаем: там ждут, когда Timeweb ВОЗЬМЁТ коммит, а это
          # событие быстрое; двадцати минут ему хватало всегда.
          BUILD_ATTEMPTS=90
          STATUS="unknown"
          COMMIT=""

          poll() {
            HTTP=$(curl -s -o /tmp/app_status.json -w "%{http_code}" \
              -H "Authorization: Bearer $TIMEWEB_TOKEN" \
              "https://api.timeweb.cloud/api/v1/apps/$APP_ID") || HTTP="000"
            [ "$HTTP" = "200" ] || return 1
            STATUS=$(python3 -c "import json;print(json.load(open('/tmp/app_status.json'))['app']['status'])" 2>/dev/null || echo "unknown")
            COMMIT=$(python3 -c "import json;print(json.load(open('/tmp/app_status.json'))['app'].get('commit_sha') or '')" 2>/dev/null || echo "")
            return 0
          }

          # Фаза 1: Timeweb взял наш коммит в работу.
          PICKED=""
          for i in $(seq 1 $ATTEMPTS); do
            if poll; then
              echo "[ожидание коммита $i/$ATTEMPTS] status=$STATUS commit=${COMMIT:0:7}"
              if contains_expected "$COMMIT"; then PICKED=1; break; fi
            else
              echo "[ожидание коммита $i/$ATTEMPTS] API недоступен (HTTP $HTTP)"
            fi
            sleep $SLEEP
          done

          if [ -z "$PICKED" ]; then
            echo "::error::Timeweb за 20 минут не взял в работу ни ${EXPECTED_SHA:0:7}, ни его потомка (сейчас ${COMMIT:0:7}). Сборку никто не заказал или заказ не принят: смотри код POST в шаге «Ask Timeweb» выше; при включённом автодеплое — ещё и webhook приложения."
            exit 1
          fi

          if [ "${COMMIT:0:7}" != "${EXPECTED_SHA:0:7}" ]; then
            echo "Собран ${COMMIT:0:7} — более новый коммит, содержащий ${EXPECTED_SHA:0:7}. Это успех: наши изменения в проде."
          fi

          # Фаза 2: сборка этого коммита дошла до конца.
          #
          # Отказ API отличается от провала сборки (аудит 08.09,
          # missing_third_state). `poll || true` оставляет ПРЕЖНИЙ статус, и
          # если панель не ответила ни разу, цикл истощался, а итог краснел
          # словами «сборка не дошла» — приговор сборке по молчанию панели.
          # Для сайта третий исход в этом же файле давно есть («НЕ СМОГЛИ
          # ПОДТВЕРДИТЬ фактом сайта»), а для панели не было.
          POLL_FAILS=0
          for i in $(seq 1 $BUILD_ATTEMPTS); do
            case "$STATUS" in
              deploy|build|building|deploying|pending|created)
                echo "[сборка $i/$BUILD_ATTEMPTS] status=$STATUS"
                sleep $SLEEP
                if poll; then POLL_FAILS=0; else POLL_FAILS=$((POLL_FAILS+1)); fi
                continue
                ;;
            esac
            break
          done

          # Панель молчит подряд — судить сборку по её молчанию нельзя.
          # Пять отказов выбраны как «не разовая сетевая икота»: при паузе в
          # 30 секунд это две с половиной минуты подряд без единого ответа.
          if [ "$POLL_FAILS" -ge 5 ]; then
            echo "::warning::НЕ СМОГЛИ ПОДТВЕРДИТЬ панелью: последние $POLL_FAILS опросов API Timeweb не ответили. Это не приговор сборке — судит проверка сайта ниже."
            STATUS="unknown_api"
          fi

          echo "Итог: status=$STATUS commit=${COMMIT:0:7} ожидался ${EXPECTED_SHA:0:7}"
          echo "Сайт: https://vedarai.ru"

          case "$STATUS" in
            started|running|deployed|active|ok)
              ;;
            unknown_api)
              # Третий исход: панель не отвечала. Идём к проверке сайта —
              # она судит по факту того, что отдаёт прод, а не по мнению API.
              echo "Статус сборки НЕИЗВЕСТЕН: панель молчала. Последнее слово — за сайтом."
              ;;
            *)
              echo "::error::Сборка не дошла до рабочего состояния: status=$STATUS. Прод остаётся на прежнем контейнере."
              exit 1
              ;;
          esac

          # Последнее слово — за самим сайтом, а не за панелью. /version.json
          # пишется в образ на сборке (см. Dockerfile), поэтому отвечает на
          # вопрос «какой контейнер СЕЙЧАС отдаёт страницы», а не «что панель
          # думает о последней сборке». Именно этого различия и не хватало.
          # ВРЕМЯ СБОРКИ — второй свидетель, и он работает, когда первый молчит.
          #
          # 07.09: прод отдавал образ built_at=10:55, тогда как проверяемый
          # коммит лёг в main в 11:30 — то есть контейнер физически не мог
          # содержать наш код. Панель при этом сообщала active на нашем
          # коммите через 33 секунды после запроса сборки (столько она не
          # собирается): поле commit у панели — эхо ЗАПРОСА, а не то, что
          # работает. Проверка ниже верила этому эху дословно.
          #
          # built_at врать не может: его пишет сам образ на сборке
          # (Dockerfile → scripts/write-version.js), и он приезжает в том же
          # ответе, что и `unknown`. Сравнение с временем нашего коммита даёт
          # ответ там, где sha не установлен: образ СТАРШЕ коммита — значит
          # не доехал, и это не «не знаю».
          #
          # Правило не новое: ровно им живёт scripts/wait-for-deploy.sh
          # (исход 2). Здесь его не было, и два места, решающие один вопрос,
          # расходились — та самая болезнь, ради которой писался §12.
          NEED_EPOCH=$(git show -s --format=%ct "$EXPECTED_SHA" 2>/dev/null || echo 0)
          # Запас built_at над временем коммита — тот же, что в
          # scripts/wait-for-deploy.sh (#1762, 10.09): образ ПРЕДЫДУЩЕГО
          # коммита, собранный после нашего пуша, тоже новее пуша, и без запаса
          # он сходит за свежий. Пока сборку запускал вебхук, хватало 600 с;
          # без автодеплоя (15.10) предыдущий коммит строится после ЕГО CI —
          # худший CI 36 мин + сборка 26 — отсюда 3900 с. Имя историческое:
          # это запас, а не время сборки. Число держит сторож
          # wait-for-deploy-strict вместе со скриптом.
          MIN_BUILD_SECONDS=3900
          # Время самой сборки: меньше десяти минут она не длилась ни разу
          # (ранние замеры около 12, 07.09 — 26). Из него — окно сверки ниже.
          BUILD_FLOOR_SECONDS=600
          # Заказ сборки — свидетель точнее времени коммита (15.10). Timeweb,
          # начиная новую сборку, останавливает идущую (24.09: восемь сборок
          # подряд в stopped), поэтому образ, начатый не раньше нашего заказа,
          # собран по нему или по более новому заказу — то есть содержит наш
          # коммит. built_at маркер пишет в начале сборки (после npm ci), и
          # образ предыдущего коммита, законченный уже после нашего пуша, но
          # начатый до заказа, этим правилом за наш не сходит — а запасом
          # 600 с от времени коммита сходил.
          #
          # «Более новый заказ» равен «более новому коммиту» не всегда
          # (замечание ревью 15.10): прогон старшего коммита P, запущенный
          # повторно рукой или задержанный очередью, мог заказать P ПОСЛЕ
          # нас и остановить нашу сборку, если проверка списка сборок выше
          # её не увидела. Образ P начат после нашего заказа, и без сверки
          # запись назвала бы на проде наш коммит, когда там P. Поэтому в
          # момент принятия панель спрашивается заново: её commit — эхо
          # ПОСЛЕДНЕГО заказа (07.09), и он обязан содержать наш коммит.
          # Панель не ответила — «по заказу» не подтверждаем: чей заказ
          # последний, неизвестно.
          ORDERED_EPOCH="${ORDERED_AT:-0}"
          case "$ORDERED_EPOCH" in ''|*[!0-9]*) ORDERED_EPOCH=0 ;; esac
          echo "Наш коммит ${EXPECTED_SHA:0:7} создан в epoch $NEED_EPOCH — образ старше этого времени нашего кода не содержит; свежим считается образ, начатый не раньше нашего заказа сборки (epoch $ORDERED_EPOCH, 0 — не заказывали) или built_at не раньше чем через ${MIN_BUILD_SECONDS}с после коммита."

          # Окно ожидания ответа САЙТА.
          #
          # 19.09, прогон 1823: цикл был `seq 1 20` со сном 15с — пять минут,
          # при том что рядом этот же файл утверждает, что меньше десяти минут
          # сборка не длилась НИ РАЗУ. То есть окно ожидания было вдвое короче
          # того, чего ждали, и отказ был заложен в арифметику. Прогон
          # покраснел в 12:42, код доехал в 12:46.
          #
          # Величина выведена из времени сборки, а не назначена на глаз:
          # ждать нужно дольше сборки, иначе «не дождался» гарантирован. Запас
          # взят полуторный — сборка 07.09 шла 26 минут, но столько ждать в
          # каждом прогоне дорого, а третий исход ниже теперь честен и для
          # такого случая.
          SERVE_ATTEMPTS=$(( (BUILD_FLOOR_SECONDS * 3 / 2) / 15 ))
          SERVED_OK=""
          SERVED=""
          REASON=""
          BUILT_EPOCH=0
          for i in $(seq 1 $SERVE_ATTEMPTS); do
            curl -s --max-time 15 "https://vedarai.ru/version.json" -o /tmp/served.json || true
            SERVED=$(python3 -c "import json;print(json.load(open('/tmp/served.json')).get('commit',''))" 2>/dev/null || echo "")
            # reason пишет сам маркер (scripts/write-version.js) начиная с 30.08:
            # причина «не знаю» приезжает вместе с ответом, а не ищется в чужом
            # сборочном логе. У старой сборки поля нет — это законная пустота.
            REASON=$(python3 -c "import json;print(json.load(open('/tmp/served.json')).get('reason',''))" 2>/dev/null || echo "")
            # Разборы однострочные намеренно: тело run — блочный скаляр YAML, и
            # многострочная программа с отступами от нулевой колонки обрывает
            # его молча (проверено 07.09 — файл перестал разбираться как YAML).
            BUILT_EPOCH=$(python3 -c "import json,datetime;b=json.load(open('/tmp/served.json')).get('built_at');print(int(datetime.datetime.fromisoformat(str(b).replace('Z','+00:00')).timestamp()) if b else 0)" 2>/dev/null || echo 0)
            AHEAD=$((BUILT_EPOCH - NEED_EPOCH))
            echo "[$i/$SERVE_ATTEMPTS] сайт отдаёт ${SERVED:0:7}${REASON:+ (reason=$REASON)}, built_at epoch $BUILT_EPOCH, built_at минус пуш = ${AHEAD}с"
            if contains_expected "$SERVED"; then SERVED_OK=commit; break; fi
            if [ "$ORDERED_EPOCH" -gt 0 ] && [ "$BUILT_EPOCH" -ge "$ORDERED_EPOCH" ]; then
              if ! poll; then
                echo "  образ начат после нашего заказа, но панель не ответила (HTTP $HTTP) — чей заказ последний, не сверить; по заказу не подтверждаем"
              elif contains_expected "$COMMIT"; then
                SERVED_OK=ordered; break
              else
                echo "  образ начат после нашего заказа, но последний заказ в панели — ${COMMIT:0:7}, он не содержит ${EXPECTED_SHA:0:7}: сборку перезаказали старшим коммитом; по заказу не подтверждаем"
              fi
            fi
            if [ "$BUILT_EPOCH" -gt 0 ] && [ "$NEED_EPOCH" -gt 0 ] && [ "$AHEAD" -ge "$MIN_BUILD_SECONDS" ]; then
              SERVED_OK=built_at; break
            fi
            sleep 15
          done

          # ── Три исхода, а не два ─────────────────────────────────────────
          #
          # §4.0: у проверки обязан быть исход «не смог», отличный от «плохо».
          # До 30.08 исходов было два, и в «не подтвердилось» падало `unknown` —
          # СОБСТВЕННОЕ «не знаю» маркера: scripts/write-version.js пишет его,
          # когда не смог разрешить sha по файлам .git. Шапка того же скрипта
          # требует обратного дословно: «проверка деплоя обязана трактовать его
          # как „не смог подтвердить“, а не как „не доехало“». Файл и проверка
          # противоречили друг другу в письменном виде.
          #
          # Цена замерена аудитом 30.08: с 20.08 ни одного зелёного прогона
          # (последний — run 1128), при этом выкладка шла — владелец видел на
          # проде изменения только что смерженных PR. Хуже шума: шаг падал ДО
          # смоука, поэтому «Production smoke» не выполнялся НИ РАЗУ за эти
          # десять дней. Ложная тревога глушила единственную проверку
          # «задеплоено ≠ работает», ради которой смоук и заведён (15-16.08).
          #
          # Красным остаётся только НАСТОЯЩЕЕ расхождение: сайт назвал живой
          # коммит, и нашего в нём нет. Это по-прежнему откат или застрявшая
          # сборка, и формулировка про контейнер там верна.
          if [ "$SERVED_OK" = "commit" ]; then
            echo "Деплой подтверждён фактом: vedarai.ru отдаёт ${SERVED:0:7}, он содержит ${EXPECTED_SHA:0:7}."
          elif [ "$SERVED_OK" = "ordered" ]; then
            echo "Деплой подтверждён заказом сборки: образ начат в epoch $BUILT_EPOCH, не раньше нашего заказа сборки ${EXPECTED_SHA:0:7} (epoch ${ORDERED_EPOCH:-0}) — Timeweb, начиная сборку, останавливает идущую, а последний заказ в панели (${COMMIT:0:7}) содержит наш коммит, значит это сборка нашего коммита или более нового. Sha образ не назвал (reason='${REASON:-не указана}'), и это отдельная поломка маркера, а не деплоя."
          elif [ "$SERVED_OK" = "built_at" ]; then
            echo "Деплой подтверждён временем сборки: образ собран в epoch $BUILT_EPOCH, на $((BUILT_EPOCH - NEED_EPOCH))с позже нашего коммита ($NEED_EPOCH) при запасе ${MIN_BUILD_SECONDS:-600}с — значит содержит его. Sha образ не назвал (reason='${REASON:-не указана}'), и это отдельная поломка маркера, а не деплоя."
          elif [ "$BUILT_EPOCH" -gt 0 ] && [ "$NEED_EPOCH" -gt 0 ] && [ "$BUILT_EPOCH" -lt "$NEED_EPOCH" ]; then
            # Здесь «не знаю» кончается: даже без sha образ САМ назвал время
            # своей сборки, и оно раньше, чем наш коммит появился на свет.
            # Панель может сколько угодно сообщать active на нашем коммите —
            # она отвечает за свой запрос, а не за то, что отдаёт сайт.
            # Формулировка правится 19.09 вместе с окном ожидания, и правится
            # по делу. Прежняя говорила «наш код на прод НЕ ДОЕХАЛ, миграции
            # этого деплоя НЕ НАКАТЫВАЛИСЬ» — утверждение о будущем, поданное
            # как факт: в прогоне 1823 код доехал через четыре минуты после
            # этих слов, и миграция 986 применилась. Читающий красный прогон
            # верит написанному и идёт накатывать руками или откатывать.
            #
            # Теперь говорится то, что проверка ЗНАЕТ: сколько ждали и что
            # видели всё это время. Вывод о причине оставлен человеку, и ему
            # же названы оба правдоподобных варианта.
            echo "::error::За $((SERVE_ATTEMPTS * 15))с прод ни разу не отдал образ новее нашего коммита: последний ответ built_at epoch $BUILT_EPOCH < $NEED_EPOCH (${EXPECTED_SHA:0:7}). Ждали дольше, чем длится сборка (${BUILD_FLOOR_SECONDS:-600}с), — значит либо сборка застряла, либо контейнер не переключился. Панель Timeweb сообщает ${COMMIT:0:7}, но её поле commit отражает ЗАПРОС на сборку, а не работающий контейнер. ПРОВЕРЬТЕ ФАКТОМ, прежде чем что-то накатывать руками: https://vedarai.ru/version.json и состояние данных — сборка могла закончиться уже после этой проверки."
            exit 1
          elif [ "$BUILT_EPOCH" -gt 0 ] && [ "$NEED_EPOCH" -gt 0 ]; then
            # Образ новее пуша, но меньше чем на запас (#1762) и начат раньше
            # нашего заказа сборки: по времени он неотличим от образа
            # ПРЕДЫДУЩЕГО коммита, собранного после нашего пуша. Не «доехало»
            # и не «не доехало» — «не знаю»: свой коммит образ не назвал, а
            # время его не доказывает. Записи выката в этом исходе нет.
            echo "::warning::НЕ СМОГЛИ ПОДТВЕРДИТЬ: образ новее нашего коммита лишь на $((BUILT_EPOCH - NEED_EPOCH))с при запасе ${MIN_BUILD_SECONDS:-600}с и начат не после нашего заказа сборки (epoch ${ORDERED_EPOCH:-0}, 0 — не заказывали) — по времени он неотличим от образа ПРЕДЫДУЩЕГО коммита, собранного после нашего пуша. Sha образ не назвал (reason='${REASON:-не указана}'). Панель Timeweb сообщает ${COMMIT:0:7}; работоспособность проверяет смоук ниже."
          elif ! printf '%s' "$SERVED" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::warning::НЕ СМОГЛИ ПОДТВЕРДИТЬ фактом сайта: /version.json не назвал ни коммит (commit='${SERVED:-пусто}', reason='${REASON:-не указана}'), ни время сборки. Оба свидетеля молчат — это «не знаю», а не «доехало»: панель Timeweb сообщает ${COMMIT:0:7}, работоспособность проверяет смоук ниже. Причины по reason (scripts/write-version.js): no_git_head — .git не попал в контекст сборки; ref_and_packed_missing / ref_not_in_packed — попал без ссылок; head_unrecognized — HEAD не опознан."
          elif ! git cat-file -e "${SERVED}^{commit}" 2>/dev/null; then
            echo "::warning::НЕ СМОГЛИ ПОДТВЕРДИТЬ: сайт назвал ${SERVED:0:7}, но такого коммита нет ни в клоне, ни на origin — родство с ${EXPECTED_SHA:0:7} установить нечем. Это тоже «не знаю», а не «не доехало»."
          else
            echo "::error::Сайт отдаёт ${SERVED:0:7}, и этот коммит не содержит ${EXPECTED_SHA:0:7}. Контейнер не переключился."
            exit 1
          fi

          # ── Что выкачено — для записи выката (15.10) ───────────────────
          #
          # Запись обязана говорить правду о проде, а не о намерении. Поэтому
          # sha в ней — то, что сверка ДОКАЗАЛА:
          #  commit         — сайт сам назвал коммит: он и выкачен (полный sha);
          #  ordered/built_at — сайт sha не назвал, доказано лишь «прод
          #                   содержит EXPECTED_SHA». Поле commit панели
          #                   Timeweb сюда не берётся: оно эхо последнего
          #                   ЗАКАЗА (07.09), и более новый заказ, ещё не
          #                   собранный, записал бы на прод коммит, которого
          #                   там нет;
          #  иначе («не смогли подтвердить») — пусто: записи не будет.
          DEPLOYED_SHA=""
          case "$SERVED_OK" in
            commit) DEPLOYED_SHA=$(git rev-parse --verify --quiet "${SERVED}^{commit}" 2>/dev/null || true) ;;
            ordered|built_at) DEPLOYED_SHA=$(git rev-parse --verify --quiet "${EXPECTED_SHA}^{commit}" 2>/dev/null || true) ;;
          esac

          # ── Схема не отстаёт от кода (аудит 15.10, A08) ────────────────
          #
          # start.js при отказе наката миграций сервер НЕ роняет: в цикле
          # перезапусков легли бы SOS-мост и полевой контур, а они важнее
          # новой фичи. Зато отказ назван в /api/health прокси:
          # migrations.state = failed, файл и SQLSTATE. Такой выкат
          # «доехавшим» не признаётся: код на проде, а схемы под него нет, и
          # ожидания по записи сочли бы готовым то, что падает на первой
          # новой колонке. Записи нет, шаг красный, причина — словами.
          #
          # «Не узнали» (образ до 15.10 без поля, health не ответил, unknown)
          # — предупреждение, а не провал: запись говорит, какой коммит на
          # проде, и это по-прежнему доказано сверкой выше. Провал — только
          # названный отказ. Поля разделены табуляцией и пустых не бывает
          # («-»): пустые поля read с IFS-табуляцией склеил бы.
          if [ -n "$DEPLOYED_SHA" ]; then
            MIG=""
            for i in 1 2 3; do
              curl -s --max-time 15 "https://vedarai.ru/api/health" -o /tmp/health.json || true
              MIG=$(python3 -c "import json;m=json.load(open('/tmp/health.json')).get('migrations');print('\t'.join(str(m.get(k) or '-') for k in ('state','reason','file','sqlstate')) if isinstance(m,dict) and m.get('state') else '')" 2>/dev/null || echo "")
              [ -z "$MIG" ] || break
              sleep 5
            done
            IFS=$'\t' read -r MIG_STATE MIG_REASON MIG_FILE MIG_SQLSTATE <<< "${MIG:--}"
            [ "${MIG_FILE:--}" != "-" ] || MIG_FILE="неизвестно"
            case "$MIG_STATE" in
              ok)
                echo "Миграции этого образа при старте применены (migrations.state=ok)."
                ;;
              failed)
                if [ "${MIGRATIONS_GATE:-warn}" = "block" ]; then
                  echo "deployed_sha=" >> "$GITHUB_OUTPUT"
                  echo "confirmed_by=migrations_failed" >> "$GITHUB_OUTPUT"
                  echo "::error::Выкат ${DEPLOYED_SHA:0:7} не признан: при старте контейнера накат миграций не завершён (reason=$MIG_REASON, файл $MIG_FILE, SQLSTATE $MIG_SQLSTATE). Сервер работает на прежней схеме — код этого коммита ждёт колонок, которых нет. Запись выката не пишется. Текст ошибки — в логе сборки Timeweb и в _migration_failures (/hub/admin/migrations); починка — миграцией вперёд и новым выкатом."
                  exit 1
                fi
                echo "::error::Схема отстаёт от кода на выкате ${DEPLOYED_SHA:0:7}: при старте контейнера накат миграций не завершён (reason=$MIG_REASON, файл $MIG_FILE, SQLSTATE $MIG_SQLSTATE). Запись выката пишется: гейт в режиме warn до первого замера migrations.state на проде (MIGRATIONS_GATE: block — запрет). Текст ошибки — в логе сборки Timeweb и в _migration_failures (/hub/admin/migrations)."
                ;;
              unknown)
                echo "::warning::Исход наката миграций на проде неизвестен (migrations.state=unknown, reason=$MIG_REASON): отстаёт ли схема, start.js не узнал. Запись выката пишется — коммит на проде доказан сверкой; схему проверит health-крон."
                ;;
              *)
                echo "::warning::НЕ СМОГЛИ УЗНАТЬ исход наката миграций: /api/health не назвал migrations.state (образ до 15.10 или health не ответил). Это «не знаю», а не «ok»; запись выката пишется — коммит на проде доказан сверкой."
                ;;
            esac
          fi

          echo "deployed_sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"
          echo "confirmed_by=${SERVED_OK:-none}" >> "$GITHUB_OUTPUT"

      # ── Запись выката: этот sha на проде (15.10) ─────────────────────────
      #
      # GitHub Deployment в окружении DEPLOY_ENVIRONMENT (vedarai.ru) со
      # статусом success. По ней scripts/wait-for-deploy.sh у трёх десятков
      # workflow отвечает «тот ли код на проде» точно: built_at маркера при
      # выключенном автодеплое образ предыдущего коммита от нашего не отличает.
      #
      # Стоит СРАЗУ после сверки и ДО смоука: запись говорит «этот sha на
      # проде», а не «смоук прошёл» — красный смоук не делает выкат небывшим,
      # и ожидания по записи как раз и должны узнать, что код уже там.
      #
      # Отказ записи — предупреждение, не провал: выкат уже состоялся, и
      # ронять его из-за записи было бы неправдой о проде. Но и не молчание
      # (§4.0): без записи ожидания этого коммита дождутся только следующей.
      - name: Запись выката — этот sha на проде
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOYED_SHA: ${{ steps.verify.outputs.deployed_sha }}
          CONFIRMED_BY: ${{ steps.verify.outputs.confirmed_by }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DEPLOYED_SHA" ]; then
            echo "::warning::Запись выката не создана: сверка не доказала, какой коммит на проде (${CONFIRMED_BY:-исход не передан}). Ожидания своей сборки по записи увидят этот коммит только со следующей подтверждённой записью, которая его содержит."
            exit 0
          fi
          DESC="Сверено: прод отдаёт этот коммит (${CONFIRMED_BY:-?})"
          if ! jq -n --arg ref "$DEPLOYED_SHA" --arg env "$DEPLOY_ENVIRONMENT" --arg d "$DESC" \
               '{ref: $ref, environment: $env, required_contexts: [], auto_merge: false, production_environment: true, transient_environment: false, description: $d}' \
               > /tmp/deploy-record.json; then
            echo "::warning::Запись выката не создана: тело запроса не собрано (jq). Прод на ${DEPLOYED_SHA:0:7}, но ожидания по записи этого не увидят."
            exit 0
          fi
          if ! ID=$(gh api -X POST "repos/$REPO/deployments" --input /tmp/deploy-record.json --jq '.id' 2>/tmp/deploy-record.err) \
             || ! printf '%s' "$ID" | grep -Eq '^[0-9]+$'; then
            echo "::warning::Запись выката не создана ($(tr '\n' ' ' < /tmp/deploy-record.err | head -c 300)${ID:+; ответ: $(printf '%s' "$ID" | head -c 100)}). Прод на ${DEPLOYED_SHA:0:7}, но ожидания по записи этого не увидят: дождутся следующей записи или уйдут в запасной путь."
            exit 0
          fi
          if gh api -X POST "repos/$REPO/deployments/$ID/statuses" \
               -f state=success -f environment="$DEPLOY_ENVIRONMENT" \
               -f environment_url=https://vedarai.ru -f log_url="$RUN_URL" \
               -f description="$DESC" > /dev/null 2>/tmp/deploy-status.err; then
            echo "Запись выката #$ID: ${DEPLOYED_SHA:0:7} на $DEPLOY_ENVIRONMENT (подтверждено: $CONFIRMED_BY)."
          else
            echo "::warning::Запись выката #$ID создана, статус success не записан ($(tr '\n' ' ' < /tmp/deploy-status.err | head -c 300)). Ожидания читают саму запись — её создают только после сверки, — так что на них это не влияет; в интерфейсе GitHub выкат останется без статуса."
          fi

      # Смоук идёт ПОСЛЕ публикации, а не до неё: проверять новую версию до
      # того, как она опубликована, нечем. Схема — деплой → смоук → отметка
      # здоровья; не прошёл смоук, workflow краснеет, и разрыв виден сразу.
      #
      # 15–16.08 прод простоял с мёртвым выбором маршрута при зелёной сборке и
      # верном /version.json: «задеплоено» доказывалось, «работает» — нет.
      - name: Production smoke (каталог, деталь маршрута, MCP read)
        env:
          BASE_URL: https://vedarai.ru
          # Фикстура контракта карточки маршрута. Живёт в переменных
          # РЕПОЗИТОРИЯ (Settings → Secrets and variables → Actions →
          # Variables), а не в окружении Timeweb: смоук выполняется на
          # раннере и читает env раннера, до контейнера ему дела нет.
          # Пустое значение — сознательный красный: непроверенный контракт
          # не должен выглядеть зелёным.
          #
          # Берётся из ОБОИХ мест. 17.08 владелец завёл фикстуру дважды, и оба
          # раза прогон видел пустоту: на одной странице панели две вкладки,
          # Secrets и Variables, и класть id маршрута в первую — естественная
          # ошибка. Id маршрута не секрет, прятать его не от кого; настаивать
          # на вкладке ценой ещё одного красного прогона — упрямство, а не
          # строгость. Пусть работает там, куда его положили.
          SMOKE_ROUTE_ID: ${{ vars.SMOKE_ROUTE_ID || secrets.SMOKE_ROUTE_ID }}
        run: node scripts/deploy-smoke.mjs

      # ── Выкат возобновлён — закрыть тревогу о красном CI (аудит 15.10) ──
      #
      # ci-red-alert ниже открывает issue, когда CI на main красный. Здесь —
      # обратная сторона: выкат проверенного коммита подтверждён и смоук
      # прошёл, значит прод больше не стоит. Открытая тревога после этого
      # стала бы ложной, и следующую настоящую дописали бы в старую.
      # Отказ чтения или закрытия — предупреждение, не провал: выкат уже
      # состоялся, ронять его из-за issue было бы неправдой о проде.
      - name: Выкат возобновлён — закрыть тревогу о красном CI
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! gh issue list --repo "$REPO" --state open --search "in:title \"$STOP_ISSUE_TITLE\"" \
               --json number,title > /tmp/stop-issues.json 2>/tmp/stop-issues.err; then
            echo "::warning::Не смог прочитать открытые issues ($(head -c 200 /tmp/stop-issues.err)) — тревогу о красном CI, если она открыта, закрыть рукой."
            exit 0
          fi
          N=$(jq -r --arg t "$STOP_ISSUE_TITLE" '[.[] | select(.title == $t)][0].number // empty' /tmp/stop-issues.json) || {
            echo "::warning::Ответ gh об открытых issues не разобран — тревогу о красном CI, если она открыта, закрыть рукой."
            exit 0
          }
          if [ -z "$N" ]; then
            echo "Открытой тревоги о красном CI нет — закрывать нечего."
            exit 0
          fi
          if gh issue close "$N" --repo "$REPO" --comment "Выкат возобновлён: проверенный коммит ${SHA:0:7} на проде. Прогон: $RUN_URL"; then
            echo "Тревога #$N закрыта: выкат ${SHA:0:7} подтверждён."
          else
            echo "::warning::Не смог закрыть тревогу #$N — закрыть рукой."
          fi

  # ── Красный CI на main: выкат стоит, владелец узнаёт (аудит 15.10, AR-deploy) ──
  #
  # Автодеплой выключен: прод получает только то, что позеленело в CI. Значит
  # красный CI на main — не «один прогон упал», а «прод застыл на прошлой
  # сборке», и без этого джоба он застыл бы молча: deploy выше по такому
  # прогону пропускается (skipped), а пропуск никого не будит. Замер за 30
  # дней до 15.10: 31 красный прогон main из 726, самый длинный перерыв между
  # зелёными — 64 часа (05–07.10). Пока выкатывал вебхук, это не держало прод;
  # теперь держит.
  #
  # Два канала, потому что каждый может молчать по своей причине:
  #  - Telegram владельцу — секреты TELEGRAM_BOT_TOKEN и TELEGRAM_OWNER_ID в
  #    секретах РЕПОЗИТОРИЯ (те же значения, что в переменных приложения
  #    Timeweb). На 15.10 ни один workflow их не читает и в репозитории их,
  #    вероятно, нет — об этом скажет первое же предупреждение ниже;
  #  - issue с постоянным заголовком: новый красный прогон дописывается в
  #    открытую, успешный выкат её закрывает (последний шаг deploy).
  # В тексте — только sha, исход и ссылка на прогон: сообщение коммита может
  # нести имена и телефоны из правок, в Telegram оно не уходит (152-ФЗ).
  #
  # Отменённый прогон тревогой не считается: на main идущий прогон не
  # отменяется (ci.yml), отменяется только ждущий, которого заменил свежий.
  #
  # Тревога — только если решать больше некому. Если за красным прогоном
  # уже идёт (или прошёл) прогон более свежего пуша в main, выкат решит он:
  # зелёный — выкатит, красный — поднимет тревогу сам. Без этого тревожил бы
  # каждый маркер в режиме apply: три сторожа (timeweb-configure, iamkam-site,
  # images-repack) требуют dry в репозитории, и коммит с apply краснеет
  # нарочно, на минуты до возврата в dry. Не смогли спросить GitHub о
  # прогонах — тревожим: «не знаю» не выдаётся за «решит другой» (§4.0).
  #
  # Джоб красный ВСЕГДА: выкат этого коммита не состоялся, а зелёный
  # «Deploy» по красному CI читался бы как выкат. Куда ушла тревога (или кто
  # решит вместо неё) — в строке ошибки.
  ci-red-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped' }}
    steps:
      - name: Тревога владельцу — выкат остановлен
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          SHORT="${SHA:0:7}"

          # Решит ли более свежий прогон CI на main? Самый новый из прогонов
          # по пушу в main, начатых после нашего; отменённый (его заменил ещё
          # более свежий) не в счёт.
          if gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=20" \
               > /tmp/ci-runs.json 2>/tmp/ci-runs.err \
             && NEWER=$(jq -r --argjson id "$CI_RUN_ID" '[.workflow_runs[] | select(.id > $id) | select(.status != "completed" or .conclusion != "cancelled")] | max_by(.id) // empty | "\(.head_sha[0:7]) \(.status)/\(.conclusion // "-")"' /tmp/ci-runs.json); then
            if [ -n "$NEWER" ]; then
              echo "::error::Выкат $SHORT остановлен: CI на main — $CONCLUSION. Тревогу не поднимаем: следом прогон более свежего пуша ($NEWER) — он и решит выкат, а если не пройдёт, поднимет тревогу сам."
              exit 1
            fi
          else
            echo "::warning::Не смог спросить GitHub о более свежих прогонах CI ($(head -c 200 /tmp/ci-runs.err 2>/dev/null)) — тревожим: решать, возможно, некому."
          fi
          TEXT="Выкат остановлен: CI на main не прошёл ($CONCLUSION) на коммите $SHORT. Прод остаётся на последней проверенной сборке; следующий зелёный прогон main выкатится сам. Прогон: $RUN_URL"
          TG=""; ISSUE=""; TG_OK=0; ISSUE_OK=0

          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_OWNER_ID" ]; then
            TG_CODE=$(curl -sS -o /tmp/tg-alert.json -w "%{http_code}" --max-time 20 \
              --data-urlencode "chat_id=$TELEGRAM_OWNER_ID" \
              --data-urlencode "text=$TEXT" \
              --data-urlencode "disable_web_page_preview=true" \
              "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage") || TG_CODE="000"
            if [ "$TG_CODE" = "200" ] && jq -e '.ok == true' /tmp/tg-alert.json >/dev/null 2>&1; then
              TG_OK=1; TG="доставлено"
            else
              TG="отказ HTTP $TG_CODE $(jq -r '.description // empty' /tmp/tg-alert.json 2>/dev/null | head -c 200)"
              echo "::warning::Telegram не принял тревогу: $TG"
            fi
          else
            TG="не настроено"
            echo "::warning::В секретах репозитория нет TELEGRAM_BOT_TOKEN и/или TELEGRAM_OWNER_ID — тревога в Telegram не ушла. Добавить: Settings → Secrets and variables → Actions (те же значения, что в переменных приложения Timeweb)."
          fi

          BODY=$(printf '%s\n\nКоммит: %s\nИсход CI: %s\n\nПока CI на main не зелёный, deploy.yml не заказывает сборку у Timeweb (автодеплой выключен, CLAUDE.md §6). Тревога закроется сама, когда выкат проверенного коммита подтвердится.\n' "$TEXT" "$SHA" "$CONCLUSION")
          if gh issue list --repo "$REPO" --state open --search "in:title \"$STOP_ISSUE_TITLE\"" \
               --json number,title > /tmp/stop-issues.json 2>/tmp/stop-issues.err \
             && N=$(jq -r --arg t "$STOP_ISSUE_TITLE" '[.[] | select(.title == $t)][0].number // empty' /tmp/stop-issues.json); then
            if [ -n "$N" ]; then
              gh issue comment "$N" --repo "$REPO" --body "$BODY" >/dev/null && ISSUE_OK=1 && ISSUE="дописано в #$N"
            else
              URL=$(gh issue create --repo "$REPO" --title "$STOP_ISSUE_TITLE" --body "$BODY") && ISSUE_OK=1 && ISSUE="открыто: $URL"
            fi
          else
            ISSUE="не прочитаны открытые issues: $(head -c 200 /tmp/stop-issues.err 2>/dev/null)"
          fi
          if [ "$ISSUE_OK" != 1 ]; then
            ISSUE="${ISSUE:-gh отказал}"
            echo "::warning::Issue о тревоге не записан: $ISSUE"
          fi

          {
            echo "## Выкат остановлен: CI на main — $CONCLUSION"
            echo "- коммит: $SHORT"
            echo "- прогон: $RUN_URL"
            echo "- Telegram: $TG"
            echo "- issue: $ISSUE"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TG_OK" != 1 ] && [ "$ISSUE_OK" != 1 ]; then
            echo "::error::Тревога НЕ ДОСТАВЛЕНА никуда (Telegram: $TG; issue: $ISSUE). Выкат остановлен на $SHORT, и знает об этом только этот лог."
            exit 1
          fi
          echo "::error::Выкат остановлен: CI на main — $CONCLUSION на $SHORT. Тревога: Telegram — $TG; issue — $ISSUE."
          exit 1
