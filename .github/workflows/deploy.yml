name: Deploy to Timeweb Cloud

# Timeweb Cloud auto-deploy включён (is_auto_deploy: true)
# Деплой запускается автоматически через webhook при push в main
# Env vars управляются через Timeweb UI или scripts/sync-timeweb-envs.js
#
# Quality gate: runs only after CI workflow succeeds on main.
# Manual dispatch (workflow_dispatch) bypasses the CI gate.
#
# 04.08 — почему здесь появилось ожидание вместо одного curl.
# Прежний шаг спрашивал статус приложения ЧЕРЕЗ СЕКУНДУ после старта сборки,
# печатал «Status: deploy» (это «идёт сборка») и завершался зелёным. Никто
# никогда не проверял, ЧЕМ кончилась сборка. Итог: пять смерженных PR подряд,
# зелёные галочки везде, а прод сутки отдавал старый контейнер — владелец
# третий день видел на телефоне баги, которые в main давно исправлены.
# «Задеплоено» подтверждалось словом, а не фактом.
#
# Теперь ждём терминального статуса и сверяем commit_sha приложения с тем, что
# в main. Не совпало или сборка упала — workflow краснеет.
#
# 16–17.08 — этот шаг отработал ровно так, как задуман, и это стоит записать.
# Timeweb собирал и поднимал контейнер УСПЕШНО, но брал revision `8c891a8` от
# 07:54 — сутки подряд, четыре прогона подряд, по 40 опросов в каждом. Прод всё
# это время отдавал каталог с ошибкой 42702 и рисовал на карте линию через весь
# край, хотя оба фикса лежали в main. Со стороны GitHub исправно было всё:
# приложение установлено, доступ к репозиторию есть, права на хуки есть —
# а доставок по вебхуку не было с 12:35 (тикет поддержки 12479061).
#
# И вот чего стоит комментарий вместо факта. Строка выше про
# «is_auto_deploy: true» пролежала здесь месяцами как самоочевидная. Когда её
# наконец СПРОСИЛИ у API (.github/workflows/timeweb-app-info.yml), выяснилось,
# что значение живое: 17.08 в 06:05 — True, в 07:43, после переподключения
# репозитория по инструкции поддержки, — False. Процедура восстановления
# молча погасила автодеплой. Настройки приложения проверять запросом, а не
# чтением этого файла.
#
# Вывод на будущее: зелёная сборка у провайдера не означает, что выложен наш
# коммит. Единственное доказательство — сверка commit_sha ниже.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # История нужна ДО проверки: подтверждение «прод содержит наш коммит»
      # считается по предкам, а не по совпадению строк (см. ниже).
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # ── Сборку просим САМИ, а не ждём чужого решения ───────────────────
      #
      # 17.08 выкладка встала дважды за день, и оба раза не по нашей вине.
      # Утром вебхук молчал сутки. Вечером GitHub доставил пуш, Timeweb ответил
      # «успешно» — и не начал сборку: панель показывала последний коммит
      # четырёхчасовой давности, а очередь стояла после четырёх подряд упавших
      # сборок.
      #
      # Пока единственный запуск — реакция чужого приложения на событие, у нас
      # нет ни способа её вызвать, ни способа отличить «не дошло» от «дошло и
      # проигнорировано». Просьба напрямую снимает обе неизвестности.
      #
      # Шаг НЕ роняет прогон при отказе: если вебхук всё-таки сработал, сборка
      # уже идёт, и вторая просьба лишь вернёт ошибку. Судит по-прежнему сверка
      # ниже — по факту того, что отдаёт САЙТ. Здесь только попытка и запись
      # ответа, чтобы в следующий раз не гадать.
      #
      # 24.08: пустое тело `{}` API не принимал НИКОГДА — 400 на каждом
      # прогоне, с самого создания шага. Причина в собственном ответе API:
      #   "commit_sha should not be null or undefined",
      #   "commit_sha must match ^[0-9a-f]{40}$ regular expression".
      # То есть просьба о сборке не работала ни разу; всё это время
      # деплой держался ЦЕЛИКОМ на вебхуке Timeweb. commit_sha теперь в теле.
      - name: Ask Timeweb to build this commit
        env:
          TIMEWEB_TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          APP_ID="198048"

          if [ -z "$TIMEWEB_TOKEN" ]; then
            echo "TIMEWEB_TOKEN не задан — попросить сборку нечем; ждём вебхук."
            exit 0
          fi

          # Тело ответа печатается урезанным: в нём приходит объект приложения,
          # а у него в настройках живут переменные окружения прода.
          ask() {
            CODE=$(curl -sS -o /tmp/deploy-ask.json -w "%{http_code}" --max-time 60 \
              -X POST -H "Authorization: Bearer $TIMEWEB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"commit_sha\":\"$EXPECTED_SHA\"}" "$1") || CODE="000"
            echo "POST $1 -> $CODE"
            head -c 200 /tmp/deploy-ask.json 2>/dev/null || true
            echo ""
          }

          ask "https://api.timeweb.cloud/api/v1/apps/$APP_ID/deploy"

          # Путь взят из документации провайдера (метод createDeploy) и из этой
          # среды не проверялся. Если версия API другая — пробуем вторую и
          # оставляем код в логе: следующий разбор начнётся не с нуля.
          if [ "$CODE" = "404" ] || [ "$CODE" = "405" ]; then
            ask "https://api.timeweb.cloud/api/v2/apps/$APP_ID/deploy"
          fi

          case "$CODE" in
            2*) echo "Сборка запрошена." ;;
            *)  echo "::warning::Timeweb не принял просьбу о сборке ($CODE). Ждём вебхук; судит проверка ниже." ;;
          esac

      - name: Verify deploy reached production
        env:
          TIMEWEB_TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
          # SHA коммита, ради которого этот прогон запущен. Для workflow_run это
          # голова main на момент запуска CI, а не head самого workflow-файла.
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # 29.07: 175477 отдавал 404. Настоящий id получен из GET /api/v1/apps
          # (name=Tourhab). Проверка статуса деплоя была мертва из-за константы.
          APP_ID="198048"

          if [ -z "$TIMEWEB_TOKEN" ]; then
            echo "TIMEWEB_TOKEN не задан — подтвердить деплой нечем."
            echo "Это не «всё хорошо», а «проверить невозможно»: добавь токен в секреты репозитория."
            exit 1
          fi

          echo "Приложение $APP_ID, ждём коммит ${EXPECTED_SHA:0:7}"

          # Успех — «прод СОДЕРЖИТ наш коммит», а не «прод РАВЕН нашему».
          #
          # 16.08: мерж 7609965 и авто-коммит счётчиков README легли в main с
          # разницей в минуты. Timeweb собирает голову ветки, а не конкретный
          # коммит, — он собрал 22ae4d1 (потомок 7609965), прод получил фикс,
          # а проверка ждала ровно 7609965, не дождалась за 20 минут и
          # покраснела. Двадцать минут ожидания того, что уже произошло.
          #
          # Ложная тревога здесь дороже, чем кажется: она неотличима от
          # настоящего «автодеплой не сработал», и следующая такая же будет
          # прочитана как шум. Поэтому обгон более новым коммитом — успех,
          # а вот прод БЕЗ нашего коммита (откат, застрявшая сборка) —
          # по-прежнему провал.
          contains_expected() {
            CANDIDATE="$1"
            [ -n "$CANDIDATE" ] || return 1
            [ "${CANDIDATE:0:7}" = "${EXPECTED_SHA:0:7}" ] && return 0
            # Коммита может не быть в клоне: собрано не из этой ветки или
            # история ушла вперёд. Дотягиваем точечно, молча.
            git cat-file -e "${CANDIDATE}^{commit}" 2>/dev/null \
              || git fetch --quiet origin "$CANDIDATE" 2>/dev/null \
              || return 1
            git merge-base --is-ancestor "$EXPECTED_SHA" "$CANDIDATE" 2>/dev/null
          }

          # Две фазы, а не одна. Первый вариант этой проверки спрашивал статус
          # через секунду после мержа, видел «active» на ПРОШЛОМ коммите, считал
          # это терминальным состоянием и краснел: сборка ещё не начиналась, а
          # он уже вынес приговор (прогон 05.08 00:40 по 822a9b8). Ждать надо не
          # «любого терминального статуса», а появления НУЖНОГО коммита.
          ATTEMPTS=40
          SLEEP=30
          STATUS="unknown"
          COMMIT=""

          poll() {
            HTTP=$(curl -s -o /tmp/app_status.json -w "%{http_code}" \
              -H "Authorization: Bearer $TIMEWEB_TOKEN" \
              "https://api.timeweb.cloud/api/v1/apps/$APP_ID") || HTTP="000"
            [ "$HTTP" = "200" ] || return 1
            STATUS=$(python3 -c "import json;print(json.load(open('/tmp/app_status.json'))['app']['status'])" 2>/dev/null || echo "unknown")
            COMMIT=$(python3 -c "import json;print(json.load(open('/tmp/app_status.json'))['app'].get('commit_sha') or '')" 2>/dev/null || echo "")
            return 0
          }

          # Фаза 1: Timeweb взял наш коммит в работу.
          PICKED=""
          for i in $(seq 1 $ATTEMPTS); do
            if poll; then
              echo "[ожидание коммита $i/$ATTEMPTS] status=$STATUS commit=${COMMIT:0:7}"
              if contains_expected "$COMMIT"; then PICKED=1; break; fi
            else
              echo "[ожидание коммита $i/$ATTEMPTS] API недоступен (HTTP $HTTP)"
            fi
            sleep $SLEEP
          done

          if [ -z "$PICKED" ]; then
            echo "::error::Timeweb за 20 минут не взял в работу ни ${EXPECTED_SHA:0:7}, ни его потомка (сейчас ${COMMIT:0:7}). Автодеплой не сработал — проверь webhook приложения."
            exit 1
          fi

          if [ "${COMMIT:0:7}" != "${EXPECTED_SHA:0:7}" ]; then
            echo "Собран ${COMMIT:0:7} — более новый коммит, содержащий ${EXPECTED_SHA:0:7}. Это успех: наши изменения в проде."
          fi

          # Фаза 2: сборка этого коммита дошла до конца.
          for i in $(seq 1 $ATTEMPTS); do
            case "$STATUS" in
              deploy|build|building|deploying|pending|created)
                echo "[сборка $i/$ATTEMPTS] status=$STATUS"
                sleep $SLEEP
                poll || true
                continue
                ;;
            esac
            break
          done

          echo "Итог: status=$STATUS commit=${COMMIT:0:7} ожидался ${EXPECTED_SHA:0:7}"
          echo "Сайт: https://vedarai.ru"

          case "$STATUS" in
            started|running|deployed|active|ok)
              ;;
            *)
              echo "::error::Сборка не дошла до рабочего состояния: status=$STATUS. Прод остаётся на прежнем контейнере."
              exit 1
              ;;
          esac

          # Последнее слово — за самим сайтом, а не за панелью. /version.json
          # пишется в образ на сборке (см. Dockerfile), поэтому отвечает на
          # вопрос «какой контейнер СЕЙЧАС отдаёт страницы», а не «что панель
          # думает о последней сборке». Именно этого различия и не хватало.
          SERVED_OK=""
          for i in $(seq 1 20); do
            SERVED=$(curl -s --max-time 15 "https://vedarai.ru/version.json" \
              | python3 -c "import json,sys;print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || echo "")
            echo "[$i/20] сайт отдаёт ${SERVED:0:7}"
            if contains_expected "$SERVED"; then SERVED_OK=1; break; fi
            sleep 15
          done

          if [ -z "$SERVED_OK" ]; then
            echo "::error::Сайт отдаёт ${SERVED:0:7}, и этот коммит не содержит ${EXPECTED_SHA:0:7}. Контейнер не переключился."
            exit 1
          fi

          echo "Деплой подтверждён фактом: vedarai.ru отдаёт ${SERVED:0:7}, он содержит ${EXPECTED_SHA:0:7}."

      # Смоук идёт ПОСЛЕ публикации, а не до неё: проверять новую версию до
      # того, как она опубликована, нечем. Схема — деплой → смоук → отметка
      # здоровья; не прошёл смоук, workflow краснеет, и разрыв виден сразу.
      #
      # 15–16.08 прод простоял с мёртвым выбором маршрута при зелёной сборке и
      # верном /version.json: «задеплоено» доказывалось, «работает» — нет.
      - name: Production smoke (каталог, деталь маршрута, MCP read)
        env:
          BASE_URL: https://vedarai.ru
          # Фикстура контракта карточки маршрута. Живёт в переменных
          # РЕПОЗИТОРИЯ (Settings → Secrets and variables → Actions →
          # Variables), а не в окружении Timeweb: смоук выполняется на
          # раннере и читает env раннера, до контейнера ему дела нет.
          # Пустое значение — сознательный красный: непроверенный контракт
          # не должен выглядеть зелёным.
          #
          # Берётся из ОБОИХ мест. 17.08 владелец завёл фикстуру дважды, и оба
          # раза прогон видел пустоту: на одной странице панели две вкладки,
          # Secrets и Variables, и класть id маршрута в первую — естественная
          # ошибка. Id маршрута не секрет, прятать его не от кого; настаивать
          # на вкладке ценой ещё одного красного прогона — упрямство, а не
          # строгость. Пусть работает там, куда его положили.
          SMOKE_ROUTE_ID: ${{ vars.SMOKE_ROUTE_ID || secrets.SMOKE_ROUTE_ID }}
        run: node scripts/deploy-smoke.mjs
