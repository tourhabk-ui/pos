# Одноразовый запуск руки эволюции: проверить пробник после починки дедлока
# (#992, задеплоено 06.08 11:36; плановый крон с тех пор не ходил). Тот же
# скрипт и те же секреты, что у evo-report.yml. Файл удаляется после снятия
# показаний — как ua-probe и fishingkam-probe.
name: evo-report-probe
on:
  push:
    branches: [claude/pos-repository-ercvsa]
    paths: ['.github/workflows/evo-report-probe.yml']

concurrency:
  group: evo-report
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Завести GitHub Issues из находок эволюции
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVO_REPO: ${{ github.repository }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "ERROR: CRON_SECRET secret не настроен"; exit 1; fi
          node scripts/evo-report-issues.js
