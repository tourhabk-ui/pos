name: Post-Merge Cleanup

# Петля loop engineering, детерминированная часть (без LLM, уровень L3):
# после мержа PR смерженная claude/* ветка удаляется. Мусор веток копился
# с апреля — GitHub их не чистит сам, а cleanup не требует суждения.
#
# Ветки вне claude/* (ручные ветки владельца) не трогаются.

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Ветка могла быть удалена вручную или переиспользована новым
          # коммитом после мержа — оба случая не ошибка петли.
          HEAD_NOW=$(gh api "repos/${{ github.repository }}/branches/$BRANCH" --jq .commit.sha 2>/dev/null || echo "gone")
          if [ "$HEAD_NOW" = "gone" ]; then
            echo "Ветка $BRANCH уже удалена"
            exit 0
          fi
          if [ "$HEAD_NOW" != "${{ github.event.pull_request.head.sha }}" ]; then
            echo "На $BRANCH появились новые коммиты после мержа — не трогаем"
            exit 0
          fi
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH"
          echo "Удалена смерженная ветка $BRANCH"

  # Счётчики README обновляются здесь, а не проверяются в CI.
  #
  # Раньше `update-readme-stats --check` стоял первым шагом CI и ронял job,
  # а деплой висит на зелёном CI. Числа меняются от каждого мержа, поэтому
  # любая ветка приносила на main устаревшие — 15.08 это остановило выкладку
  # прода на пять часов. Витринная статистика не должна держать продукт.
  #
  # Петли нет: .md отсутствует в путях-триггерах ci.yml, а этот workflow
  # запускается на закрытие PR, не на push. Конфликтов в ветках тоже нет —
  # им больше незачем трогать README.
  readme-stats:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Цифры каталога — из переписи на проде, не из головы (04.09). С июля
      # README держал «~415 мест, ~421 маршрут» при 379 и 288 по переписям,
      # и внешний обзор репозитория унаследовал завышение как факт. Отказ
      # переписи не роняет job и не подменяет числа: блок остаётся с прежней
      # датой, а лог называет причину.
      - name: Снять перепись каталога с прода
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET не задан — перепись каталога не снята, блок README не тронут"
            exit 0
          fi
          HTTP=$(curl -s -o /tmp/catalog.json -w '%{http_code}' --max-time 60 \
            "https://vedarai.ru/api/cron/catalog-census" \
            -H "Authorization: Bearer $CRON_SECRET" || echo 000)
          echo "catalog-census HTTP: $HTTP"
          if [ "$HTTP" = "200" ]; then
            cat /tmp/catalog.json
            echo "CATALOG=--catalog /tmp/catalog.json" >> "$GITHUB_ENV"
          else
            echo "перепись не снята (HTTP $HTTP) — блок каталога в README остаётся с прежней датой"
            cat /tmp/catalog.json 2>/dev/null || true
          fi

      - name: Обновить счётчики
        run: node scripts/update-readme-stats.mjs $CATALOG

      - name: Закоммитить, если цифры изменились
        run: |
          if git diff --quiet README.md; then
            echo "README актуален — коммитить нечего"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "README-stats: автообновление после мержа [skip ci]"
          # Гонка с параллельными мержами: если main ушёл вперёд, подтянуть
          # и пересчитать заново, а не падать. Цифры — не повод для алярма.
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/update-readme-stats.mjs $CATALOG
            git diff --quiet README.md && exit 0
            git add README.md
            git commit -m "README-stats: автообновление после мержа [skip ci]"
          done
          echo "Не удалось запушить обновление счётчиков — не критично"
