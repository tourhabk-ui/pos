# Одноразовый probe: снять SEO-факты с fishingkam.ru (аудит по слову владельца
# 06.08). Из песочницы и через WebFetch сайт недоступен (403), с раннера GitHub
# Actions — проходит (проверено 06.08 на vedarai.ru: все UA получают 200).
# Файл удаляется после снятия показаний — как ua-probe.
name: fishingkam-probe
on:
  push:
    branches: [claude/pos-repository-ercvsa]
    paths: ['.github/workflows/fishingkam-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Снять показания
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

          section() { echo; echo "=================== $1 ==================="; }

          section "Редиректы: http, https, www"
          for u in http://fishingkam.ru/ https://fishingkam.ru/ https://www.fishingkam.ru/; do
            echo "--- $u"
            curl -sS -o /dev/null -A "$UA" --max-time 30 -w 'code=%{http_code} redirect=%{redirect_url}\n' "$u" || echo "FAIL $u"
          done

          section "Главная: заголовки ответа"
          curl -sSL -A "$UA" --max-time 30 -D /tmp/headers.txt -o /tmp/home.html -w 'final=%{url_effective} code=%{http_code} time=%{time_total}s size=%{size_download}b\n' https://fishingkam.ru/ || true
          cat /tmp/headers.txt

          section "Главная: head-факты"
          tr -d '\n\r' < /tmp/home.html > /tmp/home.flat
          grep -o '<title[^>]*>[^<]*</title>' /tmp/home.flat | head -3 || echo "title: НЕТ"
          grep -o '<meta[^>]*name="description"[^>]*>' /tmp/home.flat | head -3 || echo "meta description: НЕТ"
          grep -o '<meta[^>]*property="og:[^"]*"[^>]*>' /tmp/home.flat | head -10 || echo "og: НЕТ"
          grep -o '<link[^>]*rel="canonical"[^>]*>' /tmp/home.flat | head -3 || echo "canonical: НЕТ"
          grep -o '<meta[^>]*name="robots"[^>]*>' /tmp/home.flat | head -3 || echo "meta robots: НЕТ"
          grep -o '<html[^>]*lang="[^"]*"' /tmp/home.flat | head -1 || echo "lang: НЕТ"
          grep -o '<meta[^>]*name="viewport"[^>]*>' /tmp/home.flat | head -1 || echo "viewport: НЕТ"

          section "Главная: h1/h2"
          grep -o '<h1[^>]*>.\{0,200\}</h1>' /tmp/home.flat | head -5 || echo "h1: НЕТ"
          grep -o '<h2[^>]*>.\{0,120\}</h2>' /tmp/home.flat | head -10 || echo "h2: НЕТ"

          section "Главная: JSON-LD"
          COUNT=$(grep -c 'application/ld+json' /tmp/home.flat || true)
          echo "блоков ld+json: $COUNT"
          grep -o '<script type="application/ld+json">.\{0,600\}' /tmp/home.flat | head -5 || true

          section "Главная: движок и счётчики"
          grep -o 'generator[^>]\{0,80\}' /tmp/home.flat | head -3 || echo "generator: не указан"
          grep -o 'mc\.yandex\.ru/metrika' /tmp/home.flat | head -1 && echo "Яндекс.Метрика: ЕСТЬ" || echo "Яндекс.Метрика: НЕТ"
          grep -o 'tilda' /tmp/home.flat | head -1 && echo "Tilda: следы есть" || echo "Tilda: следов нет"

          section "robots.txt"
          curl -sS -A "$UA" --max-time 30 -w '\ncode=%{http_code}\n' https://fishingkam.ru/robots.txt | head -40 || true

          section "sitemap.xml"
          curl -sS -A "$UA" --max-time 30 -w '\ncode=%{http_code}\n' https://fishingkam.ru/sitemap.xml -o /tmp/sitemap.xml || true
          head -c 4000 /tmp/sitemap.xml; echo
          echo "url в sitemap: $(grep -c '<loc>' /tmp/sitemap.xml || echo 0)"
          grep -o '<loc>[^<]*</loc>' /tmp/sitemap.xml | head -30 || true

          section "Внутренние ссылки главной (структура)"
          grep -o 'href="/[^"]\{1,80\}"' /tmp/home.flat | sort | uniq -c | sort -rn | head -30 || true

          section "Вес и картинки"
          echo "HTML: $(wc -c < /tmp/home.html) байт"
          echo "img-тегов: $(grep -c '<img' /tmp/home.flat || echo 0)"
          grep -o '<img[^>]*src="[^"]*"' /tmp/home.flat | grep -o 'src="[^"]*"' | head -10 || true
          echo "img без alt: $(grep -o '<img[^>]*>' /tmp/home.flat | grep -vc 'alt=' || echo 0)"

          section "sitemap-store.xml (магазин Tilda — есть ли отдельные страницы туров)"
          curl -sS -A "$UA" --max-time 30 -w '\ncode=%{http_code}\n' https://fishingkam.ru/sitemap-store.xml -o /tmp/store.xml || true
          echo "url в sitemap-store: $(grep -c '<loc>' /tmp/store.xml || echo 0)"
          grep -o '<loc>[^<]*</loc>' /tmp/store.xml | head -40 || true

          section "Страницы товаров из store (первые 5): title/description/h1/ld+json"
          for u in $(grep -o '<loc>[^<]*</loc>' /tmp/store.xml | sed 's/<[^>]*>//g' | grep -v '^https://fishingkam.ru/$' | head -5); do
            echo "--- $u"
            curl -sSL -A "$UA" --max-time 20 -o /tmp/p.html -w 'code=%{http_code} size=%{size_download}b\n' "$u" || continue
            tr -d '\n\r' < /tmp/p.html > /tmp/p.flat
            grep -o '<title[^>]*>[^<]*</title>' /tmp/p.flat | head -1
            grep -o '<meta[^>]*name="description"[^>]*>' /tmp/p.flat | head -1
            grep -o '<h1[^>]*>.\{0,150\}</h1>' /tmp/p.flat | head -1
            echo "ld+json: $(grep -o 'application/ld+json' /tmp/p.flat | wc -l)"
            grep -o '<script type="application/ld+json">.\{0,400\}' /tmp/p.flat | head -2 || true
          done
