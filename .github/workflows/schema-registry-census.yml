name: Перепись реестра схемы (вручную)

# Что стоит за списком «таблиц вне реестра схемы» (#1304) на самом деле.
#
# Список заморожен с 19.08 и может только сокращаться, но сам по себе он —
# признание незнания, а не диагноз. Разбор 31.08 показал, что за пунктами стоят
# РАЗНЫЕ беды с разными способами закрытия:
#
#   transfer_bookings — таблицы на проде нет вовсе (Watchdog получил 42P01),
#                       значит пятнадцать читающих её файлов мертвы, и пункт
#                       закрывается УДАЛЕНИЕМ кода;
#   operators         — её читают 73 файла и кабинет оператора работает, значит
#                       она почти наверняка есть мимо миграций, и пункт
#                       закрывается ЗАХВАТОМ DDL в миграцию.
#
# «Почти наверняка» — не факт, а про остальные двадцать шесть неизвестно вообще
# ничего. Перепись спрашивает прод и раскладывает пункты по состояниям; отказ
# запроса делает список НЕИЗВЕСТНЫМ, а не пустым (§4.0) — иначе читающий примет
# «мы не дозвонились» за «таблиц нет» и удалит живой код.
#
# Роут только читает: ни одной записывающей команды, живость спрашивается
# LIMIT 1 вместо count(*). Сторож — tests/unit/schema-registry-census.test.ts.
#
# Запускается кнопкой и пушем файла-маркера. Ждать чужого клика нечем: у токена
# агента нет actions:write (403 на dispatch). Приём с маркером в репозитории
# общий — см. коммит 87bb939f.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/schema-registry-census.json'

# contents: read — ровно для checkout: цикл ожидания лежит в
# scripts/ci/wait-for-contract.sh. Больше воркфлоу не делает ничего.
permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    # 20 > 15 минут ожидания выкладки + запас на сам запрос. Терпение джоба
    # обязано быть больше терпения шага, иначе ожидание обрывается снаружи и
    # исход снова становится неразличим.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Состояние каждого пункта списка #1304 на проде
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WAIT_URL: https://vedarai.ru/api/cron/schema-registry-census
          WAIT_OUT: /tmp/census.json
          # Маркер запускает перепись тем же пушем, которым едет роут, а Timeweb
          # выкладывает контейнер около двенадцати минут. Ждать надо не только
          # появления ответа, но и НУЖНОЙ его версии: прогон 4 приёмки ledger
          # показал, что прежний код отвечает 200 мгновенно и печатает старое
          # как свежее. Поднимать вместе с contract_version в роуте.
          WAIT_CONTRACT: '3'
        run: |
          bash scripts/ci/wait-for-contract.sh

          # Вердикт словами — первым, чтобы читающий не разбирал JSON ради него.
          python3 - <<'PY'
          import json
          with open('/tmp/census.json') as f:
              d = json.load(f)
          print('ВЕРДИКТ:', d.get('verdict', '(нет)'))
          print()
          # Канарейка — первым делом после вердикта: без неё «нет на проде»
          # ничего не значит. Прогон 1 ответил «нет» про все 28 пунктов сразу,
          # и отличить правду от слепого запроса было нечем.
          c = d.get('canary') or {}
          print('КАНАРЕЙКА:', 'видна' if c.get('ok') else f"НЕ ВИДНА — {c.get('missing')}",
                '· контрольные:', ', '.join(c.get('expected', [])) or '—')
          print('ПОДКЛЮЧЕНИЕ:', json.dumps(d.get('connection') or {}, ensure_ascii=False))
          print()
          # Объявленные миграцией, но под сомнением: их CREATE TABLE ссылается
          # на отсутствующую таблицу, а такой CREATE не выполняется вовсе.
          sd = d.get('suspect_declared')
          if sd is None:
              print('ОБЪЯВЛЕНЫ ПОД СОМНЕНИЕМ: не спрашивали (ответ не заслуживает доверия)')
          else:
              for t in sd:
                  state = 'есть, с данными' if t['alive'] else ('есть, пусто' if t['present'] else 'НЕТ')
                  print(f"ОБЪЯВЛЕНА ПОД СОМНЕНИЕМ · {t['table']}: {state}")
          print()
          print('РАСКЛАДКА:', json.dumps(d.get('counts', {}), ensure_ascii=False))
          print()
          # Колонки живых таблиц — материал для захвата DDL, ради него перепись и
          # заводилась. Отсутствующие печатаются одним списком: там нужны не
          # колонки, а решение об удалении кода.
          for t in d.get('tables', []):
              if t['state'] == 'present_with_rows' or t['state'] == 'present_empty':
                  cols = ', '.join(f"{c['name']} {c['type']}{'' if c['nullable'] else ' NOT NULL'}"
                                   for c in t['columns'])
                  print(f"{t['table']} [{t['state']}]: {cols}")
          print()
          print('НЕТ НА ПРОДЕ:', ', '.join(t['table'] for t in d.get('tables', []) if t['state'] == 'absent') or '—')
          print('НЕ СМОГЛИ СПРОСИТЬ:', ', '.join(t['table'] for t in d.get('tables', []) if t['state'] == 'unknown') or '—')
          PY
