name: Diag — проверка URL на проде

# Универсальная диагностика: печатает HTTP-статус и фрагмент тела для списка
# URL прода. Нужна, потому что песочница агента не имеет доступа к vedarai.ru.
#
# Способы запуска:
#   1. workflow_dispatch — кнопка Run workflow (input urls, через запятую)
#   2. push в main, меняющий .github/triggers/prod-check.json — URL берутся
#      из поля urls этого файла

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URL через запятую'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/triggers/prod-check.json'

concurrency:
  group: prod-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # 40: ожидание сборки до 25 мин плюс сами проверки.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Ждём НЕ любой рестарт, а СВОЮ сборку — по маркеру /version.json
      # (commit + built_at, пишется scripts/write-version.js при сборке образа).
      # Правило одно на все замеры — scripts/wait-for-deploy.sh; замер 05.09
      # (prod-check run 8) показал, что штамп из next.config.js до обработчика
      # маршрута не доходит: build_time был null, и ожидание отсиживало 25 мин
      # впустую.
      - name: Wait for fresh deploy
        if: github.event_name == 'push'
        env:
          BASE: https://vedarai.ru
          WANT_SHA: ${{ github.sha }}
          NEED_AFTER: ${{ github.event.head_commit.timestamp }}
        run: bash scripts/wait-for-deploy.sh

      # Роуты /api/cron/* прода закрыты CRON_SECRET; без него проверка увидела
      # бы только 401 и ничего не сказала о самом роуте. Заголовок уходит
      # ТОЛЬКО на vedarai.ru/api/cron/ — никакому другому адресу из триггера.
      - name: Check URLs
        env:
          INPUT_URLS: ${{ github.event.inputs.urls || '' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$INPUT_URLS" ]; then
            URLS=$(echo "$INPUT_URLS" | tr ',' '\n')
          else
            URLS=$(python3 -c "import json; print('\n'.join(json.load(open('.github/triggers/prod-check.json')).get('urls', [])))")
          fi
          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            echo "════ $URL ════"
            AUTH=()
            case "$URL" in
              https://vedarai.ru/api/cron/*) [ -n "$CRON_SECRET" ] && AUTH=(-H "Authorization: Bearer $CRON_SECRET") ;;
            esac
            CODE=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 60 -L "${AUTH[@]}" "$URL")
            BYTES=$(wc -c < /tmp/body)
            echo "HTTP $CODE, bytes: $BYTES"
            head -c 1200 /tmp/body | tr -d '\0'
            # Хвост тоже: у JSON интересное часто в КОНЦЕ (замер 06.09 —
            # поле statuses ленты вулканов не попало в печать вовсе, и
            # проверить его было нечем, хотя ответ пришёл целым).
            if [ "$BYTES" -gt 1200 ]; then
              echo ""
              echo "…хвост:"
              tail -c 800 /tmp/body | tr -d '\0'
            fi
            echo ""
          done <<< "$URLS"
