name: Cron — Scout-Innovator (daily)

# Runs once per day at 06:00 UTC:
# 1. /api/cron/intelligence — собирает AI/travel сигналы
# 2. /api/cron/scout       — синтезирует → эволюционные предложения

on:
  schedule:
    - cron: '0 8 * * *'    # каждый день в 08:00 UTC: после Scout Digest (07:00)
  workflow_dispatch:        # ручной запуск из GitHub Actions UI

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Run Repo Scanner (DB schema + GitHub tree + production health)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipping"
            exit 0
          fi

          HTTP=$(curl -s -o /tmp/repo_scan_resp.json -w "%{http_code}" \
            --max-time 60 \
            "https://vedarai.ru/api/cron/repo-scan" \
            -H "Authorization: Bearer $CRON_SECRET")

          echo "Repo Scan HTTP: $HTTP"
          cat /tmp/repo_scan_resp.json 2>/dev/null || true

      - name: Run intelligence monitor (сбор сигналов)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipping"
            exit 0
          fi

          HTTP=$(curl -s -o /tmp/intel_resp.json -w "%{http_code}" \
            --max-time 120 \
            "https://vedarai.ru/api/cron/intelligence" \
            -H "Authorization: Bearer $CRON_SECRET")

          echo "Intelligence HTTP: $HTTP"
          cat /tmp/intel_resp.json 2>/dev/null || true

      - name: Run Scout-Innovator (синтез → предложения)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then exit 0; fi

          sleep 10

          GIT_LOG=$(git log --oneline -30 2>/dev/null || echo "")
          CHANGED_FILES=$(git diff --name-only HEAD~10 HEAD 2>/dev/null | head -50 | tr '\n' ',' || echo "")

          PAYLOAD=$(printf '{"git_log":"%s","changed_files":"%s"}' \
            "$(echo "$GIT_LOG" | sed 's/"/\\"/g' | tr '\n' '|')" \
            "$CHANGED_FILES")

          HTTP=$(curl -s -o /tmp/scout_resp.json -w "%{http_code}" \
            --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://vedarai.ru/api/cron/scout")

          echo "Scout HTTP: $HTTP"
          cat /tmp/scout_resp.json 2>/dev/null || true
          [ "$HTTP" = "200" ] || exit 1
