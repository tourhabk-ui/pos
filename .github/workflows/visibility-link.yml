name: visibility-link (manual, one-off)
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run discovery check (key stays inside the runner)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cp research-visibility/check_link.py .
          python3 check_link.py
      - uses: actions/upload-artifact@v4
        with: { name: visibility-link-results, path: results.json }
