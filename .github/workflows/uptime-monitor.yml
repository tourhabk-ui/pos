name: Uptime — внешний пинг прода

# #2551. Внешняя проверка доступности vedarai.ru с раннера GitHub, независимо
# от сервера: если прод лёг целиком, серверный watchdog (/api/cron/watchdog)
# сам об этом сказать не может. Каждые 10 минут, только чтение:
#   1) GET /api/health — 200;
#   2) MCP initialize на /api/mcp — в ответе serverInfo.
# Каждая проверка — до 3 попыток с паузой 20 с (холодный старт и сетевой
# шум раннера не считаются падением).
# Тревога: issue «Прод недоступен» (открыть или дописать) и Telegram владельцу,
# если в секретах есть TELEGRAM_BOT_TOKEN и TELEGRAM_OWNER_ID. Восстановление —
# комментарий и закрытие issue. Повтор тревоги не чаще одного раза в час
# (комментарий в открытый issue), чтобы не засыпать телефон.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TITLE: 'Прод недоступен (uptime-monitor)'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
    steps:
      - name: Проверки
        id: check
        run: |
          set +e
          try() { # $1 имя, остальное — команда, печатающая OK при успехе
            local name=$1; shift
            for i in 1 2 3; do
              OUT=$("$@" 2>&1); [ "$OUT" = "OK" ] && { echo "$name: OK"; return 0; }
              echo "$name: попытка $i — $OUT"; [ $i -lt 3 ] && sleep 20
            done
            FAILS="${FAILS}${name}: ${OUT}; "; return 1
          }
          health() {
            C=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://vedarai.ru/api/health)
            [ "$C" = "200" ] && echo OK || echo "HTTP $C"
          }
          mcp() {
            B=$(curl -s --max-time 30 https://vedarai.ru/api/mcp \
              -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"uptime-monitor","version":"1"}}}')
            echo "$B" | grep -q '"serverInfo"' && echo OK || echo "нет serverInfo: $(echo "$B" | head -c 150)"
          }
          FAILS=""
          try health health
          try mcp mcp
          echo "fails=$FAILS" >> "$GITHUB_OUTPUT"
          [ -z "$FAILS" ] && echo "Всё доступно" || echo "::warning::Сбой: $FAILS"

      - name: Тревога или восстановление
        env:
          FAILS: ${{ steps.check.outputs.fails }}
        run: |
          N=$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" --json number,title \
              | jq -r --arg t "$TITLE" '[.[]|select(.title==$t)][0].number // empty')
          NOW=$(date -u +%Y-%m-%dT%H:%MZ)
          if [ -z "$FAILS" ]; then
            if [ -n "$N" ]; then
              gh issue close "$N" --repo "$REPO" --comment "Восстановлено $NOW UTC: /api/health 200, MCP initialize отвечает."
              MSG="Ведар снова доступен ($NOW UTC)."
            else
              exit 0
            fi
          else
            RUN="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
            if [ -z "$N" ]; then
              gh issue create --repo "$REPO" --title "$TITLE" --body "Внешняя проверка с раннера GitHub $NOW UTC: $FAILS
          Прогон: $RUN
          Закроется сам, когда проверки пройдут."
              MSG="Ведар недоступен: $FAILS ($NOW UTC) $RUN"
            else
              LAST=$(gh issue view "$N" --repo "$REPO" --json comments,createdAt -q '(.comments[-1].createdAt // .createdAt)')
              AGE=$(( $(date -u +%s) - $(date -u -d "$LAST" +%s) ))
              [ "$AGE" -lt 3300 ] && { echo "Тревога уже открыта #$N, повтор позже"; exit 1; }
              gh issue comment "$N" --repo "$REPO" --body "Всё ещё недоступен $NOW UTC: $FAILS — $RUN"
              MSG="Ведар всё ещё недоступен: $FAILS ($NOW UTC)"
            fi
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_OWNER_ID" ]; then
            curl -s -o /dev/null --max-time 20 -X POST \
              --data-urlencode "chat_id=$TELEGRAM_OWNER_ID" --data-urlencode "text=$MSG" \
              "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" || echo "::warning::Telegram не ответил"
          else
            echo "::warning::Нет TELEGRAM_BOT_TOKEN в секретах репозитория — тревога только через issue."
          fi
          [ -z "$FAILS" ] || exit 1
