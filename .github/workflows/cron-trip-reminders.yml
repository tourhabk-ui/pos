name: Cron — Trip Reminders (туристам за 2 дня)

on:
  schedule:
    - cron: '0 5 * * *'  # 05:00 UTC — напоминание о туре за 2 дня (17:00 KMT)
  workflow_dispatch:

jobs:
  trip-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send trip reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi
          HTTP=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vedarai.ru/api/cron/trip-reminders")
          echo "HTTP: $HTTP" && cat /tmp/out.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "OK" || { echo "FAIL $HTTP"; exit 1; }
