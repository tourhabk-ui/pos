name: visibility-check (manual, monthly)
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run discovery check (key stays inside the runner)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cp research-visibility/check.py . 2>/dev/null || cp check.py .
          python3 check.py
      - uses: actions/upload-artifact@v4
        with: { name: visibility-results, path: results.json }
