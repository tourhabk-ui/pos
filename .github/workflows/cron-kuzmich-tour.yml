name: Cron Kuzmich Tour

# Вечерний пост о живом туре operator_tours — текст из карточки, снимки
# оператора. До 05.09 этот файл звался cron-kuzmich-sezon и слал type=sezon:
# явный тип побеждал чередование sezon/tour внутри роута, и тур по расписанию
# не выходил ни разу («я не вижу постов про реальные туры» — владелец 05.09,
# решение: вместо сезонов публиковать туры). Ежедневно в 19:23 по Камчатке;
# при 8 живых турах каждый повторяется примерно раз в 8 дней.

on:
  schedule:
    - cron: '23 7 * * *'  # 07:23 UTC = 19:23 KMT (нечётная минута: GitHub дропает запуски ровно в :00)
  workflow_dispatch:
  # Запуск маркером — см. cron-kuzmich-route.yml: dispatch через интеграцию
  # отвечает 403, а расписание одно на сутки.
  push:
    branches: [main]
    paths:
      - '.github/triggers/kuzmich-tour.json'

jobs:
  trigger:
    runs-on: ubuntu-latest
    # 40: ожидание своей сборки (до 25 мин) плюс сам пост.
    timeout-minutes: 40
    steps:
      # checkout ради scripts/wait-for-deploy.sh: сам пост идёт на проде.
      - uses: actions/checkout@v7

      # Ждём СВОЮ сборку — иначе маркер бьёт по старому коду.
      #
      # Замер 07.09: маркер поднят, пост ушёл через 40 секунд, ответ пришёл
      # без поля photo — правка ещё не выкатилась, а два поста в канал уже
      # ушли. Проверять починку прогоном по старому коду значит проверять
      # старый код.
      #
      # Только для запуска маркером: по расписанию head_commit пуст, и шаг
      # честно ждал бы «свою сборку», которой не просили.
      - name: Wait for fresh deploy
        if: github.event_name == 'push'
        env:
          BASE: https://vedarai.ru
          WANT_SHA: ${{ github.sha }}
          NEED_AFTER: ${{ github.event.head_commit.timestamp }}
        run: bash scripts/wait-for-deploy.sh

      - name: Trigger Kuzmich tour post
        run: |
          curl -X GET "https://vedarai.ru/api/cron/kuzmich?type=tour" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions" \
            --max-time 120 \
            --fail
