name: Опознание Telegram-канала по его содержимому

# Подбор источников нашёл живой t.me/s/kammeteo и предположил, что это
# Камчатское УГМС. Перепись доказала, что канал жив, — и ничего про то, ЧЕЙ он.
# Внести лавинный бюллетень «неизвестно от кого» в источники безопасности хуже,
# чем не внести никакого: турист поверит подписи, а не нашей осторожности.
#
# Раннер, а не прод: t.me с прода закрыт, а с раннера читается напрямую.
# Ключей прогон не просит вовсе — ходит только в сам канал.
#
# Модели здесь нет. Первая редакция звала Astra; прогон 1 показал, что звать
# некого: вопрос решил ЗАГОЛОВОК страницы — «Александр Колесов. О погоде в
# Петербурге», — а модель в это время отвечала HTTP 402 и не сказала ничего.
# Утверждение «канал принадлежит такой-то службе» машиной не проверяется, а
# место, где модель нельзя проверить, — не её место.
#
# Прогон печатает скачанное: заголовок, описание, даты, тексты постов. Читает
# и решает человек; в случае kammeteo ему хватило одной строки.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Имя канала без @ (например kammeteo)'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/triggers/channel-identity.json'

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # Ожидания сборки нет намеренно: прогон не зовёт прод вовсе — только
      # сам канал в t.me (сторож tests/unit/marker-waits-for-deploy).
      - name: Опознать канал
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel || '' }}
        run: |
          set -uo pipefail
          CH="$INPUT_CHANNEL"
          if [ -z "$CH" ]; then
            CH=$(python3 -c "
          import json
          try:
              print(json.load(open('.github/triggers/channel-identity.json')).get('channel') or '')
          except Exception:
              print('')
          ")
          fi
          if [ -z "$CH" ]; then
            echo "::error::Канал не назван ни во входе, ни в маркере — опознавать нечего."
            exit 1
          fi
          npx tsx scripts/channel-identity-runner.ts "$CH" | tee /tmp/identity.txt

      - name: Итог в сводку прогона
        if: always()
        run: |
          {
            echo "## Опознание канала"
            echo
            echo '```'
            cat /tmp/identity.txt 2>/dev/null || echo 'вывода нет'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
