name: Cron — SSR-сторож листингов

# Еженедельная проверка, что публичные листинги (/routes, /operators,
# /catalog, главная) отдают контент в ПЕРВОМ HTML — сторож регрессии шага 3
# (SSR-листинги, #457/#460/#461). Провал пробы — Telegram-алерт с прода.
#
# Первый прогон: правка .github/triggers/ssr-sentinel.json в main (мерж этого
# PR запускает сторож автоматически после ожидания деплоя эндпоинта).

on:
  schedule:
    - cron: '0 5 * * 1'  # понедельник 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/ssr-sentinel.json'

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: SSR sentinel
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE: https://vedarai.ru
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set"; exit 0; fi

          # Ждём деплой эндпоинта (актуально только для первого прогона после мержа).
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE/api/cron/ssr-sentinel" || echo 000)
            if [ "$CODE" != "404" ] && [ "$CODE" != "000" ]; then echo "эндпоинт на месте (HTTP $CODE)"; break; fi
            echo "эндпоинт ещё не задеплоен (HTTP $CODE), жду 60с ($i/20)"; sleep 60
          done

          HTTP=$(curl -s -o /tmp/sentinel.json -w "%{http_code}" --max-time 150 \
            "$BASE/api/cron/ssr-sentinel" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP: $HTTP"
          cat /tmp/sentinel.json 2>/dev/null | python3 -m json.tool --no-ensure-ascii 2>/dev/null || cat /tmp/sentinel.json || true
          [ "$HTTP" = "200" ] || { echo "FAIL $HTTP"; exit 1; }
          # Провал проб — алерт уже ушёл в Telegram с прода; красним и ран для видимости.
          python3 -c "import json,sys; d=json.load(open('/tmp/sentinel.json')); sys.exit(0 if d.get('ok') else 1)"
