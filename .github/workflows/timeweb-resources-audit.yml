# Перепись ресурсов Timeweb Cloud (вручную, только чтение).
#
# Владелец 02.10: «посмотри, может нам нужно что-то перенастроить в Timeweb,
# там появились новые сервисы… сделай аудит наших ресурсов». Токен лежит в
# секретах репозитория (TIMEWEB_TOKEN), поэтому спрашивать API можно только
# отсюда, с раннера. Все вызовы — GET; ничего не создаётся и не меняется.
#
# Что печатается: имена, статусы, тарифы, адреса, даты — то, по чему видно,
# за что платим и что лежит без дела. Что НЕ печатается никогда: значения
# ключей, паролей и переменных окружения (только их имена) — редактор ниже
# режет любое поле, в имени которого есть password/secret/token/key.
#
# Запуск: правка .github/triggers/timeweb-resources-audit.json в main или
# кнопка. Итог целиком — в сводке задачи (Summary) и в логе шага; аннотация
# общего итога режется на 3500 знаках и говорит об этом сама, а раздел
# резервных копий базы идёт ОТДЕЛЬНОЙ аннотацией (timeweb-db-backups), чтобы
# обрезка его не съедала. Аудит 15.10 (A01, Д3-1): итог прогона 3 считали
# потерянным, потому что аннотация кончалась раньше раздела копий, а полный
# текст лежал в логе.
#
# Резервные копии базы (аудит 15.10, A01 / Д3-1, Д3-4). Пути и поля — по
# OpenAPI Timeweb Cloud https://timeweb.cloud/api-docs-data/bundle.json
# (страница timeweb.cloud/api-docs), прочитано 15.10.2026:
#   GET /api/v1/databases                 — список кластеров (ключ dbs), у
#       кластера is_autobackups_enabled и is_backup_schedule_enabled;
#       прежний /api/v1/dbs в спецификации 15.10 уже не значится, но прогон 3
#       ответ от него получил — спрашиваются оба, id берутся из обоих;
#   GET /api/v1/dbs/{db_id}/auto-backups  — auto_backups_settings: is_enabled,
#       interval (day|week|month), day_of_week, copy_count (1–99),
#       creation_start_at («время не учитывается» — часа копии API не отдаёт);
#   GET /api/v1/dbs/{db_id}/backups       — «Список бэкапов базы данных»:
#       backups[] с type manual|auto, status (…|done|fail), size в МБ,
#       created_at; meta.total; limit по умолчанию 100;
#   GET /api/v2/databases/{db_id}/backups — «Список S3-бэкапов»: по словам
#       документации «отдельный от /api/v1/dbs/{db_id}/backups механизм»,
#       size в байтах.
# Прогон 3 (02.10) спрашивал список копий только по v2 и напечатал «пусто» —
# это про S3-копии; список v1, где по схеме лежат и автокопии, не
# спрашивался вовсе. Записи (PATCH настроек, POST копии) здесь нет и не будет:
# перепись только читает, запись — задачей timeweb-configure по маркеру.
# Сторож: tests/unit/timeweb-resources-audit.test.ts (шаг исполняется с
# подложенным curl).
name: Перепись ресурсов Timeweb (вручную)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/timeweb-resources-audit.json'

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Спросить API Timeweb (только GET)
        env:
          TIMEWEB_TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
        run: |
          set -u
          if [ -z "$TIMEWEB_TOKEN" ]; then
            echo "::error::TIMEWEB_TOKEN не задан в секретах репозитория — спросить нечего."
            exit 1
          fi
          # Каталог ответов. TW_DIR задаёт только сторож; на раннере — /tmp/tw.
          TW="${TW_DIR:-/tmp/tw}"
          export TW
          mkdir -p "$TW"
          # Каждый адрес — отдельный файл; код ответа — рядом. 404 значит
          # «такого раздела у аккаунта нет» и так и печатается. Сеть не
          # дошла — код 000 (прежнее `|| echo 000` дописывало его к 000 от
          # -w, и в итоге стояло «HTTP 000000»).
          ask() {
            local name="$1" url="$2"
            local code
            code=$(curl -sS -o "$TW/$name.json" -w '%{http_code}' --max-time 60 \
              -H "Authorization: Bearer $TIMEWEB_TOKEN" "$url") || code=000
            echo "$code" > "$TW/$name.code"
          }
          # Идентификаторы из ответа-списка: ids <имя ответа> <ключ списка>
          # <поле> <допустимый вид>. Отказ разбора не глушится (аудит 15.10,
          # Д3-4): прежний `except Exception: pass` превращал битый ответ в
          # «баз нет», и раздел копий пропадал из итога молча. Причина
          # ложится в <имя>.parse и печатается в итоге и аннотацией.
          ids() {
            python3 - "$TW" "$@" <<'PY'
          import json, re, sys
          tw, name, list_key, field, shape = sys.argv[1:6]
          why, out = '', []
          try:
              code = open(f'{tw}/{name}.code').read().strip()
              if code != '200':
                  why = f'HTTP {code}'
              else:
                  data = json.load(open(f'{tw}/{name}.json'))
                  items = data.get(list_key) if isinstance(data, dict) else None
                  if not isinstance(items, list):
                      why = f'в ответе нет списка «{list_key}»'
                  else:
                      vals = [str(x.get(field)) for x in items if isinstance(x, dict) and x.get(field) is not None]
                      bad = [v for v in vals if not re.fullmatch(shape, v)]
                      out = [v for v in vals if re.fullmatch(shape, v)]
                      if bad:
                          why = f'пропущено {len(bad)} значений «{field}» не того вида'
          except Exception as e:
              why = f'ответ не разобран: {type(e).__name__}: {e}'
          if why:
              with open(f'{tw}/{name}.parse', 'w') as f:
                  f.write(why)
          print(' '.join(out))
          PY
          }
          B=https://api.timeweb.cloud/api/v1
          B2=https://api.timeweb.cloud/api/v2
          ask finances        "$B/account/finances"
          ask status          "$B/account/status"
          ask projects        "$B/projects"
          ask apps            "$B/apps"
          ask servers         "$B/servers"
          ask dbs             "$B/dbs"
          ask databases       "$B/databases"
          ask balancers       "$B/balancers"
          ask buckets         "$B/storages/buckets"
          ask domains         "$B/domains"
          ask vpcs            "$B/vpcs"
          ask floating_ips    "$B/floating-ips"
          ask firewall        "$B/firewall/groups"
          ask k8s             "$B/k8s/clusters"
          ask images          "$B/images"
          ask ssh_keys        "$B/ssh-keys"
          ask mail            "$B/mail/domains"
          # AI-разделы живут на api.timeweb.cloud (спецификация bundle.json, 02.10);
          # прогон 1 спрашивал agent.timeweb.cloud и получил 404 — это хост
          # чата с агентом, не каталога.
          ask ai_agents       "$B/cloud-ai/agents"
          ask ai_kbs          "$B/../v2/cloud-ai/knowledge-bases"
          ask ai_models       "$B/../v3/cloud-ai/models"
          ask notifications   "$B/account/notification-settings"
          ask cdn             "$B/cdn/http-resources"
          ask app_198048      "$B/apps/198048"
          # Статистика приложения за 7 дней и копии базы — по id из ответов выше.
          ask app_stats       "$B/apps/198048/statistics?date_from=$(date -u -d '7 days ago' +%Y-%m-%d)&date_to=$(date -u +%Y-%m-%d)"
          # id баз — из обоих списков (см. шапку): какой-то из двух ответит.
          DB_IDS=$( { ids dbs dbs id '[0-9]+'; ids databases dbs id '[0-9]+'; } | tr ' ' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ')
          echo "$DB_IDS" > "$TW/db_ids"
          for db in $DB_IDS; do
            ask "db_${db}_autobackups" "$B/dbs/$db/auto-backups"
            ask "db_${db}_v1backups"   "$B/dbs/$db/backups?limit=100"
            ask "db_${db}_s3backups"   "$B2/databases/$db/backups"
          done
          # DNS — у каждого домена аккаунта из ответа выше, а не у одного
          # вписанного руками: аудит должен видеть и www, и забытые домены.
          for fqdn in $(ids domains domains fqdn '[A-Za-z0-9.-]+'); do
            ask "dns_$fqdn" "$B/domains/$fqdn/dns-records"
          done
          python3 - <<'PY' | tee "$TW/summary.md"
          import json, os, re, datetime
          TW = os.environ['TW']
          NOW = datetime.datetime.now(datetime.timezone.utc)

          # Поле «key» в списке переменных окружения — это ИМЯ переменной (его
          # показываем), а «value» — значение (его не показываем никогда).
          SECRET = re.compile(r'(password|secret|token|api_key|apikey|private|credential|_key$|^value$|^envs?$)', re.I)

          def load(name):
              code = open(f'{TW}/{name}.code').read().strip()
              try:
                  data = json.load(open(f'{TW}/{name}.json'))
              except Exception:
                  data = None
              return code, data

          def clean(v, depth=0):
              """Снять всё, что похоже на секрет, на любой глубине."""
              if isinstance(v, dict):
                  return {k: ('<скрыто>' if SECRET.search(str(k)) else clean(x, depth + 1)) for k, x in v.items()}
              if isinstance(v, list):
                  return [clean(x, depth + 1) for x in v]
              return v

          def pick(d, keys):
              return {k: d.get(k) for k in keys if k in d}

          def money(x):
              try:
                  return f'{float(x):.2f} ₽'
              except Exception:
                  return str(x)

          def section(title, name, list_key, keys, extra=None):
              code, data = load(name)
              print(f'\n## {title}')
              if code == '404':
                  print('раздела нет у аккаунта (404)'); return []
              if code != '200' or not isinstance(data, dict):
                  print(f'не ответил: HTTP {code}'); return []
              def keep_env_names(obj):
                  if isinstance(obj, dict):
                      envs = obj.get('envs')
                      if isinstance(envs, dict): obj['_env_names'] = [str(k) for k in envs]
                      elif isinstance(envs, list): obj['_env_names'] = [str(e.get('key') or e.get('name') or '') for e in envs if isinstance(e, dict)]
                      for v in obj.values(): keep_env_names(v)
                  elif isinstance(obj, list):
                      for v in obj: keep_env_names(v)
              keep_env_names(data)
              data = clean(data)
              items = data.get(list_key)
              if isinstance(items, dict):
                  # Одиночный объект под ключом списка (например, настройки
                  # автобэкапов): прогон 2 печатал «всего: 4» — число ключей,
                  # а не значения. Печатаем поля.
                  for k, v in pick(items, keys).items():
                      print(f'- {k}: {v!r}')
                  if extra: extra(items)
                  return [items]
              if items is None:
                  # Одиночный объект (счёт, статус, приложение)
                  obj = data.get(list_key.rstrip('s')) if list_key.endswith('s') else None
                  obj = obj or {k: v for k, v in data.items() if k != 'meta'}
                  for k, v in pick(obj if isinstance(obj, dict) else {}, keys).items():
                      print(f'- {k}: {v!r}')
                  if extra: extra(obj)
                  return [obj]
              if not items:
                  print('пусто'); return []
              print(f'всего: {len(items)}')
              for it in items:
                  if not isinstance(it, dict): continue
                  row = pick(it, keys)
                  print('- ' + ' · '.join(f'{k}={v!r}' for k, v in row.items()))
                  if extra: extra(it)
              return items

          print('# Перепись ресурсов Timeweb Cloud')
          print(f'снято {NOW:%Y-%m-%d %H:%M} UTC, только чтение')

          def fin(obj):
              # Баланс и расход — ключ к вопросу «за что платим».
              for k in ('balance', 'monthly_cost', 'hourly_cost', 'currency', 'autopay_card_info', 'billing_period_end'):
                  if k in obj: print(f'- {k}: {money(obj[k]) if "cost" in k or k == "balance" else obj[k]!r}')
          code, data = load('finances')
          print('\n## Счёт')
          if code == '200' and isinstance(data, dict):
              fin(clean(data).get('finances') or clean(data))
          else:
              print(f'не ответил: HTTP {code}')

          section('Статус аккаунта', 'status', 'status', ['is_blocked', 'is_permanent_blocked', 'is_send_bill_letters', 'company_info', 'last_password_changed_at'])
          section('Проекты', 'projects', 'projects', ['id', 'name', 'is_default', 'description'])

          def app_extra(a):
              doms = a.get('domains') or a.get('domain') or []
              if isinstance(doms, dict): doms = [doms]
              if doms:
                  print('    домены: ' + ', '.join(str((d.get('fqdn') or d.get('domain') or d.get('name') or d) if isinstance(d, dict) else d) + (' (ssl: ' + str(d.get('ssl') or d.get('is_ssl') or d.get('ssl_status')) + ')' if isinstance(d, dict) and ('ssl' in d or 'is_ssl' in d or 'ssl_status' in d) else '') for d in doms))
              envs = a.get('_env_names')
              if isinstance(envs, list):
                  print('    переменные окружения (только имена): ' + ', '.join(sorted(envs)))
              elif isinstance(envs, dict):
                  print('    переменные окружения (только имена): ' + ', '.join(sorted(map(str, envs))))
              elif isinstance(envs, list):
                  print('    переменные окружения (только имена): ' + ', '.join(sorted(str(e.get('key') or e.get('name') or '') for e in envs if isinstance(e, dict))))
              conf = a.get('configuration') or {}
              if isinstance(conf, dict) and conf:
                  print('    конфигурация: ' + ', '.join(f'{k}={v!r}' for k, v in pick(conf, ['cpu', 'ram', 'disk', 'network_bandwidth', 'preset_id', 'price']).items()))
          section('Приложения (App Platform)', 'apps', 'apps', ['id', 'name', 'status', 'type', 'framework', 'branch_name', 'is_auto_deploy', 'preset_id', 'location', 'created_at'], app_extra)
          section('Приложение 198048 (Tourhab) подробно', 'app_198048', 'app', ['id', 'name', 'status', 'type', 'framework', 'branch_name', 'is_auto_deploy', 'preset_id', 'location', 'updated_at'], app_extra)

          def server_extra(s):
              conf = s.get('configuration') or {}
              if isinstance(conf, dict) and conf:
                  print('    ' + ', '.join(f'{k}={v!r}' for k, v in pick(conf, ['cpu', 'ram', 'disk', 'network_bandwidth']).items()))
              nets = s.get('networks') or []
              ips = [ip.get('ip') for n in nets if isinstance(n, dict) for ip in (n.get('ips') or []) if isinstance(ip, dict)]
              if ips: print('    ip: ' + ', '.join(map(str, ips)))
          section('Серверы (VPS)', 'servers', 'servers', ['id', 'name', 'status', 'os', 'preset_id', 'location', 'created_at', 'is_ddos_guard'], server_extra)

          def db_extra(d):
              for k in ('type', 'preset_id', 'disk_stats', 'location', 'is_enabled_public_network'):
                  if k in d: print(f'    {k}: {d[k]!r}')
              h = d.get('host') or (d.get('networks') or [{}])[0] if d.get('networks') else None
              if h: print(f'    host: {h!r}')
          section('Базы данных', 'dbs', 'dbs', ['id', 'name', 'status', 'type', 'preset_id', 'location', 'created_at'], db_extra)
          section('Балансировщики', 'balancers', 'balancers', ['id', 'name', 'status', 'preset_id', 'location', 'ip'])
          section('Хранилище S3 (бакеты)', 'buckets', 'buckets', ['id', 'name', 'status', 'type', 'location', 'preset_id', 'created_at'],
                  lambda b: print(f"    занято: {b.get('disk_stats')!r}" if 'disk_stats' in b else ''))
          section('Домены', 'domains', 'domains', ['id', 'fqdn', 'is_premium', 'expiration', 'is_autoprolong_enabled', 'provider', 'linked_ip'])
          for f in sorted(os.listdir(TW)):
              if f.startswith('dns_') and f.endswith('.json'):
                  section(f'DNS {f[4:-5]}', f[:-5], 'dns_records', ['id', 'type', 'data', 'ttl'])
          section('Приватные сети (VPC)', 'vpcs', 'vpcs', ['id', 'name', 'location', 'subnet_v4'])
          section('Плавающие IP', 'floating_ips', 'ips', ['id', 'ip', 'is_ddos_guard', 'resource_type', 'resource_id'])
          section('Файрвол', 'firewall', 'groups', ['id', 'name', 'description', 'policy'])
          section('Kubernetes', 'k8s', 'clusters', ['id', 'name', 'status', 'preset_id', 'created_at'])
          section('Образы', 'images', 'images', ['id', 'name', 'status', 'size', 'created_at'])
          section('SSH-ключи (только имена)', 'ssh_keys', 'ssh_keys', ['id', 'name', 'is_default', 'created_at'])
          section('Почта', 'mail', 'domains', ['id', 'fqdn', 'email_count'])
          section('AI-агенты (Timeweb Cloud AI)', 'ai_agents', 'agents', ['id', 'name', 'model_id', 'provider_id', 'status', 'created_at'],
                  lambda a: print(f"    модель: {((a.get('settings') or {}).get('model') or {})!r}"[:300]))
          section('Базы знаний (Cloud AI)', 'ai_kbs', 'knowledge_bases', ['id', 'name', 'status', 'documents_count', 'created_at'])

          # Каталог моделей шлюза — ради вопроса «какие флагманы достижимы без
          # хопа за границей» (CLAUDE.md §8): имя, идентификатор для поля model
          # и цены из parameter_values, если они там есть.
          code, data = load('ai_models')
          print('\n## Модели Cloud AI (каталог шлюза)')
          if code == '200' and isinstance(data, dict):
              ms = data.get('models') or []
              print(f'всего: {len(ms)}')
              for m in ms:
                  if not isinstance(m, dict): continue
                  pv = m.get('parameter_values') or {}
                  price = {k: v for k, v in pv.items() if isinstance(k, str) and ('price' in k or 'cost' in k or 'token' in k)}
                  print(f"- {m.get('public_name')!r} · model={m.get('model_name')!r} · type={m.get('type')!r} · {json.dumps(price, ensure_ascii=False)[:160]}")
          else:
              print(f'не ответил: HTTP {code}')

          section('Уведомления аккаунта', 'notifications', 'notification_settings', ['group', 'type', 'channels'])
          section('CDN-ресурсы', 'cdn', 'http_resources', ['id', 'name', 'source', 'status', 'traffic_usage'])

          # ── Резервные копии базы (аудит 15.10, A01 / Д3-1, Д3-4) ──────────
          # Пути и поля — в шапке файла. У итога по базе три исхода, и третий
          # не равен первому (CLAUDE.md §4.0):
          #  ПОДТВЕРЖДЕНЫ    — список v1 прочитан, в нём есть готовая копия;
          #  НЕ ПОДТВЕРЖДЕНЫ — список прочитан, готовой копии в нём нет;
          #                    документация не говорит, что пустой ответ значит
          #                    «копий нет», поэтому и мы этого не говорим;
          #  НЕ ПРОВЕРЕНЫ    — настройки или список не прочитаны (401, 500,
          #                    сеть, битый ответ): это «не смог», а не «копий
          #                    нет», и прогон краснеет.
          def read(name):
              """(данные, причина отказа). Отказ разбора называется, не глушится."""
              try:
                  code = open(f'{TW}/{name}.code').read().strip()
              except OSError:
                  return None, 'не спрошено'
              if code != '200':
                  return None, f'HTTP {code}'
              try:
                  return json.load(open(f'{TW}/{name}.json')), ''
              except Exception as e:
                  return None, f'ответ HTTP 200 не разобран: {type(e).__name__}'

          def parse_note(name):
              try:
                  return open(f'{TW}/{name}.parse').read().strip()
              except OSError:
                  return ''

          def when(s):
              try:
                  t = datetime.datetime.fromisoformat(str(s).replace('Z', '+00:00'))
                  return t if t.tzinfo else t.replace(tzinfo=datetime.timezone.utc)
              except Exception:
                  return None

          def backups_report():
              out, warn, fail = [], [], []
              out.append('\n## Резервные копии базы')
              out.append('настройки — GET /api/v1/dbs/{id}/auto-backups; копии — GET /api/v1/dbs/{id}/backups;'
                         ' S3-копии — GET /api/v2/databases/{id}/backups (по документации отдельный механизм)')
              try:
                  ids = open(f'{TW}/db_ids').read().split()
              except OSError:
                  ids = []
              if not ids:
                  why = '; '.join(f'{n}: {parse_note(n)}' for n in ('dbs', 'databases') if parse_note(n)) or 'оба списка пусты'
                  line = f'НЕ ПРОВЕРЕНЫ: ни одной базы не прочитано ({why}) — копии спросить не у кого'
                  out.append(line)
                  fail.append(line)
                  return out, warn, fail
              clusters = {}
              data, _ = read('databases')
              for c in (data.get('dbs') or []) if isinstance(data, dict) else []:
                  if isinstance(c, dict) and c.get('id') is not None:
                      clusters[str(c['id'])] = c
              for db in ids:
                  out.append(f'\n### База {db}')
                  c = clusters.get(db)
                  if c:
                      out.append(f"- кластер: is_autobackups_enabled={c.get('is_autobackups_enabled')!r}"
                                 f" · is_backup_schedule_enabled={c.get('is_backup_schedule_enabled')!r}")
                  unknown = []
                  # Настройки автокопий.
                  data, why = read(f'db_{db}_autobackups')
                  s = data.get('auto_backups_settings') if isinstance(data, dict) else None
                  auto = 'НЕ ПРОВЕРЕНЫ'
                  if why or not isinstance(s, dict) or not isinstance(s.get('is_enabled'), bool):
                      why = why or 'в ответе нет auto_backups_settings.is_enabled'
                      out.append(f'- автокопии: НЕ ПРОВЕРЕНЫ ({why})')
                      unknown.append(f'настройки автокопий: {why}')
                  elif s['is_enabled']:
                      auto = (f"включены, интервал {s.get('interval')!r}"
                              + (f", день недели {s.get('day_of_week')!r}" if s.get('interval') == 'week' else '')
                              + f", хранится копий {s.get('copy_count')!r}")
                      out.append(f"- автокопии: {auto}; первая не раньше {s.get('creation_start_at')!r} (час копии API не отдаёт)")
                  else:
                      auto = 'ВЫКЛЮЧЕНЫ'
                      out.append('- автокопии: ВЫКЛЮЧЕНЫ (is_enabled=False)')
                      warn.append(f'база {db}: автокопии выключены')
                  # Список копий v1 — по схеме здесь лежат и ручные, и автокопии.
                  data, why = read(f'db_{db}_v1backups')
                  items = data.get('backups') if isinstance(data, dict) else None
                  latest, total = None, None
                  if why or not isinstance(items, list):
                      why = why or 'в ответе нет списка backups'
                      out.append(f'- копии (v1): НЕ ПРОВЕРЕНЫ ({why})')
                      unknown.append(f'список копий: {why}')
                      items = []
                  else:
                      items = [b for b in items if isinstance(b, dict)]
                      meta = data.get('meta')
                      total = meta.get('total') if isinstance(meta, dict) else None
                      items.sort(key=lambda b: str(b.get('created_at') or ''), reverse=True)
                      out.append(f'- копии (v1): в ответе {len(items)}' + (f', meta.total={total!r}' if total is not None else ''))
                      for b in items[:20]:
                          out.append(f"  - id={b.get('id')!r} · type={b.get('type')!r} · status={b.get('status')!r}"
                                     f" · size={b.get('size')!r} МБ · created_at={b.get('created_at')!r}")
                      if len(items) > 20:
                          out.append(f'  - и ещё {len(items) - 20}')
                      done = [b for b in items if b.get('status') == 'done' and when(b.get('created_at'))]
                      if done:
                          latest = max(done, key=lambda b: when(b.get('created_at')))
                  # S3-копии — отдельный механизм; их пустота об автокопиях не говорит.
                  data, why = read(f'db_{db}_s3backups')
                  s3 = data.get('backups') if isinstance(data, dict) else None
                  if why or not isinstance(s3, list):
                      why = why or 'в ответе нет списка backups'
                      s3n = f'не прочитаны ({why})'
                      out.append(f'- S3-копии (v2): {s3n}')
                      warn.append(f'база {db}: S3-копии {s3n}')
                  else:
                      s3 = [b for b in s3 if isinstance(b, dict)]
                      s3n = str(len(s3))
                      out.append(f'- S3-копии (v2): {len(s3)}'
                                 + ('' if s3 else ' — это копии в объектном хранилище; об автокопиях пустота здесь не говорит'))
                      for b in s3[:5]:
                          out.append(f"  - type={b.get('type')!r} · status={b.get('status')!r}"
                                     f" · size={b.get('size')!r} байт · created_at={b.get('created_at')!r}")
                  # Итог по базе.
                  if unknown:
                      line = (f"ИТОГ базы {db}: НЕ ПРОВЕРЕНЫ — {'; '.join(unknown)}."
                              ' Это «не смог прочитать», а не «копий нет»')
                      fail.append(line)
                  elif latest:
                      hours = (NOW - when(latest.get('created_at'))).total_seconds() / 3600
                      line = (f"ИТОГ базы {db}: ПОДТВЕРЖДЕНЫ — автокопии {auto};"
                              f" последняя готовая {latest.get('created_at')} (type={latest.get('type')!r},"
                              f" {latest.get('size')!r} МБ), возраст {hours:.1f} ч, моложе суток: {'да' if hours < 24 else 'нет'};"
                              f" копий в списке v1: {total if total is not None else len(items)}; S3-копий: {s3n}")
                      if hours >= 24:
                          warn.append(f'база {db}: последняя готовая копия старше суток ({hours:.1f} ч)')
                  else:
                      line = (f'ИТОГ базы {db}: НЕ ПОДТВЕРЖДЕНЫ — автокопии {auto}; список копий v1 прочитан (HTTP 200),'
                              f' готовой копии в нём нет (в ответе {len(items)}). Пустой список ещё не доказывает отсутствия'
                              ' копий: по схеме здесь лежат и ручные, и автокопии, но что пустой ответ значит «копий нет»,'
                              f' документация не говорит — сверить глазами в панели (база → Бэкапы); S3-копий: {s3n}')
                      warn.append(line)
                  out.append(line)
              return out, warn, fail

          BACKUP_LINES, BACKUP_WARN, BACKUP_FAIL = backups_report()
          for l in BACKUP_LINES:
              print(l)

          code, data = load('app_stats')
          print('\n## Нагрузка приложения за 7 дней')
          if code == '200' and isinstance(data, dict):
              for key in ('cpu', 'ram', 'disk', 'network_traffic'):
                  rows = [r for r in (data.get(key) or []) if isinstance(r, dict)]
                  if not rows: print(f'- {key}: нет данных'); continue
                  nums = {}
                  for r in rows:
                      for k, v in r.items():
                          if isinstance(v, (int, float)) and k != 'logged_at': nums.setdefault(k, []).append(v)
                  print(f'- {key} ({len(rows)} точек): ' + ', '.join(f'{k} средн. {sum(v)/len(v):.3f} макс. {max(v):.3f}' for k, v in nums.items()))
          else:
              print(f'не ответил: HTTP {code}')

          print('\n## Коды ответов по разделам')
          for f in sorted(os.listdir(TW)):
              if f.endswith('.code'):
                  print(f'- {f[:-5]}: HTTP {open(os.path.join(TW, f)).read().strip()}')

          # Отказы разбора списков (аудит 15.10, Д3-4): раньше — `except: pass`.
          notes = sorted(f for f in os.listdir(TW) if f.endswith('.parse'))
          print('\n## Отказы разбора списков')
          for f in notes:
              print(f'- {f[:-6]}: {open(os.path.join(TW, f)).read().strip()}')
          if not notes:
              print('нет')

          # Аннотации — в файл: вывод этого скрипта уходит в итог. Раздел копий
          # идёт своей аннотацией, чтобы обрезка общего итога его не съедала.
          def esc(s):
              return str(s).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          with open(f'{TW}/annotations.txt', 'w') as a:
              for line in BACKUP_FAIL:
                  a.write(f'::error title=timeweb-db-backups::{esc(line)}\n')
              for line in BACKUP_WARN:
                  a.write(f'::warning title=timeweb-db-backups::{esc(line)}\n')
              for f in notes:
                  a.write(f'::warning title=timeweb-resources-audit::{esc(f[:-6] + ": " + open(os.path.join(TW, f)).read().strip())}\n')
              a.write(f"::notice title=timeweb-db-backups::{esc(chr(10).join(BACKUP_LINES).strip()[:3500])}\n")
          with open(f'{TW}/backups.verdict', 'w') as v:
              v.write('unverified' if BACKUP_FAIL else 'checked')
          PY
          {
            echo '## Перепись ресурсов Timeweb'
            echo '```'
            cat "$TW/summary.md"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Общий итог аннотацией — первые 3500 знаков, и если обрезан, это
          # сказано в нём самом (прогон 3 молча кончался раньше раздела копий).
          python3 - "$TW/summary.md" >> "$TW/annotations.txt" <<'PY'
          import sys
          LIMIT = 3500
          text = open(sys.argv[1], encoding='utf-8').read()
          body = text[:LIMIT]
          if len(text) > LIMIT:
              body += (f'\n… обрезано: показано {LIMIT} из {len(text)} знаков.'
                       ' Полный итог — сводка задачи (Summary) и лог шага; раздел копий базы — аннотация timeweb-db-backups.')
          print('::notice title=timeweb-resources-audit::' + body.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          cat "$TW/annotations.txt"
          # Итог копий не собран или «не смог проверить» — прогон красный:
          # молчащая перепись читалась бы как «копии есть» (§4.0).
          verdict=$(cat "$TW/backups.verdict" 2>/dev/null || echo missing)
          case "$verdict" in
            checked) ;;
            unverified) exit 1 ;;
            *)
              echo "::error title=timeweb-db-backups::Итог резервных копий не собран — разбор упал раньше, см. лог шага"
              exit 1
              ;;
          esac
