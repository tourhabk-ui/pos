name: SEO probe (временный, удалить до мержа)

# Одноразовая проба живого vedarai.ru с раннера: из контейнера разработки прод
# закрыт (403 на прокси). Только чтение, ни БД, ни репозиторий не трогает.
# Файл живёт в рабочей ветке до снятия показаний и удаляется тем же PR.

on:
  push:
    branches: [ccr-1212a0d0-8yg7mi]
    paths:
      - '.github/workflows/seo-probe-tmp.yml'
      - '.github/seo-probe-tmp.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Probe
        run: python3 .github/seo-probe-tmp.py
