name: CodeQL — статический анализ (security-extended)

# Сканируются ДВА языка (23.08.2026):
#
#   javascript-typescript — код платформы;
#   actions               — сами workflow. CodeQL 2.26.3 принёс новые квери на
#                           command injection в Actions, но они не запускались
#                           бы: язык надо просить отдельно, а мы просили только
#                           JS/TS. В репозитории 104 workflow, и в 100 из них
#                           есть `${{ }}`. Непрошенная проверка выглядит как
#                           проверка, ничего не нашедшая (CLAUDE.md §4.0).
#
# fail-fast: false — падение одного языка не должно скрывать находки другого.
#
# Сканирование JS/TS, включая новый квери js/system-prompt-injection
# (CodeQL 2.26.0, июль 2026): непроверенный пользовательский ввод в
# system-промпте AI-модели. У платформы большой AI-стек (Кузьмич, AI
# Спасатель, lead-processor) — это наш профильный класс уязвимостей.
#
# Результаты: вкладка Security -> Code scanning alerts И вкладка Summary
# этого прогона (плюс тот же текст в логе джоба).
#
# Вторая половина заведена 23.08.2026, потому что первой было НЕДОСТАТОЧНО:
# три алерта висели непрочитанными, а прочитать их не мог никто, кроме
# владельца в браузере. Токену агента Security-таб отвечает
# «403 Resource not accessible by integration», артефакт лежит на blob-хранилище
# за сетевой политикой. Проверка, чей результат нельзя достать, отвечает
# «не знаю», а выглядит зелёной галочкой (CLAUDE.md §4.0).

on:
  push:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'
      # Сами workflow: без этой строки правка workflow не запускала бы их же
      # анализ — язык actions добавлен 23.08.2026, а фильтр остался от JS/TS.
      - '.github/workflows/**'
  # main автодеплоится на Timeweb — ловим уязвимость на диффе PR ДО мержа,
  # а не постфактум в Security-табе, когда она уже уехала в прод.
  pull_request:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'
      # Сами workflow: без этой строки правка workflow не запускала бы их же
      # анализ — язык actions добавлен 23.08.2026, а фильтр остался от JS/TS.
      - '.github/workflows/**'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per-ref: PR-скан и main-скан не отменяют друг друга (иначе мерж гасит
  # незавершённый анализ ветки и наоборот).
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Анализ (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      # Analyze читает свой прогон (GET actions/runs/{id}). С 03.10 без этого
      # права шаг падает «Resource not accessible by integration» на каждом
      # прогоне, включая main; раньше это было лишь предупреждением телеметрии.
      # Права только на чтение — то, что документация CodeQL требует для
      # приватных репозиториев.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - name: Init CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          # SARIF остаётся на диске и разбирается шагом ниже в сводку прогона.
          #
          # Загрузка в Security-таб выключена 03.10 решением владельца: API
          # отвечает «Code scanning is not enabled for this repository» —
          # загружать некуда. С 09:11 UTC шаг Analyze краснел на каждом прогоне,
          # включая main, без единой находки; роняло его отсутствие права
          # `actions: read` (добавлено выше), отказ загрузки ждал следом.
          # Красная проверка, которая ничего не нашла, учит не смотреть на
          # красное (CLAUDE.md §4.0). Вторая дверь (сводка + лог) осталась;
          # включат code scanning в настройках — вернуть `upload: always` и
          # строку сторожа codeql-report.
          output: sarif-results
          upload: never

      - name: Находки CodeQL — в сводку прогона и в лог
        # `always()`: разбор нужен и тогда, когда анализ упал. Молчащий шаг
        # неотличим от «находок нет».
        if: always()
        run: node scripts/codeql-report.js sarif-results
