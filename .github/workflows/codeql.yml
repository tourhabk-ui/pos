name: CodeQL — статический анализ (security-extended)

# Сканирование JS/TS, включая новый квери js/system-prompt-injection
# (CodeQL 2.26.0, июль 2026): непроверенный пользовательский ввод в
# system-промпте AI-модели. У платформы большой AI-стек (Кузьмич, AI
# Спасатель, lead-processor) — это наш профильный класс уязвимостей.
#
# Результаты: вкладка Security -> Code scanning alerts.

on:
  push:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'
  # main автодеплоится на Timeweb — ловим уязвимость на диффе PR ДО мержа,
  # а не постфактум в Security-табе, когда она уже уехала в прод.
  pull_request:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per-ref: PR-скан и main-скан не отменяют друг друга (иначе мерж гасит
  # незавершённый анализ ветки и наоборот).
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Init CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
