name: Публикация MCP-сервера в Smithery

# Smithery (с 08.2026 — часть Arcade.dev) — второй каталог после официального
# реестра MCP, и он НЕ подтягивает записи оттуда сам: у него своя витрина,
# свой шлюз и своя публикация. Владелец 17.09 принёс инструкцию, где вход —
# `smithery auth login` через браузер; из Actions браузера нет, но CLI
# читает `SMITHERY_API_KEY` из окружения раньше всякого логина (проверено
# по исходнику smithery@1.2.0: `process.env.SMITHERY_API_KEY ?? config`).
# Ключ создаётся на https://smithery.ai/account/api-keys и кладётся в
# секрет Actions — с телефона, как и ключ реестра.
#
# Имя сервера (`org/name`) — из маркера: пространство имён у Smithery —
# это аккаунт владельца, и до первого входа его не угадать; менять имя —
# правкой JSON, без правки workflow.
#
# Ожидание своей сборки — по общему правилу (marker-waits-for-deploy):
# Smithery при публикации СКАНИРУЕТ инструменты с живого адреса, и скан
# старого прода описал бы вчерашний набор.
#
# Три исхода: секрета нет — красный ДО публикации с именем секрета;
# опубликовано и найдено поиском — зелёный; опубликовано, но поиск не
# показал за две минуты — красный словами Smithery, не догадкой.
#
# Ручной вход и файл-триггер — как у остальных сборок: интеграция Claude не
# имеет права на workflow_dispatch (403, проверено 02.09).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/smithery-publish.json'

permissions:
  contents: read

concurrency:
  group: smithery-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Ожидание сборки — до 35 минут (70 x 30 с) плюс до 10 минут ожидания
    # релиза у Smithery; таймаут обязан быть больше суммы
    # (tests/unit/workflow-timeout-fits-wait.test.ts).
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Параметры — из маркера; секрет на месте
        id: cfg
        run: |
          set -euo pipefail
          NAME=$(python3 -c "import json;print(json.load(open('.github/triggers/smithery-publish.json'))['name'])")
          URL=$(python3 -c "import json;print(json.load(open('.github/triggers/smithery-publish.json'))['url'])")
          case "$NAME" in
            */*) ;;
            *) echo "::error::имя в маркере должно быть вида org/name, получено '$NAME'"; exit 1 ;;
          esac
          if [ -z "${{ secrets.SMITHERY_API_KEY }}" ]; then
            echo "::error::секрет SMITHERY_API_KEY не задан — ключ создаётся на https://smithery.ai/account/api-keys (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Публикуем $URL как $NAME"

      - name: Дождаться своей сборки на проде
        env:
          BASE: https://vedarai.ru
          WANT_SHA: ${{ github.sha }}
          NEED_AFTER: ${{ github.event.head_commit.timestamp }}
        run: bash scripts/wait-for-deploy.sh

      - name: Smithery CLI
        run: npm install -g smithery@1 --no-audit --no-fund && smithery --version

      - name: Пространство имён — то, которым владеет ключ, а не то, что угадано
        id: ns
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          CI: 'true'
        run: |
          set -euo pipefail
          # Первый прогон (run 1, 17.09) упёрся в «404 Namespace not found»:
          # пространство имён у Smithery — аккаунт владельца, и `tourhabk-ui`
          # из маркера оказалось не им. Ключ при этом принят — отказ был на
          # имени. Поэтому имя не угадывается: спрашиваем у Smithery, какими
          # пространствами владеет ключ.
          #   · org из маркера среди них — берём его;
          #   · ровно одно пространство, и оно другое — берём его и говорим об
          #     этом вслух (маркер поправить, чтобы не удивляться в следующий раз);
          #   · ни одного — заводим org из маркера (`namespace create`);
          #   · несколько, и ни одно не совпало — красный со списком: выбор
          #     имени владельца, не прогона.
          WANT='${{ steps.cfg.outputs.name }}'
          ORG="${WANT%%/*}"
          SRV="${WANT##*/}"
          set +e
          RAW=$(smithery namespace list --json 2>&1)
          RC=$?
          set -e
          echo "namespace list (rc=$RC): $RAW"
          if [ "$RC" -ne 0 ]; then
            # Отказ CLI — не пустой список: слово «Error» из его ответа не
            # должно стать именем пространства.
            echo "::error::не удалось получить список пространств Smithery (rc=$RC): $RAW"
            exit 1
          fi
          mapfile -t OWNED < <(python3 - "$RAW" <<'PY'
          import json, re, sys
          raw = sys.argv[1]
          names = []
          def take(rows):
              for r in rows:
                  n = r.get('name') if isinstance(r, dict) else r
                  if isinstance(n, str) and n: names.append(n)
          # CLI печатает по-разному: `--json` — один объект со списком; в
          # не-TTY без флага — по объекту на строку (jsonl); в TTY — таблицу.
          # Разбираем все три, потому что какой из них придёт на раннере,
          # из исходника не следует наверняка.
          try:
              data = json.loads(raw)
              take(data if isinstance(data, list) else data.get('data') or data.get('namespaces') or [])
          except Exception:
              for line in raw.splitlines():
                  line = line.strip()
                  if not line: continue
                  try:
                      take([json.loads(line)]); continue
                  except Exception:
                      pass
                  m = re.match(r'([a-z0-9][a-z0-9-]*)\b', line, re.I)
                  if m and m.group(1).lower() not in ('name', 'current', 'error', 'warning'): names.append(m.group(1))
          print('\n'.join(dict.fromkeys(names)))
          PY
          )
          echo "владеет: ${OWNED[*]:-(ничего)}"
          USE=""
          for n in "${OWNED[@]:-}"; do [ "$n" = "$ORG" ] && USE="$ORG"; done
          if [ -z "$USE" ] && [ "${#OWNED[@]}" -eq 1 ] && [ -n "${OWNED[0]}" ]; then
            USE="${OWNED[0]}"
            echo "::warning::пространство из маркера '$ORG' ключу не принадлежит; публикуем в единственное доступное '$USE' — поправьте name в .github/triggers/smithery-publish.json на '$USE/$SRV'"
          fi
          if [ -z "$USE" ] && { [ "${#OWNED[@]}" -eq 0 ] || [ -z "${OWNED[0]}" ]; }; then
            echo "у ключа нет ни одного пространства — заводим '$ORG'"
            smithery namespace create "$ORG"
            USE="$ORG"
          fi
          if [ -z "$USE" ]; then
            echo "::error::у ключа несколько пространств (${OWNED[*]}), и '$ORG' среди них нет — выберите одно и впишите в name маркера"
            exit 1
          fi
          echo "name=$USE/$SRV" >> "$GITHUB_OUTPUT"
          echo "Публикуем как $USE/$SRV"

      - name: Публикация
        id: publish
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          # Не-интерактивный прогон: подсказки CLI в CI некому отвечать.
          CI: 'true'
        run: |
          set -euo pipefail
          # В не-TTY CLI не ждёт обработки релиза: печатает JSON с
          # deploymentId и статусом PENDING и уходит (run 2, 17.09). Ждать —
          # дело следующего шага, ему нужен deploymentId.
          smithery mcp publish "${{ steps.cfg.outputs.url }}" -n "${{ steps.ns.outputs.name }}" | tee publish.out
          DEPLOY=$(python3 - <<'PY'
          import json, re
          out = open('publish.out').read()
          for line in out.splitlines():
              line = line.strip()
              if line.startswith('{'):
                  try:
                      d = json.loads(line)
                      if d.get('deploymentId'): print(d['deploymentId']); break
                  except Exception: pass
          else:
              m = re.search(r'Release ([0-9a-f-]{36}) accepted', out)
              print(m.group(1) if m else '')
          PY
          )
          echo "deployment=$DEPLOY" >> "$GITHUB_OUTPUT"
          echo "релиз: ${DEPLOY:-(id не найден в выводе)}"

      - name: Карточка — имя и описание из server.json (одно описание на все каталоги)
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          set -euo pipefail
          # `smithery mcp publish` создаёт запись без тела (`servers.create(t)`
          # в исходнике CLI) — карточка выходит с пустым описанием, и владелец
          # это увидел первым (18.09). Описание и имя — из server.json, того же
          # манифеста, что ушёл в официальный реестр: одно описание на все
          # каталоги, второго источника нет. Отказ здесь — предупреждение, не
          # красный: карточка без описания хуже, чем с ним, но публикация
          # состоялась, и вердикт о ней выносит следующий шаг.
          NAME='${{ steps.ns.outputs.name }}'
          python3 - > card.json <<'PY'
          import json
          m = json.load(open('server.json'))
          json.dump({'displayName': m.get('title') or 'Vedar', 'description': m['description']}, open('card.json', 'w'), ensure_ascii=False)
          PY
          echo "карточка: $(cat card.json)"
          CODE=$(curl -sS -o card.out -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $SMITHERY_API_KEY" -H 'Content-Type: application/json' \
            --data-binary @card.json "https://api.smithery.ai/servers/$NAME" || echo 000)
          if [ "$CODE" = "200" ] || [ "$CODE" = "204" ]; then
            echo "описание обновлено (HTTP $CODE)"
          else
            echo "::warning::описание карточки не обновилось (HTTP $CODE): $(head -c 400 card.out)"
          fi

      - name: Релиз обработан и Smithery нас видит — иначе красный
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          CI: 'true'
        run: |
          set -euo pipefail
          NAME='${{ steps.ns.outputs.name }}'
          DEPLOY='${{ steps.publish.outputs.deployment }}'
          NS="${NAME%%/*}"
          SRV="${NAME##*/}"
          # Run 2 (17.09): релиз принят (PENDING), а поиск через две минуты
          # пуст — обработка релиза у Smithery дольше. Поэтому спрашивается не
          # поиск, а сам релиз — тем же адресом, каким CLI следит за ним в
          # TTY (GET /servers/{name}/releases/{id}, api.smithery.ai, Bearer).
          # SUCCESS — зелёный; CANCELLED/FAILED — красный телом ответа; всё
          # ещё PENDING через десять минут — красный «не смог проверить», со
          # ссылкой на страницу релизов: это третий исход, не успех.
          API="https://api.smithery.ai"
          for attempt in $(seq 1 40); do
            if [ -n "$DEPLOY" ]; then
              BODY=$(curl -sS -H "Authorization: Bearer $SMITHERY_API_KEY" "$API/servers/$NAME/releases/$DEPLOY" || true)
            else
              BODY=$(curl -sS -H "Authorization: Bearer $SMITHERY_API_KEY" "$API/servers/$NAME/releases" || true)
            fi
            STATUS=$(python3 - "$BODY" "$DEPLOY" <<'PY'
          import json, sys
          body, dep = sys.argv[1], sys.argv[2]
          try:
              d = json.loads(body)
          except Exception:
              print('unparsed'); sys.exit(0)
          rel = d
          if isinstance(d, dict) and 'releases' in d:
              items = d['releases'] or []
              rel = next((r for r in items if r.get('deploymentId') == dep), items[0] if items else {})
          print((rel.get('status') if isinstance(rel, dict) else None) or 'unknown')
          PY
          )
            echo "попытка $attempt/40 — статус релиза: $STATUS"
            case "$STATUS" in
              SUCCESS)
                echo "Релиз обработан. Страница: https://smithery.ai/servers/$NAME"
                # Поиск — для сведения, не для вердикта: индекс отстаёт от релиза.
                smithery mcp search "$SRV" --namespace "$NS" --limit 5 2>&1 | head -5 || true
                exit 0 ;;
              CANCELLED|FAILED|ERROR)
                echo "::error::Smithery отверг релиз $NAME ($STATUS). Ответ:"
                echo "$BODY" | head -30
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::релиз $NAME всё ещё '$STATUS' через десять минут — проверить не смог. Статус: https://smithery.ai/servers/$NAME/releases"
          echo "$BODY" | head -30
          exit 1
