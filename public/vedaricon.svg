<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="lava" x1="256" y1="474" x2="256" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0E0503"/>
      <stop offset="25%"  stop-color="#3A1005"/>
      <stop offset="55%"  stop-color="#A02C07"/>
      <stop offset="78%"  stop-color="#D44A0C"/>
      <stop offset="100%" stop-color="#F09018"/>
    </linearGradient>

    <filter id="glow-wide" x="-80%" y="-60%" width="260%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
    </filter>
    <filter id="glow-mid" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="#18100A"/>

  <!--
    Камчатка — узкий длинный полуостров (1:3 примерно)
    Западный берег (лево) — плавный
    Восточный берег (право) — с характерными выступами:
      • Кронoцкий п-ов ~y175 (выступ вправо)
      • Авачинский залив ~y310 (вогнутость)
      • Мыс Лопатка внизу — острый кончик
    Вулканы — в верхней трети (Ключевская, Корякский)
    Размер: x 196→316 (ширина 120), y 36→474 (высота 438)
  -->
  <path d="
    M 256,36
    C 240,36 210,42 196,58
    L 192,88
    C 190,112 192,136 194,162
    C 196,184 193,204 196,226
    C 198,244 195,260 197,278
    C 199,296 196,314 200,334
    C 204,354 208,374 216,394
    C 224,414 236,438 248,458
    C 252,466 254,472 256,474
    C 258,472 260,466 264,458
    C 276,438 286,416 294,396
    C 302,376 308,356 311,336
    C 314,316 311,300 308,282
    C 306,264 316,248 322,230
    C 328,212 336,192 334,170
    C 332,150 330,126 328,100
    C 326,78 320,58 316,48
    C 304,38 270,36 256,36 Z
  " fill="url(#lava)"/>

  <!-- Кронoцкий п-ов — характерный выступ восточного берега -->
  <path d="
    M 316,48 C 320,58 326,78 328,100
    C 330,126 332,150 334,170
    C 336,192 328,212 322,230
    C 316,248 306,264 308,282
    C 311,300 314,316 311,336
  " fill="none" stroke="#F08020" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Широкое свечение вулканической зоны (верхняя треть, левее — зап. вулканы) -->
  <ellipse cx="238" cy="118" rx="52" ry="44"
    fill="#F06818" opacity="0.4" filter="url(#glow-wide)"/>

  <!-- Средний ореол -->
  <ellipse cx="236" cy="112" rx="26" ry="22"
    fill="#FFB030" opacity="0.6" filter="url(#glow-mid)"/>

  <!-- Яркое жерло — Ключевская -->
  <ellipse cx="234" cy="108" rx="7" ry="6"
    fill="#FFE878" opacity="1" filter="url(#glow-mid)"/>
  <ellipse cx="234" cy="108" rx="3" ry="2.5"
    fill="#FFFFFF" opacity="0.95"/>
</svg>
