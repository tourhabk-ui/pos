<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Volcanic dark background -->
  <rect width="512" height="512" rx="110" fill="#18100A"/>

  <!-- Back mountain — muted, receding -->
  <path d="M38 408 L196 178 L318 408Z" fill="#2D1A0E"/>

  <!-- Main peak — accent volcanic orange -->
  <path d="M138 408 L256 116 L374 408Z" fill="#D44A0C"/>

  <!-- Snow cap cutout — creates depth -->
  <path d="M220 226 L256 148 L292 226Z" fill="#18100A" opacity="0.55"/>

  <!-- Navigation waypoint at peak — "you are here, you know where you go" -->
  <circle cx="256" cy="96" r="34" fill="#F5F0EB"/>
  <circle cx="256" cy="96" r="15" fill="#18100A"/>
  <circle cx="256" cy="96" r="6"  fill="#D44A0C"/>
</svg>
