# Ведар — сейсмо-реле (Cloudflare Worker).
#
# Деплой:
#   cd infra/safety-relay
#   npx wrangler secret put CRON_SECRET     # то же значение, что в переменных Timeweb
#   npx wrangler deploy
#
# Проверка ДО того, как поверить (см. шапку worker.js — с OpenRouter такой же
# замысел не сработал, и урок стоил времени):
#   curl -H "Authorization: Bearer <CRON_SECRET>" \
#        https://vedar-safety-relay.<account>.workers.dev/selftest
#
# Ответ покажет размеры страниц t.me. Байты есть — блокировка обойдена;
# отказ — путь не работает, и воркфлоу GitHub остаётся единственным.

name = "vedar-safety-relay"
main = "worker.js"
compatibility_date = "2024-11-01"

# Явно, а не по умолчанию (03.09). Первая выкатка прошла (wrangler напечатал
# адрес и расписание), а /selftest по адресу workers.dev ответил 404 с телом
# «error code: 1042» ДО входа в воркер: наш собственный 404 говорит словами
# «safety-relay: только /selftest». Это известный случай на стороне Cloudflare:
# hostname workers.dev не привязывается сразу после деплоя. Явный флаг
# заставляет wrangler заявить маршрут при каждой выкатке. Cron-триггер при этом
# уже стоит и от hostname не зависит.
workers_dev = true

# Каждые 5 минут — та же норма, что у воркфлоу: цунами от 185 км идёт ~15 мин.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Приёмник. Вынесен в переменную, чтобы адрес прода не был зашит в код:
# на tourhab.ru два джоба cron-job.org падали ровно потому, что домен
# переехал, а адрес остался.
INGEST_BASE = "https://vedarai.ru"

# Белый список хостов для /fetch (03.09) — чтение для разведчика
# (lib/agents/scout-relay). Точное имя или поддомен. Без списка /fetch —
# открытый прокси под нашим именем, поэтому пусто значит «никому».
# Хосты нынешних фидов разведчика — чтобы фолбэк на реле работал у любого;
# openai.com и anthropic.com — гео-закрыты для прода в РФ (провайдерская
# сторона того же блока описана в lib/ai/provider-config.ts); t.me — как у
# сейсмо-реле. Список расширяется по замеру /census, не по догадке.
RELAY_HOSTS = "simonwillison.net,huggingface.co,marktechpost.com,hnrss.org,habr.com,skift.com,producthunt.com,tourprom.ru,ratanews.ru,openai.com,anthropic.com,blog.google,deepmind.google,t.me"

# CRON_SECRET задаётся секретом (wrangler secret put), а НЕ здесь:
# содержимое [vars] видно в панели и уезжает в конфиг.
